 não dá para ver bem através dele. Ele é:","options":["espelhado","opaco","transparente","translúcido"],"answer":3,"explain":"Translúcido é o material que deixa passar parte da luz, mas embaça a imagem."},{"q":"Como a sombra se forma?","options":["Quando o objeto é transparente","Quando um objeto opaco bloqueia a luz","Quando a luz atravessa um vidro","Quando a luz fica mais forte"],"answer":1,"explain":"O objeto opaco impede a luz de passar, e atrás dele fica uma região escura: a sombra."},{"q":"Ao meio-dia, com o Sol bem alto no céu, a sombra de uma pessoa fica:","options":["azul","bem comprida","do tamanho de uma árvore","bem curta"],"answer":3,"explain":"Com o Sol lá no alto, a luz vem de cima e a sombra fica curtinha."},{"q":"No fim da tarde, com o Sol mais baixo, as sombras ficam:","options":["coloridas","invisíveis","mais curtas","mais compridas"],"answer":3,"explain":"Quando a luz chega mais de lado, as sombras se esticam e ficam compridas."},{"q":"Se uma lanterna for colocada mais perto de um boneco, a sombra do boneco na parede fica:","options":["igual","colorida","menor","maior"],"answer":3,"explain":"Quanto mais perto da luz o objeto está, mais luz ele bloqueia e maior fica a sombra."},{"q":"O que acontece com a luz quando ela bate em um espelho?","options":["Ela vira som","Ela atravessa o espelho","Ela é refletida, ou seja, volta","Ela desaparece"],"answer":2,"explain":"O espelho reflete a luz. É por isso que vemos nossa imagem nele."},{"q":"Uma colher de metal bem polida e brilhante funciona um pouco como:","options":["uma sombra","um espelho, refletindo a luz","um vidro transparente","uma lâmpada"],"answer":1,"explain":"Superfícies polidas refletem a luz, como um espelho. Dá até para ver seu rosto na colher!"},{"q":"Qual destes objetos produz luz própria?","options":["espelho","Lua","janela de vidro","lâmpada acesa"],"answer":3,"explain":"A lâmpada acesa produz luz. O espelho e a Lua apenas refletem luz."},{"q":"Por que conseguimos ver a Lua à noite?","options":["Porque ela tem luz própria","Porque ela é uma estrela","Porque ela reflete a luz do Sol","Porque ela é feita de fogo"],"answer":2,"explain":"A Lua não tem luz própria: ela brilha porque reflete a luz do Sol."},{"q":"Para enxergar os objetos, nossos olhos precisam de:","options":["luz","som","cheiro","calor"],"answer":0,"explain":"Só vemos as coisas quando a luz bate nelas e chega aos nossos olhos. No escuro total não vemos nada."}]},{"id":"3-cie-saude-auditiva-visual","name":"Cuidados com a audição e a visão","desc":"Pratica hábitos que protegem os olhos e os ouvidos no dia a dia.","questions":[{"q":"Qual atitude protege a audição?","options":["Ficar colado nas caixas de som em shows","Ouvir música com volume baixo no fone","Limpar o ouvido com objetos pontudos","Usar o fone no volume máximo"],"answer":1,"explain":"Volume baixo protege os ouvidos. Sons muito altos por muito tempo podem prejudicar a audição."},{"q":"Qual destes lugares tem um barulho que pode prejudicar a audição se a pessoa ficar ali muito tempo?","options":["uma biblioteca","um quarto silencioso","um jardim tranquilo","perto de uma obra com britadeira"],"answer":3,"explain":"A britadeira faz um barulho muito forte. Ficar perto dela por muito tempo pode machucar os ouvidos."},{"q":"Pessoas que trabalham em lugares muito barulhentos, como pistas de aeroporto, devem usar:","options":["óculos escuros","capacete de bicicleta","luvas","protetor auricular"],"answer":3,"explain":"O protetor auricular diminui o barulho que entra nos ouvidos e protege a audição."},{"q":"Qual é o jeito mais seguro de limpar as orelhas?","options":["Enfiar grampos no ouvido","Colocar objetos pequenos no ouvido","Secar a parte de fora com a toalha depois do banho","Usar palitos de dente"],"answer":2,"explain":"Basta limpar a parte de fora com a toalha. Nunca coloque objetos dentro do ouvido."},{"q":"Qual profissional cuida da saúde dos ouvidos, do nariz e da garganta?","options":["dentista","otorrinolaringologista","oftalmologista","cardiologista"],"answer":1,"explain":"O otorrinolaringologista, ou \"otorrino\", cuida dos ouvidos, do nariz e da garganta."},{"q":"Qual profissional cuida da saúde dos olhos?","options":["otorrinolaringologista","dentista","veterinário","oftalmologista"],"answer":3,"explain":"O oftalmologista é o médico dos olhos. Ele pode indicar óculos, se for preciso."},{"q":"Por que nunca devemos olhar diretamente para o Sol?","options":["Porque a luz forte pode machucar os olhos","Porque o Sol pode apagar","Porque deixa os olhos mais fortes","Porque faz mal só para os ouvidos"],"answer":0,"explain":"A luz do Sol é fortíssima e pode causar danos sérios aos olhos."},{"q":"Óculos escuros com proteção contra raios ultravioleta servem para:","options":["esquentar os olhos","enxergar no escuro","ouvir melhor","proteger os olhos da luz forte do Sol"],"answer":3,"explain":"Bons óculos escuros filtram parte da luz do Sol e protegem os olhos."},{"q":"Ler em um lugar com pouca luz pode:","options":["melhorar a audição","deixar o livro mais leve","cansar a vista","fazer as letras crescerem"],"answer":2,"explain":"Com pouca luz, os olhos fazem mais esforço e ficam cansados. Prefira ler em lugar bem iluminado."},{"q":"Ficar muito tempo olhando para telas, como celular e TV, sem fazer pausas pode:","options":["proteger contra a poeira","deixar os olhos mais fortes","melhorar a visão","cansar e ressecar os olhos"],"answer":3,"explain":"Olhando para telas piscamos menos, e os olhos ficam cansados e secos. Fazer pausas ajuda."},{"q":"Que equipamento protege os olhos de quem trabalha soldando metais?","options":["boné","luvas de lã","fone de ouvido","máscara ou óculos de proteção"],"answer":3,"explain":"A solda solta faíscas e uma luz muito forte, por isso o trabalhador usa máscara ou óculos de proteção."},{"q":"Se uma criança tem dificuldade para enxergar o quadro da sala, o melhor a fazer é:","options":["esfregar bem os olhos","contar aos pais e ir ao oftalmologista","usar os óculos de um colega","sentar mais longe do quadro"],"answer":1,"explain":"O oftalmologista examina os olhos e diz se a criança precisa de óculos feitos para ela."},{"q":"Quando entra um cisco no olho, o que devemos fazer?","options":["Apertar bem o olho","Lavar com água limpa, sem esfregar","Esfregar com força","Mexer com o dedo sujo"],"answer":1,"explain":"Esfregar pode machucar o olho. O certo é lavar com água limpa e pedir ajuda a um adulto."}]},{"id":"3-cie-animais-modo-de-vida","name":"Como vivem os animais","desc":"Pratica o que os animais comem, como se locomovem e como se reproduzem.","questions":[{"q":"Um animal que se alimenta só de plantas é chamado de:","options":["onívoro","insetívoro","herbívoro","carnívoro"],"answer":2,"explain":"Herbívoros comem plantas, como capim, folhas e frutos."},{"q":"Qual destes animais é carnívoro?","options":["cavalo","coelho","vaca","onça-pintada"],"answer":3,"explain":"A onça-pintada caça outros animais para comer. Ela é carnívora."},{"q":"O ser humano pode comer carne e vegetais. Por isso, o ser humano é um animal:","options":["carnívoro","onívoro","herbívoro","insetívoro"],"answer":1,"explain":"Onívoros são animais que conseguem se alimentar de plantas e de outros animais."},{"q":"A capivara come capim e plantas aquáticas. Ela é:","options":["insetívora","carnívora","herbívora","onívora"],"answer":2,"explain":"Como a capivara se alimenta de plantas, ela é herbívora."},{"q":"O tamanduá-bandeira se alimenta principalmente de:","options":["folhas","formigas e cupins","peixes","frutas"],"answer":1,"explain":"O tamanduá usa sua língua comprida e pegajosa para comer formigas e cupins."},{"q":"O beija-flor se alimenta principalmente de:","options":["néctar das flores","peixes","sementes duras","carne"],"answer":0,"explain":"O beija-flor usa o bico fino para sugar o néctar, um líquido doce das flores."},{"q":"Como o peixe se locomove?","options":["rastejando","nadando","voando","andando com patas"],"answer":1,"explain":"O peixe nada usando as nadadeiras e o movimento do corpo."},{"q":"Qual destes animais se locomove rastejando?","options":["cobra","pato","cavalo","borboleta"],"answer":0,"explain":"A cobra não tem patas: ela se move rastejando com o corpo."},{"q":"Qual destes animais consegue voar?","options":["pinguim","morcego","avestruz","ema"],"answer":1,"explain":"O morcego voa com suas asas de pele. Pinguim, avestruz e ema são aves que não voam."},{"q":"Animais que nascem de ovos são chamados de:","options":["vivíparos","mamíferos","ovíparos","herbívoros"],"answer":2,"explain":"Ovíparos são os animais que nascem de ovos, como as aves e a maioria dos répteis."},{"q":"Qual destes animais é ovíparo?","options":["gato","baleia","vaca","jacaré"],"answer":3,"explain":"O jacaré nasce de um ovo. Gato, baleia e vaca se desenvolvem na barriga da mãe."},{"q":"Qual destes animais é vivíparo, ou seja, o filhote se desenvolve dentro da barriga da mãe?","options":["galinha","cachorro","sapo","tartaruga"],"answer":1,"explain":"O filhote de cachorro cresce na barriga da mãe e nasce de lá. Galinha, tartaruga e sapo põem ovos."},{"q":"A baleia vive no mar, mas é um mamífero. Como nasce o filhote da baleia?","options":["de um ovo na areia","de um ovo no fundo do mar","da barriga da mãe","de uma semente"],"answer":2,"explain":"Como a maioria dos mamíferos, o filhote da baleia cresce na barriga da mãe e, depois de nascer, mama."}]},{"id":"3-cie-ciclo-de-vida","name":"Ciclo de vida dos animais","desc":"Pratica as fases da vida dos animais, a metamorfose e os nomes dos filhotes.","questions":[{"q":"Todo animal passa por fases na vida. Quais são elas?","options":["nascer, crescer e morrer, podendo se reproduzir","apenas crescer","nascer já adulto e não mudar","nascer e nunca morrer"],"answer":0,"explain":"Os seres vivos nascem, crescem, podem se reproduzir e um dia morrem. Isso é o ciclo de vida."},{"q":"Qual é a ordem correta das fases da vida humana?","options":["bebê, adulto, criança, idoso, adolescente","criança, bebê, adulto, adolescente, idoso","bebê, criança, adolescente, adulto, idoso","adolescente, criança, bebê, adulto, idoso"],"answer":2,"explain":"Primeiro somos bebês, depois crianças, adolescentes, adultos e, por fim, idosos."},{"q":"Qual é a ordem do ciclo de vida da borboleta?","options":["lagarta, ovo, borboleta, pupa","ovo, lagarta, pupa, borboleta","borboleta, lagarta, ovo, pupa","ovo, borboleta, lagarta, pupa"],"answer":1,"explain":"Do ovo nasce a lagarta, que vira pupa (crisálida) e, depois, sai a borboleta adulta."},{"q":"Na fase de lagarta, o que o animal faz?","options":["Bota ovos","Sai da pupa com asas","Come muitas folhas e cresce","Voa entre as flores"],"answer":2,"explain":"A lagarta é uma comilona! Ela come muitas folhas para crescer antes de virar pupa."},{"q":"As grandes mudanças no corpo de animais como a borboleta e o sapo durante a vida se chamam:","options":["metamorfose","respiração","fotossíntese","digestão"],"answer":0,"explain":"Metamorfose é a transformação do corpo ao longo da vida, como a lagarta que vira borboleta."},{"q":"O filhote do sapo, que nasce na água e tem cauda, se chama:","options":["pintinho","lagarta","girino","potro"],"answer":2,"explain":"O girino vive na água, respira por brânquias e tem cauda, até virar sapo."},{"q":"O que acontece com a cauda do girino quando ele vira sapo?","options":["Ela desaparece aos poucos","Ela vira uma asa","Ela vira uma nadadeira","Ela fica maior"],"answer":0,"explain":"Durante a metamorfose, nascem as patas e a cauda vai sumindo até desaparecer."},{"q":"Onde o sapo costuma colocar seus ovos?","options":["na água","na areia seca do deserto","nas nuvens","no alto das árvores"],"answer":0,"explain":"Os ovos do sapo ficam na água, onde os girinos nascem e crescem."},{"q":"O filhote da galinha se chama:","options":["pintinho","potro","bezerro","girino"],"answer":0,"explain":"O pintinho nasce do ovo e cresce até virar galinha ou galo."},{"q":"O filhote da vaca se chama:","options":["cordeiro","bezerro","potro","leitão"],"answer":1,"explain":"Bezerro é o filhote da vaca. Potro é do cavalo, cordeiro é da ovelha e leitão é do porco."},{"q":"O filhote do cavalo se chama:","options":["potro","leitão","bezerro","cabrito"],"answer":0,"explain":"Potro é o filhote do cavalo e da égua."},{"q":"Como nasce o filhote de cachorro?","options":["Nasce na água como girino","Passa por metamorfose","Nasce de um ovo","Nasce da barriga da mãe e mama"],"answer":3,"explain":"O cachorro é mamífero: o filhote se forma na barriga da mãe e depois mama o leite dela."},{"q":"Quando são filhotes, os mamíferos se alimentam de:","options":["insetos","leite da mãe","néctar das flores","folhas"],"answer":1,"explain":"Mamíferos recebem esse nome porque os filhotes mamam o leite produzido pela mãe."}]},{"id":"3-cie-classificacao-animais","name":"Características e grupos de animais","desc":"Pratica agrupar animais por penas, pelos, escamas e outras características: mamíferos, aves, répteis, anfíbios, peixes e insetos.","questions":[{"q":"Qual destes animais tem o corpo coberto de penas?","options":["cachorro","jacaré","sapo","arara"],"answer":3,"explain":"A arara é uma ave, e todas as aves têm penas."},{"q":"Qual característica todas as aves têm?","options":["oito patas","penas e bico","escamas e nadadeiras","pelos e dentes"],"answer":1,"explain":"Toda ave tem penas e bico, mesmo as que não voam."},{"q":"O pinguim não voa, mas é uma ave. Por quê?","options":["Porque nada muito bem","Porque vive no gelo","Porque tem penas, bico e nasce de ovo","Porque tem pelos"],"answer":2,"explain":"O que faz um animal ser ave são as penas, o bico e o ovo, e não o voo."},{"q":"Animais com o corpo coberto de pelos e que mamam quando filhotes são os:","options":["mamíferos","peixes","répteis","aves"],"answer":0,"explain":"Pelos e amamentação são características dos mamíferos, como nós."},{"q":"O morcego voa, mas é um mamífero. Por quê?","options":["Porque tem penas","Porque tem pelos e o filhote mama","Porque tem bico","Porque bota ovos"],"answer":1,"explain":"O morcego tem pelos e amamenta os filhotes, por isso é mamífero, mesmo voando."},{"q":"O jacaré e a tartaruga têm a pele coberta de escamas ou placas duras. Eles são:","options":["aves","anfíbios","répteis","mamíferos"],"answer":2,"explain":"Répteis têm pele seca com escamas ou placas, como jacarés, cobras, lagartos e tartarugas."},{"q":"O sapo e a rã vivem parte da vida na água e parte na terra. Eles são:","options":["aves","peixes","répteis","anfíbios"],"answer":3,"explain":"Anfíbios começam a vida na água e, adultos, podem viver na terra. \"Anfíbio\" quer dizer vida dupla."},{"q":"Qual destes animais é um peixe?","options":["golfinho","foca","tubarão","baleia"],"answer":2,"explain":"O tubarão é um peixe e respira por brânquias. Golfinho, baleia e foca são mamíferos."},{"q":"Qual animal tem o corpo coberto por escamas e respira por brânquias?","options":["peixe","galinha","cobra","sapo adulto"],"answer":0,"explain":"Os peixes têm escamas e retiram o oxigênio da água pelas brânquias."},{"q":"Quantas patas tem um inseto?","options":["6","10","4","8"],"answer":0,"explain":"Todo inseto adulto tem 6 patas, como a formiga, a abelha e a borboleta."},{"q":"A aranha tem 8 patas. Ela é um inseto?","options":["Não, porque insetos têm 6 patas","Sim, porque é pequena","Sim, porque tem patas","Não, porque aranhas são mamíferos"],"answer":0,"explain":"A aranha não é inseto: ela tem 8 patas e faz parte de outro grupo, o dos aracnídeos."},{"q":"Animais que têm coluna vertebral, com ossos nas costas, são chamados de:","options":["invertebrados","herbívoros","vertebrados","insetos"],"answer":2,"explain":"Vertebrados têm coluna vertebral: peixes, anfíbios, répteis, aves e mamíferos."},{"q":"Qual destes animais é invertebrado, ou seja, não tem coluna vertebral?","options":["cachorro","galinha","minhoca","peixe"],"answer":2,"explain":"A minhoca não tem ossos. Cachorro, galinha e peixe têm coluna vertebral."}]},{"id":"3-cie-terra-ceu","name":"Planeta Terra e observação do céu","desc":"Pratica a forma da Terra, água e terra no planeta, e quando vemos o Sol, a Lua, as estrelas e os planetas.","questions":[{"q":"Qual é a forma do planeta Terra?","options":["quadrada","triangular","arredondada, quase uma esfera","plana como um prato"],"answer":2,"explain":"Fotos tiradas do espaço mostram que a Terra é arredondada, quase uma esfera."},{"q":"Qual objeto representa a Terra no formato de esfera?","options":["régua","globo terrestre","calendário","bússola"],"answer":1,"explain":"O globo terrestre é uma bola que mostra os continentes e oceanos da Terra."},{"q":"A maior parte da superfície da Terra é coberta por:","options":["areia","florestas","água","gelo"],"answer":2,"explain":"Cerca de 3 partes em cada 4 da superfície da Terra são cobertas por água, principalmente oceanos."},{"q":"No globo e nas fotos da Terra, as partes azuis geralmente representam:","options":["desertos","florestas","cidades","a água de oceanos, mares e rios"],"answer":3,"explain":"O azul representa a água. Por isso a Terra é chamada de planeta azul."},{"q":"Além da água, o que forma a parte de terra firme do nosso planeta?","options":["ar","nuvens","algodão","rochas e solo"],"answer":3,"explain":"Os continentes e ilhas são formados por rochas e cobertos, em grande parte, por solo."},{"q":"O Sol é:","options":["um satélite","uma estrela","um planeta","um cometa"],"answer":1,"explain":"O Sol é uma estrela, a mais próxima da Terra. Ele tem luz própria."},{"q":"A Lua é o satélite natural de qual planeta?","options":["Marte","Vênus","Terra","Júpiter"],"answer":2,"explain":"A Lua gira em volta da Terra. Ela é o nosso satélite natural."},{"q":"Em qual período vemos o Sol no céu?","options":["só à meia-noite","de dia","nunca","só à noite"],"answer":1,"explain":"O Sol ilumina o céu durante o dia. À noite, o nosso lado da Terra fica de costas para ele."},{"q":"Às vezes conseguimos ver a Lua durante o dia?","options":["Sim, às vezes a Lua aparece de dia","Não, a Lua desaparece de dia","Não, a Lua só existe à noite","Sim, mas só nas férias"],"answer":0,"explain":"Em muitos dias dá para ver a Lua no céu claro, de manhã ou à tarde. Observe!"},{"q":"Por que não vemos as estrelas durante o dia?","options":["Porque a luz do Sol é muito forte e esconde o brilho delas","Porque as estrelas vão dormir","Porque as estrelas se apagam de dia","Porque as estrelas caem no mar"],"answer":0,"explain":"As estrelas continuam lá, mas a luz do Sol é tão forte que não conseguimos ver o brilho delas."},{"q":"O dia e a noite acontecem porque:","options":["a Lua tapa o Sol todas as noites","a Terra gira em torno de si mesma","o Sol se apaga à noite","as nuvens cobrem o Sol"],"answer":1,"explain":"A Terra gira como um pião. O lado virado para o Sol tem dia, e o outro lado tem noite."},{"q":"Em qual direção (ponto cardeal) o Sol aparece de manhã?","options":["oeste","sul","leste","norte"],"answer":2,"explain":"O Sol nasce do lado leste e se põe do lado oeste."},{"q":"Qual destes astros é um planeta que pode ser visto no céu, no começo da noite ou ao amanhecer, parecendo uma estrela muito brilhante?","options":["Sol","Vênus","Lua","Via Láctea"],"answer":1,"explain":"Vênus é tão brilhante que é chamado de \"estrela d'alva\", mas é um planeta, como a Terra."}]},{"id":"3-cie-solo","name":"Solo: tipos e usos","desc":"Pratica os tipos de solo (arenoso, argiloso e humoso), suas características e como o ser humano usa e protege o solo.","questions":[{"q":"O solo arenoso tem muita areia. O que acontece quando jogamos água nele?","options":["A água passa rápido","A água fica parada por muito tempo","A água vira lama grudenta","A água some no ar"],"answer":0,"explain":"Os grãos de areia são grandes e deixam espaços entre eles, por isso a água escorre rápido."},{"q":"O solo argiloso tem muita argila. Como ele é?","options":["Não tem nenhuma água","É feito só de folhas","Deixa a água passar muito rápido","Segura bastante água e fica grudento quando molhado"],"answer":3,"explain":"A argila tem grãos bem pequenos e juntinhos, que seguram a água e formam uma massa grudenta."},{"q":"O solo humoso é escuro e rico em restos de plantas e animais. Ele é muito bom para:","options":["fazer castelos de areia","fazer vidro","plantar","fazer tijolos"],"answer":2,"explain":"O solo humoso tem muitos nutrientes e é ótimo para as plantas crescerem."},{"q":"Qual tipo de solo é conhecido por ser escuro e fértil?","options":["rochoso","arenoso","humoso","pedregoso"],"answer":2,"explain":"O húmus deixa o solo escuro e cheio de nutrientes: é o solo humoso."},{"q":"O que é o húmus?","options":["A areia da praia","A água do subsolo","Um tipo de pedra","Uma matéria escura formada por restos de plantas e animais decompostos"],"answer":3,"explain":"O húmus se forma quando folhas, frutos e restos de animais se decompõem no solo."},{"q":"A argila é usada para fazer:","options":["tijolos, telhas e vasos","roupas","papel","vidro"],"answer":0,"explain":"A argila molhada pode ser moldada e, depois de queimada no forno, vira tijolo, telha ou vaso."},{"q":"Por que as minhocas são importantes para o solo?","options":["Porque cavam túneis que deixam entrar ar e água","Porque deixam o solo duro","Porque espantam a chuva","Porque comem todas as plantas"],"answer":0,"explain":"Os túneis das minhocas arejam o solo, e as fezes delas deixam a terra mais fértil."},{"q":"Ao comparar amostras de solo, o que podemos observar?","options":["cor, cheiro, textura e tamanho dos grãos","o nome do dono do terreno","a idade do Sol","o som que o solo faz"],"answer":0,"explain":"Olhando, cheirando e tocando, percebemos diferenças de cor, cheiro, textura e tamanho dos grãos."},{"q":"Por que a agricultura depende do solo?","options":["Porque o solo faz chover","Porque as plantas tiram dele água e nutrientes","Porque o solo dá luz às plantas","Porque as plantas não precisam de raízes"],"answer":1,"explain":"As raízes buscam no solo a água e os nutrientes de que a planta precisa para crescer."},{"q":"Para que o ser humano usa o solo?","options":["Só para brincar","Para fabricar nuvens","Para plantar, criar animais, construir e retirar minérios","Só para jogar lixo"],"answer":2,"explain":"O solo é usado de muitos jeitos: na agricultura, na pecuária, nas construções e na mineração."},{"q":"Como se chama a atividade de retirar minérios, como o ferro, do solo?","options":["mineração","pesca","agricultura","pecuária"],"answer":0,"explain":"Mineração é a retirada de minérios do solo e das rochas."},{"q":"O que pode acontecer com um solo sem plantas quando chove muito?","options":["O solo fica mais forte","O solo vira pedra","Erosão: a água da chuva leva a terra embora","Nasce uma floresta na hora"],"answer":2,"explain":"Sem raízes para segurar a terra, a chuva arrasta o solo. Isso se chama erosão."},{"q":"Qual atitude ajuda a proteger o solo?","options":["Plantar árvores e não jogar lixo no chão","Desmatar as margens dos rios","Fazer queimadas","Jogar óleo na terra"],"answer":0,"explain":"As plantas seguram o solo e o lixo pode contaminá-lo. Cuidar do solo é cuidar da vida!"}]}]},{"id":"his","name":"História","topics":[{"id":"3-his-cidade-municipio","name":"A cidade e o município","desc":"Pratica o que é município, zona urbana e rural, e quem governa e faz as leis da cidade.","questions":[{"q":"O município é formado por:","options":["apenas fazendas","apenas o centro da cidade","apenas prédios","zona urbana (cidade) e zona rural (campo)"],"answer":3,"explain":"O município inclui a cidade, que é a zona urbana, e o campo, que é a zona rural."},{"q":"Qual é a área do município com mais casas, prédios, ruas asfaltadas e comércio?","options":["área de praia","zona urbana","área de floresta","zona rural"],"answer":1,"explain":"A zona urbana é a cidade, onde há mais construções, ruas e lojas."},{"q":"Na zona rural é mais comum encontrar:","options":["muitos prédios altos","metrô","shoppings","plantações, sítios e criação de animais"],"answer":3,"explain":"A zona rural é o campo, onde ficam sítios, fazendas, plantações e criações de animais."},{"q":"Quem é eleito para governar o município?","options":["o presidente","o diretor da escola","o governador","o prefeito ou a prefeita"],"answer":3,"explain":"O prefeito ou a prefeita administra o município. O governador cuida do estado e o presidente, do país."},{"q":"Como se chama o lugar onde trabalha o prefeito?","options":["prefeitura","delegacia","câmara municipal","biblioteca"],"answer":0,"explain":"O prefeito trabalha na prefeitura, de onde administra o município."},{"q":"Onde trabalham os vereadores?","options":["na câmara municipal","na escola","no hospital","no corpo de bombeiros"],"answer":0,"explain":"Os vereadores se reúnem na câmara municipal para discutir e votar as leis do município."},{"q":"Qual é uma das funções dos vereadores?","options":["dar aulas na escola","cuidar de doentes no hospital","apagar incêndios","criar e votar leis para o município"],"answer":3,"explain":"Os vereadores fazem as leis do município e fiscalizam o trabalho da prefeitura."},{"q":"Quem escolhe o prefeito e os vereadores?","options":["o presidente","o diretor da escola","os eleitores do município, pelo voto","um sorteio entre os vizinhos"],"answer":2,"explain":"Nas eleições, os eleitores do município votam e escolhem o prefeito e os vereadores."},{"q":"Com o dinheiro dos impostos pagos pelos moradores, a prefeitura pode:","options":["fechar as praças","construir escolas e postos de saúde e cuidar das ruas","comprar brinquedos para os vereadores","pagar as compras de cada família"],"answer":1,"explain":"Os impostos ajudam a pagar serviços para todos, como escolas, saúde, iluminação e limpeza das ruas."},{"q":"Muitas cidades brasileiras cresceram quando pessoas saíram do campo para morar na cidade. Esse movimento se chama:","options":["êxodo rural","viagem de férias","mudança de estação","festa junina"],"answer":0,"explain":"Êxodo rural é a saída de muitas pessoas do campo para as cidades, em busca de trabalho e estudo."},{"q":"Muitas cidades começaram perto de:","options":["montanhas de gelo","lugares sem nenhuma água","desertos sem caminhos","rios, estradas e ferrovias"],"answer":3,"explain":"Rios dão água e transporte, e estradas e ferrovias facilitam o comércio. Por isso muitas cidades nasceram perto deles."},{"q":"Brasília é a capital de quê?","options":["do estado de São Paulo","do Rio de Janeiro","de Minas Gerais","do Brasil"],"answer":3,"explain":"Brasília é a capital do Brasil desde 1960. Lá trabalham o presidente e o Congresso Nacional."}]},{"id":"3-his-grupos-formadores","name":"Povos que formaram nossas cidades","desc":"Pratica a contribuição de indígenas, africanos, portugueses, imigrantes e migrantes para a cultura brasileira.","questions":[{"q":"Quem já vivia nas terras do Brasil antes da chegada dos portugueses?","options":["os japoneses","os alemães","os povos indígenas","os italianos"],"answer":2,"explain":"Muitos povos indígenas já viviam aqui há milhares de anos quando os portugueses chegaram, em 1500."},{"q":"De qual continente foram trazidas à força muitas pessoas escravizadas para trabalhar no Brasil?","options":["América do Norte","Oceania","África","Europa"],"answer":2,"explain":"Durante mais de 300 anos, milhões de africanos foram trazidos à força e escravizados no Brasil."},{"q":"Os portugueses trouxeram para o Brasil:","options":["a capoeira","a língua portuguesa","a rede de dormir","a língua tupi"],"answer":1,"explain":"A língua que falamos veio de Portugal. O tupi é indígena, a capoeira é afro-brasileira e a rede é indígena."},{"q":"Qual destas palavras, que usamos no dia a dia, tem origem indígena (tupi)?","options":["futebol","pipoca","computador","bicicleta"],"answer":1,"explain":"Pipoca vem do tupi. Muitas palavras indígenas fazem parte do nosso português, como mandioca e abacaxi."},{"q":"A rede de dormir é um costume herdado de quais povos?","options":["japoneses","alemães","portugueses","indígenas"],"answer":3,"explain":"Os povos indígenas já usavam a rede para dormir e descansar, e o costume se espalhou pelo Brasil."},{"q":"A capoeira, que mistura luta, dança e música, tem origem:","options":["italiana","alemã","afro-brasileira","japonesa"],"answer":2,"explain":"A capoeira foi criada no Brasil por africanos escravizados e seus descendentes."},{"q":"O acarajé, comida típica da Bahia, tem origem:","options":["italiana","japonesa","africana","alemã"],"answer":2,"explain":"O acarajé é uma herança da culinária africana, muito presente na Bahia."},{"q":"Comunidades formadas por africanos escravizados que fugiram e resistiram à escravidão eram chamadas de:","options":["aldeias","quilombos","condomínios","colônias de férias"],"answer":1,"explain":"Os quilombos foram comunidades de resistência. Hoje, seus descendentes formam comunidades quilombolas."},{"q":"Imigrantes são pessoas que:","options":["nasceram na mesma cidade em que moram","só visitam o país nas férias","vêm de outro país para morar aqui","nunca saem de casa"],"answer":2,"explain":"Imigrante é quem sai do seu país para viver em outro, como os italianos e japoneses que vieram para o Brasil."},{"q":"Uma família que se muda do Nordeste para o Sudeste, dentro do próprio Brasil, é formada por:","options":["turistas","migrantes","indígenas","imigrantes estrangeiros"],"answer":1,"explain":"Quem muda de cidade ou região dentro do mesmo país é chamado de migrante."},{"q":"Muitos imigrantes italianos que chegaram ao Brasil no fim do século 19 foram trabalhar principalmente:","options":["em aeroportos","em plataformas de petróleo","em fábricas de computadores","nas lavouras de café"],"answer":3,"explain":"Naquela época, o café era a principal produção do Brasil e precisava de muitos trabalhadores."},{"q":"Em qual estado brasileiro vive a maior comunidade de descendentes de japoneses?","options":["Amapá","Acre","Roraima","São Paulo"],"answer":3,"explain":"A partir de 1908, muitos imigrantes japoneses chegaram pelo porto de Santos, em São Paulo, e se estabeleceram no estado."},{"q":"Qual atitude mostra respeito às diferentes culturas?","options":["proibir festas de outros povos","rir das tradições dos outros","conhecer e valorizar costumes diferentes dos nossos","achar que só o nosso jeito é certo"],"answer":2,"explain":"O Brasil foi formado por muitos povos. Conhecer e respeitar as diferenças deixa todo mundo mais rico!"}]},{"id":"3-his-fontes-historicas","name":"Fontes históricas e linha do tempo","desc":"Pratica tipos de fontes históricas (escritas, orais, visuais e materiais) e a organização do tempo.","questions":[{"q":"O que é uma fonte histórica?","options":["Qualquer registro que nos ajuda a conhecer o passado","Um bebedouro antigo","Um livro de histórias inventadas","Um lugar para nadar"],"answer":0,"explain":"Fontes históricas são documentos, objetos, fotos e relatos que nos contam como era o passado."},{"q":"Uma fotografia antiga da sua cidade é uma fonte histórica:","options":["visual","oral","escrita","inventada"],"answer":0,"explain":"Fotografias, pinturas e desenhos são fontes visuais: a gente observa as imagens."},{"q":"Quando o vovô conta como era a cidade na infância dele, ele é uma fonte:","options":["material","escrita","oral","visual"],"answer":2,"explain":"Fonte oral é aquela que vem da fala, das memórias contadas pelas pessoas."},{"q":"Uma certidão de nascimento é uma fonte:","options":["sonora","oral","escrita","imaginária"],"answer":2,"explain":"Documentos, cartas, jornais e diários são fontes escritas."},{"q":"Um ferro de passar roupa antigo, guardado em um museu, é uma fonte:","options":["escrita","material","sonora","oral"],"answer":1,"explain":"Objetos, roupas, ferramentas e construções são fontes materiais."},{"q":"Onde podemos ver muitos objetos e documentos antigos para conhecer o passado?","options":["na quadra de esportes","no museu","na piscina","no estacionamento"],"answer":1,"explain":"Os museus guardam e mostram objetos e documentos importantes da história."},{"q":"Para saber como era a escola há muitos anos, uma boa ideia é:","options":["olhar as nuvens","adivinhar","entrevistar ex-alunos e ver fotos antigas","assistir a um desenho de ficção"],"answer":2,"explain":"Entrevistas e fotos antigas são fontes que mostram como a escola era de verdade."},{"q":"Para que serve uma linha do tempo?","options":["Para medir a altura das pessoas","Para organizar os acontecimentos na ordem em que aconteceram","Para desenhar mapas","Para contar dinheiro"],"answer":1,"explain":"A linha do tempo mostra os fatos em ordem, do mais antigo para o mais recente."},{"q":"A vovó nasceu em 1958, a mamãe em 1988 e Davi em 2018. Qual é a ordem do mais antigo para o mais recente?","options":["Davi, mamãe, vovó","vovó, Davi, mamãe","mamãe, vovó, Davi","vovó, mamãe, Davi"],"answer":3,"explain":"1958 vem antes de 1988, que vem antes de 2018. Então: vovó, mamãe e Davi."},{"q":"Uma década tem quantos anos?","options":["12","5","10","100"],"answer":2,"explain":"Uma década é um período de 10 anos."},{"q":"Um século tem quantos anos?","options":["100","10","50","1000"],"answer":0,"explain":"Um século é um período de 100 anos."},{"q":"Uma praça foi inaugurada em 1926. Quantos anos ela completou em 2026?","options":["26 anos","1000 anos","10 anos","100 anos"],"answer":3,"explain":"2026 − 1926 = 100. A praça completou um século!"}]},{"id":"3-his-patrimonio-memoria","name":"Patrimônio e marcos de memória","desc":"Pratica patrimônio material e imaterial, monumentos, museus e nomes de ruas que guardam a memória da cidade.","questions":[{"q":"O que é patrimônio histórico e cultural?","options":["Tudo o que é novo","Os carros de uma família","Aquilo que tem valor para a memória e a história de um povo e deve ser preservado","Somente o dinheiro de uma cidade"],"answer":2,"explain":"Patrimônio é o que herdamos do passado e queremos cuidar para as próximas gerações."},{"q":"Qual destes é um exemplo de patrimônio material?","options":["um prédio histórico","um modo de fazer renda","uma dança tradicional","uma lenda contada pelos avós"],"answer":0,"explain":"Patrimônio material é aquilo que podemos tocar, como prédios, igrejas, pontes e objetos."},{"q":"Qual destes é um exemplo de patrimônio imaterial?","options":["o frevo, dança de Pernambuco","uma estátua de bronze","uma ponte antiga","um museu"],"answer":0,"explain":"Patrimônio imaterial são saberes, danças, músicas, festas e modos de fazer. O frevo é patrimônio imaterial do Brasil."},{"q":"A roda de capoeira é reconhecida como patrimônio cultural do Brasil. Ela é um patrimônio:","options":["imaterial","material","natural","mineral"],"answer":0,"explain":"A roda de capoeira é uma prática, com música, movimentos e saberes. Por isso é patrimônio imaterial."},{"q":"As festas juninas, com quadrilha e comidas de milho, fazem parte:","options":["da cultura popular brasileira","das regras do futebol","só da cultura de outros países","das leis de trânsito"],"answer":0,"explain":"As festas juninas são uma tradição muito forte em todo o Brasil, principalmente no Nordeste."},{"q":"Uma receita de bolo passada da bisavó para a avó, e da avó para a mãe, é:","options":["um monumento","uma lei da cidade","uma memória da família que passa de geração em geração","uma notícia de jornal"],"answer":2,"explain":"Receitas, histórias e costumes passados na família também são parte da nossa memória e do nosso patrimônio."},{"q":"O Cristo Redentor é um monumento famoso de qual cidade?","options":["São Paulo","Rio de Janeiro","Manaus","Salvador"],"answer":1,"explain":"O Cristo Redentor fica no alto do morro do Corcovado, no Rio de Janeiro."},{"q":"Para que serve um museu?","options":["Para guardar, estudar e mostrar objetos de valor histórico e cultural","Para fazer compras de mercado","Para vender roupas novas","Para consertar carros"],"answer":0,"explain":"O museu preserva objetos e documentos e os mostra para que todos conheçam a história."},{"q":"Por que muitas ruas e praças têm nomes de pessoas?","options":["Para confundir os motoristas","Porque os nomes são sorteados","Para homenagear e lembrar pessoas importantes","Porque é proibido usar outros nomes"],"answer":2,"explain":"Dar o nome de alguém a uma rua é uma forma de homenagear e manter viva a memória dessa pessoa."},{"q":"Para que servem monumentos, estátuas e placas nas praças?","options":["Para atrapalhar a passagem","Para lembrar pessoas e acontecimentos importantes","Para servir de brinquedo","Para marcar o lugar de jogar lixo"],"answer":1,"explain":"Monumentos são marcos de memória: lembram fatos e pessoas da história do lugar."},{"q":"Marcos de memória são:","options":["marcas de pneu na rua","lugares, nomes e objetos que lembram fatos e pessoas do passado","os números das casas","as nuvens no céu"],"answer":1,"explain":"Monumentos, prédios antigos e nomes de ruas são marcos que ajudam a lembrar a história da cidade."},{"q":"O que significa preservar o patrimônio?","options":["Levar pedaços para casa","Derrubar prédios antigos","Pichar as paredes","Cuidar dele e não estragar"],"answer":3,"explain":"Preservar é cuidar, para que as pessoas do futuro também possam conhecer nossa história."},{"q":"Qual destas atitudes ajuda a preservar a memória da cidade?","options":["Pichar monumentos","Arrancar placas antigas","Visitar museus e cuidar dos prédios históricos","Jogar lixo nas praças"],"answer":2,"explain":"Visitar, conhecer e cuidar dos lugares históricos ajuda a manter viva a memória da cidade."}]},{"id":"3-his-espacos-publicos-privados","name":"Espaços públicos, privados e de conservação","desc":"Pratica diferenciar espaços públicos, privados e áreas de conservação ambiental, e suas funções.","questions":[{"q":"Espaço público é aquele que:","options":["só o dono pode entrar","pode ser usado por todas as pessoas","pertence a uma só família","é proibido para crianças"],"answer":1,"explain":"Espaços públicos, como praças e ruas, são de todos e podem ser usados por toda a população."},{"q":"Qual destes é um espaço público?","options":["o quarto do vizinho","o quintal de uma família","a sua casa","praça"],"answer":3,"explain":"A praça é de uso de todos. Casa, quarto e quintal são espaços privados."},{"q":"Qual destes é um espaço privado (particular)?","options":["o posto de saúde público","a praça","a rua","a casa de uma família"],"answer":3,"explain":"A casa pertence a uma família, e só entra quem os moradores permitirem."},{"q":"A cozinha e o quarto de uma casa são espaços:","options":["de uso de toda a cidade","de conservação ambiental","públicos","domésticos (privados)"],"answer":3,"explain":"Os cômodos da casa são espaços domésticos, que pertencem à família que mora ali."},{"q":"Para entrar na casa de outra pessoa, é preciso:","options":["ser vereador","apenas querer entrar","ter a permissão dos moradores","pagar um ingresso à prefeitura"],"answer":2,"explain":"A casa é um espaço privado: só entramos com a permissão de quem mora lá."},{"q":"Quem cuida da manutenção de praças, ruas e escolas públicas?","options":["o poder público, como a prefeitura","só os moradores de uma casa","os turistas","as lojas do centro"],"answer":0,"explain":"O poder público usa o dinheiro dos impostos para cuidar dos espaços públicos."},{"q":"Qual é a função de um hospital público?","options":["atender pessoas doentes","vender alimentos","guardar livros","consertar carros"],"answer":0,"explain":"O hospital público atende a população que precisa de cuidados de saúde."},{"q":"Qual espaço público empresta livros para os moradores?","options":["garagem","delegacia","posto de combustível","biblioteca pública"],"answer":3,"explain":"Na biblioteca pública, qualquer pessoa pode ler e pegar livros emprestados."},{"q":"Qual destes lugares é um espaço público de lazer?","options":["o escritório de uma empresa","parque municipal","o quintal do vizinho","a sala da casa da vovó"],"answer":1,"explain":"O parque municipal é aberto a todos para passear, brincar e descansar."},{"q":"Como devemos agir nos espaços públicos?","options":["Jogar lixo no chão","Pichar os bancos","Estragar, porque não são nossos","Cuidar e respeitar, porque são de todos"],"answer":3,"explain":"Os espaços públicos são de todos nós. Cuidar deles é respeitar todos que os usam."},{"q":"Um parque nacional ou uma reserva ambiental é uma área de:","options":["construção de prédios","depósito de lixo","estacionamento","conservação da natureza"],"answer":3,"explain":"Essas áreas existem para proteger a natureza: plantas, animais, rios e paisagens."},{"q":"Por que existem áreas de conservação ambiental?","options":["Para proteger plantas, animais, rios e nascentes","Para construir fábricas","Para caçar animais","Para fazer queimadas"],"answer":0,"explain":"As áreas de conservação protegem a natureza, que é importante para a vida de todos."},{"q":"O Parque Nacional do Iguaçu, onde ficam as Cataratas do Iguaçu, fica em qual estado?","options":["Bahia","Ceará","Paraná","Amazonas"],"answer":2,"explain":"O Parque Nacional do Iguaçu fica no Paraná e protege as cataratas e uma grande área de mata."}]},{"id":"3-his-modos-de-vida","name":"Modos de vida no campo e na cidade: antes e hoje","desc":"Pratica comparar como as pessoas viviam no passado e vivem hoje, no campo e na cidade.","questions":[{"q":"Antes da luz elétrica, as casas eram iluminadas por:","options":["luminárias elétricas","lâmpadas de LED","lanternas de celular","lamparinas, velas e lampiões"],"answer":3,"explain":"Sem energia elétrica, a luz vinha do fogo: velas, lamparinas e lampiões."},{"q":"O que mudou nas casas com a chegada da energia elétrica?","options":["Elas passaram a ter lâmpadas, geladeira e outros aparelhos","Elas passaram a usar só velas","Elas ficaram sem água","As pessoas pararam de cozinhar"],"answer":0,"explain":"A energia elétrica trouxe lâmpadas, geladeira, rádio, TV e muitos outros aparelhos."},{"q":"Antigamente, antes de existir geladeira, como muitas famílias conservavam a carne?","options":["Salgando e secando a carne","No micro-ondas","Em sacolas plásticas","No freezer"],"answer":0,"explain":"O sal e a secagem ajudam a conservar a carne. É assim que se faz a carne-seca."},{"q":"Antigamente, como as pessoas costumavam se comunicar com quem morava longe?","options":["Por e-mail","Por aplicativo de mensagem","Por videochamada","Por cartas enviadas pelo correio"],"answer":3,"explain":"Antes da internet e dos celulares, as cartas eram a forma mais comum de falar com quem estava longe."},{"q":"Antigamente, muitas pessoas se locomoviam usando:","options":["patinetes elétricos","carroças, cavalos e bondes","carros elétricos","aviões a jato"],"answer":1,"explain":"Antes de os carros se tornarem comuns, as pessoas usavam animais, carroças e bondes para se locomover."},{"q":"Antigamente, como muitas famílias do campo conseguiam água?","options":["Por máquinas automáticas","Em poços, usando baldes","Pela torneira, com água encanada em todas as casas","Em garrafões entregues por aplicativo"],"answer":1,"explain":"Sem água encanada, era preciso buscar água em poços, rios e nascentes."},{"q":"Antigamente, as roupas eram lavadas muitas vezes:","options":["em máquina de lavar automática","em lavanderia por aplicativo","por robôs","à mão, em rios ou tanques"],"answer":3,"explain":"Antes da máquina de lavar, as roupas eram esfregadas à mão, em rios ou tanques."},{"q":"Como as crianças antigamente se divertiam muitas vezes?","options":["Com tablets","Com videogames online","Com brincadeiras de rua, como pião, pipa e amarelinha","Assistindo a vídeos no celular"],"answer":2,"explain":"Pião, pipa, amarelinha e pega-pega são brincadeiras antigas, e muitas crianças brincam delas até hoje!"},{"q":"Hoje, muitas tarefas do campo são feitas com:","options":["apenas as mãos","apenas enxadas","tratores e outras máquinas","foguetes"],"answer":2,"explain":"Tratores, colheitadeiras e outras máquinas tornaram o trabalho no campo mais rápido."},{"q":"O que hoje é comum tanto no campo quanto na cidade?","options":["O uso de celular e energia elétrica em muitos lugares","Lampiões em todas as casas","Cartas como única forma de comunicação","Bondes puxados por burros"],"answer":0,"explain":"Hoje a energia elétrica e o celular chegam a muitos lugares do campo e da cidade."},{"q":"Uma diferença entre o campo e a cidade é que, no campo, geralmente:","options":["há mais trânsito de carros","as casas ficam mais distantes umas das outras","há mais shoppings","há mais prédios altos"],"answer":1,"explain":"No campo, sítios e fazendas são grandes, por isso as casas ficam mais afastadas."},{"q":"Na cidade, hoje, a maioria das pessoas consegue seus alimentos:","options":["comprando em mercados e feiras","caçando nas ruas","pescando no lago da praça","plantando tudo no apartamento"],"answer":0,"explain":"Na cidade, a maioria das pessoas compra alimentos que vêm do campo em mercados e feiras."}]},{"id":"3-his-trabalho-lazer","name":"Trabalho e lazer: antes e hoje","desc":"Pratica trabalhos do campo e da cidade, profissões que mudaram com a tecnologia e formas de lazer.","questions":[{"q":"Qual trabalho é mais comum no campo?","options":["condutor de metrô","agricultor","bancário","vendedor de shopping"],"answer":1,"explain":"O agricultor planta e colhe alimentos, um trabalho típico do campo."},{"q":"Qual trabalho é mais comum na cidade?","options":["colhedor de café","vaqueiro","tratorista","caixa de supermercado"],"answer":3,"explain":"Supermercados ficam nas cidades. Vaqueiro, colhedor de café e tratorista trabalham no campo."},{"q":"Por que o trabalho do agricultor é importante para quem mora na cidade?","options":["Porque fabrica carros","Porque dirige o metrô","Porque produz os alimentos que chegam aos mercados","Porque constrói prédios"],"answer":2,"explain":"Grande parte da comida que compramos na cidade é produzida no campo."},{"q":"A colheitadeira é uma máquina que ajuda no trabalho:","options":["do campo, colhendo as plantações","do hospital","do escritório","da escola"],"answer":0,"explain":"A colheitadeira colhe grandes plantações, como de soja e milho, muito mais rápido que à mão."},{"q":"Antigamente, o leiteiro:","options":["dirigia ônibus elétricos","consertava computadores","vendia celulares","entregava leite de porta em porta"],"answer":3,"explain":"O leiteiro passava nas casas entregando leite fresco, uma profissão comum no passado."},{"q":"O acendedor de lampiões era uma profissão antiga. O que ele fazia?","options":["Consertava sapatos","Acendia as luzes dos postes das ruas","Vendia pão","Plantava árvores"],"answer":1,"explain":"Antes da luz elétrica nas ruas, ele acendia os lampiões dos postes ao anoitecer."},{"q":"Antes de as máquinas de costura se tornarem comuns, as roupas eram feitas:","options":["por aplicativos","por impressoras 3D","à mão, por costureiras e alfaiates","por robôs"],"answer":2,"explain":"Costureiras e alfaiates costuravam as roupas ponto por ponto, com agulha e linha."},{"q":"Qual profissão surgiu recentemente, junto com a internet?","options":["ferreiro","lavadeira","acendedor de lampiões","criador de aplicativos"],"answer":3,"explain":"Criar aplicativos só passou a existir com os computadores e a internet. As outras profissões são antigas."},{"q":"Por que a tecnologia mudou muitos trabalhos?","options":["Porque proibiram as ferramentas","Porque máquinas e computadores fazem tarefas mais rápido","Porque todas as profissões acabaram","Porque as pessoas pararam de trabalhar"],"answer":1,"explain":"Com máquinas e computadores, muitos trabalhos mudaram, alguns sumiram e outros novos surgiram."},{"q":"O que é lazer?","options":["As tarefas obrigatórias da escola","A hora de acordar","Atividades que fazemos no tempo livre para descansar e se divertir","O trabalho mais cansativo"],"answer":2,"explain":"Lazer é o tempo de diversão e descanso, como brincar, passear e praticar esportes."},{"q":"Qual destes é um exemplo de lazer?","options":["brincar no parque","fazer o dever de casa","lavar a louça","trabalhar na fábrica"],"answer":0,"explain":"Brincar no parque é uma atividade de diversão no tempo livre: é lazer!"},{"q":"Qual brincadeira existe há muito tempo e ainda é feita hoje?","options":["jogar videogame online","soltar pipa","assistir a vídeos na internet","usar óculos de realidade virtual"],"answer":1,"explain":"Soltar pipa é uma brincadeira muito antiga que continua divertindo as crianças até hoje."}]}]},{"id":"geo","name":"Geografia","topics":[{"id":"3-geo-paisagens","name":"Paisagens naturais e modificadas","desc":"Pratica elementos naturais e culturais da paisagem e como a natureza e o ser humano a transformam.","questions":[{"q":"O que é paisagem?","options":["Tudo aquilo que vemos e percebemos em um lugar","Apenas o céu","Apenas os prédios","Apenas as montanhas"],"answer":0,"explain":"Paisagem é tudo o que nossos sentidos percebem em um lugar: o que vemos, ouvimos e sentimos."},{"q":"Qual destes é um elemento natural da paisagem?","options":["ponte","rio","estrada","prédio"],"answer":1,"explain":"O rio foi formado pela natureza. Ponte, prédio e estrada foram construídos pelo ser humano."},{"q":"Qual destes elementos da paisagem foi formado pela natureza?","options":["nuvem","semáforo","poste","calçada"],"answer":0,"explain":"As nuvens se formam naturalmente. Semáforo, calçada e poste são construções humanas."},{"q":"Qual destes é um elemento cultural, ou seja, construído pelo ser humano?","options":["cachoeira","viaduto","floresta","montanha"],"answer":1,"explain":"O viaduto foi construído por pessoas. Os outros são elementos da natureza."},{"q":"Uma paisagem com poucos sinais da ação humana, como uma floresta preservada, é chamada de:","options":["paisagem industrial","paisagem urbana","paisagem natural","paisagem modificada"],"answer":2,"explain":"Paisagem natural é aquela em que predominam os elementos da natureza."},{"q":"Quando as pessoas constroem casas, ruas e plantações, a paisagem fica:","options":["natural","modificada (humanizada)","invisível","congelada"],"answer":1,"explain":"A ação humana transforma a paisagem. Por isso ela passa a ser chamada de modificada ou humanizada."},{"q":"Uma paisagem com muitos prédios, carros e asfalto é uma paisagem:","options":["rural","natural","urbana","de floresta"],"answer":2,"explain":"A paisagem urbana é a das cidades, com muitas construções."},{"q":"Qual destas é uma transformação natural da paisagem?","options":["a pintura de uma casa","a abertura de uma rua","a construção de um shopping","a erosão causada pela chuva e pelo vento"],"answer":3,"explain":"A chuva e o vento desgastam o solo e as rochas sem a ação humana: é uma transformação natural."},{"q":"As ondas do mar, batendo nas rochas durante muitos anos:","options":["pintam as rochas de azul","fazem as rochas crescerem","desgastam e mudam o formato das rochas","deixam as rochas sempre iguais"],"answer":2,"explain":"A força da água, com o tempo, vai desgastando as rochas e mudando a paisagem do litoral."},{"q":"Um vulcão em erupção é um exemplo de:","options":["construção de uma cidade","plantação","transformação natural da paisagem","transformação feita pelo ser humano"],"answer":2,"explain":"O vulcão é um fenômeno da natureza que pode mudar muito a paisagem."},{"q":"Derrubar uma floresta para fazer pasto é uma transformação causada:","options":["pela chuva","pelo vento","pelo ser humano","pelos animais da floresta"],"answer":2,"explain":"O desmatamento é feito por pessoas, por isso é uma transformação humana da paisagem."},{"q":"Comparando uma foto antiga com uma foto atual da mesma rua, podemos perceber:","options":["o som dos carros antigos","o cheiro da rua","o que as pessoas estavam pensando","as mudanças que aconteceram na paisagem com o tempo"],"answer":3,"explain":"Fotos de épocas diferentes mostram como as paisagens se transformam ao longo do tempo."}]},{"id":"3-geo-campo-cidade","name":"Campo e cidade","desc":"Pratica as diferenças e as ligações entre o campo (zona rural) e a cidade (zona urbana).","questions":[{"q":"O campo também é chamado de:","options":["bairro comercial","zona rural","zona urbana","centro da cidade"],"answer":1,"explain":"O campo é a zona rural, onde ficam sítios, chácaras e fazendas."},{"q":"A cidade também é chamada de:","options":["zona urbana","sítio","fazenda","zona rural"],"answer":0,"explain":"A cidade é a zona urbana, com ruas, prédios, comércio e serviços."},{"q":"Qual atividade é típica do campo?","options":["dirigir táxi","cultivar milho e criar gado","trabalhar em um banco","vender em lojas de shopping"],"answer":1,"explain":"Agricultura e pecuária são as principais atividades do campo."},{"q":"Quais atividades são mais típicas da cidade?","options":["criar gado no pasto","comércio e serviços, como lojas, bancos e hospitais","colher café","plantar arroz"],"answer":1,"explain":"Nas cidades há muitas lojas, bancos, escolas e hospitais: comércio e serviços."},{"q":"Qual destes é encontrado principalmente nas cidades grandes?","options":["curral","pomar","metrô","pasto"],"answer":2,"explain":"O metrô é um transporte das cidades grandes. Pasto, curral e pomar são do campo."},{"q":"Uma pessoa que trabalha cuidando do gado na fazenda é o:","options":["bancário","porteiro de prédio","vaqueiro","garçom"],"answer":2,"explain":"O vaqueiro (ou peão) cuida do gado no campo."},{"q":"Como o campo e a cidade dependem um do outro?","options":["A cidade não precisa do campo","O campo produz alimentos e a cidade fornece produtos industrializados e serviços","Eles não trocam nada entre si","O campo não precisa da cidade"],"answer":1,"explain":"O campo manda alimentos e matérias-primas para a cidade, e a cidade oferece máquinas, roupas e serviços ao campo."},{"q":"O leite tirado da vaca no sítio vai para uma fábrica na cidade, onde vira queijo. Isso mostra:","options":["a ligação entre o campo e a cidade","que o queijo nasce em árvores","que a cidade produz leite","que o campo não produz nada"],"answer":0,"explain":"O produto sai do campo e é transformado na cidade: campo e cidade trabalham juntos."},{"q":"Um problema comum nas cidades grandes é:","options":["ausência de ruas","excesso de plantações","trânsito intenso e poluição do ar","falta total de casas"],"answer":2,"explain":"Com muitos carros e fábricas, as cidades grandes têm congestionamentos e ar poluído."},{"q":"No campo, a distância até escolas e hospitais costuma ser:","options":["menor que na cidade","maior, porque as casas ficam espalhadas","zero, porque fica tudo junto","igual à de um quarteirão"],"answer":1,"explain":"No campo, as moradias ficam distantes umas das outras e dos serviços, que costumam ficar nas cidades."},{"q":"Qual festa tradicional brasileira tem ligação com a vida no campo e com a colheita do milho?","options":["festa junina","Dia da Independência","réveillon","Dia das Crianças"],"answer":0,"explain":"As festas juninas acontecem na época da colheita do milho e lembram a vida no campo, com quadrilha e comidas típicas."},{"q":"Que cuidado é importante para quem usa tratores e outras máquinas no campo?","options":["Usar sem treinamento","Deixar crianças dirigirem","Tirar as proteções da máquina","Seguir as regras e usar equipamentos de proteção"],"answer":3,"explain":"Máquinas agrícolas podem causar acidentes. Por isso é preciso treinamento e equipamentos de proteção."}]},{"id":"3-geo-povos-tradicionais","name":"Povos e comunidades tradicionais","desc":"Pratica os modos de vida de indígenas, quilombolas, ribeirinhos, caiçaras e outros grupos, e suas contribuições.","questions":[{"q":"Como são os povos indígenas do Brasil?","options":["São todos iguais e falam a mesma língua","Já não existem mais","São muitos povos diferentes, com línguas e costumes próprios","Vieram da Europa"],"answer":2,"explain":"No Brasil vivem centenas de povos indígenas, que falam mais de 200 línguas diferentes."},{"q":"Por que é importante respeitar as terras dos povos indígenas?","options":["Porque elas são essenciais para a vida, a cultura e o sustento desses povos","Porque ninguém mora nelas","Porque lá não há florestas","Porque são lugares de turismo"],"answer":0,"explain":"Nas suas terras, os povos indígenas vivem, plantam, caçam, pescam e mantêm suas tradições."},{"q":"Qual alimento muito consumido no Brasil foi cultivado primeiro pelos povos indígenas?","options":["maçã","trigo","mandioca","uva"],"answer":2,"explain":"A mandioca é nativa da América do Sul e já era plantada pelos indígenas antes da chegada dos europeus."},{"q":"A tapioca e o beiju são feitos de mandioca. Eles são uma herança:","options":["indígena","alemã","japonesa","italiana"],"answer":0,"explain":"Os povos indígenas já preparavam beiju com a goma da mandioca. Hoje esse alimento está em todo o Brasil."},{"q":"Quem são os quilombolas?","options":["Pessoas que vieram do Japão","Moradores de prédios","Descendentes de africanos escravizados que vivem em comunidades chamadas quilombos","Turistas estrangeiros"],"answer":2,"explain":"As comunidades quilombolas mantêm tradições e modos de vida ligados à história de resistência de seus antepassados."},{"q":"Os ribeirinhos são comunidades que vivem:","options":["em cavernas de gelo","às margens dos rios","no alto de prédios","no deserto"],"answer":1,"explain":"Ribeirinhos moram nas margens dos rios, muitas vezes em casas sobre palafitas, principalmente na Amazônia."},{"q":"Qual atividade é muito importante para os ribeirinhos da Amazônia?","options":["o trabalho no metrô","o trabalho em grandes fábricas","a pesca","a criação de pinguins"],"answer":2,"explain":"O rio é central na vida dos ribeirinhos: dele vêm os peixes, a água e o caminho para se locomover de barco."},{"q":"Os caiçaras são comunidades tradicionais que vivem:","options":["no litoral, da pesca artesanal e da pequena agricultura","nas grandes metrópoles","em ilhas geladas","no sertão seco, longe do mar"],"answer":0,"explain":"Os caiçaras vivem no litoral, principalmente de São Paulo, Rio de Janeiro e Paraná, e são conhecidos pela pesca artesanal."},{"q":"Seringueiros são trabalhadores da Amazônia que retiram das árvores:","options":["o látex, usado para fazer borracha","o petróleo","o ferro","o mel"],"answer":0,"explain":"O seringueiro faz pequenos cortes na seringueira e recolhe o látex, que vira borracha."},{"q":"O que os povos e comunidades tradicionais costumam ter em comum?","options":["Trabalho em fábricas","Moradia em grandes prédios","Uma forte ligação com a natureza e com o lugar onde vivem","A mesma língua no mundo todo"],"answer":2,"explain":"Esses povos conhecem profundamente a natureza do lugar onde vivem e dependem dela para seu sustento."},{"q":"Como muitos povos tradicionais passam seus conhecimentos?","options":["Escondendo tudo das crianças","Contando histórias e ensinando os mais jovens no dia a dia","Só por livros estrangeiros","Apenas pela televisão"],"answer":1,"explain":"Os mais velhos ensinam os mais jovens conversando, contando histórias e mostrando como se faz."},{"q":"Imigrantes que chegaram ao Brasil deixaram marcas nas cidades, como:","options":["nomes de bairros, comidas e festas típicas","o formato das nuvens","a altura das montanhas","a cor do mar"],"answer":0,"explain":"Comidas, festas, construções e nomes de lugares mostram a contribuição de povos de várias origens."}]},{"id":"3-geo-producao-materia-prima","name":"Produção, matéria-prima e consumo","desc":"Pratica agricultura, pecuária, extrativismo e indústria, e de onde vêm os materiais dos produtos que usamos.","questions":[{"q":"O que é matéria-prima?","options":["O material usado para fabricar um produto","O caminhão de entrega","O produto pronto na loja","O dinheiro da compra"],"answer":0,"explain":"Matéria-prima é o que a indústria transforma, como a madeira que vira móvel."},{"q":"Qual é a matéria-prima do papel?","options":["ferro","leite","areia","madeira das árvores"],"answer":3,"explain":"O papel é feito da celulose, que vem da madeira das árvores."},{"q":"Qual é a principal matéria-prima do pão?","options":["farinha de trigo","barro","algodão","borracha"],"answer":0,"explain":"O pão é feito principalmente com farinha de trigo."},{"q":"O algodão é a matéria-prima de:","options":["tijolos","panelas de ferro","roupas e tecidos","vidro"],"answer":2,"explain":"As fibras do algodão viram fios, e os fios viram tecidos para roupas."},{"q":"O vidro é fabricado principalmente a partir de:","options":["areia","lã","leite","madeira"],"answer":0,"explain":"A areia, aquecida a temperaturas altíssimas com outros materiais, vira vidro."},{"q":"O leite é matéria-prima de qual produto?","options":["papel","tijolo","vidro","queijo"],"answer":3,"explain":"Com o leite se fazem queijo, iogurte, manteiga e outros produtos."},{"q":"O minério de ferro, retirado do solo, é usado para fabricar:","options":["aço para carros, panelas e pregos","pão","roupas de algodão","papel"],"answer":0,"explain":"O ferro é transformado em aço, usado em carros, construções, panelas e muitos outros objetos."},{"q":"Plantar e colher alimentos é uma atividade chamada:","options":["agricultura","indústria","mineração","pecuária"],"answer":0,"explain":"Agricultura é o cultivo de plantas, como arroz, feijão, milho e frutas."},{"q":"Criar animais como bois, porcos e galinhas é a:","options":["pesca","agricultura","pecuária","mineração"],"answer":2,"explain":"Pecuária é a criação de animais para produzir carne, leite, ovos, couro e lã."},{"q":"Retirar da natureza produtos como castanhas, açaí e peixes é o:","options":["comércio","transporte","extrativismo","turismo"],"answer":2,"explain":"Extrativismo é retirar recursos diretamente da natureza, sem precisar plantar ou criar."},{"q":"A indústria é o lugar onde:","options":["se plantam alimentos","a matéria-prima é transformada em produtos","se criam animais soltos no pasto","se pescam peixes"],"answer":1,"explain":"Nas fábricas, a matéria-prima vira produtos, como o trigo que vira biscoito."},{"q":"Qual é a ordem do caminho de um suco de laranja de caixinha até a nossa casa?","options":["transporte, mercado, fábrica, plantação","plantação, fábrica, transporte, mercado","fábrica, mercado, plantação, transporte","mercado, plantação, fábrica, transporte"],"answer":1,"explain":"A laranja é colhida, vira suco na fábrica, é transportada e chega ao mercado."},{"q":"Consumir de forma consciente significa:","options":["comprar tudo o que aparece nas propagandas","jogar fora coisas que ainda servem","trocar de brinquedo toda semana","comprar só o necessário e evitar desperdício"],"answer":3,"explain":"Consumo consciente economiza dinheiro, gera menos lixo e usa menos recursos da natureza."}]},{"id":"3-geo-agua","name":"A água e seus usos","desc":"Pratica os usos da água em casa, na agricultura e na produção de energia, e como economizar e proteger a água.","questions":[{"q":"Qual destes é um uso da água no dia a dia?","options":["beber, cozinhar e tomar banho","fabricar areia","acender o fogo","secar a roupa"],"answer":0,"explain":"Usamos água o tempo todo: para beber, cozinhar, tomar banho e limpar."},{"q":"Água potável é a água:","options":["suja do esgoto","própria para beber","salgada do mar","da chuva misturada com lama"],"answer":1,"explain":"Água potável é limpa e tratada, segura para beber."},{"q":"Onde a água é tratada para ficar potável antes de chegar às casas?","options":["na estação de tratamento de água","na padaria","no posto de combustível","na escola"],"answer":0,"explain":"Na estação de tratamento, a água é filtrada e limpa antes de ir pelos canos até as casas."},{"q":"A maior parte da água do planeta está:","options":["nas garrafas","nos oceanos e é salgada","nas nuvens","nos rios e é doce"],"answer":1,"explain":"Quase toda a água da Terra é salgada, dos oceanos. A água doce é pouca, por isso precisamos cuidar dela."},{"q":"Qual atividade usa a maior parte da água retirada dos rios no Brasil?","options":["as lojas de roupas","os cinemas","a agricultura, para irrigar plantações","as escolas"],"answer":2,"explain":"A irrigação das plantações é o uso que mais consome água no Brasil."},{"q":"Na agricultura, qual forma de irrigação economiza mais água?","options":["regar ao meio-dia com sol forte","gotejamento, que molha só perto da raiz da planta","jogar água com mangueira o dia todo","inundar a plantação sem controle"],"answer":1,"explain":"No gotejamento, a água cai gota a gota perto da raiz, sem desperdício."},{"q":"A usina hidrelétrica usa a força da água para produzir:","options":["areia","energia elétrica","alimentos","gelo"],"answer":1,"explain":"A água passa pelas turbinas da usina, que giram e geram eletricidade. É assim que se produz grande parte da energia do Brasil."},{"q":"Qual atitude economiza água?","options":["Tomar banhos muito longos","Fechar a torneira enquanto escova os dentes","Deixar a torneira pingando","Lavar a calçada com mangueira"],"answer":1,"explain":"Fechar a torneira enquanto escova os dentes evita que muita água vá para o ralo à toa."},{"q":"Usar a água que sai da máquina de lavar para limpar o quintal é um exemplo de:","options":["poluição","irrigação de plantações","reúso da água","desperdício"],"answer":2,"explain":"Reúso é aproveitar de novo uma água que já foi usada, em tarefas que não precisam de água potável."},{"q":"O que acontece com um rio quando recebe esgoto e lixo?","options":["Fica poluído e prejudica peixes e pessoas","Fica mais limpo","Passa a ter mais peixes","Vira água potável"],"answer":0,"explain":"Esgoto e lixo sujam a água, matam peixes e podem causar doenças."},{"q":"O uso exagerado de agrotóxicos nas plantações pode:","options":["deixar a água mais limpa","aumentar a quantidade de peixes","fazer chover mais","contaminar a água dos rios e do solo"],"answer":3,"explain":"A chuva leva os agrotóxicos para os rios e para dentro do solo, contaminando a água."},{"q":"Por que é importante proteger as nascentes?","options":["Porque são lugares para construir prédios","Porque lá se pode jogar lixo","Porque nascentes servem só de enfeite","Porque é onde os rios começam, e sem elas o rio pode secar"],"answer":3,"explain":"A nascente é o começo do rio. Se ela for destruída, o rio pode diminuir ou secar."},{"q":"As matas que ficam nas margens dos rios, chamadas de matas ciliares, ajudam a:","options":["aumentar a poluição","secar o rio","proteger o rio, evitando que terra e sujeira caiam na água","esquentar a água"],"answer":2,"explain":"Como os cílios protegem os olhos, a mata ciliar protege o rio contra a erosão e a sujeira."}]},{"id":"3-geo-lixo-reciclagem","name":"Lixo, consumo e reciclagem","desc":"Pratica os 3 Rs, as cores da coleta seletiva e o descarte correto do lixo.","questions":[{"q":"O que significam os 3 Rs?","options":["reciclar, rir e repetir","reduzir, rasgar e reclamar","reduzir, reutilizar e reciclar","rasgar, rabiscar e rolar"],"answer":2,"explain":"Reduzir o consumo, reutilizar objetos e reciclar materiais ajudam a diminuir o lixo."},{"q":"Levar uma sacola de pano ao mercado, em vez de pegar sacolas plásticas, é um exemplo de:","options":["reciclar vidro","reduzir o lixo","aumentar o lixo","desperdiçar"],"answer":1,"explain":"Usando a sacola de pano, menos sacolas plásticas viram lixo. Isso é reduzir."},{"q":"Usar um pote de sorvete vazio para guardar lápis é um exemplo de:","options":["reutilizar","queimar","reduzir","jogar fora"],"answer":0,"explain":"Dar um novo uso a um objeto, sem transformá-lo, é reutilizar."},{"q":"O que é reciclar?","options":["Transformar um material usado em um novo produto","Enterrar tudo no quintal","Jogar o lixo no rio","Comprar mais coisas"],"answer":0,"explain":"Na reciclagem, garrafas, latas e papéis usados viram matéria-prima para novos produtos."},{"q":"Na coleta seletiva, a lixeira azul é para:","options":["papel","vidro","plástico","metal"],"answer":0,"explain":"Azul é para papel e papelão."},{"q":"Na coleta seletiva, a lixeira vermelha é para:","options":["papel","vidro","plástico","restos de comida"],"answer":2,"explain":"Vermelho é para plástico, como garrafas PET e embalagens."},{"q":"Na coleta seletiva, a lixeira verde é para:","options":["papel","metal","plástico","vidro"],"answer":3,"explain":"Verde é para vidro, como potes e garrafas."},{"q":"Na coleta seletiva, a lixeira amarela é para:","options":["vidro","papel","restos de comida","metal"],"answer":3,"explain":"Amarelo é para metal, como latinhas."},{"q":"Na coleta seletiva, a lixeira marrom é para:","options":["lixo orgânico","metal","papel","vidro"],"answer":0,"explain":"Marrom é para o lixo orgânico, como restos de comida e cascas."},{"q":"Restos de frutas e cascas de legumes são lixo:","options":["eletrônico","de vidro","orgânico, que pode virar adubo","de metal"],"answer":2,"explain":"O lixo orgânico se decompõe e, na compostagem, vira adubo para as plantas."},{"q":"Pilhas e baterias usadas devem ser:","options":["queimadas","enterradas no quintal","levadas a pontos de coleta especiais","jogadas no rio"],"answer":2,"explain":"Pilhas têm substâncias que contaminam o solo e a água, por isso vão para pontos de coleta especiais."},{"q":"Onde deve ir o lixo de casa que não pode ser reciclado?","options":["Na rua","No lixo comum, para ser recolhido pela coleta","No terreno baldio","No rio"],"answer":1,"explain":"O lixo comum deve ser bem fechado e entregue à coleta, que o leva para o destino correto."},{"q":"Por que o consumo exagerado é um problema?","options":["Porque gera mais lixo e gasta mais recursos da natureza","Porque economiza água","Porque deixa a cidade mais limpa","Porque protege os animais"],"answer":0,"explain":"Quanto mais compramos sem precisar, mais lixo produzimos e mais recursos naturais gastamos."}]},{"id":"3-geo-mapas-representacoes","name":"Mapas, plantas e representações","desc":"Pratica visão vertical, oblíqua e frontal, mapas, plantas, maquetes, legendas e pontos cardeais.","questions":[{"q":"Quando vemos algo de cima para baixo, como um pássaro voando lá no alto, temos a visão:","options":["lateral","de baixo","vertical","frontal"],"answer":2,"explain":"A visão vertical é a vista de cima, como se estivéssemos voando sobre o lugar."},{"q":"Quando vemos algo de frente, temos a visão:","options":["de cima","frontal","oblíqua","vertical"],"answer":1,"explain":"A visão frontal é olhar de frente, como quando olhamos a fachada de uma casa na calçada."},{"q":"A visão de cima e de lado ao mesmo tempo, como da janela de um prédio alto, se chama:","options":["frontal","subterrânea","vertical","oblíqua"],"answer":3,"explain":"Na visão oblíqua, vemos o objeto de cima e de lado, ao mesmo tempo."},{"q":"Uma foto de uma cidade tirada bem de cima por um satélite mostra a visão:","options":["de dentro","oblíqua","vertical","frontal"],"answer":2,"explain":"Vista bem de cima é a visão vertical. É assim que os mapas são desenhados."},{"q":"A planta de uma casa é um desenho feito com a visão:","options":["de baixo","frontal","lateral","vertical (de cima)"],"answer":3,"explain":"A planta mostra os cômodos da casa vistos de cima, como se não houvesse telhado."},{"q":"O mapa é uma representação:","options":["plana de um lugar visto de cima","em três dimensões, como uma maquete","feita só com palavras","em forma de esfera"],"answer":0,"explain":"O mapa é um desenho plano, no papel ou na tela, de um lugar visto de cima."},{"q":"O que é uma maquete?","options":["Um desenho plano de uma rua","Um tipo de legenda","Uma representação em miniatura e em três dimensões de um lugar","Uma fotografia do céu"],"answer":2,"explain":"A maquete é um modelo pequeno, com altura, largura e comprimento, de uma casa, bairro ou cidade."},{"q":"O globo terrestre é uma representação da Terra:","options":["feita só com palavras","vista de frente, como uma casa","plana, como um mapa de cidade","em forma de esfera, em três dimensões"],"answer":3,"explain":"O globo tem formato de bola, como a Terra. Por isso é uma representação em três dimensões."},{"q":"Para que serve a legenda de um mapa?","options":["Para enfeitar o mapa","Para mostrar o nome de quem desenhou","Para explicar o que significam os símbolos e as cores","Para contar uma história"],"answer":2,"explain":"A legenda é a chave do mapa: ela diz o que cada símbolo e cada cor representam."},{"q":"Nos mapas, a cor azul geralmente representa:","options":["água, como rios, lagos e mares","florestas","cidades","estradas"],"answer":0,"explain":"Por convenção, o azul representa a água nos mapas."},{"q":"Num mapa, o desenho de um pequeno avião geralmente indica:","options":["uma escola","um rio","um aeroporto","um hospital"],"answer":2,"explain":"Os símbolos lembram o que representam: o aviãozinho indica um aeroporto."},{"q":"Quais são os quatro pontos cardeais?","options":["cima, baixo, perto e longe","norte, sul, leste e oeste","norte, sul, centro e lado","direita, esquerda, frente e trás"],"answer":1,"explain":"Norte, sul, leste e oeste são os pontos cardeais, usados para se orientar em qualquer lugar."},{"q":"Para mostrar a um colega o caminho da escola até a sua casa, você pode desenhar:","options":["um mapa ou croqui do trajeto","um gráfico de colunas","um calendário","um termômetro"],"answer":0,"explain":"Um croqui é um mapa simples, desenhado à mão, que mostra o caminho e os pontos de referência."}]},{"id":"3-geo-impactos-ambientais","name":"Impactos ambientais no campo e na cidade","desc":"Pratica os tipos de poluição, o desmatamento e as queimadas, e atitudes que protegem o ambiente.","questions":[{"q":"O que causa poluição do ar nas cidades?","options":["fumaça de carros e fábricas","andar de bicicleta","usar energia solar","plantar árvores"],"answer":0,"explain":"Os carros e as fábricas soltam gases e fumaça que poluem o ar."},{"q":"O que a poluição do ar pode causar na saúde das pessoas?","options":["Aumento da força","Pernas mais compridas","Problemas respiratórios, como tosse e asma","Melhora da visão"],"answer":2,"explain":"Respirar ar poluído pode irritar os pulmões e causar tosse, alergias e asma."},{"q":"Qual destas atitudes diminui a poluição do ar?","options":["Fazer fogueiras na mata","Queimar lixo no quintal","Usar transporte coletivo ou bicicleta","Usar o carro até para ir bem perto"],"answer":2,"explain":"Com menos carros nas ruas, sai menos fumaça. Ônibus, metrô e bicicleta ajudam o ar a ficar mais limpo."},{"q":"Qual destas fontes de energia polui menos o ar?","options":["queima de óleo diesel","energia solar","queima de carvão","queima de lenha"],"answer":1,"explain":"A energia solar vem da luz do Sol e não solta fumaça para produzir eletricidade."},{"q":"Barulho muito alto e constante, como o de buzinas e obras, é chamado de:","options":["reciclagem","poluição sonora","poluição visual","irrigação"],"answer":1,"explain":"Excesso de barulho é poluição sonora e pode prejudicar a audição e o sono."},{"q":"Excesso de placas, cartazes e pichações nas ruas é um tipo de:","options":["poluição da água","poluição visual","erosão","poluição sonora"],"answer":1,"explain":"Quando há tanta coisa para ver que a paisagem fica bagunçada, temos a poluição visual."},{"q":"Quando o esgoto das casas vai direto para o rio, qual problema ambiental acontece?","options":["poluição sonora","aumento das florestas","poluição visual","poluição da água"],"answer":3,"explain":"O esgoto sem tratamento suja a água do rio e prejudica os seres vivos que dependem dela."},{"q":"Jogar lixo nas ruas pode causar:","options":["ruas mais limpas","menos mosquitos","entupimento de bueiros e enchentes","mais flores nas praças"],"answer":2,"explain":"O lixo entope os bueiros, e a água da chuva não consegue escoar, causando alagamentos."},{"q":"O desmatamento pode causar:","options":["perda da casa de muitos animais e erosão do solo","aumento das florestas","rios mais limpos","mais animais silvestres"],"answer":0,"explain":"Sem as árvores, os animais perdem seu lar e o solo fica desprotegido contra a chuva."},{"q":"O que as queimadas causam?","options":["Deixam o ar mais puro","Poluem o ar e destroem plantas e animais","Ajudam todos os animais","Fazem os rios crescerem"],"answer":1,"explain":"O fogo destrói a vegetação, mata animais e solta muita fumaça no ar."},{"q":"A criação de gado em grandes áreas que antes eram florestas pode causar:","options":["perda de florestas e da vida selvagem","aumento das florestas","mais água nos rios","ar mais limpo"],"answer":0,"explain":"Para formar pastos, muitas florestas são derrubadas, e os animais que viviam ali perdem seu lar."},{"q":"Plantar árvores nas cidades ajuda a:","options":["aumentar a poluição","aumentar o barulho","acabar com as sombras","deixar o ar mais fresco e diminuir o calor"],"answer":3,"explain":"As árvores fazem sombra, refrescam o ambiente e ajudam a melhorar a qualidade do ar."}]}]}]},"6":{"year":6,"subjects":[{"id":"por","name":"Língua Portuguesa","topics":[{"id":"6-por-substantivo-adjetivo-artigo-numeral","name":"Substantivo, artigo, adjetivo e numeral","desc":"Reconhecer e flexionar substantivos e adjetivos e identificar artigos e numerais nas frases.","questions":[{"q":"Na frase “A menina comprou um caderno azul”, qual palavra é um adjetivo?","options":["menina","caderno","azul","comprou"],"answer":2,"explain":"“Azul” dá uma característica ao substantivo “caderno”, por isso é um adjetivo."},{"q":"Qual das palavras abaixo é um substantivo próprio?","options":["Brasília","bonita","correr","cidade"],"answer":0,"explain":"Substantivo próprio dá nome a um ser específico e é escrito com letra maiúscula, como o nome da capital “Brasília”."},{"q":"Qual é o substantivo coletivo de “abelhas”?","options":["alcateia","cardume","rebanho","enxame"],"answer":3,"explain":"Um grupo de abelhas é um enxame. Cardume é de peixes, alcateia é de lobos e rebanho é de ovelhas ou bois."},{"q":"Qual é o substantivo coletivo de “peixes”?","options":["cardume","manada","constelação","enxame"],"answer":0,"explain":"Um grupo de peixes nadando juntos se chama cardume."},{"q":"Qual é o plural correto de “cidadão”?","options":["cidadães","cidadãoes","cidadãos","cidadões"],"answer":2,"explain":"O plural de “cidadão” é “cidadãos”, assim como “irmão” vira “irmãos”."},{"q":"Qual é o plural correto de “pão”?","options":["pões","pãos","pãoes","pães"],"answer":3,"explain":"“Pão” faz o plural em “-ães”: “pães”, assim como “cão” vira “cães”."},{"q":"Qual é o feminino de “ator”?","options":["atriz","atora","atriza","atoresa"],"answer":0,"explain":"O feminino de “ator” é “atriz”, uma forma especial que vale a pena memorizar."},{"q":"Na frase “Os alunos chegaram cedo”, a palavra “Os” é:","options":["artigo indefinido","adjetivo","artigo definido","numeral"],"answer":2,"explain":"“Os” vem antes do substantivo “alunos” e indica seres já conhecidos e determinados: é artigo definido."},{"q":"Em qual frase aparece um artigo indefinido?","options":["Encontrei uma moeda no chão.","A professora chegou.","As flores murcharam.","O cachorro latiu."],"answer":0,"explain":"“Uma” apresenta a moeda de forma vaga, sem dizer qual: é artigo indefinido. “A”, “O” e “As” são artigos definidos."},{"q":"Na frase “Ela leu o segundo capítulo”, a palavra “segundo” é um numeral de que tipo?","options":["ordinal","cardinal","fracionário","multiplicativo"],"answer":0,"explain":"Numerais ordinais indicam ordem ou posição: primeiro, segundo, terceiro..."},{"q":"Qual das palavras abaixo é um numeral multiplicativo?","options":["terço","três","triplo","terceiro"],"answer":2,"explain":"“Triplo” indica uma quantidade multiplicada por três. “Terço” é fracionário, “terceiro” é ordinal e “três” é cardinal."},{"q":"A palavra “facílimo” está em qual grau?","options":["superlativo do adjetivo “fácil”","comparativo de inferioridade","diminutivo do substantivo “fácil”","plural do adjetivo “fácil”"],"answer":0,"explain":"“Facílimo” quer dizer “muito fácil”: é o adjetivo no grau superlativo."},{"q":"Qual destas palavras é um substantivo abstrato?","options":["cachorro","alegria","mesa","Pedro"],"answer":1,"explain":"Substantivo abstrato nom
