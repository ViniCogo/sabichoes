<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fd">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sabichões">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Sabichões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: caderno escolar. Claro = folha pautada; escuro = lousa verde. Cada matéria tem a cor da capa de um caderno.
   Coluna única centralizada (máx. 760px), barra fixa embaixo para começar o quiz. Lexend no texto (feita para facilitar a leitura). */
:root {
  --bg: #f6f8fd;
  --rule: #dfe6f4;
  --card: #ffffff;
  --ink: #1d2742;
  --ink-2: #5a6684;
  --line: #d3dbec;
  --accent: #ff6a3d;
  --ok: #1f9d63;
  --ok-bg: #e3f6ec;
  --bad: #d6455d;
  --bad-bg: #fde8ec;
  --star: #f5b400;
  --c-por: #e5484d;
  --c-mat: #3b6cf6;
  --c-cie: #2f9e5b;
  --c-his: #c27a1a;
  --c-geo: #0f9aa8;
  --c-ing: #8a4fe0;
  --shadow: 0 2px 0 rgba(29, 39, 66, .12);
  --font-display: 'Fredoka', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Lexend', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f362f; --rule: rgba(255, 255, 255, .045); --card: #284539; --ink: #f1f3ea; --ink-2: #b9c7bd; --line: #3c5d50;
    --accent: #ff8a5c; --ok: #5fd39a; --ok-bg: #1f4a37; --bad: #ff8fa0; --bad-bg: #4d2a33; --star: #ffd24a;
    --c-por: #ff7a7e; --c-mat: #7ea1ff; --c-cie: #63c98b; --c-his: #e5a54c; --c-geo: #4fc9d4; --c-ing: #b58cff;
    --shadow: 0 2px 0 rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f362f; --rule: rgba(255, 255, 255, .045); --card: #284539; --ink: #f1f3ea; --ink-2: #b9c7bd; --line: #3c5d50;
  --accent: #ff8a5c; --ok: #5fd39a; --ok-bg: #1f4a37; --bad: #ff8fa0; --bad-bg: #4d2a33; --star: #ffd24a;
  --c-por: #ff7a7e; --c-mat: #7ea1ff; --c-cie: #63c98b; --c-his: #e5a54c; --c-geo: #4fc9d4; --c-ing: #b58cff;
  --shadow: 0 2px 0 rgba(0, 0, 0, .25); color-scheme: dark;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  min-height: 100%; color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  background-color: var(--bg);
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 120px; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 600; text-wrap: balance; }
.eyebrow { font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; }

/* cabeçalho */
.brand { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.wordmark { font-family: var(--font-display); font-size: clamp(36px, 10vw, 54px); font-weight: 700; line-height: .95; letter-spacing: -.5px; position: relative; padding-bottom: 8px; }
.wordmark::after { content: ""; position: absolute; left: 2px; right: 30%; bottom: 0; height: 6px; border-radius: 6px; background: var(--accent); transform: rotate(-1.2deg); }
.brand p { margin: 0; color: var(--ink-2); max-width: 34ch; font-size: 14px; }

/* jogadores */
.players { display: flex; gap: 10px; flex-wrap: wrap; }
.pl {
  display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 99px; border: 2px solid var(--line);
  background: var(--card); box-shadow: var(--shadow); text-align: left; min-width: 0;
}
.pl .av { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--pc); color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.pl b { display: block; font-weight: 600; line-height: 1.1; }
.pl small { color: var(--ink-2); font-size: 12px; }
.pl.on { border-color: var(--pc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc) 30%, transparent); }
.pl-add { border-style: dashed; padding: 6px 16px; font-weight: 600; color: var(--ink-2); }
.pl-edit { border: 0; background: none; padding: 4px 6px; color: var(--ink-2); font-size: 13px; text-decoration: underline; }

/* anos */
.years { display: flex; gap: 6px; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 5px; box-shadow: var(--shadow); }
.years button { flex: 1; border: 0; border-radius: 11px; padding: 10px 6px; background: transparent; font-family: var(--font-display); font-size: 19px; font-weight: 600; color: var(--ink-2); }
.years button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

/* matérias */
.subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.subj {
  position: relative; display: grid; grid-template-columns: 64px 1fr; text-align: left; padding: 0; overflow: hidden;
  border: 2px solid color-mix(in srgb, var(--sc) 55%, var(--line)); border-radius: 14px; background: var(--card); box-shadow: var(--shadow); min-width: 0;
}
.subj-band { background: var(--sc); display: grid; place-items: center; color: #fff; position: relative; }
.subj-band::after { content: ""; position: absolute; top: 10px; bottom: 10px; right: 8px; width: 3px; border-radius: 3px; background: rgba(255, 255, 255, .35); }
.subj-band svg { width: 30px; height: 30px; }
.subj-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.subj-body b { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.1; }
.subj-body > span { font-size: 13px; color: var(--ink-2); }
.meter { height: 6px; border-radius: 99px; background: var(--rule); overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--sc); border-radius: 99px; }
.subj-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.star-txt { color: var(--ink); font-weight: 600; }
.star-txt::before { content: "★ "; color: var(--star); }
.pick-badge { position: absolute; top: 8px; right: 8px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; }

.mix { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; padding: 14px 16px; border-radius: 14px; border: 2px dashed var(--line); background: color-mix(in srgb, var(--card) 70%, transparent); }
.mix p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 46ch; }
.btn { border: 2px solid var(--ink); background: var(--card); border-radius: 12px; padding: 9px 16px; font-weight: 600; box-shadow: var(--shadow); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { border-color: var(--line); box-shadow: none; }
.btn:disabled { opacity: .5; }

.settings { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.row > span { font-weight: 600; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; padding: 7px 13px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.seg button + button { border-left: 2px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.foot-note { font-size: 12px; color: var(--ink-2); margin: 0; }

/* tela da matéria */
.shead { display: flex; flex-direction: column; gap: 10px; border-radius: 16px; padding: 14px 16px; background: var(--sc); color: #fff; }
.shead-top { display: flex; align-items: center; gap: 10px; }
.shead h1 { font-size: 28px; line-height: 1.05; }
.shead p { margin: 0; opacity: .9; font-size: 14px; }
.back { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 2px solid currentColor; background: transparent; display: grid; place-items: center; font-size: 20px; line-height: 1; padding: 0; }
.shead .btn { align-self: flex-start; background: rgba(255, 255, 255, .16); color: #fff; border-color: rgba(255, 255, 255, .6); box-shadow: none; }
.topics { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.topic { display: flex; align-items: stretch; border: 2px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
.topic.on { border-color: var(--sc); background: color-mix(in srgb, var(--sc) 8%, var(--card)); }
.tsel { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 12px 12px 12px 14px; text-align: left; }
.box { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; background: var(--card); }
.topic.on .box { background: var(--sc); border-color: var(--sc); }
.topic.on .box::after { content: ""; width: 11px; height: 6px; border-left: 3px solid #fff; border-bottom: 3px solid #fff; transform: translateY(-2px) rotate(-45deg); }
.tinfo { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tinfo b { font-weight: 600; line-height: 1.25; }
.tinfo small { color: var(--ink-2); font-size: 13px; line-height: 1.35; }
.tinfo .tstat { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.stars { letter-spacing: 1px; color: var(--line); font-size: 15px; white-space: nowrap; }
.stars .s { color: var(--star); }
.tplay { flex: none; width: 56px; border: 0; border-left: 2px solid var(--line); background: transparent; display: grid; place-items: center; color: var(--sc); }
.tplay svg { width: 22px; height: 22px; }

/* barra de início */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--card); border-top: 2px solid var(--line); box-shadow: 0 -6px 18px rgba(0, 0, 0, .08); }
.bar-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.bar-txt { flex: 1; min-width: 0; font-size: 14px; color: var(--ink-2); }
.bar-txt b { color: var(--ink); font-size: 16px; display: block; }
.bar .btn.primary { padding: 11px 22px; font-size: 17px; }

/* jogando */
.play { display: flex; flex-direction: column; gap: 16px; }
.ptop { display: flex; align-items: center; gap: 12px; }
.ptop .back { border-color: var(--line); color: var(--ink-2); }
.pbar { flex: 1; height: 12px; border-radius: 99px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.pcount { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 3.5em; text-align: right; }
.qcard { position: relative; background: var(--card); border: 2px solid var(--line); border-top: 8px solid var(--sc); border-radius: 16px; padding: 16px 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.qmeta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); padding-right: 96px; }
.tag { background: var(--sc); color: #fff; font-weight: 600; padding: 1px 9px; border-radius: 99px; font-size: 12px; }
.visual { font-size: clamp(34px, 9vw, 52px); line-height: 1.25; text-align: center; letter-spacing: 2px; word-break: break-word; padding: 4px 0; }
.qtext { font-family: var(--font-body); font-weight: 600; line-height: 1.35; font-size: 21px; }
.qtext.y1 { font-size: 27px; }
.qtext.y3 { font-size: 23px; }
.listen { position: absolute; top: 10px; right: 10px; display: flex; align-items: center; gap: 6px; border: 2px solid var(--line); background: var(--card); border-radius: 99px; padding: 5px 12px 5px 9px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.listen svg { width: 18px; height: 18px; }
.listen.on { border-color: var(--sc); color: var(--sc); }
.opts { display: grid; gap: 10px; grid-template-columns: 1fr; }
.opts.grid { grid-template-columns: repeat(2, 1fr); }
.opts.grid.n3 { grid-template-columns: repeat(3, 1fr); }
.opt {
  display: flex; align-items: center; gap: 12px; text-align: left; border: 2px solid var(--line); border-radius: 14px; background: var(--card);
  padding: 14px 14px; font-size: 18px; font-weight: 500; box-shadow: var(--shadow); min-height: 58px; min-width: 0;
  transition: transform .08s ease, border-color .15s ease;
}
.opts.y1 .opt { font-size: 24px; min-height: 70px; }
.opts.grid .opt { justify-content: center; font-family: var(--font-display); font-size: 26px; font-weight: 600; }
.opts.grid .opt .key { display: none; }
.opt:active { transform: translateY(2px); }
.opt .key { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--rule); color: var(--ink-2); font-size: 13px; font-weight: 700; }
.opt > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .key { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .key { background: var(--bad); color: #fff; }
.opt.dim { opacity: .55; }
.opt:disabled { cursor: default; }
.fb { border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border: 2px solid; }
.fb.ok { background: var(--ok-bg); border-color: var(--ok); }
.fb.bad { background: var(--bad-bg); border-color: var(--bad); }
.fb h3 { font-size: 22px; }
.fb.ok h3 { color: var(--ok); }
.fb.bad h3 { color: var(--bad); }
.fb p { margin: 0; }
.fb .btn { align-self: flex-end; }
.frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; margin: 0 .12em; font-variant-numeric: tabular-nums; }
.frac > span:first-child { border-bottom: .09em solid currentColor; padding: 0 .12em .06em; }
.frac > span:last-child { padding: .06em .12em 0; }

/* resultado */
.res { display: flex; flex-direction: column; gap: 18px; }
.score { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 20px 16px; background: var(--card); border: 2px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.score .big { font-family: var(--font-display); font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.score .big small { font-size: 26px; color: var(--ink-2); }
.score .st { font-size: 40px; letter-spacing: 6px; color: var(--line); }
.score .st .s { color: var(--star); }
.score p { margin: 0; color: var(--ink-2); max-width: 36ch; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.list li { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.list .tr { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.list small { color: var(--ink-2); }
.list .ans { color: var(--ok); font-weight: 600; }
.list .mine { color: var(--bad); text-decoration: line-through; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* diálogo */
.overlay { position: fixed; inset: 0; z-index: 10; background: rgba(15, 20, 35, .5); display: grid; place-items: end center; padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.sheet { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; background: var(--card); border-radius: 18px; border: 2px solid var(--line); padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { font-size: 24px; }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
.field input { font: inherit; font-weight: 500; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); color: var(--ink); }
.colors { display: flex; gap: 10px; flex-wrap: wrap; }
.colors button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; background: var(--pc); padding: 0; }
.colors button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--card) inset; }
.sheet .actions { justify-content: flex-end; }
.del-btn { margin-right: auto; border-color: var(--bad); color: var(--bad); box-shadow: none; }
.del-btn.arm { background: var(--bad); color: #fff; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
@media (min-width: 700px) { .overlay { place-items: center; } }
@media (prefers-reduced-motion: reduce) { .pbar i, .opt { transition: none; } }
</style>

</head>
<body>
<main class="wrap" id="view"></main>
<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="bar-txt" id="bartxt"></div>
    <button class="btn ghost" id="barclear">Limpar</button>
    <button class="btn primary" id="barstart">Começar</button>
  </div>
</div>
<div class="overlay" id="pdlg" hidden>
  <form class="sheet" id="pform" role="dialog" aria-modal="true" aria-labelledby="pdlg-t">
    <h2 id="pdlg-t">Novo jogador</h2>
    <label class="field">Nome<input id="pname" maxlength="18" autocomplete="off" placeholder="Ex.: Ana"></label>
    <div class="field">Ano escolar
      <div class="seg" id="pyear"><button type="button" data-y="1">1º ano</button><button type="button" data-y="3">3º ano</button><button type="button" data-y="6">6º ano</button></div>
    </div>
    <div class="field">Cor
      <div class="colors" id="pcolors"></div>
    </div>
    <div class="actions">
      <button type="button" class="btn del-btn" id="pdel" hidden>Apagar jogador</button>
      <button type="button" class="btn ghost" id="pcancel">Cancelar</button>
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>
</div>
<canvas id="confetti" hidden></canvas>

n":"Temos uma mão direita e uma mão esquerda."},{"q":"Ana está de frente para a porta. Onde está a porta?","options":["embaixo de Ana","atrás de Ana","na frente de Ana"],"answer":2,"explain":"Se Ana está de frente para a porta, a porta está na frente dela."},{"q":"O que fica mais perto de você agora: a sua mão ou a Lua?","options":["a sua mão","a Lua","as duas estão à mesma distância"],"answer":0,"explain":"A mão está grudadinha no corpo. A Lua está muito, muito longe."},{"q":"O que está mais longe de nós?","options":["a porta de casa","o Sol","a cadeira da sala"],"answer":1,"explain":"O Sol está muito longe da Terra, bem mais longe do que qualquer coisa da casa."},{"q":"Num mapa, os desenhos pequenos que representam as coisas são os...","options":["carimbos de correio","bilhetes","símbolos"],"answer":2,"explain":"Símbolos são desenhos que representam lugares e coisas no mapa."},{"q":"A parte do mapa que explica o que cada símbolo quer dizer é a...","options":["legenda","capa","assinatura"],"answer":0,"explain":"A legenda explica o significado de cada símbolo do mapa."},{"q":"O lado onde o Sol aparece de manhã é chamado de...","options":["meio-dia","nascente","poente"],"answer":1,"explain":"Nascente é o lado onde o Sol nasce, de manhã."},{"q":"O lado onde o Sol se põe, no fim da tarde, é chamado de...","options":["manhã","nascente","poente"],"answer":2,"explain":"Poente é o lado onde o Sol se põe."},{"q":"Para achar o caminho num lugar novo, podemos usar...","options":["um mapa","uma colher","um espelho"],"answer":0,"explain":"O mapa mostra onde ficam as ruas e os lugares."},{"q":"Um desenho do caminho da casa até a escola é um...","options":["relógio","calendário","mapa"],"answer":2,"explain":"Um desenho que mostra lugares e caminhos é um mapa."}]}]}]},"3":{"year":3,"subjects":[{"id":"por","name":"Língua Portuguesa","topics":[{"id":"3-por-ortografia-r-s-c","name":"Ortografia: R e RR, S e SS, C, Ç e QU","desc":"Pratica quando usar R ou RR, S ou SS, C, Ç e QU para escrever as palavras do jeito certo.","questions":[{"q":"Qual palavra está escrita corretamente?","options":["cachorru","cachorro","caxoro","cachoro"],"answer":1,"explain":"Entre duas vogais, para ter o som forte do R, usamos RR: ca-chor-ro. Muito bem!"},{"q":"Qual é a escrita correta do nome do planeta onde vivemos?","options":["Terra","Tera","Terrá","Therra"],"answer":0,"explain":"O som forte do R entre vogais pede RR: Ter-ra."},{"q":"Em qual palavra o R tem som fraco, como em \"arara\"?","options":["rato","carro","honra","barata"],"answer":3,"explain":"Em ba-ra-ta, o R está sozinho entre duas vogais, por isso tem som fraco. Nas outras, o som é forte."},{"q":"Em qual palavra a letra R sozinha tem som forte?","options":["careta","rua","pera","coroa"],"answer":1,"explain":"No começo da palavra, o R sozinho já tem som forte, como em \"rua\"."},{"q":"Em qual palavra o RR foi usado corretamente?","options":["guerra","Henrrique","genrro","honrra"],"answer":0,"explain":"Só usamos RR entre duas vogais, como em guer-ra. Depois de N, como em \"honra\" e \"genro\", basta um R."},{"q":"Qual palavra está escrita corretamente?","options":["paçarinho","passarinho","pasarinho","passarino"],"answer":1,"explain":"Entre duas vogais, o som de S se escreve com SS: pas-sa-ri-nho."},{"q":"Na palavra \"casa\", a letra S tem som de qual letra?","options":["som de CH","som de Z","som de X","som de SS"],"answer":1,"explain":"Quando o S fica sozinho entre duas vogais, ele tem som de Z: ca-sa."},{"q":"Em qual palavra o S tem som de Z?","options":["sol","rosa","pensar","sapo"],"answer":1,"explain":"Em ro-sa, o S está entre duas vogais e soa como Z. Nas outras, ele tem som de S mesmo."},{"q":"Qual é a forma correta de completar a frase: \"O cachorro roeu o ...\"?","options":["oso","oço","ozo","osso"],"answer":3,"explain":"Osso se escreve com SS, porque o som de S está entre duas vogais."},{"q":"Qual palavra está escrita corretamente?","options":["vassora","vasoura","vassoura","vaçoura"],"answer":2,"explain":"Vassoura tem SS entre vogais e termina em -oura: vas-sou-ra."},{"q":"Qual palavra está escrita corretamente?","options":["cabeça","cabesa","cabeca","cabessa"],"answer":0,"explain":"O Ç (cê-cedilha) tem som de S antes de A, O e U: ca-be-ça."},{"q":"Por que a palavra \"cidade\" não tem cedilha?","options":["Porque antes de E e I o C já tem som de S","Porque é uma palavra pequena","Porque o C nunca tem som de S","Porque começa com C"],"answer":0,"explain":"Antes de E e I, o C já tem som de S. Por isso nunca usamos Ç antes de E e I."},{"q":"Qual palavra está escrita corretamente?","options":["acúcar","açúcar","assúcar","asúcar"],"answer":1,"explain":"Antes de U, o C precisa de cedilha para ter som de S: a-çú-car."},{"q":"Qual palavra está escrita corretamente?","options":["qeijo","keijo","cueijo","queijo"],"answer":3,"explain":"Para o som de \"que\", usamos QU antes de E e I: quei-jo."}]},{"id":"3-por-ortografia-digrafos","name":"Ortografia: NH, LH, CH, M antes de P e B, G e J","desc":"Pratica dígrafos, o M antes de P e B, G e J, GU, H inicial e as vogais do final das palavras.","questions":[{"q":"Qual palavra está escrita corretamente?","options":["galinha","galina","galinhia","galinia"],"answer":0,"explain":"Galinha se escreve com NH: ga-li-nha."},{"q":"Qual palavra tem o dígrafo LH?","options":["telhado","ninho","talento","chapéu"],"answer":0,"explain":"Em te-lha-do, as letras L e H juntas formam um só som: o dígrafo LH."},{"q":"Em qual palavra há o dígrafo NH?","options":["sonho","sono","sonoro","sino"],"answer":0,"explain":"Em so-nho, as letras N e H juntas formam o dígrafo NH."},{"q":"Qual palavra está escrita corretamente?","options":["chuba","chuva","xhuva","xuva"],"answer":1,"explain":"Chuva se escreve com CH. Como CH e X podem ter o mesmo som, é bom memorizar a escrita."},{"q":"Qual palavra está escrita corretamente?","options":["canpo","campo","kampo","cãpo"],"answer":1,"explain":"Antes de P e B, usamos sempre M: cam-po."},{"q":"Qual palavra está escrita corretamente?","options":["bonbom","bombom","bonbon","bombon"],"answer":1,"explain":"Antes de B usamos M, e esta palavra também termina com M: bom-bom."},{"q":"Qual palavra está escrita corretamente?","options":["canto","cantu","cãto","camto"],"answer":0,"explain":"Antes de T usamos N. O M só vem antes de P e B: can-to."},{"q":"Qual palavra está escrita corretamente?","options":["jirafa","jiraffa","girafa","guirafa"],"answer":2,"explain":"Girafa se escreve com G. Antes de E e I, G e J têm o mesmo som, então é preciso memorizar."},{"q":"Qual palavra está escrita corretamente?","options":["jeito","geito","jeitu","gueito"],"answer":0,"explain":"Jeito se escreve com J no começo e termina com O."},{"q":"Qual palavra está escrita corretamente?","options":["guitara","gitara","gitarra","guitarra"],"answer":3,"explain":"Para ter o som de \"gui\", usamos GU antes do I: gui-tar-ra. Com G sozinho, leríamos \"ji\"."},{"q":"Qual palavra está escrita corretamente?","options":["oje","hoji","hoje","roje"],"answer":2,"explain":"\"Hoje\" começa com H, uma letra que não tem som. Por isso é preciso memorizar a escrita."},{"q":"Qual destas palavras começa com a letra H, que não tem som?","options":["hospital","ilha","ovo","escola"],"answer":0,"explain":"Hospital começa com H, mas falamos \"ospital\": o H inicial é mudo."},{"q":"Qual palavra está escrita corretamente?","options":["leiti","leitê","leyte","leite"],"answer":3,"explain":"Muitas vezes falamos \"leiti\", mas escrevemos com E no final: lei-te."},{"q":"Qual palavra está escrita corretamente?","options":["menino","minino","meninu","mininu"],"answer":0,"explain":"Podemos falar \"mininu\", mas a escrita correta é com E e O: me-ni-no."},{"q":"Qual palavra está escrita corretamente?","options":["mae","mãe","maem","mãi"],"answer":1,"explain":"O til mostra o som nasal, e a palavra termina com E: mãe."}]},{"id":"3-por-silabas","name":"Sílabas e número de sílabas","desc":"Pratica separar palavras em sílabas e classificá-las em monossílabas, dissílabas, trissílabas e polissílabas.","questions":[{"q":"Quantas sílabas tem a palavra \"borboleta\"?","options":["5","2","3","4"],"answer":3,"explain":"Bor-bo-le-ta: são 4 sílabas. Bater palmas a cada pedacinho ajuda a contar!"},{"q":"Como se separa a palavra \"pássaro\" em sílabas?","options":["pá-ssa-ro","pás-sar-o","pa-ssa-ro","pás-sa-ro"],"answer":3,"explain":"Na separação de sílabas, as letras do SS ficam em sílabas diferentes: pás-sa-ro."},{"q":"Como se separa a palavra \"carro\" em sílabas?","options":["car-ro","carr-o","c-arro","ca-rro"],"answer":0,"explain":"As letras do RR também se separam: car-ro."},{"q":"Como se separa a palavra \"galinha\"?","options":["ga-lin-ha","ga-li-n-ha","ga-li-nha","gal-i-nha"],"answer":2,"explain":"O NH fica junto na mesma sílaba: ga-li-nha."},{"q":"Qual é a separação correta de \"escola\"?","options":["es-co-la","es-col-a","e-sco-la","esc-o-la"],"answer":0,"explain":"Separamos assim: es-co-la. O S fica com o E na primeira sílaba."},{"q":"Como se separa a palavra \"prato\"?","options":["pra-to","prat-o","pr-a-to","p-ra-to"],"answer":0,"explain":"As letras P e R ficam juntas com a vogal: pra-to."},{"q":"A palavra \"sol\" tem uma sílaba só. Como ela se classifica?","options":["monossílaba","dissílaba","trissílaba","polissílaba"],"answer":0,"explain":"Palavras com uma só sílaba são monossílabas. \"Mono\" quer dizer um."},{"q":"Qual palavra é monossílaba (tem uma sílaba)?","options":["uva","pato","bolo","pão"],"answer":3,"explain":"Pão se fala de uma vez só: uma sílaba. Pa-to, bo-lo e u-va têm duas."},{"q":"Qual palavra é dissílaba (tem 2 sílabas)?","options":["boneca","livro","flor","abacaxi"],"answer":1,"explain":"Li-vro tem 2 sílabas. Bo-ne-ca tem 3, flor tem 1 e a-ba-ca-xi tem 4."},{"q":"Qual palavra é trissílaba (tem 3 sílabas)?","options":["janela","computador","pé","casa"],"answer":0,"explain":"Ja-ne-la tem 3 sílabas, por isso é trissílaba."},{"q":"Qual palavra é polissílaba (tem 4 sílabas ou mais)?","options":["telefone","bola","sapato","mar"],"answer":0,"explain":"Te-le-fo-ne tem 4 sílabas, então é polissílaba. Sa-pa-to tem só 3."},{"q":"Quantas sílabas tem a palavra \"chocolate\"?","options":["6","5","3","4"],"answer":3,"explain":"Cho-co-la-te: 4 sílabas. O CH fica junto na mesma sílaba."},{"q":"Quantas sílabas tem a palavra \"hipopótamo\"?","options":["6","3","4","5"],"answer":3,"explain":"Hi-po-pó-ta-mo: são 5 sílabas. Que palavra comprida!"},{"q":"Qual palavra começa com uma sílaba formada por uma só vogal?","options":["flor","bola","prato","ovelha"],"answer":3,"explain":"O-ve-lha: a primeira sílaba é só a vogal O."}]},{"id":"3-por-silaba-tonica-acentuacao","name":"Sílaba tônica e acentuação","desc":"Pratica encontrar a sílaba mais forte, classificar em oxítona, paroxítona e proparoxítona e usar os acentos.","questions":[{"q":"Qual é a sílaba tônica (a mais forte) da palavra \"borboleta\"?","options":["le","bo","bor","ta"],"answer":0,"explain":"Fale devagar: bor-bo-LE-ta. A sílaba mais forte é \"le\"."},{"q":"Qual é a sílaba tônica da palavra \"abacaxi\"?","options":["xi","a","ca","ba"],"answer":0,"explain":"Em a-ba-ca-XI, a sílaba mais forte é a última: \"xi\"."},{"q":"A palavra \"café\" tem a sílaba mais forte na última sílaba. Ela é:","options":["paroxítona","monossílaba","proparoxítona","oxítona"],"answer":3,"explain":"Quando a sílaba tônica é a última, a palavra é oxítona: ca-FÉ."},{"q":"Qual palavra é oxítona (sílaba mais forte é a última)?","options":["casa","árvore","bola","urubu"],"answer":3,"explain":"Em u-ru-BU, a sílaba mais forte é a última. Por isso é oxítona."},{"q":"Qual palavra é paroxítona (sílaba mais forte é a penúltima)?","options":["mesa","lâmpada","jacaré","sofá"],"answer":0,"explain":"Em ME-sa, a sílaba mais forte é a penúltima. A maioria das palavras do português é assim!"},{"q":"Qual palavra é proparoxítona (sílaba mais forte é a antepenúltima)?","options":["menino","médico","chapéu","caju"],"answer":1,"explain":"Em MÉ-di-co, a sílaba forte é a antepenúltima. Toda proparoxítona tem acento."},{"q":"Qual destas palavras é proparoxítona?","options":["lâmpada","tatu","sapato","picolé"],"answer":0,"explain":"LÂM-pa-da tem a sílaba forte na antepenúltima posição, e por isso leva acento."},{"q":"Qual palavra está acentuada corretamente?","options":["sôfa","sofá","sófa","sofa"],"answer":1,"explain":"Oxítonas terminadas em A levam acento: so-FÁ."},{"q":"Qual palavra está acentuada corretamente?","options":["jácare","jâcare","jacare","jacaré"],"answer":3,"explain":"Ja-ca-RÉ é oxítona terminada em E, por isso leva acento agudo."},{"q":"Qual palavra está escrita corretamente?","options":["vocé","você","vôce","voce"],"answer":1,"explain":"Você é oxítona terminada em E com som fechado, por isso leva acento circunflexo."},{"q":"Como se escreve a palavra que quer dizer \"a mãe do seu pai ou da sua mãe\"?","options":["ávo","avô","avó","avo"],"answer":2,"explain":"Avó, com acento agudo e som aberto, é a mãe do pai ou da mãe. Avô, com circunflexo, é o pai."},{"q":"Qual destes monossílabos leva acento?","options":["pé","flor","mar","sol"],"answer":0,"explain":"Monossílabos fortes terminados em A, E ou O levam acento, como pé, pá e nó."},{"q":"Qual palavra está acentuada corretamente?","options":["tres","trés","trêz","três"],"answer":3,"explain":"Três é monossílabo forte terminado em E mais S, com som fechado: leva circunflexo."},{"q":"Por que a palavra \"maracujá\" tem acento?","options":["Porque é proparoxítona","Porque é oxítona terminada em A","Porque tem quatro sílabas","Porque começa com M"],"answer":1,"explain":"Ma-ra-cu-JÁ é oxítona e termina em A. Oxítonas terminadas em A, E ou O levam acento."}]},{"id":"3-por-substantivos","name":"Substantivos: próprio, comum, gênero e número","desc":"Pratica reconhecer substantivos, diferenciar próprio e comum, e passar para o feminino e o plural.","questions":[{"q":"Qual destas palavras é um substantivo?","options":["correr","bonito","bicicleta","depressa"],"answer":2,"explain":"Substantivo é a palavra que dá nome a seres, objetos e lugares. Bicicleta é o nome de um objeto."},{"q":"Qual destas palavras é um substantivo próprio?","options":["cidade","Brasil","rio","país"],"answer":1,"explain":"Substantivo próprio dá nome a um ser ou lugar específico e começa com letra maiúscula, como Brasil."},{"q":"Na frase \"Mariana adotou um gato\", qual é o substantivo comum?","options":["adotou","gato","Mariana","um"],"answer":1,"explain":"Gato é um nome comum, que serve para qualquer gato. Mariana é substantivo próprio."},{"q":"Na frase \"meu primo mora em recife\", qual palavra, além de \"meu\", deve começar com letra maiúscula?","options":["primo","mora","em","Recife"],"answer":3,"explain":"Recife é o nome de uma cidade, um substantivo próprio, por isso começa com letra maiúscula."},{"q":"Qual é o feminino de \"menino\"?","options":["menininho","menina","meninã","meninos"],"answer":1,"explain":"Trocamos o O final por A: menino, menina."},{"q":"Qual é o feminino de \"boi\"?","options":["boina","vaca","boia","bois"],"answer":1,"explain":"Alguns femininos são palavras bem diferentes: o feminino de boi é vaca."},{"q":"Qual é o feminino de \"cavalo\"?","options":["cavala","égua","potro","cavalinha"],"answer":1,"explain":"O feminino de cavalo é égua. Potro é o filhote do cavalo."},{"q":"Qual é o masculino de \"rainha\"?","options":["rei","reinho","rainho","príncipe"],"answer":0,"explain":"O masculino de rainha é rei. Príncipe é o filho do rei e da rainha."},{"q":"Qual é o feminino de \"o professor\"?","options":["a professora","a professoura","a professor","a professorinha"],"answer":0,"explain":"Acrescentamos A no final e trocamos o artigo: o professor, a professora."},{"q":"Qual é o plural de \"flor\"?","options":["flores","florês","flors","floris"],"answer":0,"explain":"Palavras terminadas em R ganham -ES no plural: flor, flores."},{"q":"Qual é o plural de \"pão\"?","options":["pões","pãoes","pãos","pães"],"answer":3,"explain":"O plural de pão é pães. Palavras terminadas em -ão podem ter plurais diferentes, então vale memorizar."},{"q":"Qual é o plural de \"animal\"?","options":["animales","animaus","animais","animals"],"answer":2,"explain":"Palavras terminadas em -al trocam o L por -is: animal, animais."},{"q":"Qual é o plural de \"o lápis\"?","options":["os lápises","os lápis","os lápiss","os lápi"],"answer":1,"explain":"A palavra lápis é igual no singular e no plural. Só muda o artigo: o lápis, os lápis."},{"q":"Qual frase está escrita corretamente?","options":["As meninas brincou no parque.","As menina brincaram no parque.","A meninas brincaram no parque.","As meninas brincaram no parque."],"answer":3,"explain":"Todas as palavras precisam combinar no plural: As meninas brincaram."}]},{"id":"3-por-adjetivos-verbos","name":"Adjetivos e verbos","desc":"Pratica reconhecer adjetivos (características) e verbos (ações), e quem faz a ação na frase.","questions":[{"q":"Na frase \"O cachorro bravo latiu\", qual palavra é o adjetivo?","options":["bravo","cachorro","O","latiu"],"answer":0,"explain":"Adjetivo dá uma característica ao substantivo. \"Bravo\" diz como é o cachorro."},{"q":"Na frase \"A menina corajosa subiu na árvore\", qual palavra mostra uma característica da menina?","options":["árvore","menina","corajosa","subiu"],"answer":2,"explain":"\"Corajosa\" é o adjetivo que conta como a menina é."},{"q":"Qual palavra é um adjetivo?","options":["inteligência","pensar","escola","inteligente"],"answer":3,"explain":"\"Inteligente\" é uma característica, como em \"menino inteligente\"."},{"q":"Qual palavra completa a frase com um adjetivo: \"A sopa está muito ...\"?","options":["panela","colher","comer","quente"],"answer":3,"explain":"\"Quente\" diz como está a sopa, por isso é um adjetivo."},{"q":"Qual adjetivo pode descrever o sol?","options":["correr","quente","praia","nuvem"],"answer":1,"explain":"\"Quente\" é uma característica do sol. As outras palavras não são adjetivos."},{"q":"Na frase \"Lucas chutou a bola\", qual palavra indica a ação (o verbo)?","options":["bola","a","Lucas","chutou"],"answer":3,"explain":"\"Chutou\" mostra o que Lucas fez. Palavras que indicam ação são verbos."},{"q":"Qual destas palavras é um verbo?","options":["nadar","feliz","azul","piscina"],"answer":0,"explain":"Nadar é uma ação, por isso é um verbo."},{"q":"Qual é o verbo da frase \"Os pássaros cantam de manhã\"?","options":["de","cantam","manhã","pássaros"],"answer":1,"explain":"\"Cantam\" é a ação que os pássaros fazem."},{"q":"Complete com um verbo: \"Eu ... água quando tenho sede.\"","options":["copo","gelada","bebo","sede"],"answer":2,"explain":"\"Bebo\" é a ação que completa a frase, então é um verbo."},{"q":"Na frase \"Ana comeu uma maçã vermelha\", quem faz a ação?","options":["comeu","maçã","Ana","vermelha"],"answer":2,"explain":"Quem comeu foi a Ana. Ela é quem pratica a ação."},{"q":"Na frase \"O gato bebeu o leite\", o que foi bebido?","options":["bebeu","o gato","o leite","a tigela"],"answer":2,"explain":"O leite é o que recebe a ação de beber."},{"q":"Em qual frase o verbo indica algo que já aconteceu?","options":["Eu vou jogar bola.","Hoje eu jogo bola.","Ontem eu joguei bola.","Amanhã eu jogarei bola."],"answer":2,"explain":"\"Joguei\" está no passado, e a palavra \"ontem\" confirma isso."},{"q":"Qual frase fala de algo que ainda vai acontecer?","options":["Ontem nós viajamos.","Nós viajávamos sempre.","Agora nós viajamos.","Amanhã nós viajaremos."],"answer":3,"explain":"\"Viajaremos\" está no futuro: a viagem ainda vai acontecer."},{"q":"Na frase \"Comprei sapatos novos\", por que o adjetivo \"novos\" está no plural?","options":["Porque sempre se escreve assim","Porque é um verbo","Porque combina com \"sapatos\", que está no plural","Porque vem depois do verbo"],"answer":2,"explain":"O adjetivo concorda com o substantivo: sapatos novos, sapato novo."}]},{"id":"3-por-sinonimos-antonimos","name":"Sinônimos, antônimos, prefixos e sufixos","desc":"Pratica palavras de mesmo sentido e de sentido contrário, e como prefixos e sufixos formam palavras novas.","questions":[{"q":"Qual é o sinônimo (mesmo sentido) de \"alegre\"?","options":["contente","triste","bravo","cansado"],"answer":0,"explain":"Alegre e contente querem dizer quase a mesma coisa. São sinônimos."},{"q":"Qual é o sinônimo de \"bonito\"?","options":["grande","rápido","feio","belo"],"answer":3,"explain":"Bonito e belo têm o mesmo sentido."},{"q":"Qual é o sinônimo de \"começar\"?","options":["iniciar","terminar","acabar","parar"],"answer":0,"explain":"Começar e iniciar querem dizer a mesma coisa."},{"q":"Na frase \"O menino ficou muito zangado\", qual palavra tem o mesmo sentido de \"zangado\"?","options":["sonolento","feliz","calmo","bravo"],"answer":3,"explain":"Zangado e bravo são sinônimos."},{"q":"Leia: \"A girafa é enorme.\" Qual palavra tem o mesmo sentido de \"enorme\"?","options":["pequena","fina","pintada","gigante"],"answer":3,"explain":"Enorme e gigante indicam algo muito grande."},{"q":"Qual é o antônimo (sentido contrário) de \"quente\"?","options":["morno","fervendo","calor","frio"],"answer":3,"explain":"O contrário de quente é frio. São antônimos."},{"q":"Qual é o antônimo de \"abrir\"?","options":["girar","empurrar","destrancar","fechar"],"answer":3,"explain":"Abrir e fechar têm sentidos contrários."},{"q":"Qual é o antônimo de \"antes\"?","options":["sempre","agora","cedo","depois"],"answer":3,"explain":"Antes e depois são palavras de sentido contrário."},{"q":"Na frase \"A sala estava escura e silenciosa\", qual é o antônimo de \"silenciosa\"?","options":["vazia","quieta","barulhenta","calada"],"answer":2,"explain":"O contrário de silenciosa é barulhenta. Quieta e calada são sinônimos de silenciosa."},{"q":"Qual palavra é o contrário de \"feliz\" formado com um prefixo?","options":["alegre","felizmente","felicidade","infeliz"],"answer":3,"explain":"O prefixo IN- dá ideia de contrário: feliz, infeliz."},{"q":"Qual palavra foi formada com o prefixo DES-, que dá ideia de contrário?","options":["desligar","dente","dez","dedo"],"answer":0,"explain":"Desligar vem de ligar com o prefixo DES-, que indica o contrário."},{"q":"Na palavra \"casinha\", o final \"-inha\" indica:","options":["que a casa é velha","que a casa é pequena","que a casa é grande","que são muitas casas"],"answer":1,"explain":"O sufixo -inha dá ideia de tamanho pequeno: casa, casinha."},{"q":"Qual palavra indica uma casa grande?","options":["casar","casarão","casinha","caseiro"],"answer":1,"explain":"O final -ão dá ideia de tamanho grande: casa, casarão."},{"q":"De qual palavra veio \"padeiro\", a pessoa que faz pão?","options":["pedra","pão","padre","pá"],"answer":1,"explain":"Padeiro vem de pão, com o sufixo -eiro, que indica profissão."}]},{"id":"3-por-pontuacao","name":"Pontuação","desc":"Pratica ponto final, interrogação, exclamação, vírgula, dois-pontos e travessão nos diálogos.","questions":[{"q":"Qual sinal usamos no final de uma pergunta?","options":["ponto final","ponto de exclamação","ponto de interrogação","vírgula"],"answer":2,"explain":"Toda pergunta termina com ponto de interrogação, aquele que parece um gancho."},{"q":"Qual sinal usamos para mostrar surpresa, alegria ou susto, como em \"Que susto!\"?","options":["dois-pontos","ponto final","ponto de interrogação","ponto de exclamação"],"answer":3,"explain":"O ponto de exclamação mostra emoção: surpresa, alegria, susto ou raiva."},{"q":"Como se chama o sinal que termina uma frase que apenas informa algo, como \"O céu está azul\"?","options":["ponto de interrogação","ponto final","vírgula","travessão"],"answer":1,"explain":"Frases que só informam terminam com ponto final."},{"q":"Qual sinal deve terminar a frase \"Você vai à festa amanhã\"?","options":["vírgula","ponto de exclamação","ponto de interrogação","dois-pontos"],"answer":2,"explain":"A frase faz uma pergunta, então termina com ponto de interrogação."},{"q":"Qual sinal deve terminar a frase \"Eu moro em uma casa azul\"?","options":["ponto final","ponto de interrogação","dois-pontos","travessão"],"answer":0,"explain":"A frase dá uma informação, por isso termina com ponto final."},{"q":"Qual frase está pontuada corretamente?","options":["Qual é o seu nome?","Qual é o seu nome.","Qual é o seu nome,","Qual é o seu nome:"],"answer":0,"explain":"É uma pergunta, então precisa do ponto de interrogação no final."},{"q":"Qual frase é uma exclamação?","options":["Que horas são?","Hoje é sábado.","Que dia lindo!","Onde está meu livro?"],"answer":2,"explain":"\"Que dia lindo!\" mostra admiração e termina com ponto de exclamação."},{"q":"Qual frase é uma pergunta?","options":["Você gosta de sorvete?","Sorvete é gelado.","Que sorvete gostoso!","Eu gosto de sorvete."],"answer":0,"explain":"Só a primeira frase pergunta algo e termina com ponto de interrogação."},{"q":"Qual frase está pontuada corretamente?","options":["Socorro, O gato subiu no telhado,","Socorro: o gato subiu no telhado:","Socorro? O gato subiu no telhado?","Socorro! O gato subiu no telhado!"],"answer":3,"explain":"\"Socorro\" é um pedido aflito e o fato é uma surpresa, por isso usamos exclamação."},{"q":"Em um diálogo, qual sinal mostra que um personagem vai começar a falar?","options":["ponto final","vírgula","travessão","reticências"],"answer":2,"explain":"O travessão, um tracinho comprido, aparece antes da fala do personagem."},{"q":"Leia: \"A professora perguntou: — Quem fez a lição?\". Para que servem os dois-pontos nessa frase?","options":["Para anunciar a fala da professora","Para separar números","Para terminar a frase","Para mostrar uma pergunta"],"answer":0,"explain":"Os dois-pontos avisam que alguém vai falar. Depois deles vem o travessão com a fala."},{"q":"Para que serve a vírgula em \"Comprei arroz, feijão, ovos e leite\"?","options":["Para terminar a frase","Para mostrar surpresa","Para fazer uma pergunta","Para separar os itens de uma lista"],"answer":3,"explain":"A vírgula separa os itens de uma lista. Antes do último item usamos \"e\"."},{"q":"Na frase \"Mamãe, posso brincar lá fora?\", a vírgula depois de \"Mamãe\" serve para:","options":["terminar a pergunta","separar o nome de quem está sendo chamado","separar itens de uma lista","mostrar surpresa"],"answer":1,"explain":"Quando chamamos alguém pelo nome, separamos esse nome do resto da frase com vírgula."}]},{"id":"3-por-generos-textuais","name":"Gêneros textuais","desc":"Pratica reconhecer bilhete, carta, diário, receita, instruções, notícia, anúncio, poema e quadrinhos.","questions":[{"q":"Que tipo de texto tem lista de ingredientes e modo de preparo?","options":["carta","receita","notícia","poema"],"answer":1,"explain":"A receita ensina a preparar uma comida: primeiro os ingredientes, depois o modo de fazer."},{"q":"Para que serve um texto de instruções, como as regras de um jogo?","options":["Para dar uma notícia","Para fazer rimas","Para contar uma história inventada","Para ensinar como fazer algo, passo a passo"],"answer":3,"explain":"Textos instrucionais explicam como fazer algo, em etapas."},{"q":"Um texto curto, para dar um recado rápido a alguém da família, é um:","options":["poema","bilhete","relatório","conto"],"answer":1,"explain":"O bilhete é curto e serve para dar recados rápidos."},{"q":"Em uma carta pessoal, o que costuma aparecer no começo?","options":["a lista de ingredientes","o modo de fazer","a manchete","local, data e saudação, como \"Querida vovó\""],"answer":3,"explain":"A carta começa com local, data e uma saudação para quem vai receber."},{"q":"No final de uma carta, o que costuma aparecer?","options":["lista de ingredientes","manchete","despedida e assinatura","modo de preparo"],"answer":2,"explain":"A carta termina com uma despedida, como \"Um abraço\", e o nome de quem escreveu."},{"q":"Em um diário, a pessoa costuma escrever:","options":["as instruções para montar um brinquedo","as notícias do país","o que aconteceu no seu dia, com a data","os ingredientes de um bolo"],"answer":2,"explain":"No diário registramos o que vivemos e sentimos, sempre com a data."},{"q":"O texto que conta um fato real e recente, publicado em jornal, é a:","options":["adivinha","fábula","receita","notícia"],"answer":3,"explain":"A notícia informa fatos reais que aconteceram há pouco tempo."},{"q":"Como se chama o título de uma notícia, escrito com letras grandes?","options":["manchete","verso","assinatura","estrofe"],"answer":0,"explain":"A manchete é o título da notícia e chama a atenção do leitor."},{"q":"Um anúncio usa cores fortes, imagens e frases chamativas para:","options":["contar como foi o dia","ensinar uma receita","registrar uma pesquisa","convencer as pessoas a comprar ou fazer algo"],"answer":3,"explain":"O anúncio quer convencer o leitor, por isso usa recursos que chamam a atenção."},{"q":"Em um poema, cada linha se chama:","options":["estrofe","título","parágrafo","verso"],"answer":3,"explain":"Cada linha de um poema é um verso."},{"q":"Um grupo de versos em um poema se chama:","options":["manchete","parágrafo","rima","estrofe"],"answer":3,"explain":"Vários versos juntos formam uma estrofe."},{"q":"Quais palavras rimam?","options":["mesa e livro","bola e casa","janela e panela","sapo e gato"],"answer":2,"explain":"Janela e panela terminam com o mesmo som: -ela. Isso é rima!"},{"q":"Nos versos \"O vento sopra sem parar, faz a folha dançar\", qual palavra rima com \"parar\"?","options":["sopra","dançar","folha","vento"],"answer":1,"explain":"Parar e dançar terminam com o mesmo som: -ar."},{"q":"Nas histórias em quadrinhos, onde aparece a fala dos personagens?","options":["nos balões","nos títulos","nas margens","nas estrofes"],"answer":0,"explain":"Nos quadrinhos, as falas ficam dentro dos balões."},{"q":"Qual texto é escrito para mostrar o que se descobriu em uma pesquisa, às vezes com tabelas ou gráficos?","options":["relatório de pesquisa","convite","bilhete","poema"],"answer":0,"explain":"O relatório de pesquisa conta o que foi observado e descoberto."}]}]},{"id":"mat","name":"Matemática","topics":[{"id":"3-mat-numeros","name":"Números até 9999 e valor posicional","desc":"Pratica ler, escrever, comparar e ordenar números até 9999, valor posicional e sequências.","gen":"place_value","questions":[{"q":"Como se escreve o número 2345 por extenso?","options":["dois mil trezentos e quarenta e cinco","duzentos e trinta e quatro mil e cinco","vinte e três mil quatrocentos e cinco","dois mil trinta e quatro e cinco"],"answer":0,"explain":"2345 tem 2 unidades de milhar, 3 centenas, 4 dezenas e 5 unidades: dois mil trezentos e quarenta e cinco."},{"q":"No número 4728, qual é o valor do algarismo 7?","options":["70","7000","7","700"],"answer":3,"explain":"O 7 está na casa das centenas, então vale 7 centenas, ou seja, 700."},{"q":"Qual número tem 3 unidades de milhar, 5 centenas, 0 dezenas e 8 unidades?","options":["3580","3508","358","5308"],"answer":1,"explain":"Colocando cada algarismo na sua casa: 3 milhares, 5 centenas, 0 dezenas e 8 unidades formam 3508."},{"q":"Qual número é formado por 7 centenas, 4 dezenas e 2 unidades?","options":["742","7042","247","7420"],"answer":0,"explain":"700 + 40 + 2 = 742."},{"q":"Qual é o número formado por 5000 + 300 + 20 + 9?","options":["5329","5239","53029","5392"],"answer":0,"explain":"Juntando as partes: 5 milhares, 3 centenas, 2 dezenas e 9 unidades dão 5329."},{"q":"Quantas dezenas há em 1 centena?","options":["1000","1","10","100"],"answer":2,"explain":"Uma centena é igual a 100, e 100 é formado por 10 dezenas."},{"q":"Qual destes números é o maior?","options":["6201","6120","6012","6102"],"answer":0,"explain":"Todos têm 6 milhares. Comparando as centenas, 6201 tem 2 centenas, mais que os outros."},{"q":"Qual número vem logo depois de 1999?","options":["1998","2000","2009","1100"],"answer":1,"explain":"1999 + 1 = 2000. Que virada!"},{"q":"Qual opção mostra os números em ordem crescente (do menor para o maior)?","options":["1908, 1890, 1098, 987","987, 1098, 1890, 1908","987, 1890, 1098, 1908","1098, 987, 1890, 1908"],"answer":1,"explain":"987 tem só 3 algarismos, então é o menor. Depois vêm 1098, 1890 e 1908."},{"q":"Na escola de Laura há 1250 alunos e na escola de Davi há 1205 alunos. Qual escola tem mais alunos?","options":["A escola de Laura","Não dá para saber","As duas têm o mesmo número","A escola de Davi"],"answer":0,"explain":"Comparando as dezenas: 1250 tem 5 dezenas e 1205 tem 0. Então 1250 é maior."},{"q":"Na reta numérica, qual número fica exatamente no meio entre 400 e 600?","options":["500","1000","550","450"],"answer":0,"explain":"De 400 até 500 há 100, e de 500 até 600 também há 100. O meio é 500."},{"q":"Complete a sequência: 150, 200, 250, 300, ...","options":["350","310","400","325"],"answer":0,"explain":"A sequência aumenta de 50 em 50: 300 + 50 = 350."},{"q":"Complete a sequência: 1000, 2000, 3000, ...","options":["3001","4000","5000","3100"],"answer":1,"explain":"A sequência aumenta de 1000 em 1000: 3000 + 1000 = 4000."},{"q":"Qual destes números é par?","options":["3456","4445","2781","1003"],"answer":0,"explain":"Um número é par quando termina em 0, 2, 4, 6 ou 8. O 3456 termina em 6."}]},{"id":"3-mat-adicao-subtracao","name":"Adição e subtração","desc":"Pratica somar e subtrair com reserva e reagrupamento, cálculo mental e problemas do dia a dia.","gen":"add_big","questions":[{"q":"Júlia tinha 345 figurinhas e ganhou mais 278. Com quantas figurinhas ela ficou?","options":["613","633","623","523"],"answer":2,"explain":"345 + 278 = 623. Lembre de \"vai um\" nas unidades e nas dezenas!"},{"q":"Quanto é 1456 + 2387?","options":["3843","3833","3743","3733"],"answer":0,"explain":"Somando casa por casa, com as reservas: 1456 + 2387 = 3843."},{"q":"Numa loja foram vendidos 1275 bonés em janeiro e 1386 em fevereiro. Quantos bonés foram vendidos nos dois meses?","options":["2661","2561","2651","2551"],"answer":0,"explain":"Para juntar, somamos: 1275 + 1386 = 2661."},{"q":"Calcule de cabeça: 400 + 300 + 200","options":["1000","900","700","800"],"answer":1,"explain":"4 centenas + 3 centenas + 2 centenas = 9 centenas, ou seja, 900."},{"q":"Quanto é 2999 + 1?","options":["2900","3000","3009","4000"],"answer":1,"explain":"Somando 1 ao 2999, todas as casas viram e chegamos a 3000."},{"q":"A biblioteca de uma escola tinha 1200 livros e doou 350. Quantos livros ficaram?","options":["950","850","750","1550"],"answer":1,"explain":"Para tirar, subtraímos: 1200 − 350 = 850."},{"q":"Quanto é 503 − 247?","options":["356","344","256","266"],"answer":2,"explain":"Fazendo os reagrupamentos (\"pedir emprestado\"): 503 − 247 = 256."},{"q":"Em um jogo, Gabriel fez 1580 pontos e Sofia fez 1925. Quantos pontos Sofia fez a mais que Gabriel?","options":["355","455","3505","345"],"answer":3,"explain":"Para comparar, subtraímos: 1925 − 1580 = 345."},{"q":"Um álbum tem 1000 figurinhas. Helena já colou 750. Quantas faltam para completar o álbum?","options":["150","1750","250","350"],"answer":2,"explain":"Para saber quanto falta, fazemos 1000 − 750 = 250."},{"q":"Uma fazenda tinha 2340 laranjas e vendeu 1170. Quantas laranjas sobraram?","options":["3510","1070","1170","1270"],"answer":2,"explain":"2340 − 1170 = 1170. Sobrou exatamente a metade!"},{"q":"Um ônibus saiu com 38 passageiros. Na primeira parada, subiram 15 e desceram 9. Quantos passageiros ficaram no ônibus?","options":["62","53","44","32"],"answer":2,"explain":"Primeiro somamos quem subiu: 38 + 15 = 53. Depois tiramos quem desceu: 53 − 9 = 44."},{"q":"A mãe de Lívia tem 37 anos. Lívia tem 24 anos a menos que a mãe. Quantos anos Lívia tem?","options":["14","61","13","23"],"answer":2,"explain":"\"A menos\" pede subtração: 37 − 24 = 13."},{"q":"Qual conta tem o mesmo resultado que 50 + 30?","options":["60 + 30","40 + 30","90 − 20","100 − 20"],"answer":3,"explain":"50 + 30 = 80, e 100 − 20 também é 80. Contas diferentes podem dar o mesmo resultado!"}]},{"id":"3-mat-multiplicacao","name":"Multiplicação e tabuada","desc":"Pratica a tabuada, dobro e triplo, grupos iguais e organização em linhas e colunas.","gen":"mult_table","questions":[{"q":"Quanto é 6 × 7?","options":["48","36","49","42"],"answer":3,"explain":"6 × 7 = 42. Uma dica: 6 × 7 é 7 + 7 + 7 + 7 + 7 + 7."},{"q":"Quanto é 7 × 8?","options":["63","54","56","48"],"answer":2,"explain":"7 × 8 = 56. Pense em 5, 6, 7, 8: 56 = 7 × 8!"},{"q":"Quanto é 9 × 9?","options":["81","72","18","99"],"answer":0,"explain":"9 × 9 = 81. Somando os algarismos de 81 dá 9, um truque da tabuada do 9."},{"q":"Quanto é 10 × 8?","options":["810","18","70","80"],"answer":3,"explain":"Multiplicar por 10 é colocar um zero no final: 8 vira 80."},{"q":"Qual conta representa 5 + 5 + 5 + 5?","options":["4 × 5","5 × 3","5 × 5","4 + 5"],"answer":0,"explain":"São 4 vezes o número 5, ou seja, 4 × 5 = 20."},{"q":"Em uma caixa há 4 fileiras com 5 ovos em cada uma. Quantos ovos há na caixa?","options":["9","25","20","15"],"answer":2,"explain":"4 fileiras com 5 ovos: 4 × 5 = 20."},{"q":"Uma sala tem 6 fileiras com 4 carteiras em cada uma. Quantas carteiras há na sala?","options":["20","24","10","28"],"answer":1,"explain":"6 fileiras de 4 carteiras: 6 × 4 = 24."},{"q":"Cada bicicleta tem 2 rodas. Quantas rodas há em 9 bicicletas?","options":["20","11","18","16"],"answer":2,"explain":"9 bicicletas com 2 rodas cada: 9 × 2 = 18."},{"q":"Miguel comprou 3 pacotes com 8 figurinhas cada. Quantas figurinhas ele comprou?","options":["32","11","21","24"],"answer":3,"explain":"3 pacotes de 8: 3 × 8 = 24."},{"q":"Uma aranha tem 8 patas. Quantas patas têm 4 aranhas juntas?","options":["36","24","12","32"],"answer":3,"explain":"4 aranhas com 8 patas: 4 × 8 = 32."},{"q":"Qual é o dobro de 35?","options":["105","37","65","70"],"answer":3,"explain":"Dobro é multiplicar por 2: 35 × 2 = 70."},{"q":"Qual é o triplo de 12?","options":["36","48","24","15"],"answer":0,"explain":"Triplo é multiplicar por 3: 12 × 3 = 36."},{"q":"Isabela tem 3 saias e 2 blusas. Quantas combinações diferentes de uma saia com uma blusa ela pode fazer?","options":["8","5","6","4"],"answer":2,"explain":"Cada saia combina com 2 blusas: 3 × 2 = 6 combinações."}]},{"id":"3-mat-divisao","name":"Divisão","desc":"Pratica dividir em partes iguais e descobrir quantos grupos cabem, com e sem resto.","gen":"div_exact","questions":[{"q":"Quanto é 20 ÷ 4?","options":["16","4","6","5"],"answer":3,"explain":"20 ÷ 4 = 5, porque 4 × 5 = 20."},{"q":"Quanto é 56 ÷ 8?","options":["48","6","7","8"],"answer":2,"explain":"56 ÷ 8 = 7, porque 8 × 7 = 56."},{"q":"Quanto é 81 ÷ 9?","options":["11","9","7","8"],"answer":1,"explain":"81 ÷ 9 = 9, porque 9 × 9 = 81."},{"q":"Quanto é 36 ÷ 4?","options":["9","7","32","8"],"answer":0,"explain":"36 ÷ 4 = 9, porque 4 × 9 = 36."},{"q":"Quanto é 70 ÷ 10?","options":["10","60","17","7"],"answer":3,"explain":"Dividir por 10 é tirar um zero do final: 70 vira 7."},{"q":"Dona Carla dividiu 18 balas igualmente entre seus 3 filhos. Quantas balas cada um recebeu?","options":["6","5","9","15"],"answer":0,"explain":"18 ÷ 3 = 6, porque 3 × 6 = 18."},{"q":"Vovô Antônio quer colocar 40 laranjas em 10 sacolas, com a mesma quantidade em cada uma. Quantas laranjas vão em cada sacola?","options":["10","4","50","30"],"answer":1,"explain":"40 ÷ 10 = 4 laranjas em cada sacola."},{"q":"Caio tem 30 lápis e quer colocar 5 em cada estojo. Quantos estojos ele vai usar?","options":["6","25","5","35"],"answer":0,"explain":"Queremos saber quantos grupos de 5 cabem em 30: 30 ÷ 5 = 6."},{"q":"Uma caixa com 48 ovos será dividida em bandejas de 6 ovos. Quantas bandejas serão usadas?","options":["42","8","9","7"],"answer":1,"explain":"48 ÷ 6 = 8, porque 6 × 8 = 48."},{"q":"Qual conta de multiplicação ajuda a resolver 42 ÷ 6?","options":["6 × 6 = 36","6 + 36 = 42","42 × 6 = 252","6 × 7 = 42"],"answer":3,"explain":"Divisão e multiplicação são operações inversas: como 6 × 7 = 42, então 42 ÷ 6 = 7."},{"q":"Uma professora tem 25 alunos e quer formar grupos de 4. Quantos grupos completos ela forma e quantos alunos sobram?","options":["6 grupos e não sobra ninguém","6 grupos e sobra 1 aluno","5 grupos e sobram 5 alunos","7 grupos e sobram 3 alunos"],"answer":1,"explain":"6 grupos de 4 dão 24 alunos. Como 25 − 24 = 1, sobra 1 aluno."},{"q":"Yasmin dividiu 17 figurinhas igualmente com sua irmã, ficando as duas com a mesma quantidade. Quantas cada uma recebeu e quantas sobraram?","options":["8 para cada e sobrou 1","8 para cada e não sobrou nada","9 para cada e não sobrou nada","7 para cada e sobraram 3"],"answer":0,"explain":"2 × 8 = 16, e 17 − 16 = 1. Cada uma ficou com 8 e sobrou 1 figurinha."}]},{"id":"3-mat-fracoes","name":"Metade, terço, quarto, quinto e décimo","desc":"Pratica dividir um todo em partes iguais e calcular a metade, a terça parte, a quarta parte e outras.","gen":"frac_of","questions":[{"q":"Qual fração representa a metade?","options":["1/3","1/4","2/1","1/2"],"answer":3,"explain":"Metade é 1 de 2 partes iguais: 1/2."},{"q":"Uma pizza foi cortada em 4 pedaços iguais. Cada pedaço é que fração da pizza?","options":["1/4","1/2","4/1","1/3"],"answer":0,"explain":"Cada pedaço é 1 parte de 4 partes iguais: 1/4, um quarto."},{"q":"Uma barra de chocolate foi dividida em 3 partes iguais. Como se chama cada parte?","options":["um terço","um quinto","uma metade","um quarto"],"answer":0,"explain":"Quando dividimos em 3 partes iguais, cada uma é um terço: 1/3."},{"q":"O que é maior: 1/2 ou 1/4 da mesma pizza?","options":["1/2","Depende do sabor","1/4","São iguais"],"answer":0,"explain":"Dividindo em 2 partes, cada pedaço fica maior do que dividindo em 4 partes."},{"q":"Qual é a metade de 16?","options":["4","32","6","8"],"answer":3,"explain":"Metade é dividir por 2: 16 ÷ 2 = 8."},{"q":"Quanto é 1/2 de 50?","options":["100","20","48","25"],"answer":3,"explain":"1/2 de 50 é 50 ÷ 2 = 25."},{"q":"Quanto é 1/3 de 12?","options":["3","9","6","4"],"answer":3,"explain":"1/3 de 12 é 12 ÷ 3 = 4."},{"q":"Quanto é 1/4 de 40?","options":["4","20","36","10"],"answer":3,"explain":"1/4 de 40 é 40 ÷ 4 = 10."},{"q":"Quanto é 1/5 de 30?","options":["6","5","25","10"],"answer":0,"explain":"1/5 de 30 é 30 ÷ 5 = 6."},{"q":"Quanto é 1/10 de 100?","options":["20","10","90","1"],"answer":1,"explain":"1/10 de 100 é 100 ÷ 10 = 10."},{"q":"Bruno tinha 20 bolinhas de gude e deu a quarta parte para o irmão. Quantas bolinhas ele deu?","options":["4","10","5","16"],"answer":2,"explain":"A quarta parte de 20 é 20 ÷ 4 = 5."},{"q":"Em uma turma de 24 crianças, metade são meninas. Quantas meninas há na turma?","options":["6","14","12","24"],"answer":2,"explain":"Metade de 24 é 24 ÷ 2 = 12."}]},{"id":"3-mat-dinheiro","name":"Sistema monetário brasileiro","desc":"Pratica cédulas e moedas do real, somar preços, comparar valores e calcular troco.","gen":"money","questions":[{"q":"Ana comprou um caderno de R$ 12,00 e pagou com uma nota de R$ 20,00. Quanto recebeu de troco?","options":["R$ 7,00","R$ 8,00","R$ 32,00","R$ 12,00"],"answer":1,"explain":"O troco é o que sobra: 20 − 12 = 8 reais."},{"q":"Larissa pagou um lanche de R$ 6,50 com uma nota de R$ 10,00. Qual foi o troco?","options":["R$ 3,50","R$ 4,00","R$ 4,50","R$ 16,50"],"answer":0,"explain":"De R$ 6,50 até R$ 7,00 faltam 50 centavos, e de R$ 7,00 até R$ 10,00 faltam 3 reais. Troco: R$ 3,50."},{"q":"Quantas moedas de 50 centavos são necessárias para formar R$ 1,00?","options":["2","5","10","50"],"answer":0,"explain":"50 centavos + 50 centavos = 100 centavos, que é 1 real."},{"q":"Quantas moedas de 25 centavos formam R$ 1,00?","options":["4","25","2","5"],"answer":0,"explain":"25 + 25 + 25 + 25 = 100 centavos, ou seja, 1 real."},{"q":"Quantas notas de R$ 10,00 formam R$ 100,00?","options":["100","5","10","20"],"answer":2,"explain":"10 notas de 10 reais: 10 × 10 = 100 reais."},{"q":"Pedro tem uma nota de R$ 50,00, uma de R$ 20,00 e uma de R$ 5,00. Quanto dinheiro ele tem?","options":["R$ 70,00","R$ 57,00","R$ 85,00","R$ 75,00"],"answer":3,"explain":"50 + 20 + 5 = 75 reais."},{"q":"Qual é o valor de 2 notas de R$ 20,00 e 1 nota de R$ 10,00?","options":["R$ 40,00","R$ 30,00","R$ 50,00","R$ 60,00"],"answer":2,"explain":"20 + 20 + 10 = 50 reais."},{"q":"Um suco custa R$ 4,00 e um pão de queijo custa R$ 3,00. Quanto custam os dois juntos?","options":["R$ 8,00","R$ 12,00","R$ 7,00","R$ 1,00"],"answer":2,"explain":"Para saber o total, somamos: 4 + 3 = 7 reais."},{"q":"Mateus comprou 3 picolés de R$ 2,00 cada. Quanto ele gastou?","options":["R$ 8,00","R$ 5,00","R$ 2,00","R$ 6,00"],"answer":3,"explain":"3 picolés de 2 reais: 3 × 2 = 6 reais."},{"q":"Um brinquedo custa R$ 35,00. Beatriz tem R$ 28,00. Quanto falta para ela comprar o brinquedo?","options":["R$ 8,00","R$ 63,00","R$ 13,00","R$ 7,00"],"answer":3,"explain":"Para saber quanto falta: 35 − 28 = 7 reais."},{"q":"Um caderno custa R$ 15,00 na loja A e R$ 12,00 na loja B. Quanto se economiza comprando na loja B?","options":["R$ 12,00","R$ 2,00","R$ 3,00","R$ 27,00"],"answer":2,"explain":"A diferença de preço é 15 − 12 = 3 reais."},{"q":"Qual animal aparece na nota de R$ 20,00?","options":["onça-pintada","arara","lobo-guará","mico-leão-dourado"],"answer":3,"explain":"A nota de 20 reais tem o mico-leão-dourado. A onça está na de 50, o lobo-guará na de 200 e a arara na de 10."}]},{"id":"3-mat-medidas","name":"Medidas de comprimento, massa, capacidade e tempo","desc":"Pratica metro e centímetro, quilograma e grama, litro e mililitro, horas e minutos, e leitura do relógio.","gen":"units","questions":[{"q":"Joana mediu uma mesa com seus palmos e contou 6 palmos. Seu pai mediu a mesma mesa e contou 4 palmos. Por que os números foram diferentes?","options":["Porque o palmo da Joana é maior","Porque a mesa cresceu","Porque a mesa encolheu","Porque o palmo do pai é maior"],"answer":3,"explain":"Com uma unidade maior, como o palmo do pai, precisamos de menos palmos para medir a mesma coisa."},{"q":"Qual instrumento usamos para medir o comprimento de uma mesa?","options":["relógio","termômetro","balança","fita métrica"],"answer":3,"explain":"A fita métrica (ou trena) mede comprimentos. A balança mede massa e o relógio mede o tempo."},{"q":"Quantos centímetros há em 1 metro?","options":["100","50","10","1000"],"answer":0,"explain":"1 metro tem 100 centímetros. Uma régua comum costuma ter 30 centímetros."},{"q":"Uma caneta mede cerca de 15 ...","options":["metros","centímetros","quilogramas","quilômetros"],"answer":1,"explain":"Uma caneta cabe na mão: mede uns 15 centímetros. 15 metros seria do tamanho de um prédio de 5 andares!"},{"q":"Qual unidade é melhor para medir a massa de um saco de arroz?","options":["litro","hora","metro","quilograma"],"answer":3,"explain":"Massa se mede em quilogramas (kg) ou gramas (g). Um saco de arroz costuma ter 5 kg."},{"q":"Quantos gramas há em 1 quilograma?","options":["500","100","10","1000"],"answer":3,"explain":"1 quilograma é igual a 1000 gramas."},{"q":"Qual unidade usamos para medir a quantidade de suco em uma garrafa?","options":["centímetro","metro","litro","quilograma"],"answer":2,"explain":"Para líquidos, medimos a capacidade em litros (L) ou mililitros (mL)."},{"q":"Quantos mililitros há em 1 litro?","options":["100","1000","10","500"],"answer":1,"explain":"1 litro é igual a 1000 mililitros."},{"q":"Uma garrafa tem 2 litros de água. Quantos copos de 250 mL dá para encher com ela?","options":["10","8","4","6"],"answer":1,"explain":"2 litros são 2000 mL. Cada litro enche 4 copos de 250 mL, então 2 litros enchem 8 copos."},{"q":"Quantos minutos há em 1 hora?","options":["30","24","100","60"],"answer":3,"explain":"1 hora tem 60 minutos."},{"q":"Quantos minutos há em meia hora?","options":["60","30","15","50"],"answer":1,"explain":"Meia hora é a metade de 60 minutos: 30 minutos."},{"q":"Quantos segundos há em 1 minuto?","options":["60","30","100","10"],"answer":0,"explain":"1 minuto tem 60 segundos."},{"q":"Quantas horas tem um dia inteiro?","options":["30","12","60","24"],"answer":3,"explain":"Um dia completo, com a manhã, a tarde e a noite, tem 24 horas."},{"q":"O relógio digital mostra 14:30. Que horas são?","options":["duas e meia da tarde","uma e meia da tarde","duas e meia da manhã","quatro e meia da tarde"],"answer":0,"explain":"14 horas é 2 horas da tarde (14 − 12 = 2), e 30 minutos é meia hora."},{"q":"Uma aula começou às 8 horas e terminou às 10 horas. Quanto tempo ela durou?","options":["3 horas","18 horas","2 horas","1 hora"],"answer":2,"explain":"De 8 horas até 10 horas passam 2 horas: 10 − 8 = 2."},{"q":"Um filme começou às 15 horas e durou 2 horas. A que horas ele terminou?","options":["às 17 horas","às 13 horas","às 16 horas","às 18 horas"],"answer":0,"explain":"15 + 2 = 17. O filme terminou às 17 horas, ou 5 da tarde."}]},{"id":"3-mat-geometria","name":"Figuras planas, sólidos e localização","desc":"Pratica reconhecer sólidos geométricos e figuras planas, contar lados, faces e vértices, e se orientar.","questions":[{"q":"Uma bola de futebol tem a forma de qual sólido geométrico?","options":["cilindro","cubo","esfera","cone"],"answer":2,"explain":"A bola é toda arredondada, como uma esfera."},{"q":"Um dado de jogar tem a forma de qual sólido?","options":["cone","esfera","pirâmide","cubo"],"answer":3,"explain":"O dado tem 6 faces quadradas iguais: é um cubo."},{"q":"Uma lata de milho tem a forma parecida com qual sólido?","options":["cilindro","pirâmide","cubo","esfera"],"answer":0,"explain":"A lata tem duas bases redondas e uma parte curva: é um cilindro."},{"q":"Uma casquinha de sorvete tem a forma parecida com qual sólido?","options":["cone","cilindro","esfera","cubo"],"answer":0,"explain":"A casquinha tem uma base redonda e termina em ponta: parece um cone."},{"q":"Uma caixa de sapatos tem a forma de qual sólido?","options":["pirâmide","cilindro","bloco retangular (paralelepípedo)","cubo"],"answer":2,"explain":"A caixa de sapatos tem 6 faces retangulares: é um bloco retangular, também chamado paralelepípedo."},{"q":"Qual sólido rola com facilidade em qualquer direção?","options":["bloco retangular","esfera","cubo","pirâmide"],"answer":1,"explain":"A esfera é toda curva e não tem faces planas, por isso rola para qualquer lado."},{"q":"Quantas faces tem um cubo?","options":["4","6","8","12"],"answer":1,"explain":"O cubo tem 6 faces, como um dado: em cima, embaixo, frente, trás e dois lados."},{"q":"Quantas faces tem uma pirâmide de base quadrada?","options":["8","6","5","4"],"answer":2,"explain":"Ela tem 1 base quadrada e 4 faces triangulares: 1 + 4 = 5 faces."},{"q":"Quantos lados tem um triângulo?","options":["3","6","5","4"],"answer":0,"explain":"\"Tri\" quer dizer três: o triângulo tem 3 lados e 3 vértices."},{"q":"Qual figura plana tem 4 lados iguais e 4 cantos retos?","options":["trapézio","quadrado","círculo","triângulo"],"answer":1,"explain":"O quadrado tem 4 lados do mesmo tamanho e 4 cantos retos."},{"q":"Qual figura tem 4 cantos retos, 2 lados maiores iguais e 2 lados menores iguais?","options":["círculo","triângulo","retângulo","quadrado"],"answer":2,"explain":"O retângulo tem cantos retos e lados opostos iguais, dois maiores e dois menores."},{"q":"Quantos vértices (cantos) tem um retângulo?","options":["2","4","3","6"],"answer":1,"explain":"O retângulo tem 4 lados e 4 vértices."},{"q":"Qual figura plana não tem lados retos nem cantos?","options":["triângulo","quadrado","retângulo","círculo"],"answer":3,"explain":"O círculo é redondo: não tem lados retos nem vértices."},{"q":"Duas figuras são congruentes quando:","options":["têm a mesma forma e o mesmo tamanho","estão uma ao lado da outra","têm a mesma cor","têm tamanhos diferentes"],"answer":0,"explain":"Figuras congruentes se encaixam perfeitamente uma sobre a outra: mesma forma e mesmo tamanho."},{"q":"Se você girar o corpo um quarto de volta para a direita, 4 vezes seguidas, para onde ficará virado?","options":["para trás","para a esquerda","para a direita","para a mesma direção em que começou"],"answer":3,"explain":"4 quartos de volta formam uma volta completa, então você volta a olhar para onde começou."}]},{"id":"3-mat-graficos-probabilidade","name":"Tabelas, gráficos e chances","desc":"Pratica ler dados de tabelas e gráficos e dizer se um acontecimento é provável, pouco provável ou impossível.","questions":[{"q":"Em uma votação da fruta preferida da turma, banana teve 8 votos, maçã teve 12 votos e uva teve 5 votos. Qual fruta foi a mais votada?","options":["uva","maçã","morango","banana"],"answer":1,"explain":"12 é o maior número de votos, então a maçã venceu."},{"q":"Na votação da fruta preferida, banana teve 8 votos, maçã 12 e uva 5. Quantas crianças votaram ao todo?","options":["12","25","20","24"],"answer":1,"explain":"Somando todos os votos: 8 + 12 + 5 = 25 crianças."},{"q":"Na pesquisa do animal preferido, cachorro teve 14 votos e gato teve 9. Quantos votos o cachorro teve a mais que o gato?","options":["6","4","5","23"],"answer":2,"explain":"Para comparar, subtraímos: 14 − 9 = 5 votos a mais."},{"q":"Uma tabela mostra os gols de um time: na segunda, 2 gols; na quarta, 5 gols; na sexta, 3 gols. Em qual dia o time fez mais gols?","options":["sexta","quarta","segunda","domingo"],"answer":1,"explain":"5 é o maior número da tabela, e ele aparece na quarta-feira."},{"q":"Uma turma anotou o tempo durante 20 dias: 10 dias de sol, 6 dias de chuva e 4 dias nublados. Qual tipo de dia foi o menos frequente?","options":["chuva","nublado","neve","sol"],"answer":1,"explain":"4 é o menor número, então os dias nublados foram os menos frequentes."},{"q":"Numa tabela, a turma do 3º A tem 10 meninas e 12 meninos, e a turma do 3º B tem 13 meninas e 9 meninos. Quantas meninas há nas duas turmas juntas?","options":["22","44","23","21"],"answer":2,"explain":"Somamos só as meninas das duas turmas: 10 + 13 = 23."},{"q":"Em um gráfico de colunas, a coluna mais alta mostra:","options":["o maior valor","a cor preferida","o menor valor","o título do gráfico"],"answer":0,"explain":"Quanto mais alta a coluna, maior é o valor que ela representa."},{"q":"Para que serve o título de uma tabela ou de um gráfico?","options":["Para contar os votos","Para dizer sobre o que são os dados","Para enfeitar a página","Para mostrar o maior número"],"answer":1,"explain":"O título conta qual é o assunto dos dados, para entendermos o que estamos lendo."},{"q":"Ao jogar uma moeda, quais resultados podem acontecer?","options":["números de 1 a 6","só cara","cara ou coroa","só coroa"],"answer":2,"explain":"A moeda tem dois lados, então pode cair cara ou coroa."},{"q":"Ao jogar um dado comum, quantos resultados diferentes podem sair?","options":["5","6","1","12"],"answer":1,"explain":"O dado tem 6 faces, com os números de 1 a 6. São 6 resultados possíveis."},{"q":"Ao jogar um dado comum, é possível sair o número 7?","options":["Sim, de vez em quando","Sim, é muito provável","Sim, é certo","Não, é impossível"],"answer":3,"explain":"O dado comum só tem os números de 1 a 6. Sair 7 é impossível."},{"q":"Um saco tem 9 bolas vermelhas e 1 bola azul. Sem olhar, qual cor tem mais chance de sair?","options":["azul","verde","As duas têm a mesma chance","vermelha"],"answer":3,"explain":"Há muito mais bolas vermelhas, então é mais provável tirar uma vermelha."},{"q":"Um saco tem só bolas amarelas. Tirar uma bola verde desse saco é:","options":["certo","muito provável","pouco provável","impossível"],"answer":3,"explain":"Se não há nenhuma bola verde no saco, é impossível tirar uma verde."},{"q":"Uma roleta tem 4 partes iguais: 3 azuis e 1 amarela. Ao girar, qual cor tem mais chance de sair?","options":["amarela","As duas têm a mesma chance","vermelha","azul"],"answer":3,"explain":"O azul ocupa 3 das 4 partes, então tem mais chance de sair."}]}]},{"id":"cie","name":"Ciências","topics":[{"id":"3-cie-som","name":"Produção do som","desc":"Pratica como o som é produzido pela vibração, sons fortes e fracos, agudos e graves.","questions":[{"q":"Como o som é produzido?","options":["Pela luz do sol","Pelo frio","Pela vibração dos objetos","Pela cor dos objetos"],"answer":2,"explain":"Todo som nasce de uma vibração: algo treme bem rápido e faz o ar vibrar até chegar aos nossos ouvidos."},{"q":"Quando batemos em um tambor, o que acontece com a pele do tambor?","options":["Ela muda de cor","Ela fica parada","Ela vibra e produz som","Ela esquenta e brilha"],"answer":2,"explain":"A batida faz a pele do tambor vibrar, e essa vibração produz o som."},{"q":"Qual parte do nosso corpo vibra para produzirmos a voz?","options":["as pregas vocais, na garganta","as orelhas","os dentes","o nariz"],"answer":0,"explain":"O ar que sai dos pulmões faz as pregas vocais (cordas vocais) vibrarem. Coloque a mão na garganta e fale: dá para sentir!"},{"q":"Qual instrumento produz som pela vibração de cordas?","options":["apito","flauta","tambor","violão"],"answer":3,"explain":"No violão, as cordas vibram quando são tocadas e produzem o som."},{"q":"Num violão, uma corda mais fina e mais esticada produz um som:","options":["sem nenhum barulho","mais grave","mais agudo","mais lento"],"answer":2,"explain":"Cordas finas e esticadas vibram mais rápido e produzem sons mais agudos (mais finos)."},{"q":"O canto de um passarinho é um som fino. Um som fino é chamado de:","options":["fraco","agudo","forte","grave"],"answer":1,"explain":"Som fino é som agudo. Som grosso é som grave."},{"q":"O som de um bumbo é grosso. Um som grosso é chamado de:","options":["grave","agudo","fino","fraco"],"answer":0,"explain":"Sons grossos, como o do bumbo ou de um trovão, são sons graves."},{"q":"Um som muito alto, como o de uma britadeira, é chamado de som:","options":["agudo","fraco","forte","baixinho"],"answer":2,"explain":"Som alto, com muito volume, é um som forte. Agudo quer dizer fino, que é outra coisa."},{"q":"Se você bater de leve em uma panela e depois bater com força, o que muda?","options":["Nada muda","O som fica mais fino","O som fica mais forte quando bate com força","O som desaparece"],"answer":2,"explain":"Batendo com mais força, a vibração é maior e o som fica mais forte."},{"q":"Por que ouvimos o trovão depois de ver o relâmpago?","options":["Porque o trovão acontece em outro lugar","Porque a luz viaja mais rápido que o som","Porque o som viaja mais rápido que a luz","Porque os olhos funcionam melhor que os ouvidos"],"answer":1,"explain":"Os dois acontecem juntos, mas a luz chega muito mais rápido. O som demora mais para chegar até nós."},{"q":"Por onde o som consegue viajar?","options":["Pelo ar, pela água e pelos sólidos","Só pelo ar","Só pela água","Só pelos sólidos"],"answer":0,"explain":"O som viaja pelo ar, pela água e por objetos sólidos. Debaixo d'água também ouvimos sons!"},{"q":"No telefone de latas com barbante, por que o som chega até o amigo?","options":["Porque o som vai pela luz","Porque o barbante esticado vibra e leva o som","Porque o barbante leva eletricidade","Porque as latas têm pilhas"],"answer":1,"explain":"A voz faz a lata vibrar, a vibração passa pelo barbante esticado e chega à outra lata."},{"q":"Qual órgão dos sentidos percebe os sons?","options":["a língua","a orelha (ouvido)","o olho","o nariz"],"answer":1,"explain":"É pelas orelhas que captamos os sons. Por isso precisamos cuidar bem delas."}]},{"id":"3-cie-luz","name":"Luz, sombra e materiais","desc":"Pratica materiais transparentes, translúcidos e opacos, sombras e reflexão da luz.","questions":[{"q":"Um material que deixa a luz passar e permite ver claramente através dele é:","options":["escuro","translúcido","transparente","opaco"],"answer":2,"explain":"Materiais transparentes, como o vidro limpo, deixam a luz passar e dá para ver através deles."},{"q":"Qual destes objetos é transparente?","options":["porta de madeira","parede de tijolos","vidro de janela limpo","caderno fechado"],"answer":2,"explain":"Pelo vidro limpo da janela conseguimos ver tudo do outro lado."},{"q":"Um material que não deixa a luz passar é:","options":["transparente","brilhante","opaco","translúcido"],"answer":2,"explain":"Materiais opacos, como madeira e tijolo, bloqueiam a luz."},{"q":"O papel vegetal deixa passar um pouco de luz, mas
