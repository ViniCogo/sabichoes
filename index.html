:"A presbiopia é comum depois dos 40 anos e é corrigida com lentes convergentes, como óculos de leitura."},{"q":"Qual profissional médico examina os olhos e indica os óculos adequados?","options":["ortopedista","dentista","oftalmologista","cardiologista"],"answer":2,"explain":"O oftalmologista é o médico especialista nos olhos e na visão."},{"q":"Uma lupa, que aumenta a imagem de objetos próximos, é um exemplo de lente:","options":["convergente","plana","opaca","divergente"],"answer":0,"explain":"A lupa é mais grossa no meio e faz os raios de luz convergirem, ampliando a imagem."},{"q":"Qual é o caminho da luz ao entrar no olho?","options":["cristalino, córnea, retina e pupila","córnea, pupila, cristalino e retina","retina, cristalino, pupila e córnea","pupila, retina, córnea e cristalino"],"answer":1,"explain":"A luz atravessa a córnea, passa pela pupila, é focalizada pelo cristalino e chega à retina."},{"q":"Por que não devemos olhar diretamente para o Sol?","options":["porque a luz intensa pode lesionar a retina","porque o Sol fica menor","porque a íris muda de cor","porque a pupila para de funcionar à noite"],"answer":0,"explain":"A luz do Sol é muito forte e pode causar danos graves e permanentes à retina."},{"q":"A imagem que se forma na retina é invertida. Quem a interpreta na posição correta?","options":["o cristalino","o cérebro","a íris","as pálpebras"],"answer":1,"explain":"O nervo óptico leva a informação ao cérebro, que interpreta a imagem e nos faz enxergar tudo na posição certa."}]},{"id":"6-cie-sistema-locomotor","name":"Ossos, músculos e articulações","desc":"Entender como esqueleto, músculos e sistema nervoso trabalham juntos para sustentar e movimentar o corpo.","questions":[{"q":"Quantos ossos tem, em geral, o esqueleto de uma pessoa adulta?","options":["206","106","306","26"],"answer":0,"explain":"O esqueleto adulto tem cerca de 206 ossos. Os bebês nascem com mais, e alguns se unem com o crescimento."},{"q":"Qual é o maior osso do corpo humano?","options":["tíbia","fêmur","úmero","estribo"],"answer":1,"explain":"O fêmur é o osso da coxa e é o maior e mais longo do corpo."},{"q":"Qual é o menor osso do corpo humano, que fica dentro da orelha?","options":["fíbula","rádio","estribo","fêmur"],"answer":2,"explain":"O estribo fica na orelha média e ajuda a transmitir os sons."},{"q":"Qual é a principal função dos ossos do crânio?","options":["digerir alimentos","proteger o encéfalo","bombear o sangue","produzir saliva"],"answer":1,"explain":"O crânio forma uma caixa resistente que protege o encéfalo."},{"q":"As costelas protegem principalmente:","options":["os músculos das pernas","o coração e os pulmões","o encéfalo","o estômago e os rins"],"answer":1,"explain":"As costelas formam a caixa torácica, que protege o coração e os pulmões."},{"q":"O local onde dois ou mais ossos se encontram chama-se:","options":["tendão","medula","articulação","músculo"],"answer":2,"explain":"As articulações, como o joelho e o cotovelo, permitem que o corpo se dobre e se movimente."},{"q":"As articulações entre os ossos do crânio de um adulto são:","options":["semelhantes às do joelho","muito móveis, como as do ombro","feitas de músculo","imóveis"],"answer":3,"explain":"Os ossos do crânio adulto ficam bem encaixados e não se movem, o que ajuda a proteger o encéfalo."},{"q":"Como os músculos movimentam os ossos?","options":["eles empurram os ossos para longe","eles soltam os ossos das articulações","eles se contraem e puxam os ossos","eles se transformam em ossos"],"answer":2,"explain":"Ao se contrair, o músculo encurta e puxa o osso, produzindo o movimento."},{"q":"Qual estrutura liga os músculos aos ossos?","options":["ligamento","tendão","nervo","cartilagem"],"answer":1,"explain":"Os tendões prendem os músculos aos ossos. Os ligamentos ligam um osso a outro."},{"q":"Ao dobrar o braço, o que acontece com os músculos bíceps e tríceps?","options":["os dois relaxam","o tríceps se contrai e o bíceps relaxa","os dois se transformam em tendões","o bíceps se contrai e o tríceps relaxa"],"answer":3,"explain":"Os músculos trabalham em pares opostos: para dobrar o braço, o bíceps contrai e o tríceps relaxa."},{"q":"De que tipo é o músculo que forma o coração?","options":["músculo cardíaco (estriado cardíaco)","músculo estriado esquelético","tendão","músculo liso"],"answer":0,"explain":"O coração tem um tipo especial de músculo, o cardíaco, que se contrai sem parar e sem controle voluntário."},{"q":"Os músculos das paredes do estômago e do intestino, que se contraem sem controle voluntário, são do tipo:","options":["liso","estriado esquelético","cardíaco","ósseo"],"answer":0,"explain":"O músculo liso fica nos órgãos internos e funciona sem que precisemos pensar."},{"q":"Para chutar uma bola, quem envia a ordem para os músculos da perna?","options":["o sistema nervoso","o sistema circulatório","o sistema digestório","os próprios ossos"],"answer":0,"explain":"O movimento depende do trabalho conjunto dos sistemas nervoso, muscular e esquelético."},{"q":"Qual mineral, presente no leite e em vegetais verde-escuros, é importante para a saúde dos ossos?","options":["chumbo","mercúrio","cálcio","alumínio"],"answer":2,"explain":"O cálcio ajuda a formar e a manter os ossos fortes."},{"q":"Carregar uma mochila muito pesada sempre em um ombro só pode:","options":["melhorar a postura","fortalecer só os olhos","causar problemas na coluna","aumentar o número de ossos"],"answer":2,"explain":"O peso mal distribuído força a coluna. O ideal é usar as duas alças e não carregar peso demais."}]},{"id":"6-cie-terra-camadas-rochas-fosseis","name":"Camadas da Terra, rochas e fósseis","desc":"Identificar as camadas da Terra e da atmosfera, os tipos de rochas e como os fósseis se formam.","questions":[{"q":"Qual é a ordem das camadas da Terra, da superfície para o centro?","options":["núcleo, manto e crosta","crosta, núcleo e manto","manto, crosta e núcleo","crosta, manto e núcleo"],"answer":3,"explain":"A crosta é a camada externa, o manto fica abaixo dela e o núcleo está no centro."},{"q":"Em qual camada da Terra nós vivemos?","options":["núcleo interno","manto","núcleo externo","crosta terrestre"],"answer":3,"explain":"A crosta é a camada mais fina e externa, onde estão os continentes e os oceanos."},{"q":"Como se chama a camada que fica logo abaixo da crosta, formada por rochas muito quentes, e que ocupa a maior parte do volume da Terra?","options":["manto","atmosfera","hidrosfera","núcleo"],"answer":0,"explain":"O manto é a camada mais volumosa da Terra. Em algumas regiões dele as rochas derretem e formam o magma."},{"q":"O núcleo da Terra é formado principalmente por:","options":["ferro e níquel","areia e argila","gás oxigênio","água e sal"],"answer":0,"explain":"O núcleo é a camada mais quente e é composto principalmente pelos metais ferro e níquel."},{"q":"Em qual camada da atmosfera acontecem as chuvas, os ventos e as nuvens?","options":["estratosfera","mesosfera","termosfera","troposfera"],"answer":3,"explain":"A troposfera é a camada mais próxima da superfície e é onde ocorrem os fenômenos do tempo."},{"q":"A camada de ozônio, que protege os seres vivos dos raios ultravioleta do Sol, fica na:","options":["estratosfera","crosta","troposfera","hidrosfera"],"answer":0,"explain":"A camada de ozônio fica na estratosfera e filtra grande parte da radiação ultravioleta."},{"q":"O conjunto de todas as águas da Terra (oceanos, rios, lagos, geleiras e águas subterrâneas) chama-se:","options":["hidrosfera","biosfera","litosfera","atmosfera"],"answer":0,"explain":"Hidro quer dizer água. A hidrosfera reúne toda a água do planeta."},{"q":"Como se formam as rochas magmáticas (ígneas)?","options":["pela transformação de plantas em carvão","pela ação do vento sobre a areia","pelo acúmulo de conchas no fundo do mar","pelo resfriamento e endurecimento do magma"],"answer":3,"explain":"O magma, ao esfriar dentro da Terra ou na superfície (lava), endurece e forma rochas como o granito e o basalto."},{"q":"Como se formam as rochas sedimentares?","options":["pela deposição e compactação de sedimentos","pelo resfriamento rápido da lava","pelo calor intenso do núcleo","pela queima de florestas antigas"],"answer":0,"explain":"Pedaços de rochas, areia e restos de seres vivos se acumulam em camadas e, com o tempo, se compactam. O arenito é um exemplo."},{"q":"Em qual tipo de rocha os fósseis são encontrados com mais frequência?","options":["rochas magmáticas","dentro do magma","rochas metamórficas","rochas sedimentares"],"answer":3,"explain":"Os restos de seres vivos ficam soterrados entre os sedimentos, que se transformam em rocha e preservam esses restos."},{"q":"O mármore é uma rocha metamórfica. Isso quer dizer que ele se formou:","options":["pela transformação de outra rocha por calor e pressão","pela evaporação da água do mar","pelo resfriamento rápido da lava","pelo acúmulo de areia na praia"],"answer":0,"explain":"O mármore se forma a partir do calcário, que é transformado por calor e pressão no interior da Terra."},{"q":"O que é um fóssil?","options":["uma camada da atmosfera terrestre","um mineral brilhante usado em joias","restos ou marcas de seres vivos antigos preservados em rochas","uma rocha formada pelo resfriamento da lava"],"answer":2,"explain":"Ossos, conchas, pegadas e marcas de folhas preservados em rochas são exemplos de fósseis."},{"q":"O basalto se forma quando a lava esfria rapidamente na superfície. Ele é uma rocha:","options":["fóssil","magmática (ígnea)","sedimentar","metamórfica"],"answer":1,"explain":"Toda rocha que se forma a partir do magma ou da lava é magmática."},{"q":"Ao longo de milhões de anos, uma rocha pode se transformar em outro tipo de rocha. Esse processo é chamado de:","options":["rotação","ciclo das rochas","ciclo da água","fotossíntese"],"answer":1,"explain":"Pelo ciclo das rochas, uma rocha magmática pode virar sedimentar ou metamórfica, e vice-versa."}]},{"id":"6-cie-forma-movimentos-terra","name":"Forma da Terra e movimentos de rotação e translação","desc":"Reconhecer evidências de que a Terra é esférica e explicar dia e noite, sombras e estações do ano.","questions":[{"q":"Ao observar um navio se afastando no mar, deixamos de ver primeiro o casco e depois o mastro. Isso é uma evidência de que:","options":["o mar é mais alto no horizonte","a superfície da Terra é curva","a superfície da Terra é plana","o navio está afundando aos poucos"],"answer":1,"explain":"Por causa da curvatura da Terra, a parte de baixo do navio some primeiro atrás do horizonte."},{"q":"Durante um eclipse lunar, a sombra da Terra projetada na Lua é sempre arredondada. Isso indica que:","options":["a Terra tem forma esférica","a Lua é plana","o Sol é menor que a Terra","a Terra é quadrada"],"answer":0,"explain":"Só um corpo esférico projeta sombra sempre arredondada, em qualquer posição."},{"q":"Qual movimento da Terra é responsável pela sucessão dos dias e das noites?","options":["rotação","eclipse","precessão","translação"],"answer":0,"explain":"Na rotação, a Terra gira em torno do próprio eixo em cerca de 24 horas, e os lados iluminado e escuro se alternam."},{"q":"Quanto tempo a Terra leva, aproximadamente, para completar uma volta ao redor do Sol?","options":["12 meses e 15 dias","30 dias","24 horas","365 dias e 6 horas"],"answer":3,"explain":"Essa volta é o movimento de translação e corresponde a um ano."},{"q":"As estações do ano acontecem principalmente por causa:","options":["das nuvens que cobrem o Sol","da inclinação do eixo da Terra durante a translação","da rotação da Terra","da distância entre a Terra e a Lua"],"answer":1,"explain":"Com o eixo inclinado, cada hemisfério recebe mais ou menos luz do Sol ao longo do ano. Não é a distância ao Sol que causa as estações."},{"q":"Ao meio-dia solar, a sombra de um gnômon (uma vareta fincada no chão) é a menor do dia porque:","options":["o Sol está nascendo no horizonte","o Sol está no ponto mais alto do dia","a Terra parou de girar","a Lua está cobrindo o Sol"],"answer":1,"explain":"Quanto mais alto o Sol, mais curta a sombra. Ao meio-dia solar o Sol atinge a maior altura do dia."},{"q":"O Sol parece nascer do lado leste porque:","options":["a Terra gira de oeste para leste","a Lua empurra o Sol","o Sol gira ao redor da Terra todos os dias","a Terra gira de leste para oeste"],"answer":0,"explain":"Como a Terra gira de oeste para leste, vemos o Sol surgir no leste e se pôr no oeste."},{"q":"De manhã, o Sol está no lado leste do céu. Para qual lado aponta a sombra de um poste?","options":["não há sombra de manhã","para cima","leste","oeste"],"answer":3,"explain":"A sombra se forma no lado oposto ao Sol. Se o Sol está a leste, a sombra aponta para oeste."},{"q":"Quando é verão no Hemisfério Sul, que estação é no Hemisfério Norte?","options":["inverno","outono","primavera","verão"],"answer":0,"explain":"Os hemisférios têm estações opostas, porque recebem luz do Sol de forma diferente por causa da inclinação do eixo."},{"q":"No Brasil, que fica quase todo no Hemisfério Sul, o verão começa em:","options":["setembro","março","junho","dezembro"],"answer":3,"explain":"O verão no Hemisfério Sul começa por volta de 21 de dezembro, no solstício."},{"q":"Há mais de 2.000 anos, o sábio grego Eratóstenes estimou o tamanho da Terra comparando:","options":["o brilho das estrelas à noite","a altura das ondas do mar","o peso de rochas diferentes","as sombras em duas cidades distantes"],"answer":3,"explain":"As sombras tinham tamanhos diferentes porque a superfície da Terra é curva. Com isso, ele calculou a circunferência do planeta."},{"q":"O eixo de rotação da Terra é inclinado em cerca de:","options":["90 graus","0 grau","45 graus","23,5 graus"],"answer":3,"explain":"Essa inclinação de aproximadamente 23,5° é o que faz existirem as estações do ano."},{"q":"Por que existe o ano bissexto, com o dia 29 de fevereiro?","options":["porque a translação dura cerca de 365 dias e 6 horas","porque a Terra gira mais rápido em fevereiro","porque a rotação da Terra fica mais lenta a cada 4 anos","porque o Sol muda de lugar a cada 4 anos"],"answer":0,"explain":"4 × 6 horas = 24 horas, ou seja, um dia a mais no calendário a cada quatro anos."},{"q":"Qual evidência moderna mostra de forma direta que a Terra é esférica?","options":["fotos da Terra tiradas do espaço","a cor do céu ao meio-dia","a altura dos prédios","o barulho do vento"],"answer":0,"explain":"Imagens feitas do espaço mostram a Terra redonda, confirmando o que observações antigas já indicavam."}]}]},{"id":"his","name":"História","topics":[{"id":"6-his-tempo-fontes","name":"Tempo histórico e fontes históricas","desc":"Contar o tempo em séculos e milênios, entender a periodização da História e reconhecer tipos de fontes históricas.","questions":[{"q":"O ano de 1500, quando os portugueses chegaram ao território que hoje é o Brasil, pertence a qual século?","options":["século V","século XV","século XVI","século XIV"],"answer":1,"explain":"O século XV vai do ano 1401 ao ano 1500. Por isso 1500 é o último ano do século XV."},{"q":"O ano de 2026 pertence a qual século?","options":["século XXI","século XX","século II","século XXII"],"answer":0,"explain":"O século XXI começou em 2001 e vai até 2100."},{"q":"Um milênio corresponde a:","options":["100 anos","10 anos","10.000 anos","1.000 anos"],"answer":3,"explain":"Década = 10 anos, século = 100 anos e milênio = 1.000 anos."},{"q":"No calendário cristão, as siglas a.C. e d.C. tomam como referência:","options":["a invenção da escrita","o nascimento de Jesus Cristo","a chegada dos portugueses ao Brasil","a fundação de Roma"],"answer":1,"explain":"a.C. significa “antes de Cristo” e d.C., “depois de Cristo”."},{"q":"Qual acontecimento é mais antigo: um ocorrido em 500 a.C. ou outro em 200 a.C.?","options":["os dois aconteceram no mesmo ano","o de 500 a.C.","não é possível comparar datas antes de Cristo","o de 200 a.C."],"answer":1,"explain":"Antes de Cristo, os anos são contados “para trás”: quanto maior o número, mais distante no passado."},{"q":"Qual destes é um exemplo de fonte histórica oral?","options":["um vaso de cerâmica antigo","uma moeda romana de bronze","a entrevista com uma pessoa idosa","uma carta escrita em 1900"],"answer":2,"explain":"Fontes orais são relatos falados, como entrevistas e histórias contadas por quem viveu os fatos."},{"q":"Um vaso de cerâmica encontrado em uma escavação é uma fonte histórica:","options":["oral","audiovisual","material","escrita"],"answer":2,"explain":"Objetos, ferramentas, construções e utensílios são fontes materiais."},{"q":"Qual profissional estuda o passado principalmente a partir de vestígios materiais encontrados em escavações?","options":["arqueólogo","geógrafo","meteorologista","astrônomo"],"answer":0,"explain":"O arqueólogo escava e analisa objetos, ossos e construções deixados por povos antigos."},{"q":"A periodização tradicional da história, criada com base em acontecimentos da Europa, divide o tempo em:","options":["Idade Antiga, Idade Média, Idade Moderna e Idade Contemporânea","Idade da Pedra, Idade do Gelo, Idade da Água e Idade do Fogo","Paleolítico, Neolítico e Idade dos Metais apenas","Período Colonial, Imperial e Republicano"],"answer":0,"explain":"Essa divisão é a mais conhecida, mas foi pensada a partir da história europeia e não serve igualmente para todos os povos."},{"q":"Na periodização tradicional, que acontecimento marca a passagem da Pré-História para a História?","options":["a invenção da escrita","a chegada dos europeus à América","a queda do Império Romano","o domínio do fogo"],"answer":0,"explain":"A escrita surgiu há cerca de 5 mil anos, na Mesopotâmia. Hoje se sabe que povos sem escrita também têm história."},{"q":"Na periodização tradicional, o fim da Idade Antiga é marcado pela:","options":["invenção da escrita","tomada de Constantinopla, em 1453","queda do Império Romano do Ocidente, em 476","Revolução Francesa"],"answer":2,"explain":"Em 476, Odoacro, um chefe de origem germânica, depôs Rômulo Augusto, o último imperador romano do Ocidente."},{"q":"A existência de calendários diferentes, como o cristão, o judaico, o islâmico e o chinês, mostra que:","options":["os anos têm durações diferentes em cada país","diferentes sociedades têm formas diferentes de contar o tempo","o tempo não pode ser medido","só existe um jeito certo de contar o tempo"],"answer":1,"explain":"Cada calendário toma como ponto de partida um acontecimento importante para aquela cultura."},{"q":"Por que o historiador compara várias fontes sobre um mesmo acontecimento?","options":["porque cada fonte mostra um ponto de vista e pode ter limitações","porque todas as fontes dizem exatamente a mesma coisa","porque só fontes escritas são válidas","porque as fontes antigas são sempre falsas"],"answer":0,"explain":"Comparando fontes diferentes, o historiador consegue entender melhor o passado e perceber visões diferentes sobre os fatos."},{"q":"Quantos anos tem uma década?","options":["12 anos","1.000 anos","100 anos","10 anos"],"answer":3,"explain":"Uma década tem 10 anos. Dez décadas formam um século."}]},{"id":"6-his-origem-humanidade-pre-historia","name":"Origem da humanidade, Pré-História e povoamento da América","desc":"Conhecer as hipóteses sobre a origem humana, o Paleolítico, o Neolítico e as teorias de chegada dos primeiros grupos à América.","questions":[{"q":"Segundo as pesquisas científicas, em qual continente surgiram os primeiros seres humanos da nossa espécie (Homo sapiens)?","options":["África","Oceania","Europa","América"],"answer":0,"explain":"Fósseis e estudos genéticos indicam que o Homo sapiens surgiu na África e depois se espalhou pelos outros continentes."},{"q":"Qual cientista ficou conhecido por propor a teoria da evolução das espécies por seleção natural?","options":["Isaac Newton","Galileu Galilei","Albert Einstein","Charles Darwin"],"answer":3,"explain":"Charles Darwin publicou suas ideias sobre a evolução no século XIX."},{"q":"As narrativas tradicionais de diferentes povos que explicam a origem do mundo e da humanidade são chamadas de:","options":["teorias científicas","notícias","leis","mitos de origem"],"answer":3,"explain":"Muitos povos têm mitos de origem, que fazem parte de sua cultura e de suas crenças."},{"q":"O Paleolítico, também chamado de Idade da Pedra Lascada, se caracteriza por grupos humanos:","options":["que viviam em grandes cidades muradas","que usavam ferramentas de ferro","que já tinham escrita alfabética","nômades, que viviam da caça e da coleta"],"answer":3,"explain":"No Paleolítico, os grupos se deslocavam em busca de alimentos e usavam ferramentas de pedra lascada."},{"q":"O período Neolítico, ou Idade da Pedra Polida, está ligado principalmente:","options":["ao surgimento da agricultura","ao uso de máquinas a vapor","à invenção da escrita alfabética","às grandes navegações"],"answer":0,"explain":"Com a agricultura e a criação de animais, muitos grupos passaram a viver fixos em um lugar."},{"q":"O domínio do fogo permitiu aos grupos humanos:","options":["cozinhar alimentos, se aquecer e se proteger de animais","escrever os primeiros livros","fabricar ferramentas de ferro imediatamente","navegar entre os continentes"],"answer":0,"explain":"O fogo trouxe calor, luz, proteção e a possibilidade de cozinhar os alimentos."},{"q":"O bronze, muito usado na Idade dos Metais, é uma liga formada por:","options":["prata e chumbo","ferro e ouro","pedra e argila","cobre e estanho"],"answer":3,"explain":"A mistura de cobre com estanho dá origem ao bronze, mais resistente que o cobre puro."},{"q":"Segundo uma das teorias mais aceitas, grupos humanos chegaram à América vindos da Ásia a pé pelo:","options":["Canal do Panamá","Cabo da Boa Esperança","Estreito de Gibraltar","Estreito de Bering"],"answer":3,"explain":"Durante uma glaciação, o nível do mar baixou e formou uma passagem de terra entre a Ásia e a América do Norte."},{"q":"Além da passagem por Bering, outra hipótese sobre o povoamento da América propõe que grupos humanos chegaram:","options":["de avião","navegando pelo Oceano Pacífico","vindos da Lua","atravessando o deserto do Saara"],"answer":1,"explain":"Essa hipótese sugere que povos do Pacífico chegaram à América em embarcações, de ilha em ilha ou pela costa."},{"q":"Luzia, um dos fósseis humanos mais antigos encontrados na América, foi descoberta em qual estado brasileiro?","options":["Rio Grande do Sul","Minas Gerais","Amazonas","Bahia"],"answer":1,"explain":"O crânio de Luzia foi encontrado na região de Lagoa Santa, em Minas Gerais, e tem cerca de 11 mil anos."},{"q":"O Parque Nacional da Serra da Capivara, famoso por suas pinturas rupestres, fica em qual estado?","options":["Paraná","São Paulo","Pará","Piauí"],"answer":3,"explain":"A Serra da Capivara, no Piauí, tem milhares de pinturas feitas por povos antigos nas paredes de rochas."},{"q":"O que são pinturas rupestres?","options":["mapas desenhados por navegadores","desenhos feitos em papel","quadros pintados em telas por artistas europeus","pinturas feitas por povos antigos em paredes de cavernas e rochas"],"answer":3,"explain":"As pinturas rupestres mostram animais, pessoas e cenas do cotidiano e são importantes fontes históricas."},{"q":"Os sambaquis, encontrados no litoral brasileiro, são:","options":["templos de pedra construídos pelos incas","vulcões extintos do litoral","montes de conchas deixados por povos antigos","fortalezas construídas por portugueses"],"answer":2,"explain":"Os sambaquis mostram como viviam povos que se alimentavam de frutos do mar há milhares de anos."},{"q":"A “terra preta de índio”, encontrada na Amazônia, é um solo muito fértil que se formou:","options":["por adubos químicos modernos","pela chegada de colonizadores europeus","por erupções de vulcões","pela ação de povos indígenas antigos"],"answer":3,"explain":"Isso mostra que os povos indígenas transformaram a paisagem amazônica ao longo de séculos."}]},{"id":"6-his-povos-america","name":"Povos antigos da América: astecas, maias, incas e indígenas do Brasil","desc":"Conhecer os territórios, as formas de registro e as contribuições dos povos americanos antigos e indígenas do Brasil.","questions":[{"q":"Tenochtitlán, a capital dos astecas, ficava onde hoje está:","options":["a Cidade do México","Buenos Aires, na Argentina","Lima, no Peru","Brasília, no Brasil"],"answer":0,"explain":"Os astecas construíram Tenochtitlán sobre um lago, no local onde hoje fica a Cidade do México."},{"q":"As chinampas, usadas pelos astecas, eram:","options":["estradas nas montanhas","barcos usados nas guerras","pirâmides para guardar ouro","ilhas artificiais para a agricultura"],"answer":3,"explain":"As chinampas eram áreas de cultivo muito férteis feitas sobre a água."},{"q":"O Império Inca se desenvolveu em qual região da América do Sul?","options":["no Pampa gaúcho","na Floresta Amazônica, no Brasil","nas ilhas do Caribe","na Cordilheira dos Andes"],"answer":3,"explain":"Os incas viviam nos Andes, e sua capital era Cusco, no atual Peru."},{"q":"Os quipos, usados pelos incas, eram:","options":["folhas de papiro","cordões com nós usados para fazer registros e contas","moedas de ouro","tabletes de argila com escrita cuneiforme"],"answer":1,"explain":"Com cores e nós diferentes, os quipos registravam quantidades e informações do império."},{"q":"Qual povo da América desenvolveu uma escrita com hieróglifos, um calendário preciso e usava o conceito de zero?","options":["os tupis","os gregos","os maias","os romanos"],"answer":2,"explain":"Os maias, da região do atual México e da América Central, eram grandes observadores dos astros e matemáticos."},{"q":"A cidade de Machu Picchu, construída no alto das montanhas, é um importante sítio arqueológico de qual povo?","options":["astecas","egípcios","maias","incas"],"answer":3,"explain":"Machu Picchu fica no Peru e foi construída pelos incas no século XV."},{"q":"Qual alimento era a base da alimentação de muitos povos antigos da América, como maias e astecas?","options":["milho","trigo","uva","arroz"],"answer":0,"explain":"O milho é nativo da América e era tão importante que aparecia em mitos e rituais desses povos."},{"q":"A cidade de Chichén Itzá, com sua famosa pirâmide, foi construída por qual povo?","options":["maias","tupis","incas","fenícios"],"answer":0,"explain":"Chichén Itzá fica na península de Iucatã, no México, e foi uma grande cidade maia."},{"q":"Os povos indígenas do Brasil são muitas vezes agrupados em grandes troncos linguísticos. Dois dos principais são:","options":["Latim e Grego","Árabe e Hebraico","Asteca e Inca","Tupi e Macro-Jê"],"answer":3,"explain":"As línguas indígenas brasileiras são muito diversas, e Tupi e Macro-Jê são os dois maiores troncos."},{"q":"Qual alimento, cultivado pelos indígenas há muito tempo, dá origem à farinha e à tapioca?","options":["trigo","mandioca","cevada","arroz"],"answer":1,"explain":"A mandioca é uma das grandes heranças indígenas na alimentação brasileira."},{"q":"Qual destas palavras do português falado no Brasil tem origem tupi?","options":["janela","cadeira","jabuticaba","escola"],"answer":2,"explain":"Muitas palavras do nosso dia a dia vêm do tupi, como jabuticaba, pipoca, mandioca e capivara."},{"q":"Muitos povos indígenas e africanos transmitem sua história e seus conhecimentos principalmente por meio da:","options":["escrita cuneiforme","escrita alfabética","tradição oral","imprensa escrita"],"answer":2,"explain":"A tradição oral é uma forma importante de guardar a memória de um povo."},{"q":"A cerâmica marajoara, famosa por seus desenhos, foi produzida por povos que viveram:","options":["na Ilha de Marajó, no Pará","na Cordilheira dos Andes","no litoral de Santa Catarina","no deserto do Atacama"],"answer":0,"explain":"Os povos marajoaras produziram vasos e urnas decorados há mais de mil anos."},{"q":"Os incas construíram uma grande rede de estradas pelos Andes. Para que ela servia?","options":["para corridas de cavalos","apenas para enfeitar as cidades","para trens a vapor","para ligar as regiões do império"],"answer":3,"explain":"Mensageiros percorriam essas estradas levando informações rapidamente por todo o império."}]},{"id":"6-his-mesopotamia-egito-africa","name":"Mesopotâmia, Egito e reinos africanos antigos","desc":"Conhecer as primeiras civilizações do Oriente Próximo e da África, suas formas de escrita, governo e crenças.","questions":[{"q":"A Mesopotâmia se desenvolveu entre quais rios?","options":["Reno e Danúbio","Nilo e Congo","Amazonas e São Francisco","Tigre e Eufrates"],"answer":3,"explain":"Mesopotâmia significa “terra entre rios”. Ela ficava entre o Tigre e o Eufrates, no atual Iraque."},{"q":"A escrita cuneiforme, uma das mais antigas do mundo, foi criada pelos sumérios e era feita:","options":["em folhas de papel","em placas de ouro","em tabletes de argila","em cordões com nós"],"answer":2,"explain":"Os sumérios pressionavam um instrumento pontudo na argila mole, formando sinais em forma de cunha."},{"q":"O Código de Hamurábi, da Babilônia, é famoso por ser:","options":["um dos primeiros códigos de leis escritas","um livro de receitas da Babilônia","um mapa do mundo antigo","um calendário usado pelos maias"],"answer":0,"explain":"Ele reunia leis gravadas em pedra e ficou conhecido pelo princípio “olho por olho, dente por dente”."},{"q":"Qual rio foi fundamental para o desenvolvimento do Egito Antigo?","options":["Eufrates","Amazonas","Nilo","Tigre"],"answer":2,"explain":"As cheias do Nilo deixavam as margens férteis, permitindo a agricultura no meio do deserto."},{"q":"No Egito Antigo, o faraó era:","options":["um escravizado que construía pirâmides","um comerciante estrangeiro","o governante, considerado um deus ou filho dos deuses","um tipo de templo"],"answer":2,"explain":"O faraó concentrava o poder político e religioso no Egito."},{"q":"Como se chama a escrita sagrada dos antigos egípcios, formada por desenhos e símbolos?","options":["quipo","hieróglifos","alfabeto latino","cuneiforme"],"answer":1,"explain":"Os hieróglifos eram usados em templos e túmulos. Foram decifrados graças à Pedra de Roseta."},{"q":"Os egípcios mumificavam os mortos porque:","options":["queriam guardar os corpos em museus","seguiam uma ordem dos romanos","precisavam de remédios feitos de múmias","acreditavam na vida após a morte"],"answer":3,"explain":"Para os egípcios, o corpo preservado era importante para a vida no além."},{"q":"As grandes pirâmides de Gizé foram construídas para servir como:","options":["mercados","fortalezas militares","túmulos de faraós","palácios para festas"],"answer":2,"explain":"As pirâmides guardavam o corpo do faraó e objetos para a vida após a morte."},{"q":"O Reino de Kush, que chegou a governar o Egito, ficava:","options":["entre os rios Tigre e Eufrates","ao sul do Egito, na Núbia","ao norte da Grécia","na península Ibérica"],"answer":1,"explain":"Os kushitas viviam às margens do Nilo, ao sul do Egito, e chegaram a ter faraós governando o Egito."},{"q":"A cidade de Meroé, capital do Reino de Kush, ficou conhecida por:","options":["plantar café","construir navios vikings","produzir objetos de ferro","fabricar papel"],"answer":2,"explain":"Meroé foi um grande centro de produção de ferro na África antiga."},{"q":"O Reino de Axum, um importante reino comercial da África antiga, ficava na região da atual:","options":["Etiópia","Angola","Marrocos","África do Sul"],"answer":0,"explain":"Axum controlava rotas de comércio entre a África, a Arábia e a Índia."},{"q":"Os zigurates, construídos na Mesopotâmia, eram:","options":["barcos de comércio","túmulos subterrâneos","templos em forma de torre","estradas pavimentadas"],"answer":2,"explain":"Os zigurates eram centros religiosos e também administrativos das cidades mesopotâmicas."},{"q":"Na Antiguidade, um império era:","options":["uma assembleia de cidadãos","um Estado que dominava vários povos","uma pequena aldeia independente","um tipo de templo"],"answer":1,"explain":"Impérios cresciam conquistando outros povos, que passavam a pagar tributos ao governo central."},{"q":"O papiro, usado pelos egípcios para escrever, era feito:","options":["de uma planta do rio Nilo","de pedra polida","de argila cozida","de couro de camelo"],"answer":0,"explain":"As fibras do papiro eram prensadas e secas, formando folhas para escrever."},{"q":"Os fenícios, grandes navegadores e comerciantes, criaram:","options":["os hieróglifos egípcios","os quipos dos incas","um alfabeto que originou o nosso","a escrita cuneiforme"],"answer":2,"explain":"O alfabeto fenício foi adaptado pelos gregos e depois pelos romanos, chegando ao alfabeto que usamos hoje."}]},{"id":"6-his-grecia-antiga","name":"Grécia Antiga","desc":"Conhecer as cidades-estado gregas, a democracia ateniense, a cidadania e as contribuições culturais da Grécia.","questions":[{"q":"Na Grécia Antiga, as pólis eram:","options":["aldeias sem governo","templos dedicados a Zeus","cidades-estado independentes","navios de guerra"],"answer":2,"explain":"A Grécia não era um país unificado: cada pólis, como Atenas e Esparta, tinha seu próprio governo."},{"q":"Qual cidade grega é conhecida por ter desenvolvido a democracia?","options":["Atenas","Roma","Babilônia","Esparta"],"answer":0,"explain":"Em Atenas, os cidadãos participavam diretamente das decisões em assembleias."},{"q":"Qual cidade grega ficou conhecida por sua sociedade militarizada, que treinava os meninos para a guerra?","options":["Esparta","Atenas","Troia","Olímpia"],"answer":0,"explain":"Em Esparta, os meninos começavam o treinamento militar ainda crianças."},{"q":"Na democracia de Atenas, quem podia participar das decisões políticas como cidadão?","options":["homens adultos nascidos em Atenas, filhos de atenienses","apenas as mulheres","os estrangeiros e os escravizados","todas as pessoas que moravam na cidade"],"answer":0,"explain":"Mulheres, estrangeiros (metecos) e escravizados não eram considerados cidadãos, por isso a maioria da população ficava de fora."},{"q":"Em Atenas, os metecos eram:","options":["os cidadãos mais ricos","estrangeiros que viviam na cidade","os generais do exército","os sacerdotes do templo"],"answer":1,"explain":"Os metecos podiam trabalhar e comerciar, mas não tinham direitos políticos."},{"q":"Os Jogos Olímpicos da Antiguidade eram realizados em Olímpia em homenagem a qual deus?","options":["Poseidon","Ares","Zeus","Hades"],"answer":2,"explain":"Zeus era o principal deus da religião grega, e os jogos faziam parte de festas em sua honra."},{"q":"A religião dos gregos antigos era:","options":["igual à religião dos maias","sem nenhum deus","politeísta, com muitos deuses","monoteísta, com um só deus"],"answer":2,"explain":"Os gregos acreditavam em vários deuses, como Zeus, Atena, Apolo e Poseidon."},{"q":"Qual destes foi um filósofo da Grécia Antiga?","options":["Carlos Magno","Júlio César","Hamurábi","Aristóteles"],"answer":3,"explain":"Aristóteles, assim como Sócrates e Platão, foi um grande filósofo grego."},{"q":"A palavra “democracia”, de origem grega, significa:","options":["governo dos sacerdotes","governo do povo","governo de um rei","governo dos ricos"],"answer":1,"explain":"“Demos” significa povo e “kratos”, poder ou governo."},{"q":"Nas cidades gregas, a ágora era:","options":["o porto dos navios","a praça pública da cidade","o templo principal no alto da cidade","a prisão da cidade"],"answer":1,"explain":"A ágora era o centro da vida social e política da pólis."},{"q":"A Acrópole de Atenas, onde fica o Partenon, era:","options":["um estádio de corridas","um mercado de peixes","uma muralha ao redor do porto","a parte alta da cidade, com templos"],"answer":3,"explain":"Acrópole significa “cidade alta”. O Partenon foi construído ali em homenagem à deusa Atena."},{"q":"Os poemas Ilíada e Odisseia, que falam da Guerra de Troia e da volta de Ulisses, são atribuídos a:","options":["Alexandre","Platão","Homero","Péricles"],"answer":2,"explain":"Esses poemas épicos são atribuídos a Homero e são importantes fontes sobre a Grécia antiga."},{"q":"A mistura da cultura grega com culturas orientais, após as conquistas de Alexandre, o Grande, recebeu o nome de:","options":["renascimento","feudalismo","helenismo","iluminismo"],"answer":2,"explain":"Os gregos chamavam a si mesmos de helenos, por isso o nome helenismo."},{"q":"A expressão “Antiguidade Clássica” costuma se referir às civilizações:","options":["dos maias e dos astecas","da Grécia e de Roma","da China e da Índia","do Egito e da Mesopotâmia"],"answer":1,"explain":"Grécia e Roma influenciaram muito a cultura ocidental, como a política, as artes e a filosofia."},{"q":"Em Atenas, a maioria das mulheres:","options":["votava nas assembleias","não tinha direitos políticos","governava a cidade","comandava o exército"],"answer":1,"explain":"As mulheres atenienses eram excluídas da vida política e tinham pouca liberdade fora de casa."}]},{"id":"6-his-roma-antiga","name":"Roma Antiga","desc":"Conhecer a monarquia, a república e o império romanos, a sociedade romana e a expansão pelo Mediterrâneo.","questions":[{"q":"Quais foram as três formas de governo da Roma Antiga, na ordem em que aconteceram?","options":["Monarquia, República e Império","Democracia, Feudalismo e Império","República, Monarquia e Império","Império, República e Monarquia"],"answer":0,"explain":"Roma começou com reis (Monarquia), depois foi governada pelo Senado (República) e, por fim, por imperadores (Império)."},{"q":"Segundo a lenda, Roma foi fundada por dois irmãos gêmeos amamentados por uma loba. Quem eram eles?","options":["Caim e Abel","Zeus e Hades","Rômulo e Remo","Castor e Pólux"],"answer":2,"explain":"Essa é a lenda de fundação de Roma. Rômulo teria sido o primeiro rei."},{"q":"Na Roma Antiga, os patrícios eram:","options":["a aristocracia dona de terras","a maioria pobre da população","os estrangeiros","os escravizados"],"answer":0,"explain":"Os patrícios eram a elite romana e tinham muitos privilégios políticos."},{"q":"Na Roma Antiga, os plebeus eram:","options":["os senadores mais ricos","os imperadores","a maioria da população livre","os sacerdotes"],"answer":2,"explain":"Os plebeus eram livres, mas por muito tempo tiveram poucos direitos políticos."},{"q":"Durante a República romana, qual órgão concentrava grande poder e era formado principalmente por patrícios?","options":["a Ágora","o Senado","o Conselho dos Anciãos de Esparta","o Faraó"],"answer":1,"explain":"O Senado decidia sobre leis, guerras e finanças da República."},{"q":"Após lutas dos plebeus por direitos, foram criados os tribunos da plebe, que tinham a função de:","options":["escolher o papa","comandar os escravizados","defender os interesses dos plebeus","construir aquedutos"],"answer":2,"explain":"Os tribunos podiam vetar decisões que prejudicassem os plebeus."},{"q":"A Lei das Doze Tábuas é importante porque:","options":["criou os Jogos Olímpicos","proibiu o comércio no Mediterrâneo","foi o primeiro conjunto de leis escritas de Roma","dividiu o Império em dois"],"answer":2,"explain":"Com as leis escritas, os plebeus podiam conhecer as regras e se proteger de abusos."},{"q":"Quem é considerado o primeiro imperador de Roma?","options":["Carlos Magno","Otávio Augusto","Rômulo","Alexandre, o Grande"],"answer":1,"explain":"Otávio recebeu o título de Augusto e governou como imperador a partir de 27 a.C."},{"q":"A chamada política do “pão e circo” consistia em:","options":["proibir festas na cidade","distribuir alimentos e oferecer espetáculos à população","cobrar impostos sobre o pão","construir circos para treinar soldados"],"answer":1,"explain":"Os governantes buscavam agradar a população pobre e evitar revoltas."},{"q":"Os romanos chamavam o Mar Mediterrâneo de “Mare Nostrum”, que significa:","options":["“mar dos deuses”","“nosso mar”","“mar perigoso”","“mar do norte”"],"answer":1,"explain":"Roma dominou todas as terras ao redor do Mediterrâneo, por onde circulavam pessoas, mercadorias e culturas."},{"q":"A língua portuguesa se originou principalmente de qual língua falada pelos romanos?","options":["latim","árabe","grego","tupi"],"answer":0,"explain":"O latim deu origem às línguas românicas: português, espanhol, italiano, francês e romeno."},{"q":"Qual imperador tornou o cristianismo a religião oficial do Império Romano, em 380?","options":["Nero","Teodósio","Júlio César","Otávio Augusto"],"answer":1,"explain":"Antes perseguidos, os cristãos ganharam liberdade de culto com Constantino em 313, e Teodósio tornou o cristianismo religião oficial."},{"q":"Em 395, o Império Romano foi dividido em duas partes. Quais?","options":["Ocidente e Oriente","Grécia e Egito","Norte e Sul","Monarquia e República"],"answer":0,"explain":"O Império do Ocidente caiu em 476, e o do Oriente, chamado Império Bizantino, durou até 1453."},{"q":"Na Roma Antiga, muitas pessoas escravizadas eram:","options":["senadores punidos com férias","apenas estrangeiros que pediam emprego","prisioneiros de guerra dos povos conquistados","cidadãos ricos que escolhiam trabalhar de graça"],"answer":2,"explain":"As guerras de conquista trouxeram muitos escravizados a Roma. Espártaco liderou uma famosa revolta de escravizados."},{"q":"Os aquedutos, grandes construções romanas, serviam para:","options":["proteger contra ataques","realizar lutas de gladiadores","guardar alimentos","levar água até as cidades"],"answer":3,"explain":"Os aquedutos transportavam água de fontes distantes para abastecer as cidades."}]},{"id":"6-his-idade-media","name":"Idade Média: feudalismo, Igreja, Bizâncio e islamismo","desc":"Entender o feudalismo, a relação entre senhores e servos, o papel da Igreja, o Império Bizantino e a expansão islâmica.","questions":[{"q":"O feudalismo era um sistema baseado principalmente:","options":["no comércio marítimo","na posse da terra","na democracia direta","na indústria e nas fábricas"],"answer":1,"explain":"No feudalismo, a terra (o feudo) era a principal riqueza, e as relações de poder giravam em torno dela."},{"q":"Na sociedade feudal, os servos:","options":["governavam os reinos","eram os membros do clero","trabalhavam nas terras do senhor","eram donos de grandes feudos"],"answer":2,"explain":"Os servos não podiam abandonar o feudo e deviam várias obrigações ao senhor."},{"q":"A corveia era uma obrigação dos servos que consistia em:","options":["lutar nas Cruzadas","pagar com moedas de ouro","estudar nos mosteiros","trabalhar de graça nas terras do senhor"],"answer":3,"explain":"Além da corveia, havia a talha, que era a entrega de parte da produção ao senhor."},{"q":"Qual é a principal diferença entre o servo medieval e a pessoa escravizada?","options":["não havia nenhuma diferença","o servo recebia salário alto","o servo não podia ser vendido como propriedade","o servo podia ir embora quando quisesse"],"answer":2,"explain":"A pessoa escravizada era tratada como propriedade e podia ser vendida. O servo tinha obrigações, mas não era vendido como mercadoria."},{"q":"Na sociedade feudal, quais eram os três grupos principais?","options":["faraós, escribas e camponeses","patrícios, plebeus e escravizados","cidadãos, metecos e escravizados","clero, nobreza e servos"],"answer":3,"explain":"Dizia-se que o clero rezava, a nobreza guerreava e os servos trabalhavam."},{"q":"Na Idade Média, muitos monges dos mosteiros eram responsáveis por:","options":["construir pirâmides","copiar livros à mão","fabricar armas de fogo","imprimir jornais diários"],"answer":1,"explain":"Antes da imprensa, os livros eram copiados à mão, e os mosteiros guardavam muitos conhecimentos."},{"q":"Qual instituição teve grande poder político, econômico e cultural na Europa medieval?","options":["a assembleia de Atenas","o Império Asteca","a Igreja Católica","o Senado romano"],"answer":2,"explain":"A Igreja era dona de muitas terras e influenciava a vida das pessoas, dos reis e da cultura."},{"q":"Qual era a capital do Império Bizantino?","options":["Atenas","Meca","Roma","Constantinopla"],"answer":3,"explain":"Constantinopla é a atual Istambul, na Turquia. A cidade ligava a Europa e a Ásia."},{"q":"O islamismo foi fundado no século VII, na Península Arábica, pelo profeta:","options":["Constantino","Moisés","Maomé","Buda"],"answer":2,"explain":"Maomé pregou em Meca e Medina, e o islamismo se espalhou rapidamente."},{"q":"Qual é o livro sagrado do islamismo?","options":["Alcorão","Bíblia","Ilíada","Torá"],"answer":0,"explain":"Para os muçulmanos, o Alcorão reúne as revelações recebidas por Maomé."},{"q":"A Hégira, que marca o início do calendário islâmico, foi:","options":["a construção das pirâmides","a queda de Constantinopla","a coroação de Carlos Magno","a mudança de Maomé de Meca para Medina"],"answer":3,"explain":"Em 622, Maomé e seus seguidores deixaram Meca e foram para Medina."},{"q":"Os árabes ajudaram a difundir na Europa os algarismos que usamos hoje, chamados de:","options":["indo-arábicos","gregos","egípcios","romanos"],"answer":0,"explain":"Esses algarismos (0, 1, 2, 3...) vieram da Índia e chegaram à Europa por meio dos árabes."},{"q":"As Cruzadas foram:","options":["viagens de comércio dos fenícios","festas religiosas dos maias","a construção de castelos no Brasil","expedições militares cristãs a Jerusalém"],"answer":3,"explain":"As Cruzadas aconteceram entre os séculos XI e XIII e colocaram cristãos e muçulmanos em conflito."},{"q":"Carlos Magno, rei dos francos, foi coroado imperador pelo papa no ano de:","options":["476","800","1453","1500"],"answer":1,"explain":"Carlos Magno formou o Império Carolíngio, que dominou boa parte da Europa ocidental."},{"q":"Hildegarda de Bingen, monja que viveu no século XII, ficou conhecida por:","options":["liderar as Cruzadas","fundar o islamismo","compor músicas e escrever sobre medicina","governar o Império Romano"],"answer":2,"explain":"Ela mostra que, nos conventos, algumas mulheres puderam estudar e produzir conhecimento."},{"q":"Na periodização tradicional, qual acontecimento marca o fim da Idade Média?","options":["a queda de Roma, em 476","a invenção da escrita","a coroação de Carlos Magno, em 800","a tomada de Constantinopla, em 1453"],"answer":3,"explain":"Com a conquista de Constantinopla, o Império Bizantino chegou ao fim."}]}]},{"id":"geo","name":"Geografia","topics":[{"id":"6-geo-paisagem-lugar-espaco","name":"Paisagem, lugar e espaço geográfico","desc":"Diferenciar paisagem natural e cultural e entender os conceitos de lugar, território e espaço geográfico.","questions":[{"q":"Em Geografia, a paisagem é:","options":["um desenho feito por um artista","apenas as florestas e os rios","tudo o que percebemos de um lugar pelos sentidos","somente as construções humanas"],"answer":2,"explain":"A paisagem inclui elementos naturais e humanos que vemos, ouvimos e sentimos em um lugar."},{"q":"Uma cidade com prédios, ruas e pontes é um exemplo de paisagem:","options":["natural","sem transformação","cultural (humanizada)","intocada"],"answer":2,"explain":"A paisagem cultural tem elementos criados ou modificados pelos seres humanos."},{"q":"Uma praia deserta, sem nenhuma construção ou modificação humana, é exemplo de paisagem:","options":["industrial","urbana","cultural","natural"],"answer":3,"explain":"A paisagem natural é formada por elementos da natureza, sem transformações feitas pelas pessoas."},{"q":"Qual destes é um elemento cultural da paisagem?","options":["uma montanha","um rio","uma floresta nativa","uma plantação de café"],"answer":3,"explain":"A plantação foi feita pelo ser humano. Rios, montanhas e florestas nativas são elementos naturais."},{"q":"Em Geografia, o conceito de lugar está ligado:","options":["ao espaço sem nenhuma pessoa","somente aos mapas-múndi","apenas aos países distantes","ao espaço vivido, com o qual temos laços afetivos"],"answer":3,"explain":"Nossa casa, a escola e o bairro são lugares, porque fazem parte da nossa vivência."},{"q":"O espaço geográfico é:","options":["apenas o espaço sideral","o espaço transformado pela sociedade","o espaço que nunca muda","somente o fundo dos oceanos"],"answer":1,"explain":"As pessoas modificam a natureza ao construir, plantar e produzir, criando o espaço geográfico."},{"q":"Comparar fotografias antigas e atuais de um mesmo bairro ajuda a perceber:","options":["o clima de outro país","que as paisagens nunca mudam","a distância entre os planetas","as transformações da paisagem ao longo do tempo"],"answer":3,"explain":"Fotos de épocas diferentes mostram novas construções, ruas e mudanças no uso do espaço."},{"q":"Os povos indígenas transformam a paisagem ao:","options":["instalar grandes indústrias","construir arranha-céus","abrir roças e construir aldeias","asfaltar rodovias"],"answer":2,"explain":"Os povos indígenas modificam o espaço de acordo com seus modos de vida, muitas vezes preservando a floresta."},{"q":"O conceito de território está ligado:","options":["a um espaço controlado por um grupo ou governo","a qualquer paisagem bonita","a uma estação do ano","ao clima de uma região"],"answer":0,"explain":"Território envolve poder e limites, como o território de um país ou de um povo indígena."},{"q":"Uma região, em Geografia, é:","options":["uma área com características comuns","a mesma coisa que um planeta","um único prédio","uma linha imaginária"],"answer":0,"explain":"As regiões são definidas por semelhanças, como clima, vegetação, economia ou cultura."},{"q":"Além da visão, a paisagem pode ser percebida por meio:","options":["apenas de mapas","de sons, cheiros e outras sensações","apenas de livros","somente de fotografias"],"answer":1,"explain":"O barulho do trânsito, o cheiro do mar e o vento também fazem parte da paisagem."},{"q":"A formação de uma montanha leva milhões de anos, enquanto um bairro pode ser construído em poucos anos. Isso mostra que:","options":["montanhas são construídas por pessoas","a natureza costuma mudar mais devagar que as cidades","a natureza muda mais rápido que as cidades","bairros nunca mudam de aparência"],"answer":1,"explain":"As transformações naturais geralmente são lentas, enquanto a sociedade pode modificar o espaço rapidamente."},{"q":"Um rio que teve suas margens cobertas por concreto e avenidas é um exemplo de:","options":["elemento que nunca foi modificado","paisagem totalmente natural","elemento natural transformado pela ação humana","fenômeno causado apenas pelo clima"],"answer":2,"explain":"O rio é natural, mas suas margens foram modificadas pelas pessoas, tornando a paisagem humanizada."}]},{"id":"6-geo-orientacao-cartografia","name":"Orientação, coordenadas geográficas e escalas","desc":"Usar pontos cardeais, rosa dos ventos, latitude e longitude e calcular distâncias com escalas de mapas.","questions":[{"q":"Quais são os quatro pontos cardeais?","options":["norte, sul, leste e oeste","direita, esquerda, frente e trás","Equador, trópicos, polos e meridianos","nordeste, noroeste, sudeste e sudoeste"],"answer":0,"explain":"Os pontos cardeais são as direções principais usadas para orientação."},{"q":"Se você estender o braço direito para o lado onde o Sol nasce, que direção estará à sua frente?","options":["oeste","leste","norte","sul"],"answer":2,"explain":"O Sol nasce aproximadamente a leste. Com o braço direito para o leste, à frente fica o norte, e às costas, o sul."},{"q":"Qual ponto colateral fica entre o norte e o leste?","options":["noroeste","sudoeste","sudeste","nordeste"],"answer":3,"explain":"Nordeste é a junção de norte e leste. Os pontos colaterais ficam entre os cardeais."},{"q":"A bússola é um instrumento de orientação porque:","options":["sua agulha aponta para o norte magnético","mede a altitude","indica a hora exata","mostra a temperatura do ar"],"answer":0,"explain":"A agulha da bússola se alinha ao campo magnético da Terra e aponta para o norte."},{"q":"A Linha do Equador divide a Terra em:","options":["Hemisfério Norte e Hemisfério Sul","continentes e oceanos","zona urbana e zona rural","Hemisfério Leste e Hemisfério Oeste"],"answer":0,"explain":"O Equador é o paralelo de 0° e separa os hemisférios Norte e Sul."},{"q":"O Meridiano de Greenwich é a referência para:","options":["a longitude 0°","a latitude 0°","a linha dos trópicos","o Polo Sul"],"answer":0,"explain":"A partir de Greenwich, as longitudes são contadas para leste e para oeste, até 180°."},{"q":"A latitude de um lugar indica:","options":["a altura do lugar em relação ao mar","a distância até o Meridiano de Greenwich","a temperatura média do lugar","a distância em graus desse lugar até a Linha do Equador"],"answer":3,"explain":"A latitude vai de 0° (no Equador) até 90° (nos polos), para o norte ou para o sul."},{"q":"A longitude de um lugar pode variar de:","options":["0° a 180°, para leste ou para oeste","0° a 24°","0° a 360°, só para leste","0° a 90°, para norte ou para sul"],"answer":0,"explain":"As longitudes são medidas a partir do Meridiano de Greenwich, até 180° para cada lado."},{"q":"Em um mapa com escala 1:100.000, 5 cm no mapa correspondem a quantos quilômetros na realidade?","options":["500 km","5 km","50 km","0,5 km"],"answer":1,"explain":"1 cm no mapa = 100.000 cm reais = 1 km. Então 5 cm = 5 km."},{"q":"Em um mapa com escala 1:50.000, 4 cm no mapa correspondem a quantos quilômetros na realidade?","options":["200 km","2 km","20 km","4 km"],"answer":1,"explain":"4 × 50.000 = 200.000 cm, e 200.000 cm = 2 km."},{"q":"A escala gráfica de um mapa é representada:","options":["por uma fração escrita em números","pela rosa dos ventos","pela legenda de cores","por uma barra dividida em partes"],"answer":3,"explain":"Na escala gráfica, cada segmento da barra corresponde a uma distância real, como 1 cm = 10 km."},{"q":"Em um mapa, a legenda serve para:","options":["dar o título do mapa","indicar a escala","mostrar o norte","explicar os símbolos e as cores"],"answer":3,"explain":"Sem a legenda, não saberíamos o que cada cor ou símbolo representa."},{"q":"Qual destas escalas mostra mais detalhes de uma área pequena, como um bairro?","options":["1:1.000.000","1:1.000","1:100.000","1:500.000"],"answer":1,"explain":"Na escala 1:1.000, cada centímetro representa apenas 10 metros, o que permite mostrar muitos detalhes."},{"q":"O território brasileiro é atravessado por quais linhas imaginárias?","options":["Círculo Polar Antártico e Linha do Equador","Linha do Equador e Trópico de Capricórnio","Meridiano de Greenwich e Trópico de Câncer","Trópico de Câncer e Círculo Polar Ártico"],"answer":1,"explain":"O Equador passa pelo norte do país (Amapá, Pará, Amazonas e Roraima) e o Trópico de Capricórnio passa por estados do Sudeste, Sul e Centro-Oeste."},{"q":"Em mapas topográficos, as curvas de nível representam:","options":["pontos de mesma altitude","as estradas principais","os caminhos dos rios","os limites entre países"],"answer":0,"explain":"Curvas de nível muito próximas indicam um terreno íngreme; afastadas, um terreno mais plano."}]},{"id":"6-geo-movimentos-terra-fusos","name":"Movimentos da Terra, fusos horários e zonas térmicas","desc":"Relacionar rotação e translação com os dias, as estações, os fusos horários e as zonas térmicas do planeta.","questions":[{"q":"Quantos fusos horários existem no mundo, considerando a divisão teórica?","options":["4","12","360","24"],"answer":3,"explain":"A Terra gira 360° em 24 horas, então ela foi dividida em 24 fusos de 15° cada."},{"q":"Cada fuso horário corresponde a quantos graus de longitude?","options":["1°","30°","15°","24°"],"answer":2,"explain":"360° ÷ 24 horas = 15° por hora."},{"q":"Se em Brasília são 12h, que horas serão em um lugar que está 3 fusos a leste?","options":["15h","12h","9h","3h"],"answer":0,"explain":"Para o leste, as horas são adiantadas: 12h + 3h = 15h."},{"q":"Quando são 10h em Brasília, que horas são no Acre, que está 2 fusos a oeste?","options":["10h","8h","7h","12h"],"answer":1,"explain":"Para o oeste, as horas são atrasadas: 10h − 2h = 8h."},{"q":"Quantos fusos horários tem o Brasil, contando as ilhas oceânicas?","options":["24","1","4","2"],"answer":2,"explain":"O Brasil é muito extenso no sentido leste-oeste e tem 4 fusos horários, incluindo o de Fernando de Noronha."},{"q":"Quando são 12h em Greenwich (horário padrão), que horas são em Brasília, que está 3 horas atrás?","options":["3h","15h","12h","9h"],"answer":3,"explain":"O horário de Brasília está 3 horas atrasado em relação a Greenwich: 12h − 3h = 9h."},{"q":"Qual zona térmica fica entre os trópicos de Câncer e de Capricórnio e é a mais quente do planeta?","options":["zona temperada do norte","zona polar","zona tropical (intertropical)","zona temperada do sul"],"answer":2,"explain":"Nessa zona os raios solares chegam de forma mais direta durante o ano todo."},{"q":"A maior parte do território brasileiro está localizada em qual zona térmica?","options":["zona polar antártica","zona tropical","zona temperada do norte","zona polar ártica"],"answer":1,"explain":"Quase todo o Brasil fica entre a Linha do Equador e o Trópico de Capricórnio, na zona tropical."},{"q":"Por que as regiões próximas à Linha do Equador costumam ser mais quentes?","options":["porque ficam mais perto da Lua","porque estão mais perto do centro da Terra","porque não têm vento","porque recebem os raios solares mais diretamente"],"answer":3,"explain":"Os raios que chegam de forma mais direta concentram mais calor em uma área menor."},{"q":"Nos equinócios, o que acontece com a duração do dia e da noite?","options":["a noite dura 24 horas no Equador","não há noite em lugar nenhum","dia e noite têm durações quase iguais","o dia é o mais longo do ano"],"answer":2,"explain":"Nos equinócios (março e setembro), os dois hemisférios são iluminados de forma parecida."},{"q":"No Hemisfério Sul, o solstício de inverno, quando acontece a noite mais longa do ano, ocorre em:","options":["dezembro","junho","setembro","março"],"answer":1,"explain":"Por volta de 21 de junho começa o inverno no Hemisfério Sul."},{"q":"O ar aquecido pelo Sol tende a:","options":["parar de se mover","descer, pois fica mais pesado","subir, pois fica menos denso","virar água imediatamente"],"answer":2,"explain":"O ar quente sobe, e o ar mais frio ocupa seu lugar. Isso ajuda a formar os ventos."},{"q":"Os ventos se deslocam geralmente:","options":["das áreas de baixa pressão para as de alta pressão","das áreas de alta pressão para as de baixa pressão","apenas durante a noite","sempre do sul para o norte"],"answer":1,"explain":"A diferença de pressão atmosférica entre áreas faz o ar se movimentar, formando os ventos."},{"q":"A sucessão dos dias e das noites é causada por qual movimento da Terra?","options":["translação","inclinação","rotação","revolução da Lua"],"answer":2,"explain":"A Terra gira em torno de si mesma em aproximadamente 24 horas, alternando o lado iluminado e o lado escuro."}]},{"id":"6-geo-relevo-rochas-solos","name":"Estrutura da Terra, relevo, rochas e solos","desc":"Conhecer as placas tectônicas, os agentes que formam o relevo, as formas de relevo e a formação e conservação dos solos.","questions":[{"q":"As placas tectônicas são:","options":["linhas imaginárias dos mapas","pedaços de gelo nos polos","grandes blocos da crosta que se movem","nuvens carregadas de chuva"],"answer":2,"explain":"As placas se movimentam sobre o manto, alguns centímetros por ano."},{"q":"Terremotos e vulcões são mais frequentes:","options":["nas bordas das placas tectônicas","no centro das placas tectônicas","somente no Brasil","apenas nos desertos"],"answer":0,"explain":"É nas bordas, onde as placas se chocam ou se afastam, que ocorre a maior parte desses fenômenos."},{"q":"Por que o Brasil tem poucos terremotos fortes?","options":["porque fica no interior de uma placa tectônica","porque tem muitos rios","porque não tem montanhas","porque fica no Hemisfério Sul"],"answer":0,"explain":"Como o país está no meio da placa, os grandes abalos são raros."},{"q":"Quais destes são agentes internos (endógenos) de formação do relevo?","options":["geleiras e ondas do mar","tectonismo, vulcanismo e terremotos","chuva, vento e rios","plantações e estradas"],"answer":1,"explain":"Os agentes internos vêm do interior da Terra e criam ou elevam formas de relevo."},{"q":"Quais destes são agentes externos (exógenos) que modificam o relevo?","options":["vulcões e terremotos","o calor do núcleo","chuva, vento, rios e seres vivos","movimento das placas tectônicas"],"answer":2,"explain":"Os agentes externos desgastam e transportam materiais, modelando o relevo."},{"q":"O intemperismo é:","options":["a construção de barragens","o movimento das placas tectônicas","o desgaste e a decomposição das rochas","a formação de vulcões"],"answer":2,"explain":"Com o intemperismo, as rochas se quebram e se decompõem, ajudando a formar os solos."},{"q":"Uma planície é uma forma de relevo:","options":["elevada, onde predomina a erosão","plana, onde predomina a deposição","muito alta e pontiaguda","sempre abaixo do nível do mar"],"answer":1,"explain":"As planícies se formam pelo depósito de sedimentos trazidos pelos rios, mar ou vento."},{"q":"Um planalto é uma forma de relevo:","options":["sempre coberta por gelo","formada apenas por areia","elevada, onde predomina o desgaste (erosão)","onde predomina a deposição de sedimentos"],"answer":2,"explain":"Nos planaltos, os agentes externos mais desgastam do que depositam materiais."},{"q":"Qual é o ponto mais alto do Brasil?","options":["Pão de Açúcar","Monte Roraima","Pico da Neblina","Pico da Bandeira"],"answer":2,"explain":"O Pico da Neblina fica no Amazonas, perto da fronteira com a Venezuela, com quase 3.000 metros de altitude."},{"q":"O solo se forma principalmente:","options":["pelo derretimento do gelo","pela queda de meteoritos","pela evaporação dos oceanos","pela decomposição das rochas e matéria orgânica"],"answer":3,"explain":"O intemperismo transforma as rochas em partículas, e os restos de seres vivos formam o húmus."},{"q":"O desmatamento deixa o solo mais exposto e pode aumentar:","options":["a infiltração da água","a erosão","a quantidade de florestas","a fertilidade imediata"],"answer":1,"explain":"Sem a vegetação, a chuva bate direto no solo e arrasta suas partículas."},{"q":"O assoreamento de um rio é:","options":["a limpeza natural da água","a construção de pontes","o acúmulo de sedimentos no fundo do rio","o aumento da profundidade do rio"],"answer":2,"explain":"A terra levada pela erosão se deposita no leito, o que pode causar enchentes."},{"q":"A terra roxa, solo muito fértil encontrado em partes do Sul e do Sudeste do Brasil, se originou da decomposição de qual rocha?","options":["basalto","calcário","arenito","mármore"],"answer":0,"explain":"O basalto, rocha rica em ferro, ao se decompor dá origem a um solo avermelhado e fértil."},{"q":"Uma depressão absoluta é uma área:","options":["no topo de uma montanha","acima de 3.000 metros","coberta por gelo","abaixo do nível do mar"],"answer":3,"explain":"Um exemplo é a região do Mar Morto, que fica centenas de metros abaixo do nível do mar."}]},{"id":"6-geo-hidrografia","name":"Hidrografia e bacias hidrográficas","desc":"Entender o ciclo da água, as partes de um rio, as bacias hidrográficas do Brasil e os usos da água.","questions":[{"q":"Quais etapas fazem parte do ciclo da água?","options":["erosão, vulcanismo e terremotos","fotossíntese, digestão e respiração","rotação, translação e inclinação","evaporação, condensação, precipitação e infiltração"],"answer":3,"explain":"A água evapora, forma nuvens (condensação), cai como chuva (precipitação) e parte dela penetra no solo (infiltração)."},{"q":"Uma bacia hidrográfica é:","options":["um lago artificial","o ponto onde o rio nasce","a área drenada por um rio e seus afluentes","um tipo de represa"],"answer":2,"explain":"Toda a água da chuva que cai em uma bacia escoa para o mesmo rio principal."},{"q":"Um afluente é:","options":["o lugar onde o rio termina","o lugar onde o rio nasce","a margem de um rio","um rio que deságua em outro rio maior"],"answer":3,"explain":"Os afluentes levam suas águas para o rio principal."},{"q":"O lugar onde um rio nasce chama-se:","options":["nascente","afluente","foz","leito"],"answer":0,"explain":"A nascente é o início do rio, e a foz é onde ele termina, em outro rio, lago ou no mar."},{"q":"Qual é a maior bacia hidrográfica do mundo em área?","options":["Bacia do Nilo","Bacia Amazônica","Bacia do São Francisco","Bacia do Paraná"],"answer":1,"explain":"A Bacia Amazônica ocupa vários países da América do Sul e tem o rio com maior volume de água do planeta."},{"q":"O Rio São Francisco, chamado de “Velho Chico”, nasce em qual estado?","options":["São Paulo","Pernambuco","Bahia","Minas Gerais"],"answer":3,"explain":"Ele nasce na Serra da Canastra, em Minas Gerais, e atravessa o sertão nordestino até o oceano Atlântico."},{"q":"A Bacia do Paraná se destaca pelo grande aproveitamento:","options":["para gerar energia hidrelétrica","para criação de peixes de água salgada","para extração de petróleo","para mineração de ouro"],"answer":0,"explain":"Os rios dessa bacia têm muitos desníveis e abastecem regiões muito populosas, por isso tem muitas usinas."},{"q":"Por que nas cidades a água da chuva escoa mais pela superfície e causa enchentes com mais facilidade?","options":["porque a água evapora mais devagar no asfalto","porque chove menos nas cidades","porque o asfalto e o concreto impedem a infiltração da água no solo","porque as cidades têm mais florestas"],"answer":2,"explain":"Com o solo impermeabilizado, a água corre rapidamente para os rios e bueiros, que podem transbordar."},{"q":"Em uma área com vegetação, comparada a uma área asfaltada, a infiltração da água da chuva no solo é:","options":["maior","menor","igual a zero","impossível"],"answer":0,"explain":"As plantas e o solo sem asfalto deixam a água penetrar no chão e abastecer as águas subterrâneas."},{"q":"O Aquífero Guarani é:","options":["uma cachoeira famosa","um rio que corta a Amazônia","uma grande reserva de água subterrânea","uma represa artificial"],"answer":2,"explain":"Ele fica sob o solo de partes do Brasil, Argentina, Paraguai e Uruguai."},{"q":"No Brasil, qual atividade é a que mais consome água?","options":["o uso nas escolas","o uso em hospitais","a irrigação na agricultura","a lavagem de carros"],"answer":2,"explain":"A maior parte da água retirada dos rios e aquíferos no Brasil vai para a irrigação de plantações."},{"q":"A mata ciliar, vegetação que cresce às margens dos rios, é importante porque:","options":["impede a chuva de cair","protege as margens contra a erosão","aumenta a poluição do rio","faz o rio secar"],"answer":1,"explain":"Assim como os cílios protegem os olhos, a mata ciliar protege os rios."},{"q":"Rios que secam em parte do ano, comuns no Sertão nordestino, são chamados de:","options":["perenes","oceânicos","subterrâneos","temporários (intermitentes)"],"answer":3,"explain":"No semiárido, as chuvas são concentradas em poucos meses, e muitos rios secam no período de estiagem."},{"q":"O lugar onde um rio deságua, terminando seu percurso, chama-se:","options":["nascente","foz","cabeceira","afluente"],"answer":1,"explain":"A foz pode ser no mar, em um lago ou em outro rio."}]},{"id":"6-geo-clima-tempo","name":"Clima e tempo atmosférico","desc":"Diferenciar tempo e clima, conhecer elementos e fatores climáticos, os climas do Brasil e as ilhas de calor.","questions":[{"q":"Qual é a diferença entre tempo e clima?","options":["tempo só existe nos dias de chuva","tempo e clima são a mesma coisa","tempo é o momento; clima é o padrão de muitos anos","clima muda de hora em hora; tempo dura séculos"],"answer":2,"explain":"Para conhecer o clima, são necessários registros de muitos anos. O tempo pode mudar em poucas horas."},{"q":"A frase “Hoje está chovendo e faz frio” fala sobre:","options":["o tempo atmosférico","o clima","a hidrografia","o relevo"],"answer":0,"explain":"A frase descreve a condição do momento, então se refere ao tempo."},{"q":"A frase “No Sertão nordestino, as chuvas são escassas e irregulares ao longo dos anos” fala sobre:","options":["o fuso horário","o clima","o tempo atmosférico","a vegetação apenas"],"answer":1,"explain":"A frase descreve um padrão de muitos anos, ou seja, o clima da região."},{"q":"Qual destes é um fator que influencia o clima de um lugar?","options":["o número de habitantes de uma escola","o horário do almoço","a altitude","a cor das casas"],"answer":2,"explain":"Altitude, latitude, proximidade do mar, relevo e massas de ar são fatores do clima."},{"q":"Em geral, o que acontece com a temperatura à medida que a altitude aumenta?","options":["aumenta","diminui","dobra a cada metro","fica igual"],"answer":1,"explain":"Por isso cidades em serras e montanhas costumam ser mais frias."},{"q":"Cidades próximas ao mar costumam ter:","options":["menor diferença entre as temperaturas do dia e da noite","nenhuma umidade","maior diferença entre as temperaturas do dia e da noite","neve todos os dias"],"answer":0,"explain":"A água do mar esquenta e esfria devagar, deixando a temperatura mais estável. Isso é a maritimidade."},{"q":"Qual instrumento mede a quantidade de chuva?","options":["anemômetro","termômetro","barômetro","pluviômetro"],"answer":3,"explain":"O pluviômetro recolhe a água da chuva e mede quantos milímetros choveu."},{"q":"Qual instrumento mede a pressão atmosférica?","options":["termômetro","pluviômetro","bússola","barômetro"],"answer":3,"explain":"O barômetro indica a pressão do ar, que ajuda na previsão do tempo."},{"q":"Qual clima predomina no Sertão nordestino?","options":["semiárido","subtropical","equatorial","polar"],"answer":0,"explain":"O clima semiárido é quente e tem chuvas escassas e mal distribuídas."},{"q":"Qual clima predomina na Amazônia, quente e úmido, com chuvas abundantes?","options":["semiárido","subtropical","equatorial","temperado"],"answer":2,"explain":"A região amazônica fica perto da Linha do Equador e recebe muita chuva."},{"q":"Qual clima predomina na Região Sul do Brasil, com invernos mais frios e geadas?","options":["tropical úmido","equatorial","subtropical","semiárido"],"answer":2,"explain":"Quase toda a Região Sul fica ao sul do Trópico de Capricórnio, por isso tem invernos mais frios e as estações do ano bem marcadas."},{"q":"As ilhas de calor são áreas dos centros urbanos mais quentes que o seu entorno por causa:","options":["do excesso de asfalto e concreto","da proximidade com geleiras","dos rios limpos","do excesso de florestas"],"answer":0,"explain":"Asfalto e concreto absorvem muito calor, e a pouca vegetação diminui o frescor."},{"q":"Em um dia, a temperatura máxima foi de 31 °C e a mínima de 18 °C. Qual foi a amplitude térmica?","options":["31 °C","49 °C","18 °C","13 °C"],"answer":3,"explain":"Amplitude térmica é a diferença entre a máxima e a mínima: 31 − 18 = 13 °C."},{"q":"O efeito estufa é um fenômeno que:","options":["foi inventado no século XXI","é natural, mas está sendo intensificado","esfria o planeta todo","só existe em estufas de plantas"],"answer":1,"explain":"Sem o efeito estufa a Terra seria gelada. O problema é o excesso de gases lançados pelas atividades humanas."}]},{"id":"6-geo-biomas-brasileiros","name":"Vegetação e biomas brasileiros","desc":"Conhecer os seis biomas do Brasil, relacionar vegetação e clima e entender a importância da biodiversidade.","questions":[{"q":"Quantos biomas continentais o Brasil possui, segundo o IBGE?","options":["3","10","4","6"],"answer":3,"explain":"São eles: Amazônia, Cerrado, Caatinga, Mata Atlântica, Pantanal e Pampa."},{"q":"Qual é o maior bioma brasileiro em área?","options":["Amazônia","Cerrado","Mata Atlântica","Pantanal"],"answer":0,"explain":"A Amazônia ocupa cerca de metade do território brasileiro."},{"q":"Qual bioma existe somente no Brasil?","options":["Amazônia","Caatinga","Pantanal","Pampa"],"answer":1,"explain":"A Caatinga ocorre apenas em território brasileiro, principalmente no Nordeste."},{"q":"Qual bioma tem árvores de troncos retorcidos e casca grossa e é chamado de “berço das águas”?","options":["Mata Atlântica","Cerrado","Amazônia","Pampa"],"answer":1,"explain":"No Cerrado nascem rios que abastecem várias bacias hidrográficas do Brasil."},{"q":"Qual bioma é uma grande planície que fica alagada em parte do ano?","options":["Caatinga","Pampa","Cerrado","Pantanal"],"answer":3,"explain":"No período das chuvas, os rios transbordam e alagam grandes áreas do Pantanal."},{"q":"Qual bioma brasileiro foi o mais devastado, restando apenas uma pequena parte da vegetação original?","options":["Mata Atlântica","Pantanal","Amazônia","Pampa"],"answer":0,"explain":"A Mata Atlântica ocupa a região litorânea, onde se concentram as maiores cidades desde a colonização."},{"q":"O Pampa, formado principalmente por campos com vegetação rasteira, fica em qual estado brasileiro?","options":["Goiás","Amazonas","Rio Grande do Sul","Bahia"],"answer":2,"explain":"O Pampa ocupa grande parte do Rio Grande do Sul e se estende pelo Uruguai e pela Argentina."},{"q":"Na Caatinga, muitas plantas perdem as folhas na época seca. Por que isso acontece?","options":["porque recebem chuva demais","para perder menos água","porque estão sempre doentes","por causa da neve"],"answer":1,"explain":"Sem as folhas, a planta transpira menos e consegue sobreviver à seca. Cactos como o mandacaru também guardam água."},{"q":"Biodiversidade significa:","options":["a variedade de seres vivos existentes em um lugar","o número de cidades de uma região","a quantidade de rios de um país","o tipo de solo de uma área"],"answer":0,"explain":"Quanto mais espécies diferentes vivem em um lugar, maior é a sua biodiversidade."},{"q":"Qual é uma das principais ameaças à biodiversidade dos biomas brasileiros?","options":["o desmatamento","o plantio de mudas nativas","a reciclagem","a criação de parques nacionais"],"answer":0,"explain":"O desmatamento destrói o habitat de muitos animais e plantas."},{"q":"O manguezal é um ecossistema que fica:","options":["nas regiões polares","no litoral, onde rio e mar se encontram","no alto das montanhas","no meio do deserto"],"answer":1,"explain":"O mangue é considerado um berçário, pois muitas espécies marinhas se reproduzem ali."},{"q":"A floresta Amazônica é exuberante e muito densa principalmente porque a região tem:","options":["clima quente e muito chuvoso","chuvas raras","clima frio e seco","neve durante o ano"],"answer":0,"explain":"O calor e a muita umidade favorecem o crescimento de uma vegetação densa e variada."},{"q":"A Mata de Araucárias, com o pinheiro-do-paraná, é encontrada principalmente em qual região do Brasil?","options":["Sul","Centro-Oeste","Norte","Nordeste"],"answer":0,"explain":"As araucárias se adaptam ao clima mais frio das áreas altas do Sul."},{"q":"Unidades de conservação, como os parques nacionais, são criadas para:","options":["aumentar o desmatamento","proteger a natureza e a biodiversidade","abrir novas plantações","construir indústrias"],"answer":1,"explain":"Essas áreas têm regras especiais para preservar paisagens, plantas e animais."}]},{"id":"6-geo-atividades-economicas","name":"Atividades econômicas e transformação do espaço","desc":"Conhecer os setores da economia, as técnicas de uso do solo e da água e como campo e cidade transformam a natureza.","questions":[{"q":"Agricultura, pecuária e extrativismo fazem parte de qual setor da economia?","options":["setor terciário","setor industrial","setor secundário","setor primário"],"answer":3,"explain":"O setor primário obtém produtos diretamente da natureza."},{"q":"Uma fábrica que transforma algodão em tecido pertence a qual setor da economia?","options":["setor primário","setor extrativista","setor secundário","setor terciário"],"answer":2,"explain":"O setor secundário é o da indústria, que transforma matérias-primas em produtos."},{"q":"Comércio, transporte, educação e saúde fazem parte de qual setor da economia?","options":["setor secundário","setor terciário","setor agrícola","setor primário"],"answer":1,"explain":"O setor terciário reúne o comércio e a prestação de serviços."},{"q":"A rotação de culturas é uma técnica que consiste em:","options":["plantar sempre o mesmo produto no mesmo lugar","girar as plantas em vasos","queimar o solo depois da colheita","alternar as plantações em uma mesma área"],"answer":3,"explain":"Plantas diferentes usam nutrientes diferentes, e a alternância ajuda a manter o solo fértil."},{"q":"O terraceamento, que forma degraus nas encostas, tem como principal objetivo:","options":["secar os rios","facilitar o desmatamento","aumentar a velocidade da água da chuva","diminuir a erosão em terrenos inclinados"],"answer":3,"explain":"Os degraus seguram a água e o solo, evitando que a chuva arraste a terra morro abaixo."},{"q":"Qual é uma vantagem da irrigação na agricultura?","options":["acabar com a necessidade de solo","impedir o crescimento das plantas","economizar toda a água dos rios","permitir plantar onde chove pouco"],"answer":3,"explain":"Por outro lado, a irrigação consome muita água e, mal feita, pode prejudicar o solo."},{"q":"Qual é a diferença entre um aterro sanitário e um lixão?","options":["o lixão é mais seguro para o ambiente","o aterro tem proteção do solo; o lixão não","no aterro o lixo fica a céu aberto","não há nenhuma diferença"],"answer":1,"explain":"No lixão o lixo fica exposto e contamina o solo e a água. O aterro sanitário tem técnicas de proteção."},{"q":"A Revolução Industrial provocou uma grande mudança no espaço porque:","options":["atraiu pessoas do campo para as cidades","impediu o uso de máquinas","fez as cidades desaparecerem","acabou com o comércio"],"answer":0,"explain":"Com as indústrias, as cidades cresceram rapidamente e a urbanização aumentou."},{"q":"O êxodo rural é:","options":["a viagem de turistas para a praia","a mudança de pessoas da cidade para o campo","a saída de pessoas do campo para morar nas cidades","a exportação de alimentos"],"answer":2,"explain":"Muitas pessoas deixam o campo em busca de emprego e serviços nas cidades."},{"q":"Na pecuária extensiva, o gado é criado:","options":["confinado em pequenos espaços, com muita tecnologia","solto em grandes áreas de pasto, com pouca tecnologia","apenas em aquários","dentro de casas"],"answer":1,"explain":"A pecuária extensiva ocupa muita terra. Na intensiva, os animais ficam confinados e recebem ração e cuidados especiais."},{"q":"A coleta de castanha-do-pará e de látex na floresta é um exemplo de:","options":["comércio eletrônico","extrativismo vegetal","pecuária intensiva","indústria de transformação"],"answer":1,"explain":"O extrativismo retira produtos da natureza. Quando feito com cuidado, pode manter a floresta em pé."},{"q":"A monocultura é:","options":["o cultivo de um único produto em grandes áreas","a criação de animais soltos","a venda de produtos em feiras","o cultivo de muitos produtos diferentes na mesma área"],"answer":0,"explain":"Exemplos de monocultura são grandes plantações de soja ou de cana-de-açúcar."},{"q":"As primeiras cidades da história surgiram, em grande parte, graças:","options":["às grandes navegações","à invenção dos automóveis","à criação da internet","ao desenvolvimento da agricultura"],"answer":3,"explain":"Com a agricultura, foi possível produzir mais alimentos e viver em um mesmo local."},{"q":"A agricultura familiar no Brasil caracteriza-se por:","options":["pequenas propriedades trabalhadas pela família","enormes fazendas voltadas à exportação","grandes redes de supermercados","fábricas dentro das cidades"],"answer":0,"explain":"Muitos alimentos que chegam à nossa mesa, como feijão, mandioca e verduras, vêm da agricultura familiar."}]}]},{"id":"ing","name":"Língua Inglesa","topics":[{"id":"6-ing-saudacoes-sala-de-aula","name":"Saudações, apresentações e comandos da sala de aula","desc":"Cumprimentar, se apresentar e entender instruções e pedidos usados na sala de aula, inclusive no imperativo.","questions":[{"q":"Em inglês, “Good morning” é usado para cumprimentar alguém:","options":["à noite, na hora de dormir","só no fim de semana","à ta
