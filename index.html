rde","de manhã"],"answer":3,"explain":"“Good morning” significa “bom dia” e é usado pela manhã."},{"q":"Ao chegar a uma festa às 20h, qual expressão em inglês é usada para cumprimentar as pessoas?","options":["Good morning","Good night","Good evening","Good afternoon"],"answer":2,"explain":"“Good evening” cumprimenta à noite. “Good night” é usado para se despedir ou na hora de dormir."},{"q":"Qual é uma boa resposta para a pergunta “How are you?”","options":["I'm from Brazil.","My name is Lucas.","I'm fine, thank you.","I'm eleven years old."],"answer":2,"explain":"“How are you?” significa “Como você está?”, e “I'm fine, thank you” quer dizer “Estou bem, obrigado”."},{"q":"Qual é a resposta adequada para “What's your name?”","options":["I'm fine, thanks.","Nice to meet you, too.","I'm twelve.","My name is Ana."],"answer":3,"explain":"“What's your name?” pergunta o nome da pessoa: “Qual é o seu nome?”."},{"q":"O que significa “Nice to meet you”?","options":["Com licença.","Prazer em conhecer você.","Boa sorte.","Até amanhã."],"answer":1,"explain":"Essa expressão é usada quando conhecemos alguém pela primeira vez."},{"q":"O que significa “See you later”?","options":["Bom dia.","Muito obrigado.","Desculpe.","Até mais tarde."],"answer":3,"explain":"“See you later” é uma forma de se despedir de quem vamos ver de novo em breve."},{"q":"Qual é a resposta correta para “How old are you?”","options":["I'm eleven years old.","I'm a student.","I'm fine.","I'm from Recife."],"answer":0,"explain":"“How old are you?” pergunta a idade: “Quantos anos você tem?”."},{"q":"Qual é a resposta adequada para “Where are you from?”","options":["I'm happy.","My name is João.","I'm ten years old.","I'm from Brazil."],"answer":3,"explain":"“Where are you from?” significa “De onde você é?”."},{"q":"O que a professora pede quando diz “Open your books”?","options":["Leiam em voz alta.","Abram seus livros.","Fechem seus livros.","Guardem seus cadernos."],"answer":1,"explain":"“Open” significa abrir e “books”, livros. É uma frase no imperativo, usada para dar instruções."},{"q":"O que significa “Sit down, please”?","options":["Venha aqui, por favor.","Levante-se, por favor.","Fique quieto, por favor.","Sente-se, por favor."],"answer":3,"explain":"“Sit down” é sentar-se. O contrário é “Stand up” (levante-se)."},{"q":"Como se diz “Não fale alto” em inglês?","options":["Not speak loudly.","Don't speak loudly.","No speaks loudly.","Doesn't speak loudly."],"answer":1,"explain":"O imperativo negativo em inglês começa com “Don't” seguido do verbo: “Don't speak”."},{"q":"Como pedir em inglês para ir ao banheiro durante a aula?","options":["Where are you from?","How old are you?","Can I go to the bathroom?","Can you open the door?"],"answer":2,"explain":"“Can I go to the bathroom?” significa “Posso ir ao banheiro?”."},{"q":"Qual expressão é usada para pedir licença ou chamar a atenção de alguém com educação?","options":["Good night.","Excuse me.","Happy birthday.","Welcome."],"answer":1,"explain":"“Excuse me” significa “com licença”."},{"q":"Como perguntar em inglês como se diz “caderno”?","options":["What time is it?","How old is the notebook?","How do you say “caderno” in English?","Where is the notebook from?"],"answer":2,"explain":"Essa frase é muito útil na sala de aula para aprender palavras novas."},{"q":"O que a professora quer quando diz “Listen and repeat”?","options":["Leia e escreva.","Desenhe e pinte.","Ouça e repita.","Sente e espere."],"answer":2,"explain":"“Listen” é ouvir e “repeat” é repetir. As duas palavras estão no imperativo."}]},{"id":"6-ing-verbo-to-be-pronomes","name":"Verbo to be e pronomes pessoais","desc":"Usar o verbo to be (am, is, are) nas formas afirmativa, negativa e interrogativa e os pronomes pessoais.","questions":[{"q":"Complete: “She ___ a teacher.”","options":["are","is","be","am"],"answer":1,"explain":"Com “he”, “she” e “it” usamos “is”: “She is a teacher” (Ela é professora)."},{"q":"Complete: “They ___ my friends.”","options":["is","be","are","am"],"answer":2,"explain":"Com “they”, “we” e “you” usamos “are”: “They are my friends”."},{"q":"Complete: “I ___ eleven years old.”","options":["am","be","is","are"],"answer":0,"explain":"Com “I” usamos sempre “am”: “I am eleven years old” (Eu tenho onze anos)."},{"q":"Qual pronome substitui “Paulo” em inglês?","options":["She","It","They","He"],"answer":3,"explain":"Paulo é um menino, então usamos “he” (ele)."},{"q":"Qual pronome é usado em inglês para falar de um objeto, como “the table”?","options":["He","We","It","She"],"answer":2,"explain":"“It” é usado para objetos, animais (em geral) e coisas."},{"q":"Qual pronome substitui “Ana and I” em inglês?","options":["We","She","They","You"],"answer":0,"explain":"“Ana e eu” equivale a “nós”, que em inglês é “we”."},{"q":"Qual é a forma contraída de “He is not hungry”?","options":["He aren't hungry.","He not is hungry.","He isn't hungry.","He amn't hungry."],"answer":2,"explain":"“Is not” pode ser contraído para “isn't”."},{"q":"Qual é a forma interrogativa de “You are happy”?","options":["Is you happy?","Do you are happy?","Are you happy?","You are happy?"],"answer":2,"explain":"Para perguntar com o verbo to be, colocamos o verbo antes do sujeito: “Are you happy?”."},{"q":"Qual é a resposta curta afirmativa para “Is she Brazilian?”","options":["Yes, she am.","Yes, she does.","Yes, she are.","Yes, she is."],"answer":3,"explain":"Na resposta curta repetimos o pronome e o verbo da pergunta: “Yes, she is”."},{"q":"A palavra “you” em inglês pode significar:","options":["ele ou ela","você ou vocês","nós","eles"],"answer":1,"explain":"Em inglês, “you” é usado tanto para uma pessoa quanto para várias."},{"q":"Complete: “We ___ not at home.”","options":["are","is","am","be"],"answer":0,"explain":"Com “we” usamos “are”: “We are not at home” (Nós não estamos em casa)."},{"q":"A forma “It's” é a contração de:","options":["It are","It was","Its","It is"],"answer":3,"explain":"“It's” = “it is”. Não confunda com “its” (dele, dela, para coisas e animais)."},{"q":"Complete: “The books ___ on the table.”","options":["be","are","is","am"],"answer":1,"explain":"“The books” está no plural e equivale a “they”, então usamos “are”."},{"q":"Complete: “My mother ___ a doctor.”","options":["are","am","is","be"],"answer":2,"explain":"“My mother” equivale a “she”, então usamos “is”."},{"q":"A forma “I'm” é a contração de:","options":["I have","I is","I are","I am"],"answer":3,"explain":"“I'm” = “I am” (eu sou ou eu estou)."}]},{"id":"6-ing-possessivos-genitivo","name":"Adjetivos possessivos e caso genitivo ('s)","desc":"Indicar posse com my, your, his, her, its, our, their e com o apóstrofo seguido de s.","questions":[{"q":"Complete: “This is ___ book.” (o livro é meu)","options":["your","his","my","their"],"answer":2,"explain":"“My” significa “meu” ou “minha”."},{"q":"Qual é o adjetivo possessivo correspondente a “she”?","options":["his","their","her","its"],"answer":2,"explain":"“Her” significa “dela”: “her bag” é a bolsa dela."},{"q":"Qual é o adjetivo possessivo correspondente a “he”?","options":["his","its","her","our"],"answer":0,"explain":"“His” significa “dele”: “his car” é o carro dele."},{"q":"Qual é o adjetivo possessivo correspondente a “they”?","options":["them","there","their","they're"],"answer":2,"explain":"“Their” significa “deles” ou “delas”. “There” (lá) e “they're” (eles são) soam parecido, mas são outras palavras."},{"q":"Qual é o adjetivo possessivo correspondente a “we”?","options":["we","your","our","us"],"answer":2,"explain":"“Our” significa “nosso” ou “nossa”: “our school” é a nossa escola."},{"q":"Complete: “The tree lost ___ leaves.” (a árvore perdeu suas folhas)","options":["it","our","its","it's"],"answer":2,"explain":"“Its” é o possessivo usado para coisas e plantas. “It's” é a contração de “it is”."},{"q":"Como se diz “o carro do Pedro” em inglês?","options":["car's Pedro","Pedro's car","Pedro car's","the car Pedro"],"answer":1,"explain":"Usamos o nome do dono + 's + o objeto: “Pedro's car”."},{"q":"Como se diz “a bicicleta da minha irmã” em inglês?","options":["my sister's bike","my bike's sister","my sisters bike's","the sister my bike"],"answer":0,"explain":"O dono vem primeiro com 's: “my sister's”, e depois a coisa possuída: “bike”."},{"q":"O que significa “my parents' house”?","options":["a casa dos meus parentes","minha casa e meus pais","a casa dos meus pais","os pais da minha casa"],"answer":2,"explain":"“Parents” significa pais. Quando o dono está no plural terminado em s, colocamos só o apóstrofo: “parents'”."},{"q":"A palavra “Whose”, como em “Whose pen is this?”, pergunta:","options":["quando algo aconteceu","quantos objetos existem","onde está algo","de quem é algo"],"answer":3,"explain":"“Whose pen is this?” significa “De quem é esta caneta?”."},{"q":"Complete: “Lucas and ___ brother play soccer.” (o irmão do Lucas)","options":["our","his","its","her"],"answer":1,"explain":"Lucas é um menino, então usamos “his” (dele)."},{"q":"Complete: “Maria loves ___ dog.” (o cachorro da Maria)","options":["his","her","its","their"],"answer":1,"explain":"Maria é uma menina, então usamos “her” (dela)."},{"q":"O que significa a frase “John's bag is blue”?","options":["A mochila azul está com John agora.","John tem uma mochila verde.","John é uma mochila azul.","A mochila do John é azul."],"answer":3,"explain":"Aqui o 's indica posse: “John's bag” é a mochila do John."},{"q":"Complete: “We love ___ school.”","options":["his","their","my","our"],"answer":3,"explain":"Com “we” usamos “our”: “We love our school” (Nós amamos a nossa escola)."},{"q":"Responda: “Is this your pen?” — “Yes, it's ___ pen.”","options":["my","your","her","their"],"answer":0,"explain":"A pergunta é “É a sua caneta?”. Respondendo sobre si mesmo, dizemos “my pen” (minha caneta)."}]},{"id":"6-ing-numeros-cores-datas","name":"Números, cores, dias da semana e meses","desc":"Reconhecer números, cores, dias da semana, meses e números ordinais em inglês.","questions":[{"q":"Como se escreve o número 15 em inglês?","options":["fifty","five","fifteen","fiveteen"],"answer":2,"explain":"15 é “fifteen”. Cuidado para não confundir com “fifty”, que é 50."},{"q":"Como se escreve o número 50 em inglês?","options":["fifty","fivety","fifteen","five"],"answer":0,"explain":"50 é “fifty”. As dezenas terminam em “-ty”: twenty, thirty, forty, fifty."},{"q":"Como se escreve o número 12 em inglês?","options":["two","twenty","twelve","eleven"],"answer":2,"explain":"12 é “twelve”. 11 é “eleven” e 20 é “twenty”."},{"q":"Como se escreve o número 100 em inglês?","options":["ten","one hundred","one thousand","one million"],"answer":1,"explain":"100 é “one hundred”. “One thousand” é 1.000."},{"q":"Qual número é “thirty-four”?","options":["304","34","14","43"],"answer":1,"explain":"“Thirty” é 30 e “four” é 4: 30 + 4 = 34."},{"q":"Qual é a cor “yellow”?","options":["amarelo","verde","azul","vermelho"],"answer":0,"explain":"“Yellow” é amarelo, como a cor do sol nos desenhos."},{"q":"Como se diz “verde” em inglês?","options":["brown","gray","blue","green"],"answer":3,"explain":"Verde é “green”. “Gray” é cinza, “blue” é azul e “brown” é marrom."},{"q":"Qual é a cor “purple”?","options":["rosa","roxo","preto","laranja"],"answer":1,"explain":"“Purple” é roxo. Rosa é “pink” e laranja é “orange”."},{"q":"Qual dia da semana é “Wednesday”?","options":["sexta-feira","segunda-feira","domingo","quarta-feira"],"answer":3,"explain":"Os dias são: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday e Sunday. Wednesday é quarta-feira."},{"q":"Como se diz “sábado” em inglês?","options":["Sunday","Thursday","Tuesday","Saturday"],"answer":3,"explain":"Sábado é “Saturday” e domingo é “Sunday”. Em inglês, os dias da semana são escritos com letra maiúscula."},{"q":"Qual mês é “December”?","options":["novembro","dezembro","outubro","setembro"],"answer":1,"explain":"“December” é dezembro, o último mês do ano."},{"q":"Como se diz “abril” em inglês?","options":["Avril","April","August","May"],"answer":1,"explain":"Abril é “April”. Agosto é “August” e maio é “May”."},{"q":"O que significa “first”?","options":["um","quinto","primeiro","último"],"answer":2,"explain":"“First” é o número ordinal “primeiro”. Depois vêm “second” (segundo) e “third” (terceiro)."},{"q":"Qual é uma boa resposta para a pergunta “What color is a ripe banana?”","options":["It's blue.","It's purple.","It's black and white.","It's yellow."],"answer":3,"explain":"A pergunta é “De que cor é uma banana madura?”, e a resposta é “It's yellow” (É amarela)."},{"q":"O que significa a pergunta “What time is it?”","options":["Que horas são?","Qual é a sua cor favorita?","Quantos anos você tem?","Que dia é hoje?"],"answer":0,"explain":"“Time” aqui significa hora. A pergunta serve para saber as horas."}]},{"id":"6-ing-familia-escola","name":"Família e escola","desc":"Ampliar o vocabulário sobre membros da família, objetos escolares, matérias e lugares da escola.","questions":[{"q":"Como se diz “irmã” em inglês?","options":["sister","cousin","mother","brother"],"answer":0,"explain":"Irmã é “sister” e irmão é “brother”."},{"q":"Como se diz “avô” em inglês?","options":["grandfather","grandmother","father","uncle"],"answer":0,"explain":"Avô é “grandfather” e avó é “grandmother”."},{"q":"O que significa “aunt”?","options":["tio","tia","avó","prima"],"answer":1,"explain":"“Aunt” é tia e “uncle” é tio."},{"q":"O que significa “cousin”?","options":["sobrinho","irmão","vizinho","primo ou prima"],"answer":3,"explain":"Em inglês, “cousin” serve tanto para primo quanto para prima."},{"q":"Complete: “My father's brother is my ___.”","options":["aunt","cousin","grandfather","uncle"],"answer":3,"explain":"O irmão do meu pai é meu tio: “uncle”."},{"q":"Complete: “My mother's mother is my ___.”","options":["daughter","aunt","sister","grandmother"],"answer":3,"explain":"A mãe da minha mãe é minha avó: “grandmother”."},{"q":"O que significa a palavra “parents”?","options":["parentes","professores","padrinhos","pais (o pai e a mãe)"],"answer":3,"explain":"“Parents” parece “parentes”, mas significa pai e mãe. Parentes, em inglês, é “relatives”."},{"q":"O que significa “eraser”?","options":["lápis","borracha","estojo","régua"],"answer":1,"explain":"“Eraser” é a borracha que usamos para apagar."},{"q":"Como se diz “régua” em inglês?","options":["glue","pencil","ruler","scissors"],"answer":2,"explain":"Régua é “ruler”. “Pencil” é lápis, “scissors” é tesoura e “glue” é cola."},{"q":"O que significa “backpack”?","options":["quadro","mochila","caderno","carteira escolar"],"answer":1,"explain":"“Backpack” é a mochila, que carregamos nas costas (“back”)."},{"q":"O que significa “teacher”?","options":["livro","diretor","professor ou professora","aluno"],"answer":2,"explain":"“Teacher” é quem ensina. Aluno é “student”."},{"q":"Como se diz “Geografia” em inglês?","options":["Math","Geography","Science","History"],"answer":1,"explain":"Geografia é “Geography”. História é “History”, Ciências é “Science” e Matemática é “Math”."},{"q":"O que significa “library”?","options":["biblioteca","livraria","lanchonete","laboratório"],"answer":0,"explain":"“Library” parece “livraria”, mas significa biblioteca. Livraria, em inglês, é “bookstore”."},{"q":"O que significa “classroom”?","options":["pátio","sala de aula","quadra","banheiro"],"answer":1,"explain":"“Class” é aula ou turma e “room” é sala: “classroom”."}]},{"id":"6-ing-casa-comida-animais","name":"Casa, comida e animais","desc":"Aprender palavras em inglês sobre cômodos da casa, alimentos, refeições e animais.","questions":[{"q":"O que significa “kitchen”?","options":["banheiro","garagem","quarto","cozinha"],"answer":3,"explain":"“Kitchen” é a cozinha, onde preparamos as refeições."},{"q":"Como se diz “quarto” (cômodo onde dormimos) em inglês?","options":["bathroom","bedroom","living room","kitchen"],"answer":1,"explain":"“Bed” é cama e “room” é cômodo: “bedroom” é o quarto."},{"q":"O que significa “bathroom”?","options":["sala de jantar","quintal","escritório","banheiro"],"answer":3,"explain":"“Bath” é banho: “bathroom” é o banheiro."},{"q":"O que significa “living room”?","options":["cozinha","sala de estar","lavanderia","sótão"],"answer":1,"explain":"“Living room” é a sala de estar, onde a família costuma se reunir."},{"q":"O que significa “bread”?","options":["manteiga","pão","bolo","queijo"],"answer":1,"explain":"“Bread” é pão. Manteiga é “butter” e queijo é “cheese”."},{"q":"Como se diz “leite” em inglês?","options":["meat","milk","water","milkshake"],"answer":1,"explain":"Leite é “milk”. “Meat” é carne."},{"q":"O que significa “apple”?","options":["abacaxi","uva","laranja","maçã"],"answer":3,"explain":"“Apple” é maçã. Uva é “grape” e laranja é “orange”."},{"q":"O que significa “breakfast”?","options":["almoço","café da manhã","jantar","lanche da tarde"],"answer":1,"explain":"“Breakfast” é a primeira refeição do dia. Almoço é “lunch” e jantar é “dinner”."},{"q":"Como se diz “almoço” em inglês?","options":["snack","lunch","breakfast","dinner"],"answer":1,"explain":"Almoço é “lunch”. Lanche é “snack”."},{"q":"O que significa “horse”?","options":["vaca","cavalo","porco","casa"],"answer":1,"explain":"“Horse” é cavalo. Cuidado: casa é “house”, que tem som parecido."},{"q":"Como se diz “pássaro” em inglês?","options":["bird","bee","bat","bear"],"answer":0,"explain":"Pássaro é “bird”. “Bear” é urso, “bee” é abelha e “bat” é morcego."},{"q":"O que significa “cow”?","options":["vaca","galinha","gato","ovelha"],"answer":0,"explain":"“Cow” é vaca. Gato é “cat”, galinha é “chicken” ou “hen” e ovelha é “sheep”."},{"q":"Como se diz “Eu gosto de suco de laranja” em inglês?","options":["I like orange juice.","I am like orange juice.","I likes orange juice.","I like juice orange."],"answer":0,"explain":"Em inglês, a palavra que especifica vem antes: “orange juice” (suco de laranja). Com “I”, o verbo fica “like”, sem “s”."},{"q":"Qual é o plural de “mouse” (rato)?","options":["mousies","mice","mouses","mices"],"answer":1,"explain":"“Mouse” tem plural irregular: “mice”. Outros exemplos são “child/children” e “foot/feet”."}]},{"id":"6-ing-presente-simples-rotina","name":"Presente simples e rotina","desc":"Usar o presente simples para falar de hábitos e rotina, com do, does, don't e doesn't e advérbios de frequência.","questions":[{"q":"Complete: “She ___ to school every day.”","options":["gos","go","going","goes"],"answer":3,"explain":"Com “she” o verbo ganha -s ou -es no presente simples: “go” vira “goes”."},{"q":"Complete: “I ___ breakfast at 7 a.m.”","options":["haves","has","having","have"],"answer":3,"explain":"Com “I” o verbo fica na forma básica: “I have breakfast” (Eu tomo café da manhã)."},{"q":"Complete: “He ___ TV at night.” (watch)","options":["watchs","watching","watches","watch"],"answer":2,"explain":"Verbos terminados em -ch ganham -es com he, she e it: “watches”."},{"q":"Qual é a forma negativa de “He likes fish”?","options":["He don't like fish.","He doesn't likes fish.","He doesn't like fish.","He not likes fish."],"answer":2,"explain":"Com he, she e it usamos “doesn't” e o verbo volta à forma básica, sem -s."},{"q":"Complete: “I ___ play tennis.” (forma negativa)","options":["don't","not","isn't","doesn't"],"answer":0,"explain":"Com I, you, we e they usamos “don't” na negativa do presente simples."},{"q":"Complete a pergunta: “___ you like music?”","options":["Do","Does","Are","Is"],"answer":0,"explain":"Para perguntar no presente simples com “you”, usamos “Do”."},{"q":"Complete a pergunta: “___ she live in Recife?”","options":["Does","Are","Do","Is"],"answer":0,"explain":"Com he, she e it, a pergunta no presente simples começa com “Does”."},{"q":"O que significa a palavra “always”?","options":["nunca","sempre","raramente","às vezes"],"answer":1,"explain":"“Always” é um advérbio de frequência que significa sempre."},{"q":"O que significa a palavra “never”?","options":["geralmente","frequentemente","sempre","nunca"],"answer":3,"explain":"“Never” significa nunca: “I never drink coffee” (Eu nunca bebo café)."},{"q":"Complete: “My brother ___ his homework after lunch.” (do)","options":["doing","does","dos","do"],"answer":1,"explain":"Com “my brother” (he), o verbo “do” vira “does”."},{"q":"Complete: “They ___ soccer on Saturdays.”","options":["plays","play","is play","playing"],"answer":1,"explain":"Com “they” o verbo fica na forma básica: “They play soccer”."},{"q":"O que significa “wake up”?","options":["tomar banho","almoçar","acordar","dormir"],"answer":2,"explain":"“Wake up” é acordar: “I wake up at 6 o'clock”."},{"q":"Complete: “Ana ___ English on Mondays.” (study)","options":["studies","studyes","study","studys"],"answer":0,"explain":"Quando o verbo termina em consoante + y, trocamos o y por -ies com he, she e it: “studies”."},{"q":"O presente simples (simple present) é usado principalmente para falar de:","options":["ações que estão acontecendo agora","ordens e instruções apenas","hábitos e rotinas","ações do passado distante"],"answer":2,"explain":"Por exemplo: “I brush my teeth every morning” (Eu escovo os dentes todas as manhãs)."}]},{"id":"6-ing-presente-continuo","name":"Presente contínuo","desc":"Usar o presente contínuo (am, is, are + verbo com -ing) para descrever ações que estão acontecendo agora.","questions":[{"q":"Complete: “She ___ reading a book now.”","options":["am","is","are","does"],"answer":1,"explain":"O presente contínuo usa o verbo to be + verbo com -ing. Com “she”, usamos “is”."},{"q":"Complete: “They are ___ soccer.” (play)","options":["play","playing","played","plays"],"answer":1,"explain":"No presente contínuo, o verbo principal recebe -ing: “playing”."},{"q":"Complete: “I am ___ a letter.” (write)","options":["write","writeing","writing","writting"],"answer":2,"explain":"Verbos terminados em -e perdem o e antes do -ing: write vira writing."},{"q":"Qual é a forma com -ing do verbo “run”?","options":["runs","runing","running","runned"],"answer":2,"explain":"Em verbos cu answer":2,"explain":"“Look!” mostra que a ação está acontecendo agora, então usamos o presente contínuo: “is raining”."},{"q":"Complete: “The baby ___ crying.”","options":["is","am","are","do"],"answer":0,"explain":"“The baby” equivale a “he”, “she” ou “it”, então usamos “is”."}]},{"id":"6-ing-paises-nacionalidades","name":"Países, nacionalidades e o inglês no mundo","desc":"Reconhecer países e nacionalidades em inglês, onde o inglês é falado e palavras em inglês usadas no Brasil.","questions":[{"q":"O que significa “Brazilian”?","options":["brasileiro ou brasileira","português","Brasília","Brasil"],"answer":0,"explain":"“Brazil” é o país e “Brazilian” é a nacionalidade. Em inglês, nacionalidades são escritas com letra maiúscula."},{"q":"Qual é a nacionalidade, em inglês, de quem nasce no Japão?","options":["Japanian","Japaner","Japanish","Japanese"],"answer":3,"explain":"Japão é “Japan” e japonês é “Japanese”."},{"q":"Qual é a nacionalidade, em inglês, de quem nasce no Canadá?","options":["Canader","Canadish","Canadian","Canadese"],"answer":2,"explain":"Canadá é “Canada” e canadense é “Canadian”."},{"q":"Qual é a nacionalidade, em inglês, de quem nasce na Argentina?","options":["Argentiner","Argentinish","Argentinese","Argentinian"],"answer":3,"explain":"Argentino, em inglês, é “Argentinian”."},{"q":"Qual é a nacionalidade, em inglês, de quem nasce no México?","options":["Mexicaner","Mexicish","Mexicese","Mexican"],"answer":3,"explain":"México é “Mexico” e mexicano é “Mexican”."},{"q":"Em qual destes países a língua mais falada pela população é o inglês?","options":["Austrália","México","Brasil","Portugal"],"answer":0,"explain":"A maioria dos australianos fala inglês. No Brasil e em Portugal fala-se português, e no México, espanhol."},{"q":"Em qual destes países africanos o inglês é uma língua oficial?","options":["Senegal","Angola","Moçambique","Nigéria"],"answer":3,"explain":"A Nigéria tem o inglês como língua oficial. Angola e Moçambique têm o português, e o Senegal, o francês."},{"q":"Por que o inglês é chamado de língua internacional?","options":["porque é falado só na Inglaterra","porque substituiu todas as outras línguas","porque é a única língua do mundo","porque é muito usado na comunicação entre pessoas de países diferentes"],"answer":3,"explain":"Muitas pessoas aprendem inglês para viajar, estudar, trabalhar e usar a internet com pessoas do mundo todo."},{"q":"Muitos restaurantes no Brasil anunciam “delivery”. O que essa palavra significa?","options":["cardápio","sobremesa","entrega em domicílio","promoção"],"answer":2,"explain":"“Delivery” é o serviço de entrega. Muitas palavras em inglês fazem parte do nosso dia a dia."},{"q":"Em uma vitrine, a palavra “sale” indica:","options":["lojas fechadas","produtos novos","liquidação (produtos com desconto)","entrada proibida"],"answer":2,"explain":"“Sale” significa liquidação ou promoção."},{"q":"Em um anúncio que diz “50% off”, a palavra “off” indica:","options":["aumento de preço","produto esgotado","desconto","loja desligada"],"answer":2,"explain":"“50% off” quer dizer 50% de desconto."},{"q":"Como se diz “Inglaterra” em inglês?","options":["Inglaterry","English","Englander","England"],"answer":3,"explain":"“England” é o país. “English” é a língua inglesa ou a nacionalidade inglesa."},{"q":"Complete: “I am from Portugal. I am ___.”","options":["Portuguese","Portugish","Portugalian","Portuguish"],"answer":0,"explain":"Quem nasce em Portugal é “Portuguese”. A língua portuguesa também é chamada de “Portuguese”."},{"q":"Como se diz “Estados Unidos” em inglês?","options":["the United States","the United Kingdom","the States United","the United Nations"],"answer":0,"explain":"“The United States” são os Estados Unidos. “The United Kingdom” é o Reino Unido."}]}]}]}};

<script>
/* Geradores automáticos de questões de Matemática (1º, 3º e 6º ano) — pt-BR.
 * Sem dependências. Toda aleatoriedade vem de rng() (número em [0,1)).
 * Cada gerador: (rng, opts) => { q, options, answer, explain, visual?, _check }
 *   opts.n    = número de opções (3 no 1º ano, 4 nos demais)
 *   opts.year = 1, 3 ou 6
 * _check guarda os parâmetros sorteados (usado nos testes; o jogo pode ignorar).
 */
const GENS = (function () {
  'use strict';

  // ------------------------------------------------------------------ utilitários
  function ri(rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); }
  function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
  function chance(rng, p) { return rng() < p; }
  function shuffle(rng, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
  function lcm(a, b) { return a / gcd(a, b) * b; }
  function isPrime(n) {
    if (n < 2) return false;
    for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
    return true;
  }
  function primeFactors(n) {
    const f = [];
    for (let p = 2; p * p <= n; p++) while (n % p === 0) { f.push(p); n /= p; }
    if (n > 1) f.push(n);
    return f;
  }
  function digitsOf(n) { return String(n).split('').map(Number); }
  function digitSum(n) { return digitsOf(n).reduce((s, d) => s + d, 0); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function nOpt(opts) { return (opts && opts.n) || ((opts && opts.year) === 1 ? 3 : 4); }
  function yearOf(opts) { return (opts && opts.year) || 3; }

  // Inteiros: sem ponto até 9999; a partir de 10000, ponto de milhar (10.000).
  function fmtInt(n) {
    const neg = n < 0; const s = String(Math.abs(Math.round(n)));
    const out = Math.abs(n) >= 10000 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : s;
    return (neg ? '-' : '') + out;
  }
  // Decimais com vírgula, até 3 casas, sem zeros à direita.
  function fmtDec(x) {
    const r = Math.round(x * 1000);
    const neg = r < 0; const a = Math.abs(r);
    const ip = Math.floor(a / 1000); let dp = String(a % 1000).padStart(3, '0').replace(/0+$/, '');
    return (neg ? '-' : '') + fmtInt(ip) + (dp ? ',' + dp : '');
  }
  function decOK(x, places) { // x tem no máximo `places` casas decimais?
    const m = Math.pow(10, places == null ? 3 : places);
    return Math.abs(x * m - Math.round(x * m)) < 1e-7;
  }
  function fmtMoney(cents) {
    return 'R$ ' + fmtInt(Math.floor(cents / 100)) + ',' + String(cents % 100).padStart(2, '0');
  }
  const SUP = ['⁰', '¹', '²', '³', '⁴', '⁵', '⁶', '⁷', '⁸', '⁹'];

  // Frações
  function red(n, d) { const g = gcd(n, d) || 1; return [n / g, d / g]; }
  function fs(n, d) { return n + '/' + d; }
  function fracKey(s) { // chave por VALOR ("2/4" e "1/2" têm a mesma chave)
    const m = /^(\d+)\/(\d+)$/.exec(s);
    if (!m) return s;
    const r = red(+m[1], +m[2]);
    return r[0] + '/' + r[1];
  }

  const NAMES = ['Ana', 'Bia', 'Léo', 'Davi', 'Lucas', 'Maria', 'João', 'Pedro', 'Júlia', 'Sofia', 'Miguel', 'Helena',
    'Arthur', 'Laura', 'Gabriel', 'Alice', 'Heitor', 'Valentina', 'Rafael', 'Isabela', 'Enzo', 'Manuela', 'Thiago',
    'Luísa', 'Caio', 'Yasmin', 'Kauã', 'Ayla', 'Benício', 'Lara', 'Samuel', 'Cecília', 'Mateus', 'Nicole', 'Bruno',
    'Clara', 'Gustavo', 'Lívia', 'Felipe', 'Marina', 'Otávio', 'Rebeca', 'Iara', 'Tainá', 'Vitor', 'Camila', 'Luan',
    'Raquel', 'Henrique', 'Beatriz', 'Ícaro', 'Larissa', 'Antônio', 'Francisca', 'Joaquim', 'Emanuele'];
  function nm(rng) { return pick(rng, NAMES); }
  function twoNames(rng) { const a = nm(rng); let b = nm(rng); while (b === a) b = nm(rng); return [a, b]; }

  /* Monta as opções: correta + distratores (fortes primeiro, depois fracos, depois fallback).
   * Remove nulos, duplicatas (por chave) e nunca repete a correta. */
  function finish(rng, n, correct, strong, weak, fallback, keyFn) {
    keyFn = keyFn || (s => s);
    const out = [correct]; const seen = new Set([keyFn(correct)]);
    const add = c => {
      if (out.length >= n || c == null || c === '') return;
      const k = keyFn(c); if (seen.has(k)) return;
      seen.add(k); out.push(c);
    };
    shuffle(rng, strong || []).forEach(add);
    shuffle(rng, weak || []).forEach(add);
    let guard = 0;
    while (out.length < n && fallback && guard++ < 500) add(fallback());
    if (out.length < n) throw new Error('Opções insuficientes para: ' + correct);
    const opts = shuffle(rng, out);
    return { options: opts, answer: opts.indexOf(correct) };
  }
  // Lista de inteiros -> strings formatadas, filtrando inválidos
  function ints(list, ok, fmt) {
    fmt = fmt || fmtInt;
    return list.filter(x => x != null && Number.isFinite(x) && Number.isInteger(x) && (!ok || ok(x))).map(fmt);
  }
  function nearInt(rng, x, spread, min, max, fmt) {
    fmt = fmt || fmtInt; min = min == null ? 0 : min; max = max == null ? Infinity : max;
    return () => {
      const d = ri(rng, 1, spread) * (chance(rng, 0.5) ? 1 : -1);
      const v = x + d;
      return v >= min && v <= max ? fmt(v) : null;
    };
  }
  function result(q, built, explain, check, visual) {
    const r = { q, options: built.options, answer: built.answer, explain };
    if (visual) r.visual = visual;
    r._check = check;
    return r;
  }

  // Emojis simples para contagem e figuras
  const ITEMS = [
    ['🍎', 'maçã', 'maçãs', 'f'], ['⭐', 'estrela', 'estrelas', 'f'], ['🐟', 'peixe', 'peixes', 'm'],
    ['🎈', 'balão', 'balões', 'm'], ['🚗', 'carro', 'carros', 'm'], ['🌸', 'flor', 'flores', 'f'],
    ['🐞', 'joaninha', 'joaninhas', 'f'], ['⚽', 'bola', 'bolas', 'f'], ['🍌', 'banana', 'bananas', 'f'],
    ['🐶', 'cachorro', 'cachorros', 'm'], ['🦋', 'borboleta', 'borboletas', 'f'], ['🍓', 'morango', 'morangos', 'm'],
    ['🐱', 'gato', 'gatos', 'm'], ['🌳', 'árvore', 'árvores', 'f'], ['🐢', 'tartaruga', 'tartarugas', 'f'],
    ['🍪', 'biscoito', 'biscoitos', 'm'], ['🚲', 'bicicleta', 'bicicletas', 'f'], ['🐸', 'sapo', 'sapos', 'm'],
    ['🦆', 'pato', 'patos', 'm'], ['🐝', 'abelha', 'abelhas', 'f'], ['🍦', 'sorvete', 'sorvetes', 'm'],
    ['🐥', 'pintinho', 'pintinhos', 'm']
  ];
  function row(e, k) { // grupinhos de 5 para facilitar a contagem
    let s = '';
    for (let i = 0; i < k; i++) { if (i && i % 5 === 0) s += ' '; s += e; }
    return s;
  }
  const STORY = [
    ['figurinhas', 'f'], ['balas', 'f'], ['carrinhos', 'm'], ['adesivos', 'm'], ['bolinhas de gude', 'f'],
    ['pipas', 'f'], ['livros', 'm'], ['conchinhas', 'f'], ['bonecas', 'f'], ['lápis de cor', 'm'],
    ['biscoitos', 'm'], ['chaveiros', 'm']
  ];
  const quantos = g => (g === 'f' ? 'quantas' : 'quantos');

  // ------------------------------------------------------------------ 1º ano
  function count(rng, opts) {
    const n = nOpt(opts);
    const [e, s, p, g] = pick(rng, ITEMS);
    const k = chance(rng, 0.6) ? ri(rng, 1, 10) : ri(rng, 11, 20);
    const Q = cap(quantos(g));
    const q = pick(rng, [
      `${Q} ${p} você vê?`,
      `Conte: ${quantos(g)} ${p} tem aqui?`,
      `${Q} ${p} há na figura?`,
      `Conte as ${p}. ${Q} são?`.replace(/^Conte as/, g === 'f' ? 'Conte as' : 'Conte os')
    ]);
    const explain = k === 1
      ? `Só há 1 ${s} na figura. Muito bem observado!`
      : `Contando ${g === 'f' ? 'uma por uma' : 'um por um'}, chegamos a ${k} ${p}.` +
        (k >= 10 ? ' Dica: cada grupinho tem 5.' : '');
    const built = finish(rng, n, fmtInt(k), ints([k - 1, k + 1], x => x >= 1), ints([k - 2, k + 2], x => x >= 1),
      nearInt(rng, k, 3, 1, 23));
    return result(q, built, explain, { k }, row(e, k));
  }

  function compare(rng, opts) {
    const n = nOpt(opts), Y = yearOf(opts);
    if (Y === 1) {
      const mode = pick(rng, ['max', 'max', 'min', 'min', 'gt', 'lt', 'between']);
      if (mode === 'max' || mode === 'min') {
        const lo = ri(rng, 0, 14);
        const pool = shuffle(rng, Array.from({ length: 7 }, (_, i) => lo + i)).slice(0, n);
        const ans = mode === 'max' ? Math.max(...pool) : Math.min(...pool);
        const q = mode === 'max'
          ? pick(rng, ['Qual é o maior número?', 'Qual número é o maior?', 'Qual destes números é o maior?'])
          : pick(rng, ['Qual é o menor número?', 'Qual número é o menor?', 'Qual destes números é o menor?']);
        const explain = mode === 'max'
          ? `O ${ans} é o maior: na contagem, ele vem depois dos outros.`
          : `O ${ans} é o menor: na contagem, ele vem antes dos outros.`;
        const opt = shuffle(rng, pool.map(fmtInt));
        return result(q, { options: opt, answer: opt.indexOf(fmtInt(ans)) }, explain, { mode, nums: pool });
      }
      if (mode === 'gt' || mode === 'lt') {
        const X = ri(rng, Math.max(n, 4), 16);
        let ans, others;
        const below = shuffle(rng, range(Math.max(0, X - 6), X - 1));
        const above = shuffle(rng, range(X + 1, Math.min(20, X + 6)));
        if (mode === 'gt') { ans = above[0]; others = below.slice(0, n - 1); } else { ans = below[0]; others = above.slice(0, n - 1); }
        const q = mode === 'gt' ? `Qual destes números é maior que ${X}?` : `Qual destes números é menor que ${X}?`;
        const explain = mode === 'gt'
          ? `O ${ans} vem depois do ${X} na contagem, então é maior que ${X}.`
          : `O ${ans} vem antes do ${X} na contagem, então é menor que ${X}.`;
        const opt = shuffle(rng, [ans].concat(others).map(fmtInt));
        return result(q, { options: opt, answer: opt.indexOf(fmtInt(ans)) }, explain, { mode, X });
      }
      // between
      const L = ri(rng, 1, 17), U = L + 2, ans = L + 1;
      const q = pick(rng, [`Qual número está entre ${L} e ${U}?`, `Que número vem entre o ${L} e o ${U}?`]);
      const built = finish(rng, n, fmtInt(ans), ints([L - 1, U + 1]), ints([L, U, U + 2], x => x >= 0), nearInt(rng, ans, 5, 0, 22));
      return result(q, built, `Contando: ${L}, ${ans}, ${U}. O ${ans} fica no meio!`, { mode, L, U });
    }
    // 3º ano (até 9999)
    const mode = pick(rng, ['max', 'max', 'min', 'min', 'between']);
    if (mode === 'max' || mode === 'min') {
      const N = chance(rng, 0.75) ? ri(rng, 1000, 9999) : ri(rng, 100, 999);
      const pool = new Set([N]);
      const vars = shuffle(rng, numberVariants(N));
      for (const v of vars) { if (pool.size >= n) break; pool.add(v); }
      while (pool.size < n) pool.add(ri(rng, 100, 9999));
      const nums = Array.from(pool);
      const ans = mode === 'max' ? Math.max(...nums) : Math.min(...nums);
      const q = mode === 'max'
        ? pick(rng, ['Qual destes números é o maior?', 'Qual é o maior número?', 'Qual número tem o maior valor?'])
        : pick(rng, ['Qual destes números é o menor?', 'Qual é o menor número?', 'Qual número tem o menor valor?']);
      const lens = new Set(nums.map(x => String(x).length));
      const explain = `Compare da maior ordem para a menor (milhar, centena, dezena, unidade): o ${mode === 'max' ? 'maior' : 'menor'} é ${ans}.` +
        (lens.size > 1 ? ' Quem tem mais algarismos é sempre maior.' : '');
      const opt = shuffle(rng, nums.map(fmtInt));
      return result(q, { options: opt, answer: opt.indexOf(fmtInt(ans)) }, explain, { mode, nums });
    }
    const four = chance(rng, 0.7);
    const L = four ? ri(rng, 10, 98) * 100 : ri(rng, 1, 9) * 100;
    const U = L + 100;
    let ans; do { ans = ri(rng, L + 1, U - 1); } while (ans % 10 === 0 && chance(rng, 0.7));
    const out = x => x < L || x > U;
    const cands = numberVariants(ans).filter(out);
    const weak = [U + ri(rng, 1, 99), L - ri(rng, 1, 99), ans + 100, ans - 100, ans + 1000].filter(x => x > 0 && out(x));

    const built = finish(rng, n, fmtInt(ans), ints(cands, x => x > 0), ints(weak),

    }
    const p = pick(rng, [10, 10, 20, 25, 25, 50, 50, 75, 5, 30, 40, 1]);
    const base = p === 1 ? 100 : p === 5 ? 20 : p % 25 === 0 ? 4 : 10;
    const money = mode === 'discount' || mode === 'newprice';
    const T = base * ri(rng, money ? 2 : 2, p === 1 ? 6 : 30);
    const part = T * p / 100;
    const ans = mode === 'newprice' ? T - part : part;
    const fm = money ? (x => fmtMoney(x * 100)) : fmtInt;
    let q;
    if (mode === 'plain') q = pick(rng, [`Quanto é ${p}% de ${T}?`, `Quanto vale ${p}% de ${T}?`]);
    else if (mode === 'people') q = pick(rng, [`Numa escola com ${T} alunos, ${p}% vão de bicicleta. Quantos alunos vão de bicicleta?`,
      `Numa caixa com ${T} frutas, ${p}% são laranjas. Quantas laranjas há na caixa?`]);
    else if (mode === 'discount') q = `Um tênis custa ${fmtMoney(T * 100)} e está com ${p}% de desconto. De quanto é o desconto?`;
    else q = `Uma bicicleta custa ${fmtMoney(T * 100)} e está com ${p}% de desconto. Quanto ela passa a custar?`;
    const otherP = [10, 20, 25, 50, 75].filter(x => x !== p).map(x => T * x / 100);
    const strong = mode === 'newprice' ? [part, T + part, T - T * (p === 10 ? 20 : 10) / 100] : [T - part, part * 2, part / 2].concat(money ? [] : [p]);
    const built = finish(rng, n, fm(ans), ints(strong, x => x > 0 && x !== ans, fm),
      ints(mode === 'newprice' ? otherP.map(x => T - x) : otherP, x => x > 0 && x !== ans, fm), nearInt(rng, ans, 10, 1, Infinity, fm));
    let explain = `${p}% ${PCT_TIP[p]}: ${p}% de ${fm(T)} = ${fm(part)}.`;
    if (mode === 'newprice') explain += ` Então o novo preço é ${fm(T)} − ${fm(part)} = ${fm(ans)}.`;
    return result(q, built, explain, { mode, p, T });
  }

  // expressões: tokens
  const EXPR_T = [
    'a + b × c − d', 'a × b + c × d', 'a × b − c × d', '( a + b ) × c − d', 'a × ( b − c ) + d', 'a − b ÷ c + d',
    'a ÷ b + c × d', '( a + b ) ÷ c + d', '( a + b ) ÷ c + d × e', 'a + b × c − d ÷ e', 'a × b − ( c + d ) ÷ e',
    'a ÷ b × c + d', '( a − b ) × ( c + d )', 'a + ( b + c ) × d − e', 'a × b ÷ c − d'
  ];
  function applyOp(x, op, y) {
    if (op === '+') return x + y;
    if (op === '−') return x - y > 0 ? x - y : null;
    if (op === '×') return x * y;
    if (op === '÷') return y !== 0 && x % y === 0 ? x / y : null;
    return null;
  }
  function renderT(tk) {
    let s = '';
    tk.forEach((t, i) => {
      if (t === ')') s += ')';
      else if (i > 0 && tk[i - 1] === '(') s += t;
      else s += (s ? ' ' : '') + t;
    });
    return s;
  }
  // um passo de resolução (precedência normal, ou sem precedência se flat=true)
  function stepOnce(tk, flat) {
    let lo = 0, hi = tk.length; // [lo, hi)
    const close = tk.indexOf(')'); // parênteses mais internos, da esquerda para a direita
    const open = close >= 0 ? tk.lastIndexOf('(', close) : -1;
    if (open >= 0) { lo = open + 1; hi = close; }
    let idx = -1;
    if (!flat) for (let i = lo; i < hi; i++) if (tk[i] === '×' || tk[i] === '÷') { idx = i; break; }
    if (idx < 0) for (let i = lo; i < hi; i++) if (['+', '−', '×', '÷'].includes(tk[i])) { idx = i; break; }
    if (idx < 0) { // grupo com um número só: tira os parênteses
      if (open >= 0) return tk.slice(0, open).concat([tk[open + 1]], tk.slice(hi + 1));
      return null;
    }
    const v = applyOp(tk[idx - 1], tk[idx], tk[idx + 1]);
    if (v == null) return undefined;
    let out = tk.slice(0, idx - 1).concat([v], tk.slice(idx + 2));
    if (open >= 0 && out[open] === '(' && out[open + 2] === ')') out = out.slice(0, open).concat([out[open + 1]], out.slice(open + 3));
    return out;
  }
  function evalT(tk, flat) {
    const steps = [];
    let cur = tk;
    while (cur.length > 1) {
      const nx = stepOnce(cur, flat);
      if (nx === undefined || nx === null) return null;
      cur = nx; steps.push(renderT(cur));
    }
    return { value: cur[0], steps };
  }
  function expressions(rng, opts) {
    const n = nOpt(opts);
    let tk, res, tries = 0;
    while (true) {
      const tpl = pick(rng, EXPR_T).split(' ');
      tk = tpl.map((t, i) => {
        if (!/^[a-e]$/.test(t)) return t;
        const near = [tpl[i - 1], tpl[i + 1]];
        const mult = near.includes('×') || near.includes('÷');
        return mult ? ri(rng, 2, 12) : ri(rng, 2, 30);
      });
      res = evalT(tk, false);
      if (res && res.value >= 0 && res.value <= 300 && tries++ >= 0) break;
    }
    const expr = renderT(tk);
    const ans = res.value;
    const flat = evalT(tk, true);
    const noParen = tk.includes('(') ? evalT(tk.filter(t => t !== '(' && t !== ')'), false) : null;
    const strong = [flat && flat.value, noParen && noParen.value];
    const q = pick(rng, [`Qual é o valor da expressão ${expr}?`, `Quanto é ${expr}?`, `Resolvendo na ordem certa, quanto dá ${expr}?`]);
    const built = finish(rng, n, fmtInt(ans), ints(strong, x => x >= 0 && x !== ans), ints([ans + 1, ans - 1, ans + 2, ans + 10, ans - 10], x => x >= 0),
      nearInt(rng, ans, 12, 0));
    const rule = tk.includes('(') ? 'Primeiro o que está entre parênteses, depois × e ÷, e por último + e −' : 'Primeiro × e ÷, depois + e −, da esquerda para a direita';
    return result(q, built, `${rule}: ${expr} = ${res.steps.join(' = ')}.`, { expr });
  }

  // romanos
  const RV = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
  const RS = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
  function toRoman(n) { let s = ''; for (const [v, r] of RV) while (n >= v) { s += r; n -= v; } return s; }
  function additive(n) { let s = ''; for (const [v, r] of [[1000, 'M'], [500, 'D'], [100, 'C'], [50, 'L'], [10, 'X'], [5, 'V'], [1, 'I']]) while (n >= v) { s += r; n -= v; } return s; }
  function naiveSum(s) { return s.split('').reduce((t, c) => t + RS[c], 0); }
  function romanParts(n) {
    const parts = [];
    [1000, 100, 10, 1].forEach(p => { const v = Math.floor(n / p) % 10 * p; if (n >= p && v) parts.push(v); });
    return parts;
  }
  function roman(rng, opts) {
    const n = nOpt(opts);
    const r0 = rng();
    const N = r0 < 0.4 ? ri(rng, 1, 50) : r0 < 0.7 ? ri(rng, 51, 500) : ri(rng, 501, 3999);
    const R = toRoman(N);
    const parts = romanParts(N);
    const sub = /IV|IX|XL|XC|CD|CM/.test(R);
    let dec;
    if (parts.length > 1) dec = `${N} = ${parts.join(' + ')} = ${parts.map(toRoman).join(' + ')} = ${R}.`;
    else {
      const pcs = []; let x = N;
      for (const [v, r] of RV) while (x >= v) { pcs.push([v, r]); x -= v; }
      dec = pcs.length > 1 ? `${N} = ${pcs.map(p => p[0]).join(' + ')} = ${pcs.map(p => p[1]).join(' + ')} = ${R}.` : `${R} vale ${N}.`;
      if (!/IV|IX|XL|XC|CD|CM/.test(R)) dec += ' Lembre: I = 1, V = 5, X = 10, L = 50, C = 100, D = 500 e M = 1000.';
    }
    const subTip = sub ? ' Lembre: símbolo menor antes de um maior é subtraído (IV = 4, IX = 9, XL = 40).' : '';
    if (chance(rng, 0.5)) {
      const strong = [];
      const add = additive(N);
      if (add !== R && N % 10 !== 4) strong.push(add);
      const r100 = N % 100, r1000 = N % 1000;
      const WS = { 45: 'VL', 49: 'IL', 95: 'VC', 99: 'IC' }, WS2 = { 450: 'LD', 490: 'XD', 950: 'LM', 990: 'XM', 999: 'IM' };
      if (WS2[r1000]) strong.push(toRoman(N - r1000) + WS2[r1000]);
      else if (WS[r100]) strong.push(toRoman(N - r100) + WS[r100]);
      const m = /IV|IX|XL|XC|CD|CM/.exec(R);
      if (m) strong.push(R.slice(0, m.index) + m[0][1] + m[0][0] + R.slice(m.index + 2));
      const weak = [N + 1, N - 1, N + 10, N - 10, N + 5, N + 100].filter(x => x >= 1 && x <= 3999).map(toRoman);
      const built = finish(rng, n, R, strong, weak, () => { const x = N + ri(rng, -20, 20); return x >= 1 && x <= 3999 ? toRoman(x) : null; });
      const q = pick(rng, [`Como se escreve ${N} em números romanos?`, `Qual é o número romano que representa ${N}?`]);
      return result(q, built, dec + subTip, { mode: 'toRoman', n: N });
    }
    const strong = [], ns = naiveSum(R);
    if (ns !== N) strong.push(ns);
    strong.push(N + 1, N - 1, N + 10, N - 10);
    const weak = [N + 100, N - 100, N + 1000, N + 5, N - 5];
    const built = finish(rng, n, fmtInt(N), ints(strong, x => x >= 1 && x !== N), ints(weak, x => x >= 1 && x !== N), nearInt(rng, N, 20, 1));
    const q = pick(rng, [`Que número é representado por ${R}?`, `O número romano ${R} vale quanto?`,
      N <= 12 ? `Um relógio antigo mostra ${R}. Que número é esse?` : `Um capítulo de livro está numerado como ${R}. Que número é esse?`]);
    return result(q, built, dec + subTip, { mode: 'fromRoman', roman: R });
  }

  function area_perimeter(rng, opts) {
    const n = nOpt(opts);
    const mode = pick(rng, ['rectP', 'rectA', 'sqP', 'sqA', 'sqSide', 'rectSide']);
    const N = nm(rng);
    const u = chance(rng, 0.5) ? 'cm' : 'm';
    const L1 = x => `${fmtInt(x)} ${u}`, L2 = x => `${fmtInt(x)} ${u}²`;
    let l = ri(rng, 3, 20), w = ri(rng, 2, 20);
    if (w === l) w = l - 1;
    if (w > l) { const t = l; l = w; w = t; }
    const s = ri(rng, 2, 20);
    if (mode === 'rectP') {
      const P = 2 * (l + w);
      const q = u === 'm'
        ? pick(rng, [`Uma horta retangular mede ${l} m por ${w} m. Quantos metros de cerca são necessários para contorná-la?`,
          `Qual é o perímetro de um retângulo com ${l} m de comprimento e ${w} m de largura?`])
        : pick(rng, [`Um cartão retangular mede ${l} cm por ${w} cm. Qual é o perímetro dele?`,
          `Qual é o perímetro de um retângulo com ${l} cm de comprimento e ${w} cm de largura?`]);
      const built = finish(rng, n, L1(P), ints([l * w, l + w, 2 * l + w], x => x !== P, L1), ints([P + 2, P - 2, l + 2 * w], x => x !== P && x > 0, L1), nearInt(rng, P, 8, 1, Infinity, L1));
      return result(q, built, `Perímetro é a soma de todos os lados: ${l} + ${w} + ${l} + ${w} = ${P} ${u}.`, { mode, l, w });
    }
    if (mode === 'rectA') {
      const A = l * w;
      const q = u === 'm'
        ? pick(rng, [`O quarto de ${N} é retangular e mede ${l} m por ${w} m. Qual é a área do quarto?`,
          `Qual é a área de um retângulo com ${l} m de comprimento e ${w} m de largura?`])
        : pick(rng, [`Uma folha retangular mede ${l} cm por ${w} cm. Qual é a área dela?`,
          `Qual é a área de um retângulo com ${l} cm de comprimento e ${w} cm de largura?`]);
      const built = finish(rng, n, L2(A), ints([2 * (l + w), l + w, 2 * A], x => x !== A, L2), ints([A + l, A - w, A + 1], x => x !== A && x > 0, L2), nearInt(rng, A, 12, 1, Infinity, L2));
      return result(q, built, `A área do retângulo é comprimento × largura: ${l} × ${w} = ${A} ${u}².`, { mode, l, w });
    }
    if (mode === 'sqP') {
      const P = 4 * s;
      const q = pick(rng, [u === 'm' ? `Um terreno quadrado tem ${s} m de lado. Qual é o perímetro dele?` : `Um ladrilho quadrado tem ${s} cm de lado. Qual é o perímetro dele?`,
        `Qual é o perímetro de um quadrado de lado ${s} ${u}?`]);
      const built = finish(rng, n, L1(P), ints([s * s, 2 * s, P + s], x => x !== P, L1), ints([P + 4, P - 4, 3 * s], x => x !== P && x > 0, L1), nearInt(rng, P, 8, 1, Infinity, L1));
      return result(q, built, `O quadrado tem 4 lados iguais: 4 × ${s} = ${P} ${u}.`, { mode, s });
    }
    if (mode === 'sqA') {
      const A = s * s;
      const q = pick(rng, [`Qual é a área de um quadrado de lado ${s} ${u}?`,
        u === 'cm' ? `Um azulejo quadrado tem ${s} cm de lado. Qual é a área dele?` : `Uma sala quadrada tem ${s} m de lado. Qual é a área da sala?`]);
      const unit = u;
      const LL = x => `${fmtInt(x)} ${unit}²`;
      const built = finish(rng, n, LL(A), ints([4 * s, 2 * s, A + s], x => x !== A, LL), ints([A - s, (s + 1) * (s + 1)], x => x !== A && x > 0, LL), nearInt(rng, A, 10, 1, Infinity, LL));
      return result(q, built, `A área do quadrado é lado × lado: ${s} × ${s} = ${A} ${unit}².`, { mode, s });
    }
    if (mode === 'sqSide') {
      const P = 4 * s;
      const q = pick(rng, [`Um quadrado tem perímetro de ${P} ${u}. Quanto mede cada lado?`,
        u === 'm' ? `${N} deu uma volta completa num canteiro quadrado e andou ${P} m. Quanto mede cada lado do canteiro?` : `Um quadrado desenhado no caderno tem perímetro de ${P} cm. Quanto mede cada lado?`]);
      const built = finish(rng, n, L1(s), ints([P / 2, P - 4, s + 1, s - 1], x => x !== s && x > 0, L1), ints([s + 2, P * 4], x => x !== s, L1), nearInt(rng, s, 4, 1, Infinity, L1));
      return result(q, built, `O quadrado tem 4 lados iguais, então cada lado mede ${P} ÷ 4 = ${s} ${u}.`, { mode, P });
    }
    const A = l * w;
    const q = `Um retângulo tem área de ${A} ${u}² e um dos lados mede ${l} ${u}. Quanto mede o outro lado?`;
    const built = finish(rng, n, L1(w), ints([A - l, w + 1, w - 1, A / 2], x => x !== w && x > 0, L1), ints([w + 2, l], x => x !== w, L1), nearInt(rng, w, 4, 1, Infinity, L1));
    return result(q, built, `Área = comprimento × largura. Como ${l} × ${w} = ${A}, o outro lado mede ${A} ÷ ${l} = ${w} ${u}.`, { mode, l, A });
  }

  return {
    count, compare, even_odd, sequence, add_small, sub_small, place_value,
    add_big, sub_big, mult_table, div_exact, money, units,
    frac_of, frac_equiv, frac_add_same, frac_add_diff,
    decimals, divisibility, primes, mmc_mdc, powers, percent, expressions, roman, area_perimeter
  };
})();
window.GENS = GENS;

</script>

          <div class="seg">${[5, 10, 15, 20].map((n) => `<button data-act="setn" data-n="${n}" aria-pressed="${st.n === n}">${n}</button>`).join('')}</div>
        </div>
        <div class="row"><span>Ler as perguntas em voz alta no ${y}º ano</span>
          <div class="seg"><button data-act="setread" data-v="1" aria-pressed="${!!st.read[y]}">Sim</button><button data-act="setread" data-v="0" aria-pressed="${!st.read[y]}">Não</button></div>
        </div>
        <p class="foot-note">O progresso de cada jogador fica salvo neste aparelho. Conteúdos baseados na BNCC (Base Nacional Comum Curricular).</p>
      </section>`;
  }
  function totalStars(pid) { const pr = store.get('prog:' + pid, {}); let s = 0; for (const k in pr) s += pr[k].best || 0; return s; }
  function subjCard(y, s) {
    const nq = s.topics.reduce((a, t) => a + t.questions.length, 0);
    const got = s.topics.reduce((a, t) => a + starsOf(t.id), 0), max = s.topics.length * 3;
    const k = s.topics.filter((t) => sel.has(t.id)).length;
    return `<button class="subj" data-act="subj" data-s="${s.id}" style="--sc:var(--c-${s.id})">
      <span class="subj-band">${ICON[s.id] || ''}</span>
      <span class="subj-body"><b>${esc(s.name)}</b>
        <span>${s.topics.length} conteúdos · ${s.topics.some((t) => t.gen) ? 'perguntas sem fim' : nq + ' perguntas'}</span>
        <span class="meter"><i style="width:${max ? Math.round(got / max * 100) : 0}%"></i></span>
        <span class="subj-foot"><span class="star-txt">${got} de ${max}</span><span>Abrir</span></span>
      </span>
      ${k ? `<span class="pick-badge">${k} escolhido${k > 1 ? 's' : ''}</span>` : ''}
    </button>`;
  }

  function renderSubject() {
    const y = st.year, s = subjOf(y, curSubj);
    const all = s.topics.every((t) => sel.has(t.id));
    view.innerHTML = `
      <header class="shead" style="--sc:var(--c-${s.id})">
        <div class="shead-top"><button class="back" data-act="home" aria-label="Voltar">‹</button>
          <div><h1>${esc(s.name)}</h1><p>${y}º ano · ${s.topics.length} conteúdos</p></div></div>
        <button class="btn" data-act="selall">${all ? 'Desmarcar todos' : 'Marcar todos'}</button>
      </header>
      <p class="foot-note">Marque um ou mais conteúdos e toque em Começar, ou use o botão de play para treinar só aquele conteúdo. Dá para misturar conteúdos de matérias diferentes.</p>
      <ul class="topics" style="--sc:var(--c-${s.id})">
        ${s.topics.map((t) => {
          const pr = prog[t.id], on = sel.has(t.id);
          const stat = pr && pr.total ? `${pr.right} de ${pr.total} acertos` : 'Ainda não treinado';
          return `<li class="topic ${on ? 'on' : ''}">
            <button class="tsel" data-act="toggle" data-t="${t.id}" aria-pressed="${on}"><span class="box" aria-hidden="true"></span>
              <span class="tinfo"><b>${esc(t.name)}</b><small>${esc(t.desc || '')}</small><span class="tstat">${starHtml(starsOf(t.id))} · ${stat}</span></span></button>
            <button class="tplay" data-act="playone" data-t="${t.id}" aria-label="Treinar só ${esc(t.name)}">${PLAY_ICO}</button>
          </li>`;
        }).join('')}
      </ul>`;
  }

  function renderBar() {
    const bar = $('#bar'), show = (screen === 'home' || screen === 'subject') && sel.size > 0;
    bar.hidden = !show; if (!show) return;
    const subs = new Set([...sel].map((id) => TOPIC[id].s.name));
    $('#bartxt').innerHTML = `<b>${sel.size} conteúdo${sel.size > 1 ? 's' : ''} escolhido${sel.size > 1 ? 's' : ''}</b>${esc([...subs].join(', '))} · ${st.n} perguntas`;
  }

  /* ---------- montar rodada ---------- */
  function cleanOptions(q) {
    let opts = q.options.map((o, k) => ({ o, ok: k === q.answer }));
    const num = (s) => { const m = /^(-?\d+(?:,\d+)?)$/.exec(String(s).trim()); return m ? parseFloat(m[1].replace(',', '.')) : null; };
    if (opts.every((x) => num(x.o) !== null)) opts.sort((a, b) => num(a.o) - num(b.o));
    else shuffle(opts);
    return { options: opts.map((x) => x.o), answer: opts.findIndex((x) => x.ok) };
  }
  function buildRound(ids, n) {
    const topics = shuffle(ids.slice()), items = [], used = new Set();
    const pools = {};
    for (const id of topics) {
      const qs = TOPIC[id].t.questions.map((_, i) => i), rec = new Set(recent[id] || []);
      pools[id] = shuffle(qs.filter((i) => !rec.has(i))).concat(shuffle(qs.filter((i) => rec.has(i))));
    }
    let k = 0, guard = 0;
    while (items.length < n && guard++ < n * 20) {
      const id = topics[k++ % topics.length], T = TOPIC[id], t = T.t;
      let item = null;
      const useGen = t.gen && window.GENS && GENS[t.gen] && (pools[id].length === 0 || rnd() < 0.55);
      if (useGen) {
        for (let tries = 0; tries < 8 && !item; tries++) {
          try { const g = GENS[t.gen](rnd, { n: T.y === 1 ? 3 : 4, year: T.y }); if (!used.has(g.q)) item = Object.assign({ q: g.q, explain: g.explain, visual: g.visual, gen: true }, cleanOptions(g)); } catch (e) {}
        }
      }
      if (!item && pools[id].length) { const i = pools[id].shift(); const q = t.questions[i]; item = Object.assign({ idx: i }, q, cleanOptions(q)); }
      if (!item) continue;
      used.add(item.q); item.topic = id; items.push(item);
    }
    return { ids, items, i: 0, right: 0, log: [], answered: false };
  }
  function start(ids) {
    if (!ids.length) return;
    round = buildRound(ids, st.n); screen = 'play'; window.scrollTo(0, 0); render();
  }

  /* ---------- jogando ---------- */
  const PRAISE = ['Isso aí!', 'Muito bem!', 'Acertou!', 'Mandou bem!', 'Show!', 'Perfeito!', 'Arrasou!'];
  const OOPS = ['Quase!', 'Não foi dessa vez.', 'Vamos aprender juntos.', 'Opa, quase lá!'];
  function renderPlay() {
    const r = round, it = r.items[r.i], T = TOPIC[it.topic], y = T.y;
    const short = it.options.every((o) => String(o).length <= 5);
    view.innerHTML = `
      <div class="play" style="--sc:var(--c-${T.s.id})">
        <div class="ptop"><button class="back" data-act="quit" aria-label="Sair do quiz">✕</button>
          <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${r.items.length}" aria-valuenow="${r.i}"><i style="width:${r.i / r.items.length * 100}%"></i></div>
          <span class="pcount">${r.i + 1} de ${r.items.length}</span></div>
        <article class="qcard">
          <div class="qmeta"><span class="tag">${esc(T.s.name)}</span><span>${esc(T.t.name)}</span></div>
          <button class="listen ${st.read[y] ? 'on' : ''}" data-act="listen" aria-label="Ouvir a pergunta">${SPK_ICO}Ouvir</button>
          ${it.visual ? `<div class="visual" aria-hidden="true">${esc(it.visual)}</div>` : ''}
          <h2 class="qtext y${y}" id="qtext">${fmt(it.q)}</h2>
        </article>
        <div class="opts y${y} ${short ? 'grid n' + it.options.length : ''}" role="group" aria-labelledby="qtext">
          ${it.options.map((o, k) => `<button class="opt" data-act="ans" data-k="${k}"><span class="key">${k + 1}</span><span>${fmt(o)}</span></button>`).join('')}
        </div>
        <div id="fb" aria-live="polite"></div>
      </div>`;
    r.answered = false;
    if (st.read[y]) setTimeout(() => speakQuestion(it), 250);
  }
  function answer(k) {
    const r = round; if (r.answered) return;
    r.answered = true;
    const it = r.items[r.i], ok = k === it.answer, y = TOPIC[it.topic].y;
    if (ok) r.right++;
    r.log.push({ item: it, chosen: k, ok });
    document.querySelectorAll('.opt').forEach((b, j) => {
      b.disabled = true;
      if (j === it.answer) b.classList.add('right');
      else if (j === k) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    ok ? sfxOk() : sfxBad();
    const title = ok ? PRAISE[Math.floor(rnd() * PRAISE.length)] : OOPS[Math.floor(rnd() * OOPS.length)];
    const last = r.i === r.items.length - 1;
    $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">
      <h3>${title}</h3>
      ${ok ? '' : `<p>A resposta certa é <b>${fmt(it.options[it.answer])}</b>.</p>`}
      <p>${fmt(it.explain || '')}</p>
      <button class="btn primary" data-act="next">${last ? 'Ver resultado' : 'Próxima'}</button></div>`;
    const nb = $('#fb .btn'); if (nb) { nb.focus({ preventScroll: true }); $('#fb').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    if (st.read[y]) speak(title + (ok ? '' : ' A resposta certa é ' + it.options[it.answer] + '.') + ' ' + (it.explain || ''));
  }
  function next() {
    const r = round;
    if (r.i < r.items.length - 1) { r.i++; render(); window.scrollTo(0, 0); }
    else finish();
  }
  function finish() {
    const r = round, by = {};
    for (const e of r.log) { const b = by[e.item.topic] || (by[e.item.topic] = { right: 0, total: 0 }); b.total++; if (e.ok) b.right++; }
    r.stars = {};
    for (const id in by) {
      const b = by[id], p = prog[id] || { best: 0, right: 0, total: 0 };
      p.right += b.right; p.total += b.total;
      const ratio = b.right / b.total, s = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : ratio >= 0.4 ? 1 : 0;
      if (b.total >= 3 || r.ids.length > 1) p.best = Math.max(p.best || 0, s);
      r.stars[id] = { s, b }; prog[id] = p;
    }
    store.set(progKey(), prog);
    for (const e of r.log) if (e.item.idx != null) { const a = recent[e.item.topic] || (recent[e.item.topic] = []); a.push(e.item.idx); if (a.length > 40) a.splice(0, a.length - 40); }
    store.set(recentKey(), recent);
    screen = 'result'; window.scrollTo(0, 0); render();
  }
  function renderResult() {
    const r = round, n = r.log.length, ratio = n ? r.right / n : 0;
    const s = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : ratio >= 0.4 ? 1 : 0;
    const msg = s === 3 ? 'Você é um verdadeiro sabichão!' : s === 2 ? 'Muito bom! Falta pouquinho para a nota máxima.' : s === 1 ? 'Bom começo! Treinando de novo você vai longe.' : 'Vamos revisar os erros e tentar outra vez?';
    const wrong = r.log.filter((e) => !e.ok);
    view.innerHTML = `
      <div class="res">
        <section class="score">
          <h1>${esc(me() ? me().name + ', ' : '')}${s >= 2 ? 'parabéns!' : 'fim da rodada!'}</h1>
          <div class="big">${r.right}<small> de ${n}</small></div>
          ${starHtml(s, 'st')}
          <p>${msg}</p>
        </section>
        <div class="actions">
          ${wrong.length ? '<button class="btn primary" data-act="redo">Treinar os erros</button>' : ''}
          <button class="btn ${wrong.length ? '' : 'primary'}" data-act="again">Jogar de novo</button>
          <button class="btn ghost" data-act="home">Escolher outros conteúdos</button>
        </div>
        <section>
          <h2 class="eyebrow">Por conteúdo</h2>
          <ul class="list">${Object.keys(r.stars).map((id) => `<li><div class="tr"><span><b>${esc(TOPIC[id].t.name)}</b><br><small>${esc(TOPIC[id].s.name)} · ${r.stars[id].b.right} de ${r.stars[id].b.total}</small></span>${starHtml(r.stars[id].s)}</div></li>`).join('')}</ul>
        </section>
        ${wrong.length ? `<section>
          <h2 class="eyebrow">Para revisar</h2>
          <ul class="list">${wrong.map((e) => `<li><b>${fmt(e.item.q)}</b>
            <span>Sua resposta: <span class="mine">${fmt(e.item.options[e.chosen])}</span></span>
            <span>Certa: <span class="ans">${fmt(e.item.options[e.item.answer])}</span></span>
            <small>${fmt(e.item.explain || '')}</small></li>`).join('')}</ul>
        </section>` : ''}
      </div>`;
    if (s === 3) { sfxWin(); confetti(); }
  }
  function redoWrong() {
    const items = round.log.filter((e) => !e.ok).map((e) => Object.assign({}, e.item));
    shuffle(items);
    round = { ids: round.ids, items, i: 0, right: 0, log: [], answered: false };
    screen = 'play'; window.scrollTo(0, 0); render();
  }

  /* ---------- voz ---------- */
  let voice = null;
  function pickVoice() {
    try { const vs = speechSynthesis.getVoices(); voice = vs.find((v) => /pt[-_]BR/i.test(v.lang)) || vs.find((v) => /^pt/i.test(v.lang)) || null; } catch (e) {}
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function forSpeech(s) {
    return String(s).replace(/(\d+)\/(\d+)/g, '$1 sobre $2').replace(/×/g, ' vezes ').replace(/÷/g, ' dividido por ')
      .replace(/_{2,}/g, ' tracinho ').replace(/cm²/g, ' centímetros quadrados').replace(/m²/g, ' metros quadrados')
      .replace(/²/g, ' ao quadrado').replace(/³/g, ' ao cubo').replace(/[“”"]/g, '').replace(/\s+/g, ' ');
  }
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(forSpeech(text));
      u.lang = 'pt-BR'; if (voice) u.voice = voice;
      u.rate = round && round.items[round.i] && TOPIC[round.items[round.i].topic].y === 1 ? 0.9 : 1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function stopSpeech() { try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {} }
  function speakQuestion(it) {
    const o = it.options.slice();
    const opts = o.length > 1 ? o.slice(0, -1).join(', ') + ' ou ' + o[o.length - 1] : o[0];
    speak(it.q + ' ... ' + opts + '?');
  }

  /* ---------- sons ---------- */
  let actx = null;
  function ac() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
  function tone(f, t0, d, v, type) {
    const a = ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(a.destination);
    const t = a.currentTime + t0; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.start(t); o.stop(t + d + 0.02);
  }
  const sfxOk = () => { tone(660, 0, 0.12, 0.08, 'triangle'); tone(990, 0.09, 0.18, 0.08, 'triangle'); };
  const sfxBad = () => { tone(300, 0, 0.18, 0.06, 'sine'); tone(240, 0.12, 0.22, 0.06, 'sine'); };
  const sfxWin = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.1, 0.3, 0.07, 'triangle'));
  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = $('#confetti'), x = c.getContext('2d'); c.hidden = false;
    const w = innerWidth, h = innerHeight, d = Math.min(devicePixelRatio || 1, 2); c.width = w * d; c.height = h * d; x.setTransform(d, 0, 0, d, 0, 0);
    const cs = getComputedStyle(document.documentElement), cols = ['--c-por', '--c-mat', '--c-cie', '--c-his', '--c-geo', '--c-ing', '--star'].map((k) => cs.getPropertyValue(k).trim());
    const bits = Array.from({ length: 110 }, () => ({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - .5) * 2.4, vy: 2 + Math.random() * 3, s: 6 + Math.random() * 6, c: cols[(Math.random() * cols.length) | 0], r: Math.random() * 6 }));
    const t0 = performance.now();
    (function f(t) {
      x.clearRect(0, 0, w, h);
      bits.forEach((b) => { b.x += b.vx; b.y += b.vy; b.vy += 0.04; b.r += 0.1; x.save(); x.translate(b.x, b.y); x.rotate(b.r); x.fillStyle = b.c; x.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); x.restore(); });
      if (t - t0 < 3000) requestAnimationFrame(f); else c.hidden = true;
    })(t0);
  }

  /* ---------- jogadores ---------- */
  let editing = null, pYear = 1, pColor = COLORS[0], delArm = 0;
  function openPlayer(p) {
    editing = p || null; pYear = p ? p.year : st.year; pColor = p ? p.color : COLORS[players.length % COLORS.length];
    $('#pdlg-t').textContent = p ? 'Editar jogador' : 'Novo jogador';
    $('#pname').value = p ? p.name : '';
    $('#pdel').hidden = !p; $('#pdel').classList.remove('arm'); $('#pdel').textContent = 'Apagar jogador';
    paintPlayerForm(); $('#pdlg').hidden = false; setTimeout(() => $('#pname').focus(), 50);
  }
  function paintPlayerForm() {
    document.querySelectorAll('#pyear button').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.y === pYear));
    $('#pcolors').innerHTML = COLORS.map((c) => `<button type="button" data-c="${c}" style="--pc:${c}" aria-label="Cor" aria-pressed="${c === pColor}"></button>`).join('');
  }
  $('#pyear').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { pYear = +b.dataset.y; paintPlayerForm(); } });
  $('#pcolors').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { pColor = b.dataset.c; paintPlayerForm(); } });
  $('#pcancel').addEventListener('click', () => { $('#pdlg').hidden = true; });
  $('#pdlg').addEventListener('click', (e) => { if (e.target.id === 'pdlg') $('#pdlg').hidden = true; });
  $('#pform').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('#pname').value.trim().slice(0, 18);
    if (!name) { $('#pname').focus(); $('#pname').placeholder = 'Digite um nome'; return; }
    if (editing) Object.assign(editing, { name, year: pYear, color: pColor });
    else { const p = { id: 'p' + Date.now().toString(36), name, year: pYear, color: pColor }; players.push(p); st.pid = p.id; }
    store.set('players', players); st.year = pYear; sel.clear(); saveState(); loadProg(); recent = store.get(recentKey(), {});
    $('#pdlg').hidden = true; screen = 'home'; render();
  });
  $('#pdel').addEventListener('click', () => {
    const b = $('#pdel');
    if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = 'Toque de novo para apagar'; clearTimeout(delArm); delArm = setTimeout(() => { b.classList.remove('arm'); b.textContent = 'Apagar jogador'; }, 3000); return; }
    players = players.filter((p) => p !== editing); store.set('players', players);
    try { localStorage.removeItem(KEY + 'prog:' + editing.id); localStorage.removeItem(KEY + 'recent:' + editing.id); } catch (e) {}
    st.pid = null; saveState(); loadProg(); recent = store.get(recentKey(), {}); $('#pdlg').hidden = true; render();
  });

  /* ---------- ações ---------- */
  view.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act; ac();
    if (a === 'pick') {
      const id = b.dataset.id; st.pid = st.pid === id ? null : id;
      const p = me(); if (p && p.year !== st.year) { st.year = p.year; sel.clear(); }
      saveState(); loadProg(); recent = store.get(recentKey(), {}); render();
    } else if (a === 'newp') openPlayer(null);
    else if (a === 'editp') openPlayer(me());
    else if (a === 'year') { const y = +b.dataset.y; if (y !== st.year) { st.year = y; sel.clear(); saveState(); render(); } }
    else if (a === 'subj') { curSubj = b.dataset.s; screen = 'subject'; window.scrollTo(0, 0); render(); }
    else if (a === 'home') { screen = 'home'; window.scrollTo(0, 0); render(); }
    else if (a === 'toggle') { const id = b.dataset.t; sel.has(id) ? sel.delete(id) : sel.add(id); const sy = scrollY; render(); window.scrollTo(0, sy); }
    else if (a === 'selall') { const s = subjOf(st.year, curSubj), all = s.topics.every((t) => sel.has(t.id)); s.topics.forEach((t) => all ? sel.delete(t.id) : sel.add(t.id)); render(); }
    else if (a === 'playone') start([b.dataset.t]);
    else if (a === 'mixall') start(BANK[st.year].subjects.flatMap((s) => s.topics.map((t) => t.id)));
    else if (a === 'setn') { st.n = +b.dataset.n; saveState(); render(); }
    else if (a === 'setread') { st.read[st.year] = b.dataset.v === '1'; saveState(); render(); }
    else if (a === 'listen') { const it = round.items[round.i]; speakQuestion(it); }
    else if (a === 'ans') answer(+b.dataset.k);
    else if (a === 'next') next();
    else if (a === 'quit') { screen = sel.size ? 'home' : 'home'; render(); }
    else if (a === 'again') start(round.ids);
    else if (a === 'redo') redoWrong();
  });
  $('#barclear').addEventListener('click', () => { sel.clear(); render(); });
  $('#barstart').addEventListener('click', () => { ac(); start([...sel]); });
  document.addEventListener('keydown', (e) => {
    if (screen !== 'play' || !$('#pdlg').hidden) return;
    if (!round.answered && /^[1-4]$/.test(e.key)) { const k = +e.key - 1; if (k < round.items[round.i].options.length) answer(k); }
    else if (round.answered && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); next(); }
  });

  if (st.pid && !me()) st.pid = null;
  if (!YEARS.includes(st.year)) st.year = 1;
  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
</html>
