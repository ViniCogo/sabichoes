eia sentimentos, ações ou qualidades, como “alegria”, que depende de alguém para existir."},{"q":"Qual adjetivo pode substituir a locução “de mãe” em “carinho de mãe”?","options":["paterno","infantil","materno","fraterno"],"answer":2,"explain":"“De mãe” equivale ao adjetivo “materno”. “Paterno” é de pai e “fraterno” é de irmão."},{"q":"Qual é o aumentativo de “casa”?","options":["casarão","caseiro","casinha","casebre"],"answer":0,"explain":"“Casarão” indica uma casa grande. “Casinha” e “casebre” indicam casa pequena, e “caseiro” é outra palavra."}]},{"id":"6-por-pronomes","name":"Pronomes","desc":"Identificar pronomes pessoais, possessivos, demonstrativos e outros, e usá-los para evitar repetições no texto.","questions":[{"q":"Na frase “Marcos perdeu a chave, mas depois ele a encontrou”, a palavra “ele” se refere a quem?","options":["ao leitor","a Marcos","à chave","a uma pessoa que não aparece no texto"],"answer":1,"explain":"“Ele” retoma “Marcos”, que foi citado antes. Pronomes ajudam a não repetir palavras."},{"q":"Na frase “Marcos perdeu a chave, mas depois ele a encontrou”, a palavra “a” (antes de “encontrou”) se refere a:","options":["a Marcos","à chave","a uma porta","à palavra “depois”"],"answer":1,"explain":"O pronome oblíquo “a” retoma “a chave”, que foi o que Marcos encontrou."},{"q":"Qual é o pronome pessoal do caso reto da 1ª pessoa do plural?","options":["vós","nos","eles","nós"],"answer":3,"explain":"Os pronomes retos são: eu, tu, ele/ela, nós, vós, eles/elas. A 1ª pessoa do plural é “nós”."},{"q":"Qual destas palavras é um pronome possessivo?","options":["comigo","meu","mim","me"],"answer":1,"explain":"“Meu” indica posse (o meu livro). “Me”, “mim” e “comigo” são pronomes pessoais oblíquos."},{"q":"Na frase “Este livro aqui é o meu”, a palavra “Este” é um pronome:","options":["interrogativo","possessivo","demonstrativo","pessoal"],"answer":2,"explain":"“Este” mostra a posição do livro em relação a quem fala (perto). Isso é função do pronome demonstrativo."},{"q":"Qual frase usa os pronomes de acordo com a norma-padrão?","options":["Isto é para eu fazer.","Entre eu e você não há segredos.","Isto é para mim fazer.","Ele trouxe o livro para mim ler."],"answer":0,"explain":"Antes de um verbo no infinitivo, usamos “eu”, que é o sujeito da ação: “para eu fazer”."},{"q":"Na pergunta “Quem chegou primeiro?”, a palavra “Quem” é um pronome:","options":["pessoal oblíquo","interrogativo","demonstrativo","possessivo"],"answer":1,"explain":"“Quem” está sendo usado para fazer uma pergunta, então é pronome interrogativo."},{"q":"Qual destas palavras é um pronome indefinido?","options":["alguém","nosso","ela","aquele"],"answer":0,"explain":"“Alguém” se refere a uma pessoa de modo vago, sem dizer quem: é pronome indefinido."},{"q":"De acordo com a norma-padrão, como substituir “a menina” por um pronome em “Vi a menina na praça”?","options":["Vi-a na praça.","Vi ela na praça.","Vi-lhe na praça.","Vi-la na praça."],"answer":0,"explain":"Na norma-padrão, o objeto direto feminino é substituído pelo pronome oblíquo “a”: “Vi-a”. A forma “Vi ela” é comum na fala, mas não segue a norma-padrão."},{"q":"Qual pronome de tratamento é usado para se dirigir ao presidente da República?","options":["Vossa Majestade","Vossa Santidade","Vossa Alteza","Vossa Excelência"],"answer":3,"explain":"Para altas autoridades como o presidente usamos “Vossa Excelência”. “Vossa Santidade” é para o papa; “Majestade” e “Alteza”, para reis e príncipes."},{"q":"Na frase “O livro que eu li é ótimo”, a palavra “que” retoma qual termo?","options":["eu","ótimo","o livro","li"],"answer":2,"explain":"“Que” é pronome relativo: ele retoma “o livro” e liga as duas partes da frase (o livro / eu li o livro)."},{"q":"Qual pronome possessivo corresponde à 2ª pessoa do singular (tu)?","options":["nosso","dele","teu","meu"],"answer":2,"explain":"Para “tu” usamos “teu/tua”. “Meu” é da 1ª pessoa e “nosso”, da 1ª do plural."},{"q":"Qual pronome pode substituir “Joana” na segunda frase para evitar repetição: “Joana comprou uma bicicleta. Joana adora pedalar.”?","options":["Ela","Elas","Nós","Ele"],"answer":0,"explain":"Joana é uma pessoa só, do feminino: o pronome adequado é “Ela”."},{"q":"Na frase “Aquela casa lá no alto é antiga”, o pronome “Aquela” indica que a casa está:","options":["longe de quem fala e de quem ouve","perto de quem ouve","perto de quem fala","dentro da casa de quem fala"],"answer":0,"explain":"“Aquele/aquela” indica algo distante tanto de quem fala quanto de quem ouve. “Este” indica perto de quem fala e “esse”, perto de quem ouve."}]},{"id":"6-por-verbos","name":"Verbos: tempos e modos","desc":"Reconhecer os tempos e modos verbais (indicativo, subjuntivo e imperativo) e o efeito de sentido de cada um.","questions":[{"q":"Na frase “Amanhã nós viajaremos para a praia”, o verbo está no:","options":["pretérito perfeito","futuro do pretérito","presente","futuro do presente"],"answer":3,"explain":"“Viajaremos” indica uma ação que ainda vai acontecer, com certeza: futuro do presente do indicativo."},{"q":"Na frase “Ontem eu estudei muito”, o verbo “estudei” está no:","options":["pretérito imperfeito","presente","futuro do presente","pretérito perfeito"],"answer":3,"explain":"“Estudei” indica uma ação que já aconteceu e terminou: pretérito perfeito."},{"q":"Em “Quando eu era criança, brincava na rua todos os dias”, o verbo “brincava” está no:","options":["futuro do pretérito","pretérito mais-que-perfeito","pretérito perfeito","pretérito imperfeito"],"answer":3,"explain":"“Brincava” indica uma ação que se repetia no passado, um hábito: pretérito imperfeito."},{"q":"Em “Se eu tivesse tempo, eu viajaria”, o verbo “viajaria” está no:","options":["futuro do presente","presente","futuro do pretérito","pretérito imperfeito"],"answer":2,"explain":"“Viajaria” indica algo que poderia acontecer dependendo de uma condição: futuro do pretérito."},{"q":"Qual frase tem um verbo no modo imperativo?","options":["Talvez ele feche a porta.","Eu fecho a porta todos os dias.","Feche a porta, por favor.","Ele fechou a porta."],"answer":2,"explain":"“Feche” expressa um pedido ou ordem, que é o papel do modo imperativo."},{"q":"O modo subjuntivo geralmente expressa:","options":["uma ação concluída com certeza","uma ordem direta","uma certeza","dúvida, possibilidade ou desejo"],"answer":3,"explain":"O subjuntivo é o modo das possibilidades: “Talvez chova”, “Espero que você venha”."},{"q":"Qual destes verbos pertence à 3ª conjugação?","options":["cantar","vender","comer","partir"],"answer":3,"explain":"Verbos terminados em “-ir” são da 3ª conjugação. “Cantar” é da 1ª (-ar); “vender” e “comer”, da 2ª (-er)."},{"q":"Em “Nós cantamos no coral”, o verbo está em qual pessoa?","options":["2ª pessoa do plural","1ª pessoa do singular","3ª pessoa do plural","1ª pessoa do plural"],"answer":3,"explain":"O sujeito é “nós”, que é a 1ª pessoa do plural."},{"q":"Qual é o infinitivo do verbo em “Eles fizeram o bolo”?","options":["fizer","fazer","fazendo","feito"],"answer":1,"explain":"O infinitivo é o “nome” do verbo, como aparece no dicionário: “fazer”."},{"q":"Qual destas formas é um gerúndio?","options":["correr","corrido","correu","correndo"],"answer":3,"explain":"O gerúndio termina em “-ndo” e indica uma ação em andamento: “correndo”."},{"q":"Qual é o particípio do verbo “escrever”?","options":["escrito","escrevera","escrevido","escrevendo"],"answer":0,"explain":"O particípio de “escrever” é irregular: “escrito” (por exemplo, “O texto foi escrito por ela”)."},{"q":"Complete com o verbo no subjuntivo: “Espero que você ___ à festa.”","options":["vem","vir","virá","venha"],"answer":3,"explain":"Depois de “espero que” usamos o subjuntivo, que expressa desejo: “que você venha”."},{"q":"Em receitas, como “Bata os ovos e misture a farinha”, os verbos aparecem geralmente no:","options":["futuro do pretérito","modo imperativo","modo subjuntivo","pretérito perfeito"],"answer":1,"explain":"Receitas dão instruções ao leitor, por isso usam o imperativo: “bata”, “misture”, “asse”."},{"q":"Qual é a forma correta do imperativo negativo de “correr” para “você”?","options":["Não corre.","Não corra.","Não correr.","Não correu."],"answer":1,"explain":"No imperativo negativo usamos a forma do subjuntivo: “Não corra” (você)."}]},{"id":"6-por-adverbio-preposicao-conjuncao","name":"Advérbio, preposição, conjunção e interjeição","desc":"Identificar advérbios e suas circunstâncias, preposições, conjunções e interjeições, e o sentido que dão à frase.","questions":[{"q":"Na frase “Ela chegou cedo”, a palavra “cedo” é um advérbio de:","options":["lugar","modo","tempo","intensidade"],"answer":2,"explain":"“Cedo” indica quando ela chegou, ou seja, uma circunstância de tempo."},{"q":"Na frase “O menino correu rapidamente”, o advérbio “rapidamente” indica:","options":["tempo","lugar","dúvida","modo"],"answer":3,"explain":"“Rapidamente” mostra como o menino correu. Muitos advérbios de modo terminam em “-mente”."},{"q":"Na frase “Moramos longe da escola”, a palavra “longe” é um advérbio de:","options":["lugar","afirmação","modo","tempo"],"answer":0,"explain":"“Longe” indica onde moramos em relação à escola: circunstância de lugar."},{"q":"Na frase “Estou muito cansado”, a palavra “muito” é um advérbio de:","options":["tempo","intensidade","negação","lugar"],"answer":1,"explain":"“Muito” aumenta a intensidade do adjetivo “cansado”."},{"q":"Na frase “Talvez chova amanhã”, o advérbio “Talvez” indica:","options":["afirmação","negação","lugar","dúvida"],"answer":3,"explain":"“Talvez” mostra que não há certeza de que vai chover: é advérbio de dúvida."},{"q":"Qual destas palavras é um advérbio de afirmação?","options":["ontem","talvez","certamente","jamais"],"answer":2,"explain":"“Certamente” confirma algo. “Talvez” é de dúvida, “jamais” é de negação e “ontem” é de tempo."},{"q":"Um advérbio pode modificar:","options":["apenas pronomes pessoais","apenas numerais e artigos","apenas substantivos e artigos","um verbo, um adjetivo ou outro advérbio"],"answer":3,"explain":"Exemplos: “correu bem” (verbo), “muito bonito” (adjetivo), “muito bem” (outro advérbio)."},{"q":"Na frase “Vou de ônibus para a escola”, quais palavras são preposições?","options":["“Vou” e “escola”","“ônibus” e “escola”","“Vou” e “ônibus”","“de” e “para”"],"answer":3,"explain":"“De” e “para” ligam palavras e criam relações de sentido (meio de transporte e destino)."},{"q":"A palavra “no”, em “O livro está no armário”, é a junção de:","options":["de + o","por + o","em + o","a + o"],"answer":2,"explain":"“No” é a contração da preposição “em” com o artigo “o”: em + o = no."},{"q":"Em “Vou à escola”, o acento grave em “à” indica:","options":["apenas um artigo feminino","uma interjeição","preposição “a” + artigo “a”","um pronome pessoal"],"answer":2,"explain":"Quem vai, vai “a” algum lugar (preposição) e “a escola” tem artigo. A fusão a + a = à se chama crase."},{"q":"Na frase “Estudei bastante, mas não passei”, a conjunção “mas” indica:","options":["oposição","causa","conclusão","adição"],"answer":0,"explain":"“Mas” liga duas ideias contrárias: estudar bastante e não passar."},{"q":"Na frase “Fui ao médico porque estava doente”, a conjunção “porque” indica:","options":["adição","alternância","oposição","causa"],"answer":3,"explain":"“Porque” introduz o motivo de ter ido ao médico, ou seja, a causa."},{"q":"Qual destas conjunções indica adição (soma de ideias)?","options":["mas","ou","e","porém"],"answer":2,"explain":"“E” junta ideias: “Comi e bebi”. “Mas” e “porém” indicam oposição; “ou” indica alternância."},{"q":"Na frase “Ufa! Terminei a prova.”, a interjeição “Ufa” expressa:","options":["raiva","medo","alívio","dor"],"answer":2,"explain":"“Ufa!” é usada quando nos sentimos aliviados depois de algo difícil."},{"q":"Qual destas palavras é uma interjeição?","options":["Oba!","embora","rápido","contra"],"answer":0,"explain":"Interjeições expressam emoções de forma curta, como “Oba!” (alegria). “Contra” é preposição e “embora” é conjunção."}]},{"id":"6-por-frase-oracao-periodo","name":"Frase, oração, período, sujeito e predicado","desc":"Diferenciar frase, oração e período e identificar sujeito e predicado nas orações.","questions":[{"q":"O que é uma oração?","options":["qualquer palavra isolada","um conjunto de parágrafos","um enunciado organizado em torno de um verbo","um enunciado que nunca tem verbo"],"answer":2,"explain":"Toda oração tem um verbo (ou locução verbal). É ao redor dele que a oração se organiza."},{"q":"O enunciado “Silêncio!” é:","options":["uma frase nominal, sem verbo","um período composto","um período simples","uma oração"],"answer":0,"explain":"“Silêncio!” tem sentido completo, então é frase, mas não tem verbo, então não é oração."},{"q":"Quantas orações há no período “Cheguei, tomei banho e dormi”?","options":["1","2","3","4"],"answer":2,"explain":"Há três verbos (cheguei, tomei, dormi), e cada verbo forma uma oração."},{"q":"O período “O sol brilhava no céu.” é classificado como:","options":["frase nominal","frase sem sentido","período simples","período composto"],"answer":2,"explain":"Tem apenas um verbo (brilhava), portanto uma só oração: é um período simples."},{"q":"Qual é o sujeito da oração “As crianças brincaram no parque”?","options":["brincaram no parque","no parque","brincaram","As crianças"],"answer":3,"explain":"O sujeito é o termo sobre o qual se fala e que concorda com o verbo: “As crianças” brincaram."},{"q":"Qual é o predicado da oração “Meu avô plantou uma árvore”?","options":["plantou uma árvore","Meu avô plantou","Meu avô","uma árvore"],"answer":0,"explain":"O predicado é o que se declara sobre o sujeito. Ele contém o verbo: “plantou uma árvore”."},{"q":"Na oração “Ana e Pedro viajaram”, o sujeito é:","options":["inexistente","simples","composto","oculto"],"answer":2,"explain":"O sujeito tem dois núcleos (Ana e Pedro), por isso é composto."},{"q":"Na oração “Fomos ao cinema ontem”, o sujeito é:","options":["inexistente","composto","oculto (nós)","simples"],"answer":2,"explain":"O sujeito “nós” não aparece escrito, mas é identificado pela terminação do verbo “fomos”."},{"q":"A oração “Choveu muito ontem” é classificada como:","options":["oração com sujeito composto","oração com sujeito simples","oração com sujeito oculto","oração sem sujeito"],"answer":3,"explain":"Verbos que indicam fenômenos da natureza, como chover e ventar, formam orações sem sujeito."},{"q":"Qual é o sujeito da oração “Chegaram as encomendas”?","options":["eles, oculto","Chegaram","as encomendas","não há sujeito"],"answer":2,"explain":"Perguntando “O que chegou?”, a resposta é “as encomendas”. O sujeito pode aparecer depois do verbo."},{"q":"No período “Ventou, choveu, esfriou”, as orações estão ligadas:","options":["por vírgulas, sem conectivo","pela conjunção “e”","por pronomes relativos","por preposições"],"answer":0,"explain":"As orações aparecem lado a lado, separadas apenas por vírgulas, sem palavra de ligação."},{"q":"Qual é o núcleo do sujeito em “O cachorro do vizinho latiu a noite toda”?","options":["vizinho","noite","cachorro","latiu"],"answer":2,"explain":"O sujeito é “O cachorro do vizinho”, e a palavra principal dele é “cachorro”, quem latiu."},{"q":"Qual destas frases é interrogativa?","options":["Feche a janela.","Hoje é sexta-feira.","Você vem amanhã?","Que dia lindo!"],"answer":2,"explain":"Frase interrogativa faz uma pergunta e termina com ponto de interrogação."},{"q":"Quantas orações há no período “Quero que você venha à festa”?","options":["2","4","1","3"],"answer":0,"explain":"Há dois verbos, “quero” e “venha”, então o período tem duas orações: é composto."}]},{"id":"6-por-concordancia","name":"Concordância nominal e verbal","desc":"Fazer o verbo concordar com o sujeito e os adjetivos concordarem com os substantivos, segundo a norma-padrão.","questions":[{"q":"Complete: “Os meninos ___ cedo.”","options":["chegaste","chega","chegaram","chegou"],"answer":2,"explain":"O sujeito “Os meninos” está no plural, então o verbo também vai para o plural: “chegaram”."},{"q":"Complete: “Ana e Júlia ___ ao parque.”","options":["foi","fui","foram","vai"],"answer":2,"explain":"Sujeito composto (Ana e Júlia) leva o verbo para o plural: “foram”."},{"q":"Complete com a forma correta do adjetivo “branco”: “Comprei duas camisas ___.”","options":["brancos","branco","brancas","branca"],"answer":2,"explain":"O adjetivo concorda com o substantivo “camisas”, que é feminino e plural: “brancas”."},{"q":"Qual frase usa o verbo “faltar” de acordo com a norma-padrão?","options":["Faltou dois dias para as férias.","Falta dois dias para as férias.","Falta duas semanas para as férias.","Faltam dois dias para as férias."],"answer":3,"explain":"O sujeito é “dois dias” (plural), por isso o verbo fica no plural: “Faltam”."},{"q":"Qual frase usa o verbo “fazer”, indicando tempo, de acordo com a norma-padrão?","options":["Fazem dois anos que me mudei.","Farão dois anos que me mudei.","Fizeram dois anos que me mudei.","Faz dois anos que me mudei."],"answer":3,"explain":"Quando indica tempo passado, o verbo “fazer” não tem sujeito e fica sempre no singular: “Faz dois anos”."},{"q":"Qual frase usa o verbo “haver” de acordo com a norma-padrão?","options":["Houveram muitas pessoas na festa.","Haviam muitas pessoas na festa.","Haverão muitas pessoas na festa.","Havia muitas pessoas na festa."],"answer":3,"explain":"Com o sentido de “existir”, o verbo “haver” não tem sujeito e fica no singular: “Havia”."},{"q":"Complete: “A turma ___ do passeio.”","options":["gostaste","gostaram","gostou","gostamos"],"answer":2,"explain":"“Turma” é um substantivo coletivo no singular, então o verbo fica no singular: “gostou”."},{"q":"Complete com a forma correta do adjetivo “novo”: “Os livros e a revista estão ___.”","options":["novos","nova","novo","novas"],"answer":0,"explain":"O adjetivo se refere ao sujeito composto (livros e revista). Com palavras masculinas e femininas juntas, usamos o masculino plural: “novos”."},{"q":"Qual frase usa a palavra “meio” de acordo com a norma-padrão?","options":["Ela está meia cansada.","Elas estão meias cansadas.","Ela está meios cansada.","Ela está meio cansada."],"answer":3,"explain":"Com o sentido de “um pouco”, “meio” é advérbio e não varia: “meio cansada”."},{"q":"Complete: “Nós ___ o trabalho ontem.”","options":["termino","terminou","terminamos","terminaram"],"answer":2,"explain":"O sujeito “nós” pede o verbo na 1ª pessoa do plural: “terminamos”."},{"q":"Complete: “Eu e você ___ amigos.”","options":["somos","sou","são","és"],"answer":0,"explain":"“Eu e você” equivale a “nós”, então o verbo vai para a 1ª pessoa do plural: “somos”."},{"q":"Complete com a forma correta: “Seguem ___ as fotos da viagem.”","options":["anexa","anexo","anexas","anexos"],"answer":2,"explain":"“Anexo” é adjetivo e concorda com “as fotos” (feminino plural): “anexas”."},{"q":"Qual frase apresenta concordância verbal correta?","options":["Os alunos da escola faz uma horta.","Os alunos da escola fez uma horta.","Os alunos da escola fizeram uma horta.","O aluno da escola fizeram uma horta."],"answer":2,"explain":"O núcleo do sujeito é “alunos” (plural), então o verbo fica no plural: “fizeram”."}]},{"id":"6-por-acentuacao-ortografia-pontuacao","name":"Acentuação, ortografia e pontuação","desc":"Classificar palavras pela sílaba tônica, acentuar e escrever corretamente e usar bem os sinais de pontuação.","questions":[{"q":"Qual destas palavras é oxítona (sílaba tônica é a última)?","options":["mesa","lâmpada","café","lápis"],"answer":2,"explain":"Em “ca-FÉ” a sílaba mais forte é a última, então a palavra é oxítona."},{"q":"Qual destas palavras é proparoxítona (sílaba tônica é a antepenúltima)?","options":["saúde","médico","caju","pé"],"answer":1,"explain":"Em “MÉ-di-co” a sílaba mais forte é a antepenúltima: a palavra é proparoxítona."},{"q":"Qual regra explica o acento nas palavras “pássaro”, “lâmpada” e “música”?","options":["Os monossílabos terminados em “a” são acentuados.","As oxítonas terminadas em “a” são acentuadas.","As paroxítonas terminadas em “o” são acentuadas.","Todas as proparoxítonas são acentuadas."],"answer":3,"explain":"As três palavras são proparoxítonas, e toda proparoxítona recebe acento."},{"q":"Qual é a escrita correta da palavra que significa “aquilo que foge à regra”?","options":["excessão","exceção","esceção","exseção"],"answer":1,"explain":"A grafia correta é “exceção”, com “xc” e “ç”."},{"q":"Qual é a escrita correta da palavra que significa “vantagem especial”?","options":["previlégio","privilégeo","privilégio","previlégeo"],"answer":2,"explain":"A grafia correta é “privilégio”, com “i” em “pri” e terminação “-gio”."},{"q":"Complete corretamente: “___ você faltou à aula?”","options":["Porque","Por quê","Porquê","Por que"],"answer":3,"explain":"Em perguntas, no início da frase, usamos “Por que” separado e sem acento."},{"q":"Complete corretamente: “Eu queria ir ao parque, ___ choveu.”","options":["mas","más","mais","mãs"],"answer":0,"explain":"“Mas” indica oposição (equivale a “porém”). “Mais” indica quantidade."},{"q":"Qual frase usa a vírgula corretamente?","options":["Pedro, venha aqui!","Eu gosto, de maçã.","O menino, comeu o bolo.","Pedro venha, aqui!"],"answer":0,"explain":"A vírgula separa o vocativo (o nome de quem é chamado): “Pedro, venha aqui!”. Não se separa sujeito e verbo com vírgula."},{"q":"Qual frase está pontuada corretamente?","options":["Comprei, arroz feijão ovos e leite.","Comprei arroz, feijão ovos e, leite.","Comprei arroz, feijão, ovos e leite.","Comprei arroz feijão, ovos, e, leite."],"answer":2,"explain":"Numa enumeração, a vírgula separa os itens, e antes do “e” final normalmente não se usa vírgula."},{"q":"Em textos narrativos, o travessão é usado principalmente para:","options":["separar as sílabas","indicar a fala de um personagem","indicar o plural","terminar uma pergunta"],"answer":1,"explain":"No diálogo, o travessão anuncia que um personagem vai falar: “— Vamos embora!”."},{"q":"Em “Levei três frutas: maçã, banana e uva”, os dois-pontos servem para:","options":["encerrar o texto","mostrar surpresa","indicar uma pergunta","anunciar uma enumeração"],"answer":3,"explain":"Os dois-pontos anunciam o que vem a seguir, aqui a lista das três frutas."},{"q":"Qual destas palavras está corretamente acentuada?","options":["cajú","rúim","sofá","tatú"],"answer":2,"explain":"Oxítonas terminadas em “a” levam acento (sofá). Oxítonas terminadas em “u”, como caju e tatu, não levam, e “ruim” também não tem acento."},{"q":"Segundo o Acordo Ortográfico em vigor, como se escreve a palavra?","options":["ideia","idéia","idêia","idéa"],"answer":0,"explain":"Com o Acordo Ortográfico, os ditongos abertos “ei” e “oi” das paroxítonas perderam o acento: “ideia”, “assembleia”, “heroico”."},{"q":"Qual é a escrita correta do substantivo que vem do adjetivo “belo”?","options":["beleza","beléza","belessa","belesa"],"answer":0,"explain":"Substantivos derivados de adjetivos, como belo → beleza, se escrevem com o sufixo “-eza”, com “z”."},{"q":"Qual é a separação silábica correta de “pássaro”?","options":["pás-sa-ro","pás-sar-o","pá-ssa-ro","páss-a-ro"],"answer":0,"explain":"Na separação silábica, as letras “ss” ficam em sílabas diferentes: pás-sa-ro."}]},{"id":"6-por-sentido-palavras-figuras","name":"Sentido das palavras e figuras de linguagem","desc":"Trabalhar sinônimos, antônimos, homônimos, formação de palavras e figuras como metáfora, comparação e hipérbole.","questions":[{"q":"Qual palavra é sinônimo de “alegre”?","options":["cansado","zangado","triste","contente"],"answer":3,"explain":"Sinônimos têm sentido parecido. “Contente” e “alegre” expressam o mesmo sentimento."},{"q":"Qual palavra é antônimo de “generoso”?","options":["gentil","egoísta","bondoso","caridoso"],"answer":1,"explain":"Antônimos têm sentidos opostos. Quem é generoso divide; quem é egoísta pensa só em si."},{"q":"Qual antônimo de “possível” é formado com um prefixo de negação?","options":["possivelmente","possibilidade","improvável","impossível"],"answer":3,"explain":"O prefixo “im-” dá ideia de negação: impossível é o contrário de possível."},{"q":"Qual palavra foi formada pelo acréscimo de um prefixo?","options":["guarda-chuva","pedra","refazer","pedreiro"],"answer":2,"explain":"“Refazer” vem de “fazer” com o prefixo “re-” no início, que indica repetição."},{"q":"Qual destas palavras é composta (formada pela junção de duas palavras)?","options":["desfazer","florzinha","jardineiro","girassol"],"answer":3,"explain":"“Girassol” junta “gira” e “sol”. As outras são formadas por prefixo ou sufixo."},{"q":"“Concerto” (apresentação musical) e “conserto” (reparo) são palavras:","options":["sinônimas","antônimas","homônimas","compostas"],"answer":2,"explain":"As duas soam igual, mas têm escrita e significado diferentes: são homônimas homófonas."},{"q":"Na frase “Seus olhos brilham como estrelas”, qual figura de linguagem aparece?","options":["hipérbole","metáfora","personificação","comparação"],"answer":3,"explain":"Há uma comparação explícita, feita com a palavra “como”."},{"q":"Na frase “Aquele menino é uma fera no futebol”, qual figura de linguagem aparece?","options":["onomatopeia","metáfora","comparação","personificação"],"answer":1,"explain":"O menino é chamado de “fera” sem usar “como”: é uma comparação implícita, ou seja, uma metáfora."},{"q":"Na frase “O vento cantava na janela”, qual figura de linguagem aparece?","options":["hipérbole","metonímia","comparação","personificação"],"answer":3,"explain":"Cantar é uma ação humana atribuída ao vento. Isso é personificação."},{"q":"Na frase “Já te disse isso um milhão de vezes!”, qual figura de linguagem aparece?","options":["personificação","comparação","hipérbole","onomatopeia"],"answer":2,"explain":"Há um exagero proposital para dar ênfase: é uma hipérbole."},{"q":"Na frase “Nas férias, li Machado de Assis”, qual figura de linguagem aparece?","options":["personificação","metonímia","hipérbole","comparação"],"answer":1,"explain":"O nome do autor foi usado no lugar das obras dele. Essa troca é uma metonímia."},{"q":"Na frase “O relógio fazia tique-taque”, a palavra “tique-taque” é uma:","options":["hipérbole","comparação","onomatopeia","metáfora"],"answer":2,"explain":"Onomatopeia é a palavra que imita um som, como o tique-taque do relógio."},{"q":"Em “O bebê dormia tranquilo”, qual palavra pode substituir “tranquilo” mantendo o sentido?","options":["sossegado","agitado","barulhento","nervoso"],"answer":0,"explain":"“Sossegado” tem sentido semelhante a “tranquilo”. “Agitado”, “barulhento” e “nervoso” dão ideia contrária."},{"q":"Na palavra “jardineiro”, o sufixo “-eiro” indica:","options":["negação","repetição","profissão","tamanho pequeno"],"answer":2,"explain":"“Jardineiro” é quem cuida do jardim, assim como padeiro faz pão e sapateiro conserta sapatos."}]},{"id":"6-por-generos-textuais","name":"Gêneros textuais e narrativa","desc":"Reconhecer notícia, crônica, poema, texto dramático e anúncio, os elementos da narrativa e a diferença entre fato e opinião.","questions":[{"q":"Em uma notícia, o lide é:","options":["a lista de fontes consultadas","a opinião do jornalista no final do texto","o primeiro parágrafo, que resume o fato","a foto principal da página"],"answer":2,"explain":"O lide abre a notícia e responde logo às perguntas principais sobre o fato."},{"q":"Qual frase expressa uma opinião?","options":["Choveu 30 milímetros ontem na cidade.","A escola tem 500 alunos.","Esse é o filme mais emocionante do ano.","O jogo terminou empatado."],"answer":2,"explain":"Dizer que um filme é “o mais emocionante” é uma avaliação pessoal; outras pessoas podem pensar diferente."},{"q":"Qual frase apresenta um fato?","options":["A ponte é a mais bonita do país.","Achei a inauguração muito chata.","A ponte foi inaugurada em março.","Todos deveriam visitar a ponte."],"answer":2,"explain":"A data da inauguração pode ser verificada. As outras frases são opiniões ou conselhos."},{"q":"Em geral, uma notícia é escrita:","options":["em 1ª pessoa, cheia de opiniões","em versos rimados","só com diálogos entre personagens","em 3ª pessoa, com linguagem objetiva"],"answer":3,"explain":"A notícia busca informar o fato de forma objetiva, por isso usa a 3ª pessoa."},{"q":"Quais são os elementos da narrativa?","options":["lide, manchete, legenda e foto","narrador, personagens, tempo, espaço e enredo","título, estrofe, verso e rima","tese, argumentos e conclusão"],"answer":1,"explain":"Toda história tem alguém que conta (narrador), quem participa (personagens), quando, onde e o que acontece (enredo)."},{"q":"No trecho “Eu nunca tinha visto um mar tão azul quando cheguei à ilha”, o narrador é:","options":["inexistente","narrador-personagem, em 1ª pessoa","narrador observador, em 3ª pessoa","um narrador que não participa da história"],"answer":1,"explain":"O narrador usa “eu” e participa da história: é narrador-personagem."},{"q":"Em uma narrativa, o clímax é:","options":["a apresentação dos personagens","o momento de maior tensão da história","o título do texto","o final da história"],"answer":1,"explain":"O clímax é o ponto alto do conflito, logo antes do desfecho."},{"q":"Em um poema, cada linha é chamada de:","options":["verso","rima","parágrafo","estrofe"],"answer":0,"explain":"Cada linha do poema é um verso. Um grupo de versos forma uma estrofe."},{"q":"Um poema tem 3 estrofes com 4 versos cada. Quantos versos ele tem ao todo?","options":["4","7","12","3"],"answer":2,"explain":"São 3 estrofes × 4 versos = 12 versos."},{"q":"Qual gênero parte de um fato do cotidiano, com texto curto, olhar pessoal e muitas vezes humor, e costuma ser publicado em jornais e revistas?","options":["verbete de dicionário","receita","crônica","notícia"],"answer":2,"explain":"A crônica comenta o dia a dia de forma pessoal e leve. A notícia, ao contrário, é objetiva."},{"q":"No texto dramático (peça de teatro), as rubricas são:","options":["os versos do poema","o resumo da notícia","indicações sobre cenário e gestos","as falas dos personagens"],"answer":2,"explain":"As rubricas orientam os atores e a montagem da peça; normalmente aparecem entre parênteses."},{"q":"Qual frase está em discurso indireto?","options":["— Estou com fome! — disse Mariana.","Mariana disse: — Estou com fome.","Mariana disse que estava com fome.","“Estou com fome”, disse Mariana."],"answer":2,"explain":"No discurso indireto, o narrador conta com suas palavras o que o personagem disse, geralmente usando “que”."},{"q":"O principal objetivo de um anúncio publicitário é:","options":["convencer o leitor de algo","contar uma história de ficção","ensinar a preparar uma receita","informar fatos de forma neutra"],"answer":0,"explain":"A publicidade usa recursos de persuasão para convencer o público."},{"q":"Em um jornal, o título principal de uma notícia, escrito em destaque, chama-se:","options":["legenda","lide","rubrica","manchete"],"answer":3,"explain":"A manchete é o título em destaque que chama a atenção do leitor."},{"q":"Regulamentos e leis costumam usar expressões como “deve” e “é proibido” para indicar:","options":["obrigações e proibições","fatos do passado","dúvidas do autor","sentimentos pessoais"],"answer":0,"explain":"Textos normativos estabelecem regras: o que deve e o que não pode ser feito."}]}]},{"id":"mat","name":"Matemática","topics":[{"id":"6-mat-sistemas-numeracao","name":"Sistema de numeração decimal e romano","desc":"Ler, escrever, comparar e arredondar números naturais grandes e usar números romanos.","gen":"roman","questions":[{"q":"Qual é o valor posicional do algarismo 7 no número 4.725.310?","options":["7.000","7.000.000","700.000","70.000"],"answer":2,"explain":"O 7 ocupa a ordem das centenas de milhar, então vale 700.000."},{"q":"Como se escreve por extenso o número 2.050.008?","options":["duzentos e cinco mil e oito","dois milhões, cinco mil e oito","dois milhões, quinhentos mil e oito","dois milhões, cinquenta mil e oito"],"answer":3,"explain":"2.050.008 = 2 milhões + 50 mil + 8."},{"q":"Qual número tem 3 unidades de milhão, 4 dezenas de milhar e 6 unidades?","options":["340.006","3.004.006","3.400.006","3.040.006"],"answer":3,"explain":"3.000.000 + 40.000 + 6 = 3.040.006. As ordens vazias são preenchidas com zero."},{"q":"Arredondando 2.468 para a centena mais próxima, obtemos:","options":["2.470","2.500","3.000","2.400"],"answer":1,"explain":"2.468 está entre 2.400 e 2.500, mais perto de 2.500, porque o algarismo das dezenas (6) é 5 ou mais."},{"q":"Um estádio recebeu 38.750 torcedores. Arredondando para a unidade de milhar mais próxima, quantos foram?","options":["38.000","40.000","39.000","38.800"],"answer":2,"explain":"38.750 está mais perto de 39.000 do que de 38.000, pois o algarismo das centenas (7) é 5 ou mais."},{"q":"Qual número é representado por XIV em algarismos romanos?","options":["16","9","14","140"],"answer":2,"explain":"X vale 10 e IV vale 4 (um antes do cinco subtrai). 10 + 4 = 14."},{"q":"Como se escreve 49 em algarismos romanos?","options":["IL","XLIX","LIX","XXXXIX"],"answer":1,"explain":"49 = 40 + 9. 40 é XL (50 − 10) e 9 é IX (10 − 1), formando XLIX."},{"q":"Qual número é representado por MMXXVI?","options":["2026","2036","2006","2024"],"answer":0,"explain":"MM = 2.000, XX = 20 e VI = 6. Total: 2.026."},{"q":"Qual símbolo romano representa o número 500?","options":["M","D","C","L"],"answer":1,"explain":"Os símbolos são: I=1, V=5, X=10, L=50, C=100, D=500 e M=1.000."},{"q":"Qual é o sucessor de 99.999?","options":["999.999","100.000","99.998","100.001"],"answer":1,"explain":"O sucessor é o número que vem logo depois: 99.999 + 1 = 100.000."},{"q":"Qual opção mostra os números em ordem crescente?","options":["1.089 < 1.098 < 1.809 < 1.890","1.890 < 1.809 < 1.098 < 1.089","1.089 < 1.809 < 1.098 < 1.890","1.098 < 1.089 < 1.890 < 1.809"],"answer":0,"explain":"Todos começam com 1 milhar. Comparando as centenas, dezenas e unidades: 1.089, 1.098, 1.809, 1.890."},{"q":"O nosso sistema de numeração é chamado de decimal porque:","options":["agrupa as quantidades de 10 em 10","só existem dez números","foi criado pelos romanos","só usa números com vírgula"],"answer":0,"explain":"No sistema decimal, 10 unidades formam 1 dezena, 10 dezenas formam 1 centena, e assim por diante."},{"q":"No número 506, o algarismo zero indica que:","options":["não há centenas","não há dezenas","o número é pequeno","não há unidades"],"answer":1,"explain":"506 = 5 centenas, 0 dezenas e 6 unidades. O zero marca a ordem vazia."},{"q":"Qual é o maior número de 4 algarismos, todos diferentes?","options":["9.876","9.999","9.786","9.870"],"answer":0,"explain":"Para o maior número, colocamos os maiores algarismos nas ordens mais altas, sem repetir: 9, 8, 7, 6."}]},{"id":"6-mat-operacoes-expressoes","name":"Operações, potências e expressões numéricas","desc":"Resolver problemas com as quatro operações, potências e expressões numéricas respeitando a ordem das operações.","gen":"expressions","questions":[{"q":"Quanto é 18 + 6 × 2?","options":["36","26","30","48"],"answer":2,"explain":"Primeiro a multiplicação: 6 × 2 = 12. Depois a adição: 18 + 12 = 30."},{"q":"Quanto é 40 − 4 × (3 + 2)?","options":["20","16","180","30"],"answer":0,"explain":"Primeiro os parênteses: 3 + 2 = 5. Depois 4 × 5 = 20. Por fim, 40 − 20 = 20."},{"q":"Quanto é [10 + (8 − 2) × 3] ÷ 4?","options":["12","4","28","7"],"answer":3,"explain":"(8 − 2) = 6; 6 × 3 = 18; 10 + 18 = 28; 28 ÷ 4 = 7."},{"q":"Quanto é 2³ + 5²?","options":["49","16","31","33"],"answer":3,"explain":"2³ = 2 × 2 × 2 = 8 e 5² = 5 × 5 = 25. Então 8 + 25 = 33."},{"q":"Quanto é 10⁴?","options":["40","100.000","1.000","10.000"],"answer":3,"explain":"10⁴ = 10 × 10 × 10 × 10 = 10.000: o número 1 seguido de quatro zeros."},{"q":"Qual é a raiz quadrada de 81?","options":["18","9","8","27"],"answer":1,"explain":"9 × 9 = 81, por isso a raiz quadrada de 81 é 9."},{"q":"Júlia comprou 3 cadernos de R$ 12 cada e uma mochila de R$ 85. Pagou com R$ 150. Quanto recebeu de troco?","options":["R$ 39","R$ 121","R$ 53","R$ 29"],"answer":3,"explain":"Cadernos: 3 × 12 = 36. Total: 36 + 85 = 121. Troco: 150 − 121 = 29 reais."},{"q":"Um ônibus leva 42 passageiros. Quantos ônibus, no mínimo, são necessários para levar 300 pessoas?","options":["6","9","7","8"],"answer":3,"explain":"7 ônibus levam 7 × 42 = 294 pessoas. Sobram 6 pessoas, que precisam de mais um ônibus: 8."},{"q":"Na divisão de 157 por 6, quais são o quociente e o resto?","options":["quociente 25 e resto 7","quociente 26 e resto 1","quociente 26 e resto 0","quociente 27 e resto 1"],"answer":1,"explain":"6 × 26 = 156 e 157 − 156 = 1. O resto sempre é menor que o divisor."},{"q":"Se 3 × □ + 5 = 26, qual é o valor de □?","options":["21","6","7","8"],"answer":2,"explain":"Tirando 5 dos dois lados: 3 × □ = 21. Dividindo os dois lados por 3: □ = 7."},{"q":"Carlos e Bia dividiram 60 figurinhas de modo que Bia ficou com o dobro de Carlos. Com quantas figurinhas Bia ficou?","options":["45","30","20","40"],"answer":3,"explain":"Carlos tem 1 parte e Bia 2 partes: 3 partes = 60, então 1 parte = 20. Bia ficou com 2 × 20 = 40."},{"q":"Uma turma tem 35 alunos, e há 5 meninas a mais que meninos. Quantas meninas há na turma?","options":["15","20","25","30"],"answer":1,"explain":"Tirando as 5 meninas a mais, sobram 30 alunos divididos igualmente: 15 meninos e 15 meninas. Somando as 5: 20 meninas."},{"q":"Quanto é 5² − 4 × 3 + 1?","options":["64","14","22","12"],"answer":1,"explain":"5² = 25; 4 × 3 = 12; depois, da esquerda para a direita: 25 − 12 + 1 = 14."},{"q":"Um teatro tem 28 fileiras com 35 cadeiras cada. Quantas cadeiras há no teatro?","options":["1.080","63","980","880"],"answer":2,"explain":"28 × 35 = 980 cadeiras."},{"q":"Quanto vale 7⁰?","options":["1","7","0","70"],"answer":0,"explain":"Todo número diferente de zero elevado a zero é igual a 1."}]},{"id":"6-mat-multiplos-divisores-primos","name":"Múltiplos, divisores, primos, MMC e MDC","desc":"Usar critérios de divisibilidade, reconhecer números primos e resolver problemas com MMC e MDC.","gen":"mmc_mdc","questions":[{"q":"Qual destes números é primo?","options":["27","29","39","21"],"answer":1,"explain":"29 só é divisível por 1 e por ele mesmo. 21 = 3 × 7, 27 = 3 × 9 e 39 = 3 × 13."},{"q":"Qual destes números é composto?","options":["51","47","41","53"],"answer":0,"explain":"51 = 3 × 17, então tem mais de dois divisores. Os outros são primos."},{"q":"Por que o número 1 não é considerado primo?","options":["porque tem apenas um divisor","porque é divisível por 2","porque é ímpar","porque é muito pequeno"],"answer":0,"explain":"Um número primo tem exatamente dois divisores: 1 e ele mesmo. O 1 tem só um divisor."},{"q":"Qual é a decomposição de 60 em fatores primos?","options":["2 × 3 × 10","2³ × 3 × 5","2² × 3 × 5","2 × 30"],"answer":2,"explain":"60 = 2 × 2 × 3 × 5 = 2² × 3 × 5. O 10 e o 30 não são primos, e 2³ × 3 × 5 dá 120."},{"q":"Quais são todos os divisores de 18?","options":["2, 3, 6 e 9","18, 36, 54 e 72","1, 2, 3, 6 e 9","1, 2, 3, 6, 9 e 18"],"answer":3,"explain":"Os divisores de 18 são os números que dividem 18 sem resto, incluindo o 1 e o próprio 18."},{"q":"Qual destes números é divisível por 3?","options":["4.511","4.512","4.522","4.513"],"answer":1,"explain":"Um número é divisível por 3 quando a soma dos algarismos é divisível por 3: 4 + 5 + 1 + 2 = 12."},{"q":"Qual destes números é divisível por 9?","options":["7.281","7.181","7.282","7.291"],"answer":0,"explain":"A soma dos algarismos de 7.281 é 7 + 2 + 8 + 1 = 18, que é divisível por 9."},{"q":"Qual destes números é divisível ao mesmo tempo por 2, por 5 e por 10?","options":["345","335","342","340"],"answer":3,"explain":"Números terminados em 0 são divisíveis por 2, 5 e 10 ao mesmo tempo."},{"q":"Dois ônibus saem juntos do terminal às 7 h. Um sai a cada 12 minutos e o outro a cada 18 minutos. Depois de quantos minutos eles sairão juntos de novo?","options":["36","30","216","6"],"answer":0,"explain":"Procuramos o menor múltiplo comum de 12 e 18: MMC(12, 18) = 36 minutos."},{"q":"Uma professora tem 24 lápis e 36 borrachas e quer montar kits iguais, com o maior número possível de kits, sem sobrar nada. Quantos kits ela vai montar?","options":["4","72","12","6"],"answer":2,"explain":"O maior número que divide 24 e 36 é o MDC(24, 36) = 12. Cada kit terá 2 lápis e 3 borrachas."},{"q":"Qual é o MMC de 4, 6 e 10?","options":["240","30","2","60"],"answer":3,"explain":"60 é o menor número que é múltiplo de 4, 6 e 10 ao mesmo tempo. O 30 não é múltiplo de 4."},{"q":"Qual é o MDC de 48 e 72?","options":["8","12","24","144"],"answer":2,"explain":"24 divide 48 (2 vezes) e 72 (3 vezes), e nenhum número maior divide os dois."},{"q":"Qual número entre 50 e 60 é múltiplo de 7?","options":["56","54","58","52"],"answer":0,"explain":"7 × 8 = 56. Os múltiplos de 7 perto daí são 49, 56 e 63."},{"q":"Ana tem uma caixa com menos de 40 bombons. Contando de 6 em 6 ou de 8 em 8, não sobra nenhum. Quantos bombons há na caixa?","options":["24","32","14","36"],"answer":0,"explain":"O número é múltiplo de 6 e de 8 ao mesmo tempo. O único menor que 40 é 24."},{"q":"Quantos números primos existem entre 1 e 20?","options":["10","9","8","7"],"answer":2,"explain":"São eles: 2, 3, 5, 7, 11, 13, 17 e 19. Total: 8."}]},{"id":"6-mat-fracoes","name":"Frações: ideia, equivalência e comparação","desc":"Entender frações como parte do todo e como divisão, encontrar frações equivalentes, comparar e calcular fração de quantidade.","gen":"frac_equiv","questions":[{"q":"Qual fração é equivalente a 2/3?","options":["4/9","6/8","3/2","8/12"],"answer":3,"explain":"Multiplicando numerador e denominador de 2/3 por 4, obtemos 8/12."},{"q":"Qual é a forma mais simples (irredutível) da fração 18/24?","options":["3/4","9/12","6/8","2/3"],"answer":0,"explain":"Dividindo 18 e 24 pelo MDC, que é 6, obtemos 3/4. As frações 9/12 e 6/8 ainda podem ser simplificadas."},{"q":"Qual destas frações é a maior?","options":["7/12","3/4","5/8","2/3"],"answer":1,"explain":"Com denominador 24: 3/4 = 18/24, 2/3 = 16/24, 5/8 = 15/24 e 7/12 = 14/24. A maior é 3/4."},{"q":"Quanto é 3/4 de 32?","options":["12","28","8","24"],"answer":3,"explain":"1/4 de 32 é 32 ÷ 4 = 8. Então 3/4 é 3 × 8 = 24."},{"q":"Uma pizza foi dividida em 8 pedaços iguais e Lucas comeu 3. Que fração da pizza sobrou?","options":["3/5","3/8","5/8","8/5"],"answer":2,"explain":"Sobraram 8 − 3 = 5 pedaços de 8, ou seja, 5/8 da pizza."},{"q":"Em uma turma de 30 alunos, 2/5 usam óculos. Quantos alunos usam óculos?","options":["12","6","15","18"],"answer":0,"explain":"1/5 de 30 é 6. Então 2/5 é 2 × 6 = 12 alunos."},{"q":"Qual é a forma decimal da fração 3/4?","options":["3,4","0,34","0,75","0,43"],"answer":2,"explain":"3 ÷ 4 = 0,75. Também dá para pensar: 3/4 = 75/100 = 0,75."},{"q":"Qual fração é igual a 0,5?","options":["2/5","1/5","5/100","1/2"],"answer":3,"explain":"0,5 = 5/10, que simplificado é 1/2: metade."},{"q":"A fração 7/4 corresponde a:","options":["1 inteiro e 3/4","3 inteiros e 1/4","7 inteiros e 1/4","1 inteiro e 1/4"],"answer":0,"explain":"7/4 = 4/4 + 3/4, ou seja, 1 inteiro e mais 3/4."},{"q":"Na reta numérica, a fração 9/4 fica entre quais números naturais?","options":["2 e 3","1 e 2","4 e 5","3 e 4"],"answer":0,"explain":"9/4 = 2 inteiros e 1/4 (ou 2,25), que está entre 2 e 3."},{"q":"Lia comeu 1/3 de uma barra de chocolate e Rui comeu 1/5 de uma barra igual. Quem comeu mais?","options":["Lia","Não é possível saber","Rui","Os dois comeram a mesma quantidade"],"answer":0,"explain":"Dividindo a barra em 3 partes, cada parte é maior do que dividindo em 5. Então 1/3 é maior que 1/5."},{"q":"Três pizzas iguais foram divididas igualmente entre 4 amigos. Que fração de pizza cada um recebeu?","options":["4/3","1/4","3/4","1/3"],"answer":2,"explain":"A fração também representa uma divisão: 3 pizzas ÷ 4 amigos = 3/4 de pizza para cada um."},{"q":"Qual número completa a igualdade 5/6 = □/30?","options":["25","5","35","24"],"answer":0,"explain":"De 6 para 30 multiplicamos por 5, então o numerador também: 5 × 5 = 25."},{"q":"Quantos minutos há em 1/4 de hora?","options":["40","15","25","4"],"answer":1,"explain":"Uma hora tem 60 minutos, e 60 ÷ 4 = 15 minutos."}]},{"id":"6-mat-adicao-subtracao-fracoes","name":"Adição e subtração de frações","desc":"Somar e subtrair frações com denominadores iguais e diferentes, em contas e problemas do dia a dia.","gen":"frac_add_diff","questions":[{"q":"Quanto é 2/7 + 3/7?","options":["6/7","5/49","5/14","5/7"],"answer":3,"explain":"Com denominadores iguais, somamos só os numeradores e mantemos o denominador: 2 + 3 = 5, então 5/7."},{"q":"Quanto é 1/2 + 1/3?","options":["2/5","5/6","1/6","2/6"],"answer":1,"explain":"Usando denominador 6: 1/2 = 3/6 e 1/3 = 2/6. Então 3/6 + 2/6 = 5/6."},{"q":"Quanto é 3/4 − 1/2?","options":["2/2","1/2","3/8","1/4"],"answer":3,"explain":"1/2 = 2/4. Então 3/4 − 2/4 = 1/4."},{"q":"Marina leu 1/4 de um livro de manhã e 2/5 à tarde. Que fração do livro ela leu no dia?","options":["3/20","7/20","3/9","13/20"],"answer":3,"explain":"Com denominador 20: 1/4 = 5/20 e 2/5 = 8/20. Somando: 13/20."},{"q":"Paulo já percorreu 5/8 de uma trilha. Que fração da trilha ainda falta percorrer?","options":["3/5","8/5","5/8","3/8"],"answer":3,"explain":"A trilha inteira é 8/8. Faltam 8/8 − 5/8 = 3/8."},{"q":"Quanto é 5/6 − 1/4?","options":["6/12","4/10","4/2","7/12"],"answer":3,"explain":"Com denominador 12: 5/6 = 10/12 e 1/4 = 3/12. Então 10/12 − 3/12 = 7/12."},{"q":"Quanto é 1 + 2/3?","options":["2/3","3/3","5/3","3/4"],"answer":2,"explain":"1 inteiro = 3/3. Então 3/3 + 2/3 = 5/3."},{"q":"Uma receita usa 1/2 xícara de açúcar branco e 1/4 de xícara de açúcar mascavo. Quanto de açúcar vai na receita ao todo?","options":["2/4 de xícara","1/6 de xícara","2/6 de xícara","3/4 de xícara"],"answer":3,"explain":"1/2 = 2/4. Então 2/4 + 1/4 = 3/4 de xícara."},{"q":"Uma caixa-d'água estava com 9/10 da sua capacidade, e foram usados 2/5. Com que fração da capacidade ela ficou?","options":["1/2","7/10","7/5","11/10"],"answer":0,"explain":"2/5 = 4/10. Então 9/10 − 4/10 = 5/10, que é igual a 1/2."},{"q":"Quanto é 2/3 + 1/6?","options":["3/6","4/6","3/9","5/6"],"answer":3,"explain":"2/3 = 4/6. Então 4/6 + 1/6 = 5/6."},{"q":"Na eleição da turma, Rafa teve 3/8 dos votos e Lia teve 1/4. Que fração dos votos os dois tiveram juntos?","options":["4/12","4/8","5/8","3/32"],"answer":2,"explain":"1/4 = 2/8. Então 3/8 + 2/8 = 5/8 dos votos."},{"q":"Pedro comeu 1/3 de uma torta e Joana comeu 1/2 da mesma torta. Que fração da torta sobrou?","options":["2/5","1/6","3/5","5/6"],"answer":1,"explain":"Juntos comeram 2/6 + 3/6 = 5/6. Sobrou 6/6 − 5/6 = 1/6."}]},{"id":"6-mat-decimais-porcentagem","name":"Números decimais e porcentagem","desc":"Ler, comparar e operar com números decimais (inclusive dinheiro) e calcular porcentagens simples.","gen":"decimals","questions":[{"q":"Quanto é 3,5 + 2,75?","options":["5,80","6,80","6,25","3,25"],"answer":2,"explain":"Alinhando as vírgulas: 3,50 + 2,75 = 6,25."},{"q":"Quanto é 10 − 4,35?","options":["5,65","5,75","6,35","6,65"],"answer":0,"explain":"Escrevendo 10 como 10,00: 10,00 − 4,35 = 5,65."},{"q":"Quanto é 2,4 × 3?","options":["6,12","0,72","72","7,2"],"answer":3,"explain":"24 × 3 = 72. Como 2,4 tem uma casa decimal, o resultado também tem: 7,2."},{"q":"Quanto é 7,5 ÷ 3?","options":["25","2,5","2,05","0,25"],"answer":1,"explain":"7,5 ÷ 3 = 2,5, porque 2,5 × 3 = 7,5."},{"q":"Qual destes números é o maior?","options":["0,75","0,7","0,8","0,089"],"answer":2,"explain":"Comparando com o mesmo número de casas: 0,800; 0,750; 0,089; 0,700. O maior é 0,8."},{"q":"Qual número é igual a 1,5?","options":["1,05","15","0,15","1,50"],"answer":3,"explain":"Zeros à direita da parte decimal não mudam o valor: 1,5 = 1,50."},{"q":"Como se lê o número 2,07?","options":["dois inteiros e sete centésimos","vinte e sete centésimos","dois inteiros e setenta centésimos","dois inteiros e sete décimos"],"answer":0,"explain":"O 7 está na segunda casa depois da vírgula, a casa dos centésimos."},{"q":"Bruna comprou um suco de R$ 4,50 e um sanduíche de R$ 8,75. Pagou com uma nota de R$ 20,00. Quanto recebeu de troco?","options":["R$ 6,25","R$ 6,75","R$ 13,25","R$ 7,25"],"answer":1,"explain":"Gasto: 4,50 + 8,75 = 13,25. Troco: 20,00 − 13,25 = 6,75 reais."},{"q":"Quanto é 3,47 × 10?","options":["0,347","347","34,7","3,470"],"answer":2,"explain":"Multiplicar por 10 desloca a vírgula uma casa para a direita: 34,7."},{"q":"Quanto é 25% de 80?","options":["40","55","20","25"],"answer":2,"explain":"25% é a quarta parte: 80 ÷ 4 = 20."},{"q":"Quanto é 10% de 350?","options":["35","340","3,5","70"],"answer":0,"explain":"10% é a décima parte: 350 ÷ 10 = 35."},{"q":"Uma camiseta custa R$ 60 e está com 20% de desconto. Qual é o preço com desconto?","options":["R$ 40","R$ 72","R$ 48","R$ 12"],"answer":2,"explain":"10% de 60 é 6, então 20% é 12. Preço final: 60 − 12 = 48 reais."},{"q":"50% de uma quantidade é o mesmo que:","options":["um décimo","o dobro","a metade","um quarto"],"answer":2,"explain":"50% = 50/100 = 1/2, ou seja, a metade."},{"q":"Em uma turma de 40 alunos, 30 foram ao passeio. Que porcentagem da turma foi ao passeio?","options":["25%","75%","70%","30%"],"answer":1,"explain":"30/40 = 3/4 = 75/100 = 75%."},{"q":"A fração 1/4 corresponde a qual porcentagem?","options":["25%","4%","14%","40%"],"answer":0,"explain":"1/4 = 25/100 = 25%."}]},{"id":"6-mat-geometria","name":"Ângulos, polígonos, sólidos e plano cartesiano","desc":"Classificar ângulos, triângulos e quadriláteros, contar elementos de prismas e pirâmides e localizar pontos no plano cartesiano.","questions":[{"q":"Como se chama um ângulo que mede exatamente 90°?","options":["obtuso","raso","reto","agudo"],"answer":2,"explain":"O ângulo reto mede 90°, como o canto de uma folha de papel."},{"q":"Um ângulo de 130° é classificado como:","options":["reto","raso","agudo","obtuso"],"answer":3,"explain":"Ângulos obtusos medem mais de 90° e menos de 180°."},{"q":"Quanto mede a soma dos ângulos internos de qualquer triângulo?","options":["90°","360°","180°","270°"],"answer":2,"explain":"Em todo triângulo, os três ângulos internos somam 180°."},{"q":"Um triângulo tem dois ângulos de 50° e 60°. Quanto mede o terceiro ângulo?","options":["250°","80°","110°","70°"],"answer":3,"explain":"180° − 50° − 60° = 70°."},{"q":"Como se chama o triângulo que tem os três lados com a mesma medida?","options":["retângulo","escaleno","isósceles","equilátero"],"answer":3,"explain":"Equilátero vem de “lados iguais”: os três lados têm a mesma medida."},{"q":"Como se chama o triângulo que tem um ângulo reto?","options":["triângulo obtusângulo","triângulo equilátero","triângulo retângulo","triângulo acutângulo"],"answer":2,"explain":"O triângulo que possui um ângulo de 90° se chama retângulo."},{"q":"Como se chama o polígono que tem 6 lados?","options":["hexágono","heptágono","pentágono","octógono"],"answer":0,"explain":"Hexa significa seis. Pentágono tem 5 lados, heptágono 7 e octógono 8."},{"q":"Um polígono é chamado de regular quando:","options":["todos os lados e ângulos são iguais","tem exatamente 4 lados","tem pelo menos um ângulo reto","tem todos os lados diferentes"],"answer":0,"explain":"Polígono regular tem lados de mesma medida e ângulos de mesma medida, como o quadrado e o triângulo equilátero."},{"q":"Qual afirmação sobre quadriláteros é verdadeira?","options":["Todo losango é um quadrado.","Nenhum quadrado é um losango.","Todo quadrado é um retângulo.","Todo retângulo é um quadrado."],"answer":2,"explain":"O quadrado tem 4 ângulos retos, então é um retângulo especial (e também um losango especial, pois tem 4 lados iguais)."},{"q":"Qual quadrilátero tem apenas um par de lados paralelos?","options":["trapézio","losango","retângulo","paralelogramo"],"answer":0,"explain":"O trapézio tem só um par de lados paralelos. Paralelogramo, retângulo e losango têm dois pares."},{"q":"No plano cartesiano, para marcar o ponto (3, 5) a partir da origem, andamos:","options":["3 unidades para baixo e 5 para a esquerda","5 unidades para a direita e 3 para cima","3 unidades para a direita e 5 para cima","8 unidades para a direita"],"answer":2,"explain":"No par ordenado, o primeiro número é a posição no eixo horizontal (x) e o segundo, no eixo vertical (y)."},{"q":"Quantos vértices tem um prisma de base triangular?","options":["9","3","6","5"],"answer":2,"explain":"São 2 bases triangulares com 3 vértices cada: 2 × 3 = 6 vértices."},{"q":"Quantas faces tem uma pirâmide de base quadrada?","options":["5","4","6","8"],"answer":0,"explain":"1 face é a base quadrada e 4 faces são triângulos laterais: 1 + 4 = 5."},{"q":"Quantas arestas tem um cubo?","options":["24","6","8","12"],"answer":3,"explain":"O cubo tem 4 arestas em cima, 4 embaixo e 4 nas laterais: 12 arestas. Ele tem 6 faces e 8 vértices."},{"q":"Duas retas perpendiculares são retas que:","options":["se cruzam formando só ângulos agudos","nunca se encontram","são sempre curvas","se cruzam formando ângulos retos"],"answer":3,"explain":"Retas perpendiculares se cruzam formando quatro ângulos de 90°. As que nunca se encontram são paralelas."},{"q":"Uma pessoa estava olhando para a frente e deu meia-volta. Quantos graus ela girou?","options":["90°","180°","360°","45°"],"answer":1,"explain":"Meia-volta é metade de uma volta completa: 360° ÷ 2 = 180°."}]},{"id":"6-mat-medidas-perimetro-area","name":"Medidas, perímetro e área","desc":"Converter unidades de comprimento, massa, capacidade e tempo e calcular perímetro e área de quadrados e retângulos.","gen":"area_perimeter","questions":[{"q":"Qual é a área de um retângulo com 8 m de comprimento e 5 m de largura?","options":["26 m²","80 m²","13 m²","40 m²"],"answer":3,"explain":"Área do retângulo = comprimento × largura = 8 × 5 = 40 m²."},{"q":"Qual é o perímetro de um quadrado com lado de 7 cm?","options":["14 cm","28 cm","49 cm","21 cm"],"answer":1,"explain":"O quadrado tem 4 lados iguais: 4 × 7 = 28 cm."},{"q":"Uma horta retangular mede 12 m por 6 m e vai ser cercada com uma volta de tela. Quantos metros de tela são necessários?","options":["18 m","72 m","24 m","36 m"],"answer":3,"explain":"O contorno é o perímetro: 12 + 6 + 12 + 6 = 36 m."},{"q":"Quantos metros há em 2,5 km?","options":["250 m","25 m","25.000 m","2.500 m"],"answer":3,"explain":"1 km = 1.000 m, então 2,5 × 1.000 = 2.500 m."},{"q":"Uma receita pede 750 g de farinha. Isso corresponde a:","options":["0,75 kg","75 kg","7,5 kg","0,075 kg"],"answer":0,"explain":"1 kg = 1.000 g, então 750 g = 750 ÷ 1.000 = 0,75 kg."},{"q":"Quantos copos de 250 mL podem ser enchidos com uma garrafa de 1,5 L?","options":["6","5","60","4"],"answer":0,"explain":"1,5 L = 1.500 mL, e 1.500 ÷ 250 = 6 copos."},{"q":"Um filme dura 135 minutos. Quanto tempo é isso em horas e minutos?","options":["1 h 55 min","2 h 15 min","2 h 35 min","1 h 35 min"],"answer":1,"explain":"120 minutos são 2 horas, e sobram 15 minutos: 2 h 15 min."},{"q":"De manhã, o termômetro marcava 14 °C e à tarde, 27 °C. Quantos graus a temperatura subiu?","options":["41 °C","13 °C","11 °C","12 °C"],"answer":1,"explain":"27 − 14 = 13 graus de diferença."},{"q":"Se dobrarmos a medida do lado de um quadrado, o que acontece com a área?","options":["fica 2 vezes maior","continua igual","fica 3 vezes maior","fica 4 vezes maior"],"answer":3,"explain":"Exemplo: lado 2 dá área 4; lado 4 dá área 16, que é 4 vezes maior."},{"q":"Se dobrarmos a medida do lado de um quadrado, o que acontece com o perímetro?","options":["continua igual","fica 3 vezes maior","dobra","fica 4 vezes maior"],"answer":2,"explain":"Exemplo: lado 2 dá perímetro 8; lado 4 dá perímetro 16, que é o dobro."},{"q":"Uma caixa foi enchida com cubinhos iguais: 4 na frente, 3 de lado e 2 camadas de altura. Quantos cubinhos cabem nela?","options":["9","20","12","24"],"answer":3,"explain":"Volume em cubinhos: 4 × 3 × 2 = 24."},{"q":"Um terreno quadrado tem perímetro de 40 m. Qual é a área desse terreno?","options":["160 m²","100 m²","40 m²","1.600 m²"],"answer":1,"explain":"Cada lado mede 40 ÷ 4 = 10 m. A área é 10 × 10 = 100 m²."},{"q":"Lucas saiu de casa às 13h40 e chegou à casa da avó às 15h10. Quanto tempo durou a viagem?","options":["1 h 30 min","2 h 10 min","2 h 30 min","1 h 50 min"],"answer":0,"explain":"De 13h40 até 14h40 é 1 hora; de 14h40 até 15h10 são mais 30 minutos. Total: 1 h 30 min."},{"q":"O piso de uma sala de 5 m por 4 m será trocado. Cada caixa de piso cobre 2 m². Quantas caixas são necessárias?","options":["10","20","9","18"],"answer":0,"explain":"Área da sala: 5 × 4 = 20 m². Caixas: 20 ÷ 2 = 10."}]},{"id":"6-mat-probabilidade-estatistica","name":"Probabilidade e estatística","desc":"Calcular probabilidades simples, ler tabelas e gráficos e calcular a média de um conjunto de dados.","questions":[{"q":"Ao lançar um dado comum de 6 faces, qual é a probabilidade de sair o número 4?","options":["1/2","1/4","1/6","4/6"],"answer":2,"explain":"Há 6 resultados possíveis e só 1 deles é o número 4: probabilidade 1/6."},{"q":"Ao lançar um dado comum de 6 faces, qual é a probabilidade de sair um número par?","options":["1/2","1/3","1/6","2/3"],"answer":0,"explain":"Os pares são 2, 4 e 6: 3 resultados em 6, ou seja, 3/6 = 1/2."},{"q":"Ao lançar uma moeda, qual é a probabilidade de sair cara?","options":["10%","100%","25%","50%"],"answer":3,"explain":"Há dois lados possíveis, cara e coroa: 1/2 = 50%."},{"q":"Uma urna tem 3 bolas vermelhas, 5 azuis e 2 verdes. Sorteando uma bola, qual é a probabilidade de ela ser azul?","options":["2/5","1/2","1/5","3/10"],"answer":1,"explain":"São 10 bolas no total e 5 são azuis: 5/10 = 1/2."},{"q":"Uma urna tem 3 bolas vermelhas, 5 azuis e 2 verdes. Qual cor tem a maior chance de ser sorteada?","options":["verde","azul","todas têm a mesma chance","vermelha"],"answer":1,"explain":"Há mais bolas azuis (5) do que de qualquer outra cor."},{"q":"Qual é a probabilidade de sair o número 7 ao lançar um dado comum de 6 faces?","options":["1/6","0","7/6","1/7"],"answer":1,"explain":"O dado comum só tem números de 1 a 6. Sair 7 é um evento impossível: probabilidade 0."},{"q":"As notas de Clara foram 6, 8, 7 e 9. Qual é a média dessas notas?","options":["30","7","7,5","8"],"answer":2,"explain":"Somamos as notas: 6 + 8 + 7 + 9 = 30. Dividimos pela quantidade: 30 ÷ 4 = 7,5."},{"q":"Um time marcou 2, 0, 3, 1 e 4 gols em cinco jogos. Qual foi a média de gols por jogo?","options":["10","2,5","3","2"],"answer":3,"explain":"Total: 2 + 0 + 3 + 1 + 4 = 10 gols. Média: 10 ÷ 5 = 2 gols por jogo."},{"q":"Em um gráfico, a informação que diz de onde os dados foram retirados chama-se:","options":["eixo","título","legenda","fonte"],"answer":3,"explain":"A fonte mostra a origem dos dados, o que ajuda a saber se são confiáveis."},{"q":"Numa pesquisa, 12 alunos escolheram futebol, 8 escolheram vôlei e 5 escolheram natação. Quantos alunos responderam?","options":["3","12","25","20"],"answer":2,"explain":"Somando as frequências: 12 + 8 + 5 = 25 alunos."},{"q":"Em uma pesquisa com 20 alunos, 5 preferem suco de uva. Que porcentagem prefere suco de uva?","options":["25%","20%","5%","50%"],"answer":0,"explain":"5/20 = 1/4 = 25%."},{"q":"Qual gráfico é mais adequado para mostrar como a temperatura variou ao longo dos dias da semana?","options":["fluxograma","gráfico de setores","gráfico de linhas","planta baixa"],"answer":2,"explain":"O gráfico de linhas mostra bem como um valor sobe ou desce ao longo do tempo."},{"q":"Qual gráfico é mais adequado para mostrar como um total se divide em partes, como 50%, 30% e 20%?","options":["gráfico de setores","planta baixa","fluxograma","gráfico de linhas"],"answer":0,"explain":"O gráfico de setores (gráfico de pizza) mostra as partes de um todo."},{"q":"Rita lançou uma moeda 10 vezes e saiu cara 7 vezes. O que isso mostra?","options":["Em poucos lançamentos, o resultado pode ficar longe da probabilidade de 1/2.","A moeda vai dar sempre cara.","A probabilidade de sair cara passou a ser 7/10 para sempre.","A probabilidade de sair coroa é zero."],"answer":0,"explain":"A probabilidade de cara continua 1/2. Quanto mais lançamentos fazemos, mais o resultado tende a se aproximar da metade."}]}]},{"id":"cie","name":"Ciências","topics":[{"id":"6-cie-misturas-separacao","name":"Misturas e separação de misturas","desc":"Classificar misturas em homogêneas e heterogêneas e escolher o método certo para separá-las.","questions":[{"q":"Água e óleo colocados no mesmo copo formam uma mistura:","options":["heterogênea","homogênea","que é uma substância pura","que vira um único líquido"],"answer":0,"explain":"Dá para ver o óleo separado da água, em duas fases. Por isso a mistura é heterogênea."},{"q":"Água com sal totalmente dissolvido forma uma mistura:","options":["homogênea","heterogênea","que é uma substância pura","de duas fases"],"answer":0,"explain":"O sal se dissolve e não conseguimos distinguir as partes: a mistura tem uma só fase, é homogênea."},{"q":"Qual destas é uma mistura homogênea?","options":["água e areia","água com pedaços de gelo e pedrinhas","água com açúcar dissolvido","água e óleo"],"answer":2,"explain":"Na água com açúcar dissolvido não se distinguem as partes. Nas outras, vemos fases diferentes."},{"q":"Quantas fases tem uma mistura de água, óleo e areia?","options":["3","2","4","1"],"answer":0,"explain":"Água, óleo e areia ficam separados e visíveis: são três fases."},{"q":"Qual método usa um papel ou pano poroso para reter a areia e deixar a água passar?","options":["evaporação","filtração","destilação","catação"],"answer":1,"explain":"Na filtração, o filtro segura as partículas sólidas e deixa o líquido atravessar."},{"q":"Nas salinas, o sal de cozinha é obtido da água do mar por:","options":["filtração","evaporação","separação magnética","catação"],"answer":1,"explain":"O sol e o vento evaporam a água, e o sal fica depositado no fundo dos tanques."},{"q":"Qual é o melhor método para separar limalha de ferro misturada com areia?","options":["decantação","evaporação","separação magnética, com um ímã","filtração"],"answer":2,"explain":"O ferro é atraído pelo ímã e a areia não. Assim, os dois se separam facilmente."},{"q":"Quando escolhemos o feijão com as mãos, retirando pedrinhas e grãos estragados, usamos qual método?","options":["destilação","catação","decantação","peneiração"],"answer":1,"explain":"Catação é separar com as mãos ou com uma pinça os componentes sólidos que conseguimos ver."},{"q":"Na construção, os pedreiros separam as pedrinhas maiores da areia fina usando:","options":["separação magnética","destilação","evaporação","peneiração"],"answer":3,"explain":"A peneira deixa passar os grãos pequenos e segura os maiores."},{"q":"Qual método permite separar e recolher a água pura de uma solução de água com sal?","options":["destilação simples","evaporação ao ar livre","decantação","filtração"],"answer":0,"explain":"Na destilação, a água evapora, o vapor é resfriado, volta a ser líquido e é recolhido. O sal fica no recipiente inicial."},{"q":"Nas refinarias, o petróleo é separado em gasolina, diesel e outros produtos por meio de:","options":["destilação fracionada","filtração","peneiração","catação"],"answer":0,"explain":"Cada componente do petróleo ferve em uma temperatura diferente, e assim eles são separados em frações."},{"q":"Deixar uma mistura de água e terra em repouso para a terra ir ao fundo é um método chamado:","options":["decantação","destilação","catação","evaporação"],"answer":0,"explain":"Na decantação, o material mais denso se deposita no fundo pela ação da gravidade."},{"q":"Qual equipamento de laboratório é usado para separar água e óleo?","options":["peneira","funil de separação","ímã","pinça"],"answer":1,"explain":"O funil de separação tem uma torneira: a água, mais densa, fica embaixo e sai primeiro, e o óleo fica em cima."},{"q":"O ar que respiramos, sem poeira, é:","options":["uma mistura heterogênea de líquidos","um único gás chamado nitrogênio","uma mistura homogênea de gases","uma substância pura formada só por oxigênio"],"answer":2,"explain":"O ar é uma mistura de gases, principalmente nitrogênio e oxigênio, que não conseguimos distinguir: é homogênea."}]},{"id":"6-cie-transformacoes-quimicas","name":"Transformações químicas e materiais sintéticos","desc":"Reconhecer sinais de transformação química e entender a produção de materiais sintéticos e medicamentos e seus impactos.","questions":[{"q":"Ao misturar vinagre com bicarbonato de sódio, aparecem muitas bolhas. Isso indica que:","options":["houve apenas uma mudança de estado físico","o bicarbonato apenas se dissolveu no vinagre","formou-se uma mistura sem nenhuma reação","houve transformação química, com formação de gás"],"answer":3,"explain":"As bolhas são de gás carbônico, uma substância nova que não existia antes. Isso é sinal de transformação química."},{"q":"Qual destes é um exemplo de transformação química?","options":["dissolver açúcar na água","derreter um cubo de gelo","rasgar uma folha de papel","queimar um papel"],"answer":3,"explain":"Na queima, o papel vira cinzas, fumaça e gases: novas substâncias são formadas."},{"q":"Qual destes é um exemplo de transformação física?","options":["a fruta apodrecendo","o gelo derretendo","o bolo assando","o ferro enferrujando"],"answer":1,"explain":"Quando o gelo derrete, a água só muda de estado físico. Continua sendo água."},{"q":"Qual destas situações é um sinal de que ocorreu uma transformação química?","options":["gelo derretendo em um copo","mudança de formato de uma massinha de modelar","papel sendo dobrado ao meio","liberação de gás ao misturar duas substâncias"],"answer":3,"explain":"Liberação de gás, mudança de cor, produção de luz ou calor e formação de sólido são evidências de transformação química."},{"q":"A ferrugem se forma quando o ferro reage com:","options":["o oxigênio do ar e a umidade","apenas a luz do sol","o açúcar","a areia"],"answer":0,"explain":"O ferro em contato com oxigênio e água se transforma em ferrugem, uma nova substância."},{"q":"Para que uma combustão (queima) aconteça, são necessários:","options":["água, gelo e sombra","luz, água e sal","combustível, oxigênio e calor","vento, areia e frio"],"answer":2,"explain":"Esses três elementos formam o chamado triângulo do fogo. Sem um deles, o fogo apaga."},{"q":"O plástico é um material:","options":["mineral, encontrado pronto nas rochas","de origem animal, feito de couro e ossos","natural, retirado pronto das árvores","sintético, fabricado principalmente a partir do petróleo"],"answer":3,"explain":"O plástico não existe pronto na natureza: ele é fabricado em indústrias, em geral a partir do petróleo."},{"q":"Qual é um problema ambiental causado pelo descarte incorreto de plásticos?","options":["eles deixam o solo mais fértil","eles purificam a água dos rios","eles demoram muito para se decompor","eles se decompõem em poucos dias"],"answer":2,"explain":"Muitos plásticos levam centenas de anos para se decompor e podem poluir rios e mares e prejudicar animais."},{"q":"Os antibióticos são medicamentos usados para combater infecções causadas por:","options":["vírus","alergias","bactérias","piolhos"],"answer":2,"explain":"Antibióticos agem contra bactérias. Eles não funcionam contra vírus, como os da gripe."},{"q":"Por que não devemos tomar remédios sem orientação médica?","options":["porque remédios só servem para adultos","porque remédios nunca funcionam","porque todo remédio é feito de plástico","porque podem causar efeitos indesejados e intoxicação"],"answer":3,"explain":"Cada remédio tem dose e uso certos. Usar sem orientação pode fazer mal à saúde."},{"q":"Cozinhar um ovo é uma transformação:","options":["que não muda nada no ovo","química, pois o ovo cozido não volta a ser cru","física, pois o ovo pode voltar a ser cru","física, pois o ovo só muda de estado"],"answer":1,"explain":"O calor modifica as substâncias do ovo, e essa mudança não pode ser desfeita: é uma transformação química."},{"q":"A água que congela no freezer pode voltar a ser líquida. Isso mostra uma transformação:","options":["química","que forma uma nova substância","que destrói a água","física"],"answer":3,"explain":"Na mudança de estado físico a substância continua a mesma, só muda a forma como se apresenta."},{"q":"A massa do pão cresce por causa do fermento biológico. O que faz a massa crescer?","options":["o ar que entra pela janela","o gás carbônico liberado pelo fermento","o sal adicionado à receita","a água que evapora da massa"],"answer":1,"explain":"O fermento biológico tem fungos microscópicos que transformam o açúcar e liberam gás carbônico, que forma bolhas na massa."},{"q":"Qual atitude ajuda a reduzir o impacto ambiental dos materiais sintéticos?","options":["jogar embalagens nos rios","separar o lixo para a reciclagem","usar mais sacolas descartáveis","queimar plástico no quintal"],"answer":1,"explain":"A reciclagem permite reaproveitar materiais e diminui a quantidade de lixo no ambiente."}]},{"id":"6-cie-celula-niveis-organizacao","name":"Célula e níveis de organização","desc":"Conhecer as partes da célula, diferenciar célula animal e vegetal e ordenar os níveis de organização dos seres vivos.","questions":[{"q":"Qual é a unidade básica que forma todos os seres vivos?","options":["o sistema","o tecido","o órgão","a célula"],"answer":3,"explain":"Todos os seres vivos são formados por células, desde as bactérias até os seres humanos."},{"q":"Qual estrutura da célula controla a entrada e a saída de substâncias?","options":["o citoplasma","o núcleo","o cloroplasto","a membrana plasmática"],"answer":3,"explain":"A membrana plasmática envolve a célula e seleciona o que entra e o que sai."},{"q":"Qual é a função principal do núcleo da célula?","options":["fazer a fotossíntese da célula","proteger a célula contra o frio","guardar o material genético e controlar a célula","produzir os ossos do esqueleto"],"answer":2,"explain":"No núcleo fica o DNA, que tem as informações que comandam o funcionamento da célula."},{"q":"A região da célula entre a membrana e o núcleo, onde ficam as organelas, chama-se:","options":["parede celular","citoplasma","tecido","cromossomo"],"answer":1,"explain":"O citoplasma é preenchido por um material gelatinoso onde ficam as organelas."},{"q":"Quais estruturas a célula vegetal tem e a célula animal não tem?","options":["parede celular e cloroplastos","citoplasma e núcleo","mitocôndrias e membrana plasmática","núcleo e membrana plasmática"],"answer":0,"explain":"A parede celular dá rigidez à célula vegetal, e os cloroplastos fazem a fotossíntese. As outras estruturas existem nos dois tipos de célula."},{"q":"Em qual organela acontece a fotossíntese?","options":["mitocôndria","membrana plasmática","núcleo","cloroplasto"],"answer":3,"explain":"Os cloroplastos têm clorofila, o pigmento verde que capta a luz do Sol para a fotossíntese."},{"q":"Qual organela é responsável pela respiração celular, que libera energia para a célula?","options":["mitocôndria","núcleo","cloroplasto","parede celular"],"answer":0,"explain":"Nas mitocôndrias, a energia dos alimentos é liberada para a célula usar."},{"q":"Qual é a ordem correta dos níveis de organização, do mais simples ao mais complexo?","options":["organismo, sistema, órgão, tecido, célula","tecido, célula, sistema, órgão, organismo","célula, tecido, órgão, sistema, organismo","órgão, célula, tecido, organismo, sistema"],"answer":2,"explain":"Células formam tecidos, tecidos formam órgãos, órgãos formam sistemas e os sistemas formam o organismo."},{"q":"O coração é um exemplo de:","options":["célula","órgão","organismo","tecido"],"answer":1,"explain":"O coração é formado por vários tecidos que trabalham juntos para bombear o sangue: é um órgão."},{"q":"Qual destes seres vivos é formado por uma única célula?","options":["a bactéria","o cogumelo","o cachorro","a árvore"],"answer":0,"explain":"As bactérias são unicelulares. Cachorros, árvores e cogumelos são pluricelulares."},{"q":"Qual instrumento é usado para observar células, que são pequenas demais para ver a olho nu?","options":["periscópio","estetoscópio","telescópio","microscópio"],"answer":3,"explain":"O microscópio amplia muito a imagem e permite ver as células. O telescópio é usado para observar astros."},{"q":"As bactérias são células sem núcleo definido. Por isso são chamadas de:","options":["vegetais","procariontes","pluricelulares","eucariontes"],"answer":1,"explain":"Células procariontes não têm o material genético envolvido por uma membrana. Células eucariontes têm núcleo definido."},{"q":"Um conjunto de células parecidas que realizam a mesma função forma um:","options":["tecido","sistema","órgão","organismo"],"answer":0,"explain":"Por exemplo, o tecido muscular é formado por células musculares que se contraem."},{"q":"O sistema nervoso é formado por quais órgãos?","options":["coração, veias e artérias","encéfalo, medula espinal e nervos","pulmões, traqueia e brônquios","estômago, fígado e intestinos"],"answer":1,"explain":"Um sistema é um conjunto de órgãos que trabalham juntos. Encéfalo, medula e nervos formam o sistema nervoso."}]},{"id":"6-cie-sistema-nervoso","name":"Sistema nervoso, sentidos e substâncias psicoativas","desc":"Entender como o sistema nervoso coordena o corpo e os sentidos e como algumas substâncias o afetam.","questions":[{"q":"Qual é a principal célula do sistema nervoso, que transmite os impulsos nervosos?","options":["célula muscular","hemácia","neurônio","célula da pele"],"answer":2,"explain":"Os neurônios recebem e transmitem informações na forma de impulsos nervosos."},{"q":"Por qual parte do neurônio o impulso nervoso sai em direção a outra célula?","options":["corpo celular","axônio","dendritos","núcleo"],"answer":1,"explain":"Os dendritos recebem o impulso, ele passa pelo corpo celular e sai pelo axônio."},{"q":"O sistema nervoso central é formado por:","options":["nervos e gânglios","encéfalo e medula espinal","coração e pulmões","ossos e músculos"],"answer":1,"explain":"O encéfalo e a medula espinal ficam protegidos pelo crânio e pela coluna vertebral e formam o sistema nervoso central."},{"q":"O sistema nervoso periférico é formado principalmente por:","options":["ossos e articulações","encéfalo e medula espinal","nervos e gânglios","veias e artérias"],"answer":2,"explain":"Os nervos ligam o sistema nervoso central a todas as partes do corpo."},{"q":"Quando encostamos a mão em algo muito quente e a tiramos rapidamente, sem pensar, qual estrutura comanda essa resposta?","options":["cerebelo","estômago","medula espinal","coração"],"answer":2,"explain":"Esse é um ato reflexo: a medula espinal responde rápido, antes mesmo de o cérebro perceber a dor."},{"q":"Qual parte do encéfalo é responsável pelo equilíbrio e pela coordenação dos movimentos?","options":["nervo óptico","bulbo","cerebelo","medula espinal"],"answer":2,"explain":"O cerebelo ajuda a manter o equilíbrio do corpo e a fazer movimentos precisos."},{"q":"Qual parte do encéfalo é responsável pelo pensamento, pela memória e pelos movimentos voluntários?","options":["cérebro","bulbo","cerebelo","medula espinal"],"answer":0,"explain":"O cérebro é a maior parte do encéfalo e cuida do raciocínio, da memória, da linguagem e das ações que decidimos fazer."},{"q":"Qual parte do encéfalo controla funções vitais como a respiração e os batimentos do coração?","options":["tronco encefálico (bulbo)","cerebelo","cérebro","nervo óptico"],"answer":0,"explain":"O bulbo, no tronco encefálico, controla funções que acontecem sem precisarmos pensar, como respirar."},{"q":"Qual órgão dos sentidos percebe os sabores dos alimentos?","options":["a pele","o ouvido","o olho","a língua"],"answer":3,"explain":"A língua tem papilas gustativas, que percebem doce, salgado, azedo, amargo e outros sabores."},{"q":"Quando estamos resfriados, muitas vezes sentimos menos o sabor da comida. Por quê?","options":["porque o olfato também participa da percepção do sabor","porque o resfriado tira o sal dos alimentos","porque a língua para de funcionar","porque a audição fica mais fraca"],"answer":0,"explain":"Com o nariz entupido, sentimos menos o cheiro dos alimentos, e o cheiro faz parte do sabor."},{"q":"Por que é proibido dirigir depois de ingerir bebida alcoólica?","options":["porque o álcool deixa os reflexos mais lentos","porque o álcool fortalece os músculos","porque o álcool melhora a visão","porque o álcool deixa a pessoa mais atenta"],"answer":0,"explain":"O álcool age no sistema nervoso e diminui a atenção e a rapidez das reações, aumentando o risco de acidentes."},{"q":"A cafeína, presente no café e em alguns refrigerantes, age no sistema nervoso como:","options":["vitamina","anestésico","depressora","estimulante"],"answer":3,"explain":"A cafeína estimula o sistema nervoso e pode deixar a pessoa mais agitada e sem sono."},{"q":"A nicotina, presente no cigarro, é uma substância que:","options":["causa dependência","melhora a respiração","protege os pulmões","é uma vitamina natural"],"answer":0,"explain":"A nicotina causa dependência, e o cigarro traz muitos danos à saúde, como doenças nos pulmões e no coração."},{"q":"O ponto de comunicação entre dois neurônios chama-se:","options":["medula","dendrito","sinapse","axônio"],"answer":2,"explain":"Na sinapse, o impulso nervoso passa de um neurônio para outro por meio de substâncias químicas."}]},{"id":"6-cie-visao-lentes","name":"Visão e lentes","desc":"Conhecer as partes do olho, como enxergamos e quais lentes corrigem miopia, hipermetropia e outros problemas.","questions":[{"q":"Qual é a parte colorida do olho?","options":["íris","retina","pupila","córnea"],"answer":0,"explain":"A íris dá a cor dos olhos (castanhos, verdes, azuis) e controla o tamanho da pupila."},{"q":"O que acontece com a pupila quando estamos em um ambiente escuro?","options":["ela dilata (aumenta) para entrar mais luz","ela se fecha totalmente","ela diminui para entrar menos luz","ela muda de cor"],"answer":0,"explain":"No escuro, a pupila se abre mais para captar a pouca luz disponível."},{"q":"Em qual parte do olho a imagem se forma e onde ficam as células sensíveis à luz?","options":["pálpebra","retina","íris","córnea"],"answer":1,"explain":"A retina fica no fundo do olho e transforma a luz em impulsos nervosos."},{"q":"Qual estrutura leva as informações do olho até o cérebro?","options":["o cristalino","a pupila","o nervo óptico","a íris"],"answer":2,"explain":"O nervo óptico conduz os impulsos nervosos da retina até o cérebro."},{"q":"Qual estrutura do olho funciona como uma lente natural que ajusta o foco da imagem?","options":["retina","íris","nervo óptico","cristalino"],"answer":3,"explain":"O cristalino muda de forma para focalizar objetos perto ou longe."},{"q":"Uma pessoa com miopia tem dificuldade de enxergar:","options":["no escuro apenas","cores","objetos distantes","objetos próximos"],"answer":2,"explain":"Na miopia, a imagem de objetos distantes se forma antes da retina e fica embaçada."},{"q":"Que tipo de lente é usada para corrigir a miopia?","options":["lente convergente","lente divergente","lente colorida","espelho plano"],"answer":1,"explain":"A lente divergente afasta os raios de luz, fazendo a imagem se formar na retina."},{"q":"Que tipo de lente é usada para corrigir a hipermetropia, que dificulta enxergar de perto?","options":["lente convergente","lente escura","espelho plano","lente divergente"],"answer":0,"explain":"A lente convergente aproxima os raios de luz, ajudando a imagem a se formar na retina."},{"q":"O astigmatismo geralmente é causado por:","options":["cor da íris","falta de luz no ambiente","excesso de lágrimas","uma curvatura irregular da córnea"],"answer":3,"explain":"Com a córnea irregular, a imagem fica distorcida ou embaçada. A correção é feita com lentes cilíndricas."},{"q":"Com a idade, muitas pessoas passam a ter dificuldade de ler de perto porque o cristalino perde flexibilidade. Esse problema chama-se:","options":["daltonismo","miopia","conjuntivite","presbiopia (vista cansada)"],"answer":3,"explain"
